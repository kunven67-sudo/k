<title>Blood Moon Hunter</title>
<style>
:root{--ink:#e8e0d0;--dim:#9a9080;--blood:#b01818;--blood2:#ff3a3a;--gold:#d8b060;--panel:rgba(14,10,10,.9);--edge:#5a4430;--green:#6ac060;--blue:#5a8ae8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050304;color:var(--ink);font-family:Georgia,'Times New Roman',serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#050304;z-index:90}
#loading .lt{font-size:clamp(22px,5vw,40px);letter-spacing:.25em;color:#d8c8b0;text-shadow:0 0 30px #600}
#loading .bar{width:min(360px,70vw);height:4px;background:#2a1a14}#loading .bar i{display:block;height:100%;width:0;background:var(--blood);transition:width .2s}
#loadText{font-size:14px;color:var(--dim);letter-spacing:.1em}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;font-size:14px;text-shadow:0 1px 2px #000,0 0 6px #000}
#compass{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:min(560px,70vw);height:30px;overflow:hidden;background:linear-gradient(90deg,transparent,rgba(0,0,0,.45) 15%,rgba(0,0,0,.45) 85%,transparent);border-bottom:1px solid rgba(216,176,96,.25)}
#compassIn{position:absolute;inset:0}
#compass .m{position:absolute;top:4px;transform:translateX(-50%);font-size:13px;white-space:nowrap;color:var(--dim)}
#compass .m.card{color:#e8e0d0;font-weight:bold;font-size:14px}#compass .m.obj{color:var(--gold);font-size:16px;top:2px}#compass .m.con{color:#ff6a50}#compass .m.horse{color:#c8a070}
#compass .m small{display:block;font-size:9px;text-align:center;color:inherit;opacity:.85;margin-top:-2px}
#compass .tick{position:absolute;left:50%;bottom:0;width:2px;height:7px;background:var(--gold)}
#goal{position:absolute;top:46px;left:50%;transform:translateX(-50%);max-width:80vw;text-align:center;color:#e8d8b0;font-size:13px;font-style:italic;opacity:.92}
#bossBar{position:absolute;top:72px;left:50%;transform:translateX(-50%);width:min(520px,80vw);text-align:center}
#bossName{font-size:15px;letter-spacing:.12em;color:#ffd0c0;margin-bottom:3px}
.bb{height:9px;background:rgba(0,0,0,.6);border:1px solid #5a1a14}.bb i{display:block;height:100%;background:linear-gradient(#e03030,#801010);transition:width .15s}
#clock{position:absolute;top:10px;right:14px;text-align:right;font-size:13px}#moonT{font-size:12px;color:#c09080}#moonT.blood{color:#ff4040;font-weight:bold;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.5}}
#bars{position:absolute;left:16px;bottom:16px;width:min(260px,40vw)}
#bars .row{margin-top:5px}
.bar{position:relative;height:12px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12)}.bar i{display:block;height:100%;transition:width .12s}.bar b{position:absolute;right:4px;top:-2px;font-size:11px;font-weight:normal}
.bar.hp i{background:linear-gradient(#d83030,#7a1010)}.bar.st i{background:linear-gradient(#90c060,#3a6a2a)}.bar.mp i{background:linear-gradient(#5a8ae8,#2a3a8a)}.bar.hs i{background:linear-gradient(#c8a070,#6a4a2a)}
.bar.st{height:7px}.bar.mp{height:7px}.bar.hs{height:6px}
#surv{display:flex;gap:10px;margin-top:8px;font-size:12px}#surv span{display:flex;align-items:center;gap:3px}#surv span.bad{color:#ff7060}#surv span.warn{color:#e8c060}
#surv .tag{padding:1px 5px;border:1px solid rgba(255,255,255,.2);border-radius:3px;font-size:11px}
#hotbar{position:absolute;right:16px;bottom:16px;display:flex;gap:6px}
#hotbar .k{position:relative;width:48px;height:52px;background:rgba(0,0,0,.5);border:1px solid rgba(216,176,96,.3);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;overflow:hidden}
#hotbar .k em{position:absolute;top:1px;left:3px;font-size:10px;font-style:normal;color:var(--gold)}#hotbar .k s{position:absolute;bottom:1px;right:3px;font-size:11px;text-decoration:none}
#hotbar .k .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65)}#hotbar .k.off{opacity:.45}
#cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 3px #000}
#cross.bow{width:18px;height:18px;margin:-9px 0 0 -9px;background:none;border:1px solid rgba(255,255,255,.7);transition:transform .1s}
#hitMark{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;opacity:0;background:linear-gradient(45deg,transparent 45%,#fff 45%,#fff 55%,transparent 55%),linear-gradient(-45deg,transparent 45%,#fff 45%,#fff 55%,transparent 55%);transition:opacity .25s}
#hitMark.on{opacity:.9;transition:none}#hitMark.crit{background:linear-gradient(45deg,transparent 42%,#ff4040 42%,#ff4040 58%,transparent 58%),linear-gradient(-45deg,transparent 42%,#ff4040 42%,#ff4040 58%,transparent 58%)}
#prompt{position:absolute;left:50%;top:calc(50% + 46px);transform:translateX(-50%);background:rgba(0,0,0,.55);padding:5px 12px;border:1px solid rgba(216,176,96,.4);border-radius:4px;white-space:nowrap;font-size:14px}
#prompt kbd{display:inline-block;min-width:20px;padding:0 5px;margin-right:6px;border:1px solid var(--gold);border-radius:3px;color:var(--gold);text-align:center;font-family:inherit}
#saveIcon{position:absolute;right:16px;top:52px;font-size:12px;color:var(--gold);animation:pulse .8s infinite}
#toasts{position:fixed;top:96px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:5px;z-index:30;pointer-events:none;width:min(640px,92vw)}
.toast{background:rgba(10,6,6,.82);border:1px solid rgba(255,255,255,.12);padding:6px 14px;border-radius:4px;font-size:14px;text-align:center;animation:tin .25s;text-shadow:0 1px 2px #000}
.toast.gold{border-color:var(--gold);color:#f0d890}.toast.bad{border-color:#8a2a20;color:#ffb0a0}.toast.good{border-color:#4a8a3a;color:#c0f0b0}.toast.item{color:#d8e8c8}.toast.small{font-size:12px;padding:3px 10px}
.toast.blood{border-color:#c01010;color:#ff6060;background:rgba(40,0,0,.85)}.toast.big{font-size:20px;letter-spacing:.12em;padding:10px 20px}
.toast.out{opacity:0;transition:opacity .5s}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#fx>div{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:0}
#hurtV{background:radial-gradient(ellipse at center,transparent 45%,rgba(160,0,0,.75) 100%)}#lowV{background:radial-gradient(ellipse at center,transparent 50%,rgba(90,0,0,.8) 100%);animation:pulse 1.1s infinite}
#coldV{background:radial-gradient(ellipse at center,transparent 50%,rgba(170,210,255,.55) 100%)}#senseV{background:radial-gradient(ellipse at center,rgba(60,0,0,.05) 30%,rgba(120,0,0,.55) 100%);mix-blend-mode:screen}
#flashV{background:#fff}
#letterbox i{position:fixed;left:0;right:0;height:11vh;background:#000;z-index:20}#letterbox i:first-child{top:0}#letterbox i:last-child{bottom:0}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:80;transition:opacity .45s}
/* ---------- dialog ---------- */
#dialog{position:fixed;left:50%;bottom:13vh;transform:translateX(-50%);width:min(760px,94vw);background:var(--panel);border:1px solid var(--edge);border-radius:6px;padding:14px 18px 16px;z-index:40;box-shadow:0 8px 30px #000}
#dName{font-size:15px;letter-spacing:.1em;margin-bottom:6px;font-weight:bold}
#dText{font-size:17px;line-height:1.45;min-height:50px}
#dMore{position:absolute;right:14px;bottom:8px;color:var(--gold);font-size:13px;animation:pulse 1s infinite}
#dChoices{display:flex;flex-direction:column;gap:6px;margin-top:10px}#dChoices button{text-align:left;padding:8px 12px;background:rgba(255,255,255,.04);border:1px solid var(--edge);border-radius:4px}#dChoices button:hover,#dChoices button:focus{background:rgba(216,176,96,.15);border-color:var(--gold)}
/* ---------- screens & modals ---------- */
#screen{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;overflow:auto}
#screen.dim{background:rgba(0,0,0,.55)}
.title{font-size:clamp(34px,8vw,72px);letter-spacing:.18em;color:#e8d8c0;text-shadow:0 0 30px #a00,0 4px 8px #000;text-align:center;line-height:1}
.title small{display:block;font-size:.22em;letter-spacing:.5em;color:#c08070;margin-top:14px}
.menuCol{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:34px}
.btn{min-width:220px;padding:10px 22px;background:rgba(20,12,10,.75);border:1px solid var(--edge);border-radius:4px;font-size:17px;letter-spacing:.06em;text-align:center}
.btn:hover,.btn:focus{border-color:var(--gold);background:rgba(60,30,20,.85);outline:none}.btn.red{border-color:#8a2a20}.btn.small{min-width:0;padding:6px 12px;font-size:14px}.btn:disabled{opacity:.4;cursor:default}
.wrap{width:min(860px,94vw);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:20px 22px}
.wrap h2{margin:0 0 12px;letter-spacing:.12em;font-weight:normal;color:var(--gold)}
.saveRow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border:1px solid rgba(255,255,255,.08);border-radius:4px;margin-bottom:8px;background:rgba(255,255,255,.02)}
.saveRow .meta{font-size:12px;color:var(--dim);line-height:1.5}.saveRow .nm{font-size:17px}
.muted{color:var(--dim);font-size:13px}
#modal{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5)}
#mPanel{position:relative;width:min(900px,96vw);height:min(640px,94vh);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:16px 18px;box-shadow:0 10px 40px #000}
#mClose{position:absolute;right:10px;top:8px;background:none;border:0;font-size:20px;color:var(--dim)}
#mTitle{font-size:20px;letter-spacing:.12em;color:var(--gold);margin-bottom:8px;padding-right:30px}
#mTabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}#mTabs button{padding:6px 12px;background:rgba(255,255,255,.04);border:1px solid var(--edge);border-radius:4px;font-size:14px}#mTabs button.on{border-color:var(--gold);color:var(--gold);background:rgba(216,176,96,.1)}
#mBody{flex:1;overflow:auto;min-height:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer}
.list .it:hover,.list .it.sel{background:rgba(216,176,96,.1)}.list .it .n{flex:1}.list .it .q{color:var(--dim);font-size:13px}.list .it.eq .n::after{content:' ✔';color:var(--gold)}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px;vertical-align:middle;border:1px solid rgba(255,255,255,.3)}
.detail{border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:12px;background:rgba(255,255,255,.02);min-height:120px}
.detail h3{margin:0 0 6px;font-weight:normal;color:var(--gold)}.detail .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sect{color:var(--gold);font-size:12px;letter-spacing:.15em;margin:12px 0 4px;text-transform:uppercase}
.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media(max-width:640px){.skills{grid-template-columns:repeat(2,1fr)}}
.skill{border:1px solid var(--edge);border-radius:5px;padding:8px;font-size:13px;background:rgba(255,255,255,.02);cursor:pointer;min-height:86px}.skill.can{border-color:var(--gold)}.skill.lock{opacity:.45}
.skill b{display:block;font-size:14px;margin-bottom:3px}.pips i{display:inline-block;width:12px;height:5px;margin-right:3px;background:#333}.pips i.on{background:var(--gold)}
.stat{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:14px}
.meter{height:8px;background:#222;border-radius:2px;overflow:hidden;margin:4px 0 10px}.meter i{display:block;height:100%}
#mapWrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#mapC{max-width:100%;max-height:100%;aspect-ratio:1;border:1px solid var(--edge);touch-action:none;cursor:crosshair;image-rendering:auto}
.contract{border:1px solid rgba(255,255,255,.1);border-radius:5px;padding:10px;margin-bottom:8px}.contract.done{border-color:var(--gold)}.contract h4{margin:0 0 4px;font-weight:normal;color:#f0d0b0}
.opt{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}.opt label{width:110px;font-size:14px;color:var(--dim)}
.sw{width:26px;height:26px;border-radius:4px;border:2px solid transparent;cursor:pointer}.sw.on{border-color:#fff}
.chip{padding:5px 10px;border:1px solid var(--edge);border-radius:4px;background:rgba(255,255,255,.03);font-size:13px}.chip.on{border-color:var(--gold);color:var(--gold)}
input[type=text]{background:#120c0a;border:1px solid var(--edge);color:var(--ink);padding:8px;border-radius:4px;font:inherit;width:220px}
input[type=range]{width:200px;accent-color:#b03020}
.creator{position:fixed;left:2vw;top:3vh;bottom:3vh;width:min(420px,96vw);overflow:auto;background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:16px}
@media(max-width:700px){.creator{left:2vw;right:2vw;top:auto;bottom:2vh;height:52vh;width:auto}}
.ending{text-align:center;max-width:700px;padding:20px}.ending h1{font-size:clamp(30px,6vw,56px);letter-spacing:.15em;font-weight:normal;margin:0;color:#f0e0c8;text-shadow:0 0 30px #a00}
.ending p{font-size:18px;line-height:1.6;color:#d8ccb8}.ending .sub{color:var(--gold);letter-spacing:.1em}
#credits{position:fixed;inset:0;overflow:hidden;background:#000;z-index:70}#credits .roll{position:absolute;left:0;right:0;text-align:center;font-size:18px;line-height:2.1;color:#d8ccb8}
#credits .roll h3{color:var(--gold);font-weight:normal;letter-spacing:.2em;margin:40px 0 4px}
/* ---------- touch ---------- */
#touch{position:fixed;inset:0;z-index:15;pointer-events:none}
#stick{position:absolute;left:5vw;bottom:6vh;width:130px;height:130px;border-radius:50%;border:2px solid rgba(255,255,255,.2);background:rgba(0,0,0,.2);pointer-events:auto;touch-action:none}
#stick i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.25)}
#tBtns{position:absolute;right:2vw;bottom:3vh;display:grid;grid-template-columns:repeat(4,52px);gap:7px;pointer-events:auto}
#tBtns button,#tTop button{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.3);font-size:20px;touch-action:none}
#tBtns button.big{background:rgba(120,20,20,.45)}#tBtns button.on,#tTop button.on{background:rgba(216,176,96,.4)}
#tTop{position:absolute;top:44px;left:8px;display:flex;flex-direction:column;gap:6px;pointer-events:auto}#tTop button{width:42px;height:42px;font-size:16px}
body.touch #hotbar{bottom:auto;top:96px;right:8px;flex-direction:column;transform:scale(.8);transform-origin:top right}
body.touch #bars{left:auto;right:auto;left:50%;transform:translateX(-50%);bottom:auto;top:66px;width:min(240px,50vw)}
body.touch #clock{top:40px}
</style>
