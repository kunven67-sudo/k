<title>Blood Moon Hunter</title>
<style>
:root{--ink:#e8e0d0;--dim:#9a9080;--blood:#b01818;--gold:#d8b060;--panel:rgba(14,10,10,.88);--edge:#4a3a2a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050304;color:var(--ink);font-family:Georgia,'Times New Roman',serif;overflow:hidden}
#gl{position:fixed;inset:0;display:block;width:100%;height:100%}
[hidden]{display:none!important}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#050304;z-index:90;font-size:22px;letter-spacing:.2em}
#loading .bar{width:min(360px,70vw);height:4px;background:#2a1a14}#loading .bar i{display:block;height:100%;width:0;background:var(--blood);transition:width .2s}
</style>
