<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>TEST Lobby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120d1f; --panel:rgba(22,16,42,.86); --panel-2:rgba(255,255,255,.06); --line:rgba(255,255,255,.14);
  --text:#fff7ea; --muted:#bdb3dc; --accent:#ffd23f; --accent-2:#ffb100; --ink:#2a1b00;
  --hot:#ff4d8d; --cool:#39e1d3; --danger:#ff5d5d;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120d1f; --panel:rgba(22,16,42,.86); --panel-2:rgba(255,255,255,.06); --line:rgba(255,255,255,.14);
    --text:#fff7ea; --muted:#bdb3dc; --accent:#ffd23f; --accent-2:#ffb100; --ink:#2a1b00;
  }
}
:root[data-theme="dark"]{
  --bg:#120d1f; --panel:rgba(22,16,42,.86); --panel-2:rgba(255,255,255,.06); --line:rgba(255,255,255,.14);
  --text:#fff7ea; --muted:#bdb3dc; --accent:#ffd23f; --accent-2:#ffb100; --ink:#2a1b00;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:Nunito,system-ui,sans-serif;font-weight:800;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;touch-action:none}
canvas#view{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;cursor:grab}
canvas#view.grabbing{cursor:grabbing}
canvas#view.poke{cursor:pointer}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.hud{position:fixed;inset:0;pointer-events:none;z-index:5}
.hud > *{pointer-events:auto}

/* ---------- loading ---------- */
#loading{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#2c1d55,#0d0918 70%);transition:opacity .5s}
#loading.hide{opacity:0;pointer-events:none}
#loading .box{text-align:center;padding:24px}
#loading .logo{font-family:"Lilita One",sans-serif;font-size:min(22vw,120px);letter-spacing:.06em;color:var(--accent);
  text-shadow:0 5px 0 #b97900,0 12px 0 rgba(0,0,0,.35);transform:rotate(-3deg);animation:wob 1.6s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(3deg) scale(1.04)}}
#loading .bar{width:min(320px,70vw);height:12px;border-radius:99px;background:rgba(255,255,255,.1);margin:22px auto 10px;overflow:hidden}
#loading .bar i{display:block;height:100%;width:8%;background:linear-gradient(90deg,var(--hot),var(--accent));border-radius:99px;transition:width .3s}
#loading .msg{color:var(--muted);font-size:15px;min-height:1.4em}

/* ---------- top bar ---------- */
.top{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:18px;padding:12px 18px;
  background:linear-gradient(180deg,rgba(10,6,22,.78),rgba(10,6,22,0));pointer-events:none}
.top > *{pointer-events:auto}
.brand{display:flex;align-items:baseline;gap:10px;flex:none}
.brand b{font-family:"Lilita One",sans-serif;font-weight:400;font-size:38px;letter-spacing:.05em;color:var(--accent);
  text-shadow:0 3px 0 #b97900,0 6px 0 rgba(0,0,0,.35);transform:rotate(-3deg);display:inline-block}
.brand small{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:"Lilita One",sans-serif;font-size:19px;letter-spacing:.06em;padding:7px 16px 6px;border-radius:12px;
  color:#e9e2ff;background:rgba(255,255,255,.06);border:2px solid transparent;white-space:nowrap;transition:transform .12s,background .12s}
.tab:hover{background:rgba(255,255,255,.14);transform:translateY(-1px)}
.tab.on{background:var(--accent);color:var(--ink);box-shadow:0 4px 0 #b97900}
.spacer{flex:1}
.pill{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;background:rgba(0,0,0,.35);
  border:1px solid var(--line);font-size:13px;color:var(--muted)}
.pill .dot{width:9px;height:9px;border-radius:50%;background:#46e38a;box-shadow:0 0 8px #46e38a}
#fps{font-variant-numeric:tabular-nums;display:none}

/* ---------- bottom left play card ---------- */
.playcard{position:fixed;left:18px;bottom:18px;width:290px;padding:14px 14px 16px;border-radius:20px;
  background:var(--panel);border:2px solid var(--line);backdrop-filter:blur(6px);transform:rotate(-1.2deg)}
.playcard .k{font-size:11px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.playcard h2{margin:2px 0 2px;font-family:"Lilita One",sans-serif;font-weight:400;font-size:34px;letter-spacing:.03em;line-height:1}
.playcard .sub{font-size:13px;color:var(--muted);margin-bottom:12px}
.playbtn{width:100%;font-family:"Lilita One",sans-serif;font-size:34px;letter-spacing:.08em;color:var(--ink);
  padding:8px 0 6px;border-radius:14px;background:linear-gradient(180deg,#ffe36b,var(--accent) 45%,var(--accent-2));
  box-shadow:0 6px 0 #a86c00,0 10px 18px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s}
.playbtn:hover{transform:translateY(-2px)}
.playbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #a86c00}

/* ---------- bottom right ---------- */
.emotebtn{position:fixed;right:22px;bottom:22px;width:86px;height:86px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ff7fb0,var(--hot) 55%,#c41c5c);box-shadow:0 6px 0 #8c0f3f,0 12px 22px rgba(0,0,0,.4);
  display:grid;place-items:center;transition:transform .1s}
.emotebtn:hover{transform:scale(1.06) rotate(-4deg)}
.emotebtn:active{transform:scale(.96)}
.emotebtn svg{width:44px;height:44px}
.emotebtn span{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-family:"Lilita One",sans-serif;font-size:15px;letter-spacing:.08em;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.hints{position:fixed;right:126px;bottom:26px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;max-width:520px}
.hint{display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:10px;background:rgba(10,6,22,.6);border:1px solid var(--line);font-size:12.5px;color:#e6defc}
.key{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 6px;border-radius:6px;background:#fff7ea;color:#22163f;
  font-size:12px;font-weight:900;box-shadow:0 2px 0 #9a8fbd}

/* ---------- now playing ---------- */
.now{position:fixed;top:74px;left:50%;transform:translate(-50%,-14px);opacity:0;transition:.25s;display:flex;align-items:center;gap:12px;
  padding:8px 8px 8px 16px;border-radius:99px;background:var(--panel);border:2px solid var(--line);pointer-events:none;white-space:nowrap}
.now.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.now .eq{display:flex;gap:3px;align-items:flex-end;height:18px}
.now .eq i{width:4px;background:var(--cool);border-radius:2px;height:30%}
.now b{font-family:"Lilita One",sans-serif;font-weight:400;font-size:18px;letter-spacing:.04em}
.now small{color:var(--muted);font-size:12px}
.now button{padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.12);font-size:13px}
.now button:hover{background:rgba(255,255,255,.22)}

/* ---------- nameplate + bubble ---------- */
.tag{position:fixed;left:0;top:0;transform:translate(-50%,-100%);display:flex;align-items:center;gap:7px;pointer-events:none;
  padding:3px 12px 3px 4px;border-radius:99px;background:rgba(10,6,22,.55);border:1px solid rgba(255,255,255,.18);white-space:nowrap}
.tag .lv{display:grid;place-items:center;width:26px;height:26px;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);
  background:var(--accent);color:var(--ink);font-size:13px;font-weight:900}
.tag b{font-family:"Lilita One",sans-serif;font-weight:400;font-size:17px;letter-spacing:.04em}
.bubble{position:fixed;left:0;top:0;transform:translate(-50%,-100%) scale(.6);opacity:0;pointer-events:none;transition:opacity .15s,transform .2s cubic-bezier(.3,1.6,.5,1);
  padding:8px 14px;border-radius:16px;background:#fff7ea;color:#22163f;font-size:16px;font-weight:900;white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.bubble.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
.bubble:after{content:"";position:absolute;left:24px;bottom:-9px;border:10px solid transparent;border-top-color:#fff7ea;border-bottom:0}

/* ---------- side panel ---------- */
.panel{position:fixed;left:18px;top:78px;bottom:18px;width:390px;max-width:calc(100vw - 36px);padding:18px;border-radius:22px;
  background:var(--panel);border:2px solid var(--line);backdrop-filter:blur(8px);overflow:auto;transform:translateX(-120%);transition:transform .35s cubic-bezier(.2,.9,.3,1.1);z-index:6}
.panel.on{transform:none}
.panel h3{margin:0 0 4px;font-family:"Lilita One",sans-serif;font-weight:400;font-size:30px;letter-spacing:.04em}
.panel .lead{color:var(--muted);font-size:13px;margin:0 0 14px;font-weight:700}
.sec{margin:14px 0 6px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:38px;height:38px;border-radius:12px;border:3px solid rgba(255,255,255,.18);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18);transition:transform .1s}
.sw button:hover{transform:translateY(-2px)}
.sw button.on{border-color:#fff;transform:scale(1.08)}
.sw button.none{background:repeating-linear-gradient(45deg,#3a305a 0 6px,#2a2244 6px 12px);font-size:11px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid var(--line);font-size:14px}
.btn:hover{background:rgba(255,255,255,.18)}
.btn.yel{background:var(--accent);color:var(--ink);border-color:transparent;box-shadow:0 3px 0 #a86c00}
.btn.red{background:rgba(255,93,93,.18);border-color:rgba(255,93,93,.4)}
.btn:disabled{opacity:.4;cursor:default}
input[type=text],input[type=number],select{font:inherit;font-size:14px;color:var(--text);background:rgba(0,0,0,.35);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;outline:none}
input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.card{padding:12px;border-radius:16px;background:var(--panel-2);border:1px solid var(--line);margin-top:10px}
.card h4{margin:0;font-family:"Lilita One",sans-serif;font-weight:400;font-size:21px;letter-spacing:.03em}
.card .meta{color:var(--muted);font-size:12.5px;margin:2px 0 10px;font-weight:700}
.seg{display:flex;background:rgba(0,0,0,.3);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 8px;border-radius:9px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--ink)}
.seg button:disabled{opacity:.35;cursor:default}
.file{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
label.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;font-size:14px}
label.tog input{width:20px;height:20px;accent-color:var(--accent)}
.closeX{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.08);font-size:20px;line-height:1}

/* ---------- emote wheel ---------- */
.wheel{position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:radial-gradient(circle,rgba(10,6,22,.35),rgba(10,6,22,.75));
  opacity:0;pointer-events:none;transition:opacity .15s}
.wheel.on{opacity:1;pointer-events:auto}
.wheel svg{width:min(460px,92vw);height:min(460px,92vw);transform:scale(.85);transition:transform .2s cubic-bezier(.3,1.5,.5,1);overflow:visible}
.wheel.on svg{transform:scale(1)}
.wheel .w{fill:rgba(28,20,52,.92);stroke:rgba(255,255,255,.18);stroke-width:2;transition:fill .1s}
.wheel .w.full{fill:rgba(46,32,86,.95)}
.wheel .w.hov{fill:var(--accent)}
.wheel .w.empty.hov{fill:rgba(80,70,110,.95)}
.wheel text{font-family:"Lilita One",sans-serif;pointer-events:none}
.wheel .lab{fill:#fff7ea;font-size:15px;letter-spacing:.04em}
.wheel .hov-ink{fill:var(--ink)}
.wheel .ctr{fill:rgba(12,8,26,.96);stroke:rgba(255,255,255,.2);stroke-width:2}
.wheel .hint2{position:fixed;top:calc(50% + min(230px,46vw) + 14px);left:50%;transform:translateX(-50%);color:var(--muted);font-size:13px;white-space:nowrap}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:120px;transform:translate(-50%,20px);opacity:0;transition:.25s;z-index:9;
  padding:12px 18px;border-radius:16px;background:#fff7ea;color:#22163f;font-size:15px;font-weight:900;box-shadow:0 6px 0 rgba(0,0,0,.25);
  max-width:min(520px,90vw);text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  .top{gap:10px;padding:10px 10px 10px 12px;flex-wrap:wrap}
  .brand b{font-size:30px}
  .brand small{display:none}
  .tab{font-size:16px;padding:6px 12px 5px}
  .tabs{order:3;width:100%}
  .pill{display:none}
  .playcard{left:10px;bottom:10px;width:min(210px,52vw);padding:10px 10px 12px;border-radius:16px}
  .playcard h2{font-size:24px}
  .playcard .sub{display:none}
  .playbtn{font-size:26px}
  .emotebtn{right:14px;bottom:20px;width:74px;height:74px}
  .hints{display:none}
  .now{top:108px}
  .panel{left:8px;right:8px;width:auto;top:auto;bottom:8px;height:56vh;transform:translateY(120%)}
  .panel.on{transform:none}
}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<canvas id="view" tabindex="0"></canvas>

<div id="loading"><div class="box">
  <div class="logo">TEST</div>
  <div class="bar"><i id="loadbar"></i></div>
  <div class="msg" id="loadmsg">Building the room...</div>
</div></div>

<div class="hud" id="hud">
  <div class="top">
    <div class="brand"><b>TEST</b><small>lobby build 0.1</small></div>
    <div class="tabs" id="tabs">
      <button class="tab on" data-tab="lobby">LOBBY</button>
      <button class="tab" data-tab="locker">LOCKER</button>
      <button class="tab" data-tab="sounds">SOUNDS</button>
      <button class="tab" data-tab="settings">SETTINGS</button>
    </div>
    <div class="spacer"></div>
    <div class="pill"><span class="dot"></span><span>Lobby open</span><span id="fps"></span></div>
  </div>

  <div class="playcard" id="playcard">
    <div class="k">Mode</div>
    <h2>TEST LOBBY</h2>
    <div class="sub">Solo · just vibing · no match yet</div>
    <button class="playbtn" id="play">PLAY</button>
  </div>

  <div class="hints" id="hints">
    <div class="hint"><span class="key">B</span> Emotes (hold or tap)</div>
    <div class="hint"><span class="key">1</span><span class="key">2</span> Quick emote</div>
    <div class="hint"><span class="key">Esc</span> Stop</div>
    <div class="hint">Drag: spin him</div>
    <div class="hint">Scroll: zoom</div>
    <div class="hint">Click him: poke</div>
  </div>

  <button class="emotebtn" id="emotebtn" aria-label="Emotes">
    <svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="9" r="5" fill="#fff" stroke="none"/>
      <path d="M24 16 L22 28 M22 28 L14 40 M22 28 L32 36 L36 44 M24 18 L12 14 M24 19 L34 24 L40 18"/>
    </svg>
    <span>EMOTE</span>
  </button>

  <div class="now" id="now">
    <div class="eq" id="eq"><i></i><i></i><i></i><i></i></div>
    <div><b id="nowName">Take the L</b><br><small id="nowSub">Built-in beat</small></div>
    <button id="stopBtn">Stop</button>
  </div>
</div>

<div class="tag" id="tag"><span class="lv" id="tagLv">1</span><b id="tagName">TEST_DUMMY</b></div>
<div class="bubble" id="bubble">hey!</div>

<div class="panel" id="panel"><button class="closeX" id="closeX" aria-label="Close">×</button><div id="panelBody"></div></div>

<div class="wheel" id="wheel">
  <svg id="wheelSvg" viewBox="-230 -230 460 460"></svg>
  <div class="hint2" id="wheelHint">Pick one · <span class="key">Esc</span> close</div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
/* =====================================================================
   TEST — lobby build 0.1
   Everything (room, guy, music) is made in code. No downloads.
   ===================================================================== */
const $ = s => document.querySelector(s);
const loadBar = $('#loadbar'), loadMsg = $('#loadmsg');
const setLoad = (p, m) => { loadBar.style.width = (p * 100).toFixed(0) + '%'; if (m) loadMsg.textContent = m; };

let THREE, RoundedBoxGeometry, RoomEnvironment, mergeGeometries;
try {
  setLoad(0.1, 'Loading the 3D engine...');
  THREE = await import('three');
  ({ RoundedBoxGeometry } = await import('three/addons/geometries/RoundedBoxGeometry.js'));
  ({ RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js'));
  ({ mergeGeometries } = await import('three/addons/utils/BufferGeometryUtils.js'));
} catch (e) {
  loadMsg.textContent = 'Could not load the 3D engine. Check the internet connection and reload.';
  throw e;
}
setLoad(0.3, 'Waking up the test dummy...');
try { await Promise.race([document.fonts.load('40px "Lilita One"'), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}

const V3 = THREE.Vector3;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const win = (x, a, b, c, d) => sstep(a, b, x) * (1 - sstep(c, d, x));
let seed = 1234567;
const srand = () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646);
const rnd = (a, b) => a + srand() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const store = {
  get(k, d) { try { const v = localStorage.getItem('testLobby.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('testLobby.' + k, JSON.stringify(v)); } catch (e) {} }
};

/* =====================================================================
   RENDERER / SCENE
   ===================================================================== */
const canvas = $('#view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#1a1230');
scene.fog = new THREE.Fog('#1a1230', 14, 26);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 60);

{ // reflections for the few shiny things (disco ball, trophies, cans)
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  pm.dispose();
}

/* ---------- toon look ---------- */
const gradTex = (() => {
  const v = [96, 160, 218, 255], d = new Uint8Array(v.length * 4);
  v.forEach((x, i) => d.set([x, x, x, 255], i * 4));
  const t = new THREE.DataTexture(d, v.length, 1, THREE.RGBAFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true; return t;
})();
const toon = (color, o = {}) => new THREE.MeshToonMaterial({ color, gradientMap: gradTex, ...o });
const outlineMats = {};
function outlineMat(th) {
  if (outlineMats[th]) return outlineMats[th];
  return outlineMats[th] = new THREE.ShaderMaterial({
    uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { th: { value: th }, col: { value: new THREE.Color('#1b1029') } }]),
    vertexShader: `uniform float th;
      #include <common>
      #include <fog_pars_vertex>
      void main(){ vec4 mv = modelViewMatrix*vec4(position,1.0); vec3 n = normalize(normalMatrix*normal);
        mv.xyz += n*th*(1.0+0.08*(-mv.z)); gl_Position = projectionMatrix*mv; vec4 mvPosition = mv;
        #include <fog_vertex>
      }`,
    fragmentShader: `uniform vec3 col;
      #include <common>
      #include <fog_pars_fragment>
      void main(){ gl_FragColor = vec4(col,1.0);
        #include <fog_fragment>
      }`,
    side: THREE.BackSide, fog: true
  });
}
const propOutlines = [];

  inst.frustumCulled = false; inst.count = 0; room.add(inst);
  const P = [], m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), s = new V3(1, 1, 1), p = new V3();
  const cols = ['#ff5f6d', '#ffd23f', '#3ff3ff', '#8dff6a', '#ff7ae6', '#ffffff'].map(c => new THREE.Color(c));
  for (let i = 0; i < N; i++) { P.push({ p: new V3(), v: new V3(), r: new V3(), w: new V3(), life: 0 }); inst.setColorAt(i, cols[i % cols.length]); }

  // spin with inertia, then drift back to the front
  if (!pointer.down) {
    state.charYaw += state.yawVel * dt; state.yawVel *= Math.exp(-dt * 3.5);
    if (t - state.lastSpin > 2.5 || state.emote) { const tw = Math.round(state.charYaw / (Math.PI * 2)) * Math.PI * 2; state.charYaw = lerp(state.charYaw, tw, 1 - Math.exp(-dt * 1.8)); }
  }
  rig.root.rotation.y = state.charYaw;
  // squash spring (pokes)
  squash.v += (-squash.x * 140 - squash.v * 9) * dt; squash.x += squash.v * dt;
  const sq = squash.x * 0.6 + (state.emote ? beatPulse * 0.025 * state.emoteW : 0);
  rig.root.scale.set(1 + sq * 0.5, 1 - sq, 1 + sq * 0.5);
  applyPose(P, dt);
  blob.position.set(rig.hips.position.x, 0.146, rig.hips.position.z); blob.scale.setScalar(1 - (rig.hips.position.y - 0.79) * 1.5);

  // room fx
  for (const fn of animated) fn(t, dt, beats, !!state.emote && !state.stopping, danceEnergy);
  disco.update(t, danceEnergy, t * (0.25 + danceEnergy * 0.9));
  discoSpots.forEach((s, i) => {
    s.intensity = danceEnergy * 30 * (0.75 + 0.25 * beatPulse);
    const a = t * (0.7 + i * 0.25) + i * 2.1;
    s.target.position.set(Math.sin(a) * 3.2, 0, -2 + Math.cos(a * 1.3) * 2.2); s.target.updateMatrixWorld();
  });
  rimC.intensity = 5.5 + danceEnergy * 6 * beatPulse; rimM.intensity = 4.5 + danceEnergy * 6 * (1 - beatPulse);
  hemi.intensity = 1.05 - danceEnergy * 0.25; key.intensity = 1.65 - danceEnergy * 0.35;
  boom.cones.forEach(c => c.scale.setScalar(1 + beatPulse * 0.25 * danceEnergy));
  boom.root.position.y = 0.5 + beatPulse * 0.012 * danceEnergy;
  if (audio.analyser && state.emote) audio.analyser.getByteFrequencyData(audio.fft);
  boom.eq.forEach((b, i) => { const v = state.emote && audio.fft ? audio.fft[2 + i * 6] / 255 : 0.15 + 0.1 * Math.sin(t * 2 + i); b.scale.y = 0.3 + v * 1.6; });
  eqBars.forEach((b, i) => { const v = state.emote && audio.fft ? audio.fft[2 + i * 8] / 255 : 0; b.style.height = (20 + v * 80).toFixed(0) + '%'; });
  desk.led.material.color.setHSL((t * 0.08) % 1, 1, 0.6);
  confetti.update(dt);

  // camera
  const portrait = innerWidth / innerHeight < 0.9;
  const baseDist = portrait ? 5.6 : 4.6;
  cam.dist = lerp(cam.dist, cam.distT * (baseDist / 4.6), 1 - Math.exp(-dt * 6));
  cam.panXT = panel.open && !portrait ? -1.05 : 0; cam.panYT = panel.open && portrait ? -0.75 : 0;
  cam.panX = lerp(cam.panX, cam.panXT, 1 - Math.exp(-dt * 5)); cam.panY = lerp(cam.panY, cam.panYT, 1 - Math.exp(-dt * 5));
  const sw = cam.sway && !pointer.down ? 1 : 0;
  cam.px = lerp(cam.px, pointer.x * sw, 1 - Math.exp(-dt * 2)); cam.py = lerp(cam.py, pointer.y * sw, 1 - Math.exp(-dt * 2));
  const zoomIn = clamp((4.6 - cam.distT) / 2.2, 0, 1);
  const ty = 1.15 + zoomIn * 0.55 + cam.panY, yaw = cam.px * 0.07, pitch = 0.08 - cam.py * 0.035 - zoomIn * 0.04;
  camera.position.set(cam.panX + Math.sin(yaw) * cam.dist, ty + Math.sin(pitch) * cam.dist, Math.cos(yaw) * cam.dist);
  camera.lookAt(cam.panX, ty + 0.17 * (1 - zoomIn), 0);
  if (danceEnergy > 0.01) { camera.position.x += Math.sin(t * 0.7) * 0.06 * danceEnergy; }

  renderer.render(scene, camera);

  // nameplate + bubble
  rig.head.localToWorld(_hv.set(0, 0.74, 0)); _hv.project(camera);
  const sx = (_hv.x + 1) / 2 * innerWidth, sy = (1 - _hv.y) / 2 * innerHeight;
  tagEl.style.transform = `translate(${sx.toFixed(1)}px, ${sy.toFixed(1)}px) translate(-50%,-100%)`;
  bubbleT -= dt; if (bubbleT <= 0) bubbleEl.classList.remove('on');
  bubbleEl.style.left = (sx + 70) + 'px'; bubbleEl.style.top = (sy - 18) + 'px';

  // fps
  fpsN++; fpsT += dt; if (fpsT > 0.5) { fpsShow = Math.round(fpsN / fpsT); fpsN = 0; fpsT = 0; fpsEl.textContent = fpsShow + ' fps · ' + quality.level; }
  autoQuality(dt, t);
  requestAnimationFrame(frame);
}
/* ---------- merge everything that never moves (way fewer draw calls) ---------- */
function mergeStatic(rootObj) {
  rootObj.updateMatrixWorld(true);
  const groups = new Map(), olGroups = new Map(), victims = [];
  const keyOf = m => m.userData.noMerge ? m.uuid : [m.type, m.color && m.color.getHexString(), m.map && m.map.uuid, m.emissive && m.emissive.getHexString(), m.emissiveIntensity, m.side, m.opacity, m.metalness, m.roughness, m.toneMapped, m.shininess, m.blending].join('|');
  const prep = (geo, mw) => {
    let g = geo.index ? geo.toNonIndexed() : geo.clone();
    for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k);
    if (!g.attributes.uv) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
    if (!g.attributes.normal) g.computeVertexNormals();
    g.clearGroups(); return g.applyMatrix4(mw);
  };
  const walk = o => {
    if (o.userData.dyn) return;
    if (o.isMesh && !o.isInstancedMesh && !o.userData.outline && !Array.isArray(o.material) && !o.material.transparent && o.renderOrder === 0) {
      const k = keyOf(o.material);
      if (!groups.has(k)) groups.set(k, { mat: o.material, geos: [], recv: false });
      const g = prep(o.geometry, o.matrixWorld), G = groups.get(k);
      G.geos.push(g); G.recv = G.recv || o.receiveShadow;
      for (const c of o.children) if (c.userData.outline) {
        const th = c.material.uniforms.th.value;
        if (!olGroups.has(th)) olGroups.set(th, { mat: c.material, geos: [] }); olGroups.get(th).geos.push(g);
      }
      victims.push(o);
    }
    for (const c of o.children) walk(c);
  };
  walk(rootObj);
  for (const v of victims) v.parent.remove(v);
  propOutlines.length = 0;
  for (const G of groups.values()) {
    const geo = mergeGeometries(G.geos, false); if (!geo) continue;
    const m = new THREE.Mesh(geo, G.mat); m.castShadow = false; m.receiveShadow = G.recv; m.matrixAutoUpdate = false; rootObj.add(m);
  }
  for (const G of olGroups.values()) {
    const geo = mergeGeometries(G.geos, false); if (!geo) continue;
    const m = new THREE.Mesh(geo, G.mat); m.userData.outline = true; m.raycast = () => {}; m.matrixAutoUpdate = false; rootObj.add(m); propOutlines.push(m);
  }
  return victims.length;
}
setLoad(0.92, 'Tidying up...');
try { mergeStatic(room); } catch (e) { console.warn('merge skipped', e); }
// small moving props: no shadow casting needed
room.traverse(o => { if (o.isMesh && !charMeshes.includes(o) && !o.userData.outline) o.castShadow = false; });
setQuality(quality.mode === 'auto' ? 'medium' : quality.mode);
setLoad(1, 'Ready.');
window.__lobby = { playEmote, stopEmote, poke, setTab, rig, state, setQuality, quality, camera, cam, openWheel, closeWheel, renderer };
requestAnimationFrame(frame);
setTimeout(() => $('#loading').classList.add('hide'), 250);
setTimeout(() => { if (!state.emote && !react.type) { react.type = 'wave'; react.t = 0; react.dur = 2.2; say('yo.', 1.8); } }, 1100);
</script>
