    case "laser":
      g.fillStyle = "#3a3f4a"; rrect(g, -s * 0.22, -s * 0.9, s * 0.44, s * 1.5, s * 0.12); g.fill();
      g.fillStyle = "#1a1d24"; g.fillRect(-s * 0.12, s * 0.5, s * 0.24, s * 0.5);
      glowAdd(g, 0, -s * 0.9, s * 0.5, "#ff3a5a", 0.8); g.fillStyle = "#ff8aa0"; g.beginPath(); g.arc(0, -s * 0.9, s * 0.1, 0, TAU); g.fill();
      for(let i = 0; i < 3; i++){ g.fillStyle = "#ff3a5a"; g.fillRect(-s * 0.18, -s * 0.5 + i * s * 0.25, s * 0.36, s * 0.05); }
      break;
    case "storm":
      g.fillStyle = "#5a6a7a"; rrect(g, -s * 0.36, -s * 0.4, s * 0.72, s * 0.85, s * 0.2); g.fill();
      g.fillStyle = "#8aa0b4"; for(let i = 0; i < 4; i++) rrect(g, -s * 0.34 + i * s * 0.18, -s * 0.72, s * 0.14, s * 0.38, s * 0.06), g.fill();
      glowAdd(g, 0, -s * 0.2, s * 0.8, "#9fe8ff", 0.5);
      g.strokeStyle = "#e8faff"; g.lineWidth = s * 0.05; g.beginPath(); g.moveTo(-s * 0.2, -s * 0.9); g.lineTo(0, -s * 0.6); g.lineTo(-s * 0.08, -s * 0.5); g.lineTo(s * 0.18, -s * 0.15); g.stroke();
      break;
    case "bhgun": case "bh":
      g.fillStyle = "#2a2440"; rrect(g, -s * 0.2, -s * 0.5, s * 0.4, s * 1.1, s * 0.12); g.fill();
      g.fillStyle = "#c9b8ff"; g.fillRect(-s * 0.2, -s * 0.2, s * 0.4, s * 0.06);
      g.fillStyle = "#000"; g.beginPath(); g.arc(0, -s * 0.78, s * 0.24, 0, TAU); g.fill();
      g.strokeStyle = "#b07bff"; g.lineWidth = s * 0.05; g.beginPath(); g.ellipse(0, -s * 0.78, s * 0.38, s * 0.1, t * 2, 0, TAU); g.stroke();
      break;
    case "bigbottle": case "bottle":
      wood(0, s, 0, 0, s * 0.12);
      g.save(); g.translate(0, -s * 0.5); g.rotate(Math.PI / 2);
      drawBottle(g, byId("classic"), s * 0.45 / byId("classic").shape.h, { time:t, rot:Math.PI / 2, simple:true });
      g.restore();
      break;
    case "realfist": case "reality":
      for(const c of [["#ff2a6a", -2], ["#2affe0", 2], ["#ffffff", 0]]){
        g.save(); g.translate(c[1] * s * 0.03, 0); g.globalAlpha = c[0] === "#ffffff" ? 1 : 0.6;
        g.fillStyle = c[0]; rrect(g, -s * 0.38, -s * 0.5, s * 0.76, s * 0.66, s * 0.18); g.fill(); g.fillRect(-s * 0.3, s * 0.14, s * 0.6, s * 0.5);
        g.restore();
      }
      break;
    case "omni": {
      g.fillStyle = "#d9a630"; rrect(g, -s * 0.4, -s * 0.45, s * 0.8, s * 0.95, s * 0.22); g.fill();
      for(let i = 0; i < 4; i++){ g.fillStyle = "#e8b83a"; rrect(g, -s * 0.38 + i * s * 0.19, -s * 0.85, s * 0.15, s * 0.45, s * 0.07); g.fill(); }
      g.fillStyle = "#b08420"; g.fillRect(-s * 0.36, s * 0.45, s * 0.72, s * 0.5);
      GEMS.forEach((gm, i) => { const a = [[-0.27, -0.75], [-0.08, -0.78], [0.11, -0.78], [0.3, -0.75], [-0.42, -0.1], [0, -0.05]][i]; glowAdd(g, a[0] * s, a[1] * s, s * 0.14, gm.col, 0.7); g.fillStyle = gm.col; g.beginPath(); g.arc(a[0] * s, a[1] * s, s * (i === 5 ? 0.12 : 0.06), 0, TAU); g.fill(); });
      break; }
    default:
      g.fillStyle = "#888"; g.fillRect(-s * 0.1, -s, s * 0.2, s * 2);
  }
  g.restore();
}

/* ---------- crates ---------- */
function drawCrate(g, ci, s, t, dmg){
  const C = CRATES[ci], col = C.col;
  g.save();
  if(dmg) g.rotate(Math.sin(t * 40) * dmg * 0.03);
  if(C.id === "cardboard"){
    g.fillStyle = "#b8915a"; g.fillRect(-s, -s * 0.8, s * 2, s * 1.6);
    g.fillStyle = "#a07a48"; g.fillRect(-s, -s * 0.8, s * 2, s * 0.22);
    g.fillStyle = "rgba(255,255,255,.35)"; g.fillRect(-s * 0.15, -s * 0.8, s * 0.3, s * 1.6);
    g.strokeStyle = "rgba(60,40,20,.5)"; g.lineWidth = 1.2; g.strokeRect(-s, -s * 0.8, s * 2, s * 1.6);
    g.fillStyle = "#fff"; g.fillRect(-s * 0.85, -s * 0.4, s * 0.55, s * 0.32);
    g.fillStyle = "#222"; for(let i = 0; i < 6; i++) g.fillRect(-s * 0.82 + i * s * 0.08, -s * 0.36, s * 0.04, s * 0.22);
    ctext(g, "THIS SIDE UP", s * 0.45, s * 0.45, Math.max(7, s * 0.16), "rgba(60,30,10,.7)", "center", "700 " + Math.max(7, Math.round(s * 0.16)) + "px 'Space Grotesk', sans-serif", false);
  }else{
    const base = C.id === "wood" ? ["#a8743c", "#7a5028", "#5a3a1a"] : C.id === "steel" ? ["#b8c2c9", "#8a959d", "#4a545a"] :
      C.id === "gold" ? ["#ffe08a", "#e0b13a", "#8a6a10"] : ["#e0faff", "#9fe6ff", "#3a8aaa"];
    const gr = g.createLinearGradient(-s, -s, s, s); gr.addColorStop(0, base[0]); gr.addColorStop(0.5, base[1]); gr.addColorStop(1, base[2]);
    g.fillStyle = gr; g.fillRect(-s, -s * 0.85, s * 2, s * 1.7);
    g.strokeStyle = base[2]; g.lineWidth = Math.max(2, s * 0.09);
    g.strokeRect(-s + 2, -s * 0.85 + 2, s * 2 - 4, s * 1.7 - 4);
    g.beginPath(); g.moveTo(-s + 3, -s * 0.85 + 3); g.lineTo(s - 3, s * 0.85 - 3); g.stroke();
    if(C.id === "wood"){ g.strokeStyle = "rgba(40,20,5,.35)"; g.lineWidth = 1; for(let i = 1; i < 4; i++){ g.beginPath(); g.moveTo(-s, -s * 0.85 + i * s * 0.42); g.lineTo(s, -s * 0.85 + i * s * 0.42); g.stroke(); } }
    if(C.id === "steel"){ g.fillStyle = "#5a646a"; for(const p of [[-0.85, -0.7], [0.85, -0.7], [-0.85, 0.7], [0.85, 0.7]]){ g.beginPath(); g.arc(p[0] * s, p[1] * s, s * 0.06, 0, TAU); g.fill(); } }
    if(C.id === "gold" || C.id === "diamond"){
      g.save(); g.globalCompositeOperation = "lighter";
      const sx = ((t * 0.6) % 2 - 1) * s * 1.6;
      const sh = g.createLinearGradient(sx - s * 0.3, 0, sx + s * 0.3, 0); sh.addColorStop(0, "rgba(255,255,255,0)"); sh.addColorStop(0.5, "rgba(255,255,255,.45)"); sh.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = sh; g.fillRect(-s, -s * 0.85, s * 2, s * 1.7);
      g.restore();
      if(useGlow()) glowAdd(g, 0, 0, s * 1.6, col, 0.25);
    }
  }
  /* cracks as you smash it open */
  if(dmg > 0){
    g.strokeStyle = "rgba(0,0,0,.6)"; g.lineWidth = 1.5;
    const rnd = mulberry(ci * 99 + 7);
    for(let i = 0; i < Math.round(dmg * 10); i++){ let x = (rnd() - 0.5) * s * 1.6, y = (rnd() - 0.5) * s * 1.4; g.beginPath(); g.moveTo(x, y); for(let j = 0; j < 4; j++){ x += (rnd() - 0.5) * s * 0.4; y += (rnd() - 0.5) * s * 0.4; g.lineTo(x, y); } g.stroke(); }
  }
  g.restore();
}

/* ---------- the robot arm (bolted to the right end of the bench) ---------- */
function drawRobotArm(g, t, swing, tx, ty, level){
  const by = benchY();
  const bx = W * 0.88, base = [bx, by];
  const s = Math.min(W, H) * 0.06;
  /* swing: 0 = raised, 1 = hitting the target */
  const sh = [bx - s * 0.1, by - s * 2.2];
  const raise = [bx - s * 1.6, by - s * 4.2];
  const hit = [tx + s * 0.6, ty - s * 0.4];
  const e = swing;
  const hx = lerp(raise[0], hit[0], e), hy = lerp(raise[1], hit[1], e);
  /* elbow: bend away from the bench */
  const mx = (sh[0] + hx) / 2 + s * 1.2 * (1 - e * 0.5), my = (sh[1] + hy) / 2 - s * 1.4;
  g.save();
  g.lineCap = "round"; g.lineJoin = "round";
  /* base */
  g.fillStyle = "#3a3f44"; rrect(g, base[0] - s * 0.8, base[1] - s * 0.5, s * 1.6, s * 0.5, 4); g.fill();
  g.fillStyle = "#ffcc1a"; g.fillRect(base[0] - s * 0.8, base[1] - s * 0.5, s * 1.6, s * 0.1);
  /* arm segments */
  const seg = (a, b, wd) => {
    g.strokeStyle = "#1f2326"; g.lineWidth = wd + 3; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
    g.strokeStyle = "#e8b81a"; g.lineWidth = wd; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
    g.strokeStyle = "rgba(255,255,255,.35)"; g.lineWidth = wd * 0.25; g.beginPath(); g.moveTo(a[0] - wd * 0.2, a[1] - wd * 0.2); g.lineTo(b[0] - wd * 0.2, b[1] - wd * 0.2); g.stroke();
  };
  g.strokeStyle = "#5a5f64"; g.lineWidth = s * 0.5; g.beginPath(); g.moveTo(base[0], base[1] - s * 0.4); g.lineTo(sh[0], sh[1]); g.stroke();
  seg(sh, [mx, my], s * 0.42);
  seg([mx, my], [hx, hy], s * 0.34);
  for(const j of [sh, [mx, my]]){ g.fillStyle = "#2a2f33"; g.beginPath(); g.arc(j[0], j[1], s * 0.3, 0, TAU); g.fill(); g.fillStyle = "#8a959d"; g.beginPath(); g.arc(j[0], j[1], s * 0.12, 0, TAU); g.fill(); }
  /* hammer head */
  const ang = Math.atan2(hy - my, hx - mx);
  g.translate(hx, hy); g.rotate(ang);
  g.fillStyle = "#6a7378"; rrect(g, -s * 0.2, -s * 0.55, s * 0.5, s * 1.1, 3); g.fill();
  g.fillStyle = "#c9d1d6"; g.fillRect(s * 0.2, -s * 0.5, s * 0.12, s);
  if(level >= 6){ glowAdd(g, 0, 0, s * 0.8, "#ff6a1a", 0.3); }
  g.restore();
  /* status light */
  glowAdd(g, base[0] + s * 0.5, base[1] - s * 0.3, 6, e > 0.8 ? "#ff3a3a" : "#3aff7a", 0.9);
}

/* ---------- the buff jar on the shelf ---------- */

/* ---------- basement visitors ---------- */
function drawRat(g, s, t, grab){

  g.strokeStyle = "#5a5048"; g.lineWidth = s * 0.08;

function drawDadLegs(g, s, t, step){

/* =====================================================================
   CHAPTER 2: SMASH (cash). Crates -> devices -> smash them for cash.
   ===================================================================== */
const G2 = {
  mode:"idle", t:0, dev:null, crate:null, buffs:[], combo:0, comboT:0, swings:[], chunks:[],
  armT:0, arm:null, autoT:0, jar:null, jarT:0, visitor:null, power:0, bulbSwing:0.03, intro:null,
  boss:null, freeze:0, lastHit:null, revealT:0, scratch:null, sg:null, devCount:0
};

/* ---------- numbers ---------- */
function up2(id){ return save.g2.up[id] | 0; }
function weapon2(){ return WEAPONS[clamp(save.g2.weapon, 0, WEAPONS.length - 1)]; }
function buff2(id){ for(const b of G2.buffs) if(b.id === id && b.left > 0) return true; return false; }
function addBuff2(id, dur){
  dur = dur || 30;
  for(const b of G2.buffs) if(b.id === id){ b.left = Math.max(b.left, dur); b.full = Math.max(b.full, dur); paintBuff(true); return; }
  G2.buffs.push({ id:id, left:dur, full:dur });
  while(G2.buffs.length > 3) G2.buffs.shift();
  paintBuff(true);
}
function dmgMul2(){ return (buff2("rage") ? 3 : 1) * (eventOn("surge2") ? 2 : 1); }
function cashMulAll2(){ return cashMul2(up2("cash2")) * rebirthMul() * (buff2("cashrain") ? 2 : 1) * (eventOn("overtime") ? 2 : 1); }
function critC2(){ return critChance2(weapon2(), up2("critc"), buff2("critstorm")); }
function critM2(){ return critMul2(weapon2(), up2("critd"), perk("heavy")) * (G2.power > 0 ? 2 : 1); }
function crateCost(ci){ return Math.round(CRATES[ci].cost * (eventOn("frenzy") ? 0.5 : 1)); }
function crateStats(ci){
  const ds = crateDevices(ci), o = crateOdds(ci, up2("luck2"));
  let eh = 0, ec = 0;
  for(const d of ds) for(let r = 0; r < 7; r++){ eh += devHp(d, ci, r) * o[r] / ds.length; ec += devCash(d, ci, r) * o[r] / ds.length; }
  return { hp:eh, cash:ec };
}
function cashUnit(){ const c = crateStats(save.g2.crate); return Math.max(5, c.cash * cashMul2(up2("cash2")) * rebirthMul() * 0.5); }
function tapDps2(){ const w = weapon2(), pc = critC2(), cm = critM2(); return 4 * w.dmg * dmgMul2() * (0.3 * cm + 0.7 * (1 + pc * (cm - 1))); }
function armDps2(){ const l = up2("arm"); if(!l) return 0; const w = weapon2(); return armRate(l) * w.dmg * armFrac(l) * (1 + critC2() * (critM2() - 1)); }
function idleRate2(){
  const dps = armDps2(); if(!dps) return 0;
  const c = crateStats(save.g2.crate);
  if(!(c.hp > 0)) return 0;
  return dps * (c.cash / c.hp) * cashMul2(up2("cash2")) * rebirthMul() * 0.5;
}
function g2Intensity(){ if(G2.mode === "boss") return 4; return clamp(Math.floor(G2.combo / 8), 0, 3); }

/* ---------- device geometry ---------- */
function devBox(d, boss){
  const S = devSize() * (boss ? 1.25 : 1);
  const w = d.w * S, h = d.h * S;
  const maxW = W * 0.86, maxH = (benchY() - H * 0.12);
  const k = Math.min(1, maxW / w, maxH / h);
  return { w:w * k, h:h * k };
}
function layoutDev(D){
  const b = devBox(D.d, D.boss);
  D.w = b.w; D.h = b.h;
  D.x = W / 2; D.y = benchY() - D.h / 2;
  D.m = Math.min(D.w, D.h);
  D.key = W + "|" + H + "|" + DPR;
  rebuildHoles(D);
}
function makeDevice(d, ci, ri, boss){
  const D = { d:d, kind:d.kind, ci:ci, ri:ri, boss:!!boss, hp:0, max:0, cash:0, holes:[], cracks:[], shake:0, flash:0, born:G2.t, seed:Math.floor(Math.random() * 1e6),
    meta:DEVMETA[d.kind] || { mat:"plastic", chip:"#555" }, smoke:0, fire:false, opts:{} };
  if(boss){ D.max = d.hp; D.cash = d.cash; }
  else { D.max = devHp(d, ci, ri); D.cash = devCash(d, ci, ri); }
  D.hp = D.max;
  layoutDev(D);
  return D;
}

/* ---------- holes + cracks (stored in device units so a resize keeps them) ---------- */
function holePath(D, h){
  const rnd = mulberry(h.seed), r = h.r * D.m, cx = h.x * D.w, cy = h.y * D.h;
  const p = new Path2D(), pts = [];
  const n = 10;
  for(let i = 0; i < n; i++){ const a = (i + rnd() * 0.6) / n * TAU, rr = r * (0.5 + rnd() * 0.7); pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]); }
  pts.forEach((q, i) => i ? p.lineTo(q[0], q[1]) : p.moveTo(q[0], q[1]));
  p.closePath();
  const cr = new Path2D();
  const nc = 3 + Math.floor(rnd() * 3);
  for(let i = 0; i < nc; i++){
    const a = rnd() * TAU; let x = cx + Math.cos(a) * r * 0.8, y = cy + Math.sin(a) * r * 0.8;
    cr.moveTo(x, y);
    const len = r * (1.2 + rnd() * 2.2), steps = 4;
    let aa = a;
    for(let s = 0; s < steps; s++){ aa += (rnd() - 0.5) * 0.9; x += Math.cos(aa) * len / steps; y += Math.sin(aa) * len / steps; cr.lineTo(x, y); }
  }
  return { hole:p, crack:cr, glass:!!h.glass };
}
function rebuildHoles(D){ D.paths = D.holes.map(h => holePath(D, h)); }
function onScreen(D, lx, ly){
  const sc = D.meta.screens; if(!sc) return false;
  const fx = lx / D.w, fy = ly / D.h;
  return sc.some(s => fx >= s[0] && fx <= s[2] && fy >= s[1] && fy <= s[3]);
}
function addHole(D, lx, ly, frac){
  const glass = onScreen(D, lx, ly);
  const r = clamp(0.045 + frac * 0.6, 0.045, glass ? 0.12 : 0.22);
  /* close to an old hole? make that one bigger instead */
  for(const h of D.holes){
    const dx = h.x * D.w - lx, dy = h.y * D.h - ly;
    if(Math.hypot(dx, dy) < h.r * D.m * 0.8){ h.r = Math.min(0.32, h.r + r * 0.35); h.seed = (h.seed * 7 + 13) % 1e6; rebuildHoles(D); return; }
  }
  D.holes.push({ x:lx / D.w, y:ly / D.h, r:r, seed:Math.floor(Math.random() * 1e6), glass:glass });
  if(D.holes.length > 26) D.holes.shift();
  rebuildHoles(D);
}
/* a few holes for a device that comes back from a save already damaged */
function prebreak(D){
  const dmg = 1 - D.hp / D.max;
  const n = Math.round(dmg * 8);
  for(let i = 0; i < n; i++) addHole(D, (Math.random() - 0.5) * D.w * 0.7, (Math.random() - 0.5) * D.h * 0.7, 0.05);
}

/* ---------- crates ---------- */
function buyCrate(auto){

  if(save.g2.cash < cost){ if(!auto){ play("nope"); toast("NOT ENOUGH CASH", CRATES[ci].name + " costs " + fmt(cost)); } return false; }

  dropCrate(ci, false);
  return true;
}
function dropCrate(ci, free, boost){
  G2.crate = { ci:ci, hp:CRATES[ci].taps, max:CRATES[ci].taps, y:-H * 0.4, vy:0, landed:false, t:0, free:free, dmg:0, boost:boost || 0 };

function crateBox(){ const s = Math.min(W, H) * 0.11; return { s:s, x:W / 2, y:benchY() - s * 0.85 }; }
function hitCrate(){
  const C = G2.crate; if(!C || !C.landed) return;

}
function openCrate(){

  burst(22, { x:b.x, y:b.y, jx:b.s * 1.6, jy:b.s, speed:380, ang:-Math.PI / 2, spread:2.8, life:1.1, size:7, type:"rect", col:CRATES[C.ci].col, g:1100, vr:14, floor:floorY2() });

}
function rollDevice(ci, boost){
  const o = crateOdds(ci, up2("luck2"), boost);
  let r = Math.random(), ri = 0;
  for(let i = 0; i < o.length; i++){ r -= o[i]; if(r <= 0){ ri = i; break; } }
  const list = crateDevices(ci);
  const d = list[Math.floor(Math.random() * list.length)];
  const D = makeDevice(d, ci, ri, false);
  G2.dev = D;
  G2.mode = "reveal"; G2.t = 0; G2.revealT = 0;
  const R = RARITIES[ri];

  else play("open");
  if(ri >= 5) shake(6);

  const f = save.g2.found;
  f[d.id] = Math.max(f[d.id] === undefined ? -1 : f[d.id], ri);
  saveDevice();
}
function saveDevice(){
  const D = G2.dev;
  save.g2.device = D && !D.boss ? { id:D.d.id, ri:D.ri, ci:D.ci, hp:D.hp, max:D.max, cash:D.cash } : null;

}

/* ---------- hitting ---------- */
function devLocal(D, x, y){ return [x - D.x, y - D.y]; }
function insideDev(D, x, y){ const l = devLocal(D, x, y); return Math.abs(l[0]) <= D.w / 2 + 6 && Math.abs(l[1]) <= D.h / 2 + 6; }
function weakSpots(D){
  if(D.boss && G2.boss) return bossWeak(D);
  return (D.d.weak || []).map(p => ({ x:p[0] * D.w / 2, y:p[1] * D.h / 2, r:D.m * 0.1 }));
}
function onWeak(D, lx, ly){ for(const s of weakSpots(D)) if(Math.hypot(lx - s.x, ly - s.y) <= s.r) return s; return null; }
function hitDevice(x, y, src){
  const D = G2.dev; if(!D || G2.mode === "breaking") return;
  if(G2.freeze > 0 && src === "tap"){ play("click"); floatText("FROZEN", x, y - 20, "#9fe8ff", 14, 0.5); return; }
  const l = devLocal(D, x, y);
  const weak = onWeak(D, l[0], l[1]);
  const w = weapon2();
  let dmg = w.dmg * dmgMul2() * (src === "arm" ? armFrac(up2("arm")) : 1);
  let crit = !!weak || Math.random() < critC2();
  if(src === "arm" && weak) crit = Math.random() < 0.5;
  if(crit) dmg *= critM2();
  /* the bosses fight back */
  if(D.boss && G2.boss) dmg = bossTakeHit(D, l[0], l[1], dmg, weak, src);
  if(dmg <= 0) return;
  dealDamage(D, dmg, l[0], l[1], crit, src);
  if(src === "tap" && buff2("chain")){
    for(let i = 0; i < 2; i++){ const rx = D.x + (Math.random() - 0.5) * D.w * 0.7, ry = D.y + (Math.random() - 0.5) * D.h * 0.7; setTimeout(() => { if(G2.dev === D && G2.mode !== "breaking") hitDevice(rx, ry, "chain"); }, 70 + i * 70); }
  }
}
function dealDamage(D, dmg, lx, ly, crit, src){
  const before = D.hp;
  D.hp = Math.max(0, D.hp - dmg);
  const frac = Math.min(1, dmg / D.max);
  addHole(D, lx, ly, frac);
  D.shake = Math.min(1, D.shake + 0.35 + frac); D.flash = crit ? 1 : 0.5;
  const x = D.x + lx, y = D.y + ly;
  const glass = onScreen(D, lx, ly);
  /* sound depends on what it's made of */
  const m = D.meta.mat;
  if(glass){ play("screen"); }
  else if(m === "metal") play("hitMetal"); else if(dmg / D.max > 0.15) play("hitHard"); else play("hitSoft");
  if(crit){ play("crit"); save.g2.stats.crits++; missionTick(2, "crits", 1); }
  const wid = weapon2().id;
  if(wid === "chainsaw") play("saw"); else if(wid === "grinder") play("grind"); else if(wid === "laser" || wid === "storm") play("zap");
  /* bits fly */
  const n = crit ? 14 : 7;
  burst(n, { x:x, y:y, speed:crit ? 340 : 240, life:0.8, size:crit ? 4 : 3, type:glass ? "shard" : "rect", col:glass ? "rgba(220,240,255,.85)" : D.meta.chip, g:1000, vr:14, floor:benchY() });
  if(m === "metal" || crit) burst(crit ? 10 : 4, { x:x, y:y, speed:300, life:0.35, size:2.5, type:"spark", col:"#ffe08a", g:500 });
  if(Math.random() < 0.15) burst(1, { x:x, y:y, speed:200, life:1, size:2.5, type:"chip", col:"#1a1a1a", g:900, vr:12, floor:benchY() });
  floatText(fmt(dmg), x + (Math.random() - 0.5) * 20, y - 18, crit ? "#ffcc1a" : "#ffffff", crit ? 20 : 14, 0.7);
  if(crit) floatText("CRIT", x, y - 44, "#ff8a3a", 13, 0.55);
  shake(Math.min(9, 1.5 + frac * 20 + (crit ? 2 : 0)));
  G2.bulbSwing = Math.min(0.5, G2.bulbSwing + 0.04 + frac * 0.4);
  if(src !== "arm"){ G2.swings.push({ x:x, y:y, t:0, wid:wid, crit:crit }); if(G2.swings.length > 6) G2.swings.shift(); buzz(crit ? "smash" : "tap"); }
  save.g2.stats.hits++;
  if(src === "tap" || src === "key"){
    G2.combo = G2.comboT > 0 ? G2.combo + 1 : 1; G2.comboT = 1.2;
    if(G2.combo > (save.meta.records.combo || 0)) setRecord("combo", G2.combo);
  }
  /* damage stages: sparks, smoke, a swollen battery that catches fire */
  const dm = 1 - D.hp / D.max;
  if(dm > 0.55 && D.d.insides && D.d.insides.includes("battery") && !D.fire && Math.random() < 0.08){ D.fire = true; play("hiss"); setTimeout(() => play("fire"), 300); }
  if(!D.boss) saveDevice();
  if(D.hp <= 0 && before > 0) breakDevice(D, x, y);
}

/* ---------- breaking apart ---------- */
function breakDevice(D, hx, hy){
  G2.mode = "breaking"; G2.t = 0;
  /* cut the device into chunks that fall off the bench */
  const snap = deviceSnapshot(D);
  G2.chunks = [];
  const cols = 4, rows = 3;
  for(let j = 0; j < rows; j++) for(let i = 0; i < cols; i++){
    const x0 = -D.w / 2 + i * D.w / cols, y0 = -D.h / 2 + j * D.h / rows, cw = D.w / cols, ch = D.h / rows;
    const mx = D.x + x0 + cw / 2, my = D.y + y0 + ch / 2;
    const dx = mx - hx, dy = my - hy, dist = Math.hypot(dx, dy) + 1;
    G2.chunks.push({ sx:i * cw, sy:j * ch, cw:cw, ch:ch, x:mx, y:my, vx:dx / dist * (120 + Math.random() * 260), vy:-180 - Math.random() * 260 + dy / dist * 60,
      rot:0, vr:(Math.random() - 0.5) * 8, snap:snap, life:1.4 });
  }
  const parts = (D.d.insides || []);
  if(parts.includes("board") || parts.includes("chips")) burst(10, { x:D.x, y:D.y, jx:D.w * 0.5, jy:D.h * 0.4, speed:320, ang:-Math.PI / 2, spread:2.6, life:1.3, size:6, type:"board", g:1000, vr:10, floor:floorY2() });
  burst(14, { x:D.x, y:D.y, jx:D.w * 0.5, jy:D.h * 0.4, speed:340, ang:-Math.PI / 2, spread:2.8, life:1.2, size:3, type:"chip", col:"#151517", g:1000, vr:14, floor:floorY2() });
  if(D.meta.screens) burst(18, { x:D.x, y:D.y, jx:D.w * 0.5, jy:D.h * 0.4, speed:360, life:1, size:5, type:"shard", col:"rgba(220,240,255,.85)", g:1000, vr:16, floor:floorY2() });
  /* the money */
  const pay = D.cash * cashMulAll2();
  if(D.boss && G2.boss) bossWin(D);
  burst(Math.min(30, 6 + D.ri * 4), { x:D.x, y:D.y, speed:360, ang:-Math.PI / 2, spread:2.2, life:1.6, size:5, type:"bill", g:500, vr:6, drag:0.02, floor:floorY2() });
  if(!D.boss){
    earn("cash", pay);
    floatText("+" + fmt(pay), D.x, D.y - D.h * 0.6, "#5fd38a", 24, 1.3);
    say(RARITIES[D.ri].name.toUpperCase() + " " + D.d.name.toUpperCase(), "+" + fmt(pay), D.ri >= 2 ? RARITIES[D.ri].col : "var(--good)");
    const s2 = save.g2.stats;
    s2.smashed++; missionTick(2, "smashed", 1);
    if(D.ri >= 2){ s2.rares++; missionTick(2, "rares", 1); }
    if(D.ri > s2.bestRarity) s2.bestRarity = D.ri;
    const took = G2.t0dev ? (performance.now() - G2.t0dev) / 1000 : 0;
    if(took > 0.15 && (save.meta.records.fastSmash === undefined || took < save.meta.records.fastSmash) && D.ri >= 1) setRecord("fastSmash", took);
    if(pay > (save.meta.records.bestDevice || 0)) setRecord("bestDevice", pay);
    /* the core gem hides in the rarest devices */
    if(!save.g2.gems.includes("core") && ((D.ri === 6 && Math.random() < 0.5) || (D.ri === 5 && Math.random() < 0.05))) grantGem("core");
    G2.devCount++;
    if(Math.random() < 0.07) spawnJar();
    maybeVisitor2("after");
  }
  /* sound: what broke? */
  if(D.d.crt || D.kind === "crt" || D.kind === "arcade") play("implode");
  else if(D.fire) play("explode");
  else play("crunch");
  if(D.meta.screens) play("screen");
  play("cash");
  shake(D.boss ? 14 : 6 + D.ri); buzz(D.boss ? "boom" : "smash");
  flash(0.12 + D.ri * 0.04, D.ri >= 2 ? RARITIES[D.ri].col : "#ffffff");
  G2.bulbSwing = 0.6;
  G2.dev = null;
  save.g2.device = null;
  checkAchSoon(); persist(); paintHud();
}
function deviceSnapshot(D){
  const c = mkCanvas(D.w * DPR, D.h * DPR), g = c.getContext("2d");
  g.setTransform(DPR, 0, 0, DPR, D.w / 2 * DPR, D.h / 2 * DPR);
  renderDevice(g, D, G2.t, true);
  return c;
}

/* ---------- basement visitors (rare) ---------- */
function maybeVisitor2(when){
  if(G2.visitor || G2.mode === "boss") return;
  if(Math.random() > 1 / 140 * (1 + perk("star") * 0.15)) return;
  const pool = when === "after" ? ["rat", "dad", "power"] : ["cat2", "dad", "power"];
  startVisitor2(pickR(pool));
}
function startVisitor2(id){
  const V = VISITORS2.find(v => v.id === id); if(!V) return;
  const first = !save.g2.visitors[id];
  G2.visitor = { v:V, t:0, first:first, dur:id === "power" ? 10 : id === "dad" ? 4 : 3, done:false };
  if(id === "power"){ G2.power = 10; play("powerdown"); say(V.verdict, "crits hit twice as hard in the dark", "#9fe8ff"); }
  if(id === "dad"){ play("thump"); setTimeout(() => play("thump"), 350); setTimeout(() => play("dadyell"), 1300); }
  if(id === "rat") play("squeak");
  if(id === "cat2") play("meow");
}
function updateVisitor2(dt){
  const E = G2.visitor; if(!E) return;
  E.t += dt;
  const id = E.v.id;
  if(id === "cat2" && !E.pushed && E.t > 1.3 && G2.dev && G2.mode === "device"){
    E.pushed = true;
    /* knocked right off the bench: it smashes on the floor */
    const D = G2.dev;
    play("thump");
    D.fallVy = 0;
    G2.mode = "falling"; G2.t = 0;
  }
  if(E.t >= E.dur && !E.done){
    E.done = true;
    save.g2.visitors[id] = 1;
    const bonus = cashUnit() * (id === "power" ? 6 : 12);
    if(id !== "power" && id !== "cat2"){ earn("cash", bonus); floatText("+" + fmt(bonus), W / 2, H * 0.3, "#5fd38a", 20, 1.4); }
    say(E.v.verdict, E.v.sub, "var(--steel)");
    if(E.first){ toast("NEW VISITOR", E.v.title + ": " + E.v.sub); play("rare"); }
    G2.visitor = null;
    checkAchSoon(); persist();
  }
}

/* ---------- bosses ---------- */
function bossUnlocked(B){
  if(save.g2.weapon < B.needW) return false;
  if(B.final) return GEMS.every(gm => save.g2.gems.includes(gm.id));
  return true;
}
function fightBoss(B){
  if(G2.mode !== "idle" && G2.mode !== "device"){ toast("HOLD ON", "Finish what's on the bench first"); return false; }
  if(!bossUnlocked(B)){ play("nope"); return false; }
  /* whatever was on the bench gets pushed aside (it stays saved) */
  closeSheet();
  const d = { id:B.id, name:B.name, kind:B.kind, w:B.final ? 1.25 : 1.3, h:B.final ? 1.25 : 1.1, hp:B.hp, cash:B.cash, weak:[[0, 0]], insides:["board", "chips", "fan", "psu", "core"] };
  G2.parked = G2.dev && !G2.dev.boss ? G2.dev : null;
  const D = makeDevice(d, 0, 6, true);
  G2.dev = D;
  G2.boss = { B:B, left:B.time, phase:0, ev:0, charge:0, shield:false, shieldT:0, heat:0, fire:0, firewall:0, ghosts:[], spots:null, spotT:0, shock:0 };
  if(B.kind === "mainframe") G2.boss.firewall = B.hp * 0.2;
  G2.mode = "boss"; G2.t = 0;
  play("alarm"); shake(8); flash(0.3, "#ff3a3a");
  announce(B.name.replace("THE ", "The ").toLowerCase().replace(/^./, c => c.toUpperCase()) + ".", true);
  say(B.name, B.blurb, "var(--bad)");
  tip("boss");
  return true;
}
function bossWeak(D){
  const Bs = G2.boss, k = Bs.B.kind, m = D.m;
  if(k === "supercomputer") return [{ x:0, y:-D.h * 0.05, r:m * 0.14, eye:true }];
  if(k === "megarig"){ const out = []; for(let r = 0; r < 2; r++) for(let c = 0; c < 3; c++) out.push({ x:-D.w / 2 + D.w * (0.2 + c * 0.3), y:-D.h / 2 + D.h * (0.28 + r * 0.42), r:m * 0.12, fan:true }); return out; }
  if(k === "reality"){ if(!Bs.spots || Bs.spotT <= 0){ Bs.spotT = 3; Bs.spots = [0, 1].map(() => ({ x:(Math.random() - 0.5) * D.w * 0.7, y:(Math.random() - 0.5) * D.h * 0.7, r:m * 0.1 })); } return Bs.spots; }
  if(k === "mainframe") return Bs.firewall > 0 ? [] : [{ x:0, y:0, r:m * 0.12 }];
  if(k === "roguerobot") return Bs.shield ? [] : [{ x:0, y:-D.h * 0.36, r:m * 0.11 }];
  return [{ x:0, y:-D.h * 0.15, r:m * 0.12 }];
}
function bossTakeHit(D, lx, ly, dmg, weak, src){
  const Bs = G2.boss, k = Bs.B.kind;
  if(k === "supercomputer" && weak && weak.eye && Bs.charge > 0){ Bs.charge = 0; Bs.ev = 0; play("zap"); floatText("BLOCKED", D.x, D.y - D.h * 0.3, "#9fe8ff", 18, 0.8); }
  if(k === "roguerobot" && Bs.shield){ play("clang"); burst(6, { x:D.x + lx, y:D.y + ly, speed:260, life:0.3, size:2.5, type:"spark", col:"#ffe08a", g:300 }); return dmg * 0.1; }
  if(k === "megarig" && weak && weak.fan){ Bs.heat = Math.max(0, Bs.heat - 0.12); }
  if(k === "mainframe" && Bs.firewall > 0){
    Bs.firewall -= dmg;
    play("zap");
    burst(5, { x:D.x + lx, y:D.y + ly, speed:200, life:0.4, size:3, type:"pixel", col:["#ff3a3a", "#ff8a1a"], g:0 });
    if(Bs.firewall <= 0){ Bs.firewall = 0; Bs.fwBack = 14; play("shatter"); say("FIREWALL DOWN", "hit the core", "#ffcc1a"); }
    return 0;
  }
  return dmg;
}
function updateBoss(dt){
  const Bs = G2.boss, D = G2.dev; if(!Bs || !D) return;
  Bs.left -= dt;
  const k = Bs.B.kind;
  Bs.ev += dt;
  if(k === "supercomputer"){
    if(Bs.charge > 0){ Bs.charge += dt; if(Bs.charge > 1.3){ Bs.charge = 0; Bs.ev = 0; G2.freeze = 1.6; play("shock"); flash(0.5, "#9fe8ff"); shake(8); say("ZAPPED", "your weapon is frozen", "#9fe8ff"); } }
    else if(Bs.ev > 5.5){ Bs.charge = 0.001; play("alarm"); }
    D.opts.charge = Bs.charge > 0 ? Bs.charge / 1.3 : 0; D.opts.angry = Bs.charge > 0;
  }else if(k === "hauntedarcade"){
    if(Bs.ev > 1.8){ Bs.ev = 0; Bs.ghosts.push({ x:D.x + (Math.random() - 0.5) * D.w * 0.4, y:D.y - D.h * 0.1, vx:(Math.random() - 0.5) * 120, vy:-60 - Math.random() * 60, t:0 }); play("void"); }
    for(let i = Bs.ghosts.length - 1; i >= 0; i--){
      const gp = Bs.ghosts[i]; gp.t += dt;
      if(gp.t < 3){ gp.x += gp.vx * dt; gp.y += gp.vy * dt; gp.vx *= 0.98; gp.vy += 18 * dt; }
      else { gp.x = lerp(gp.x, D.x, dt * 4); gp.y = lerp(gp.y, D.y, dt * 4); if(Math.hypot(gp.x - D.x, gp.y - D.y) < 14){ D.hp = Math.min(D.max, D.hp + D.max * 0.02); Bs.ghosts.splice(i, 1); play("chime"); floatText("+HEAL", D.x, D.y - D.h * 0.4, "#9aff7a", 14, 0.6); } }
    }
  }else if(k === "roguerobot"){
    Bs.shieldT += dt;
    Bs.shield = (Bs.shieldT % 5) < 2;
    if(Bs.ev > 7){ Bs.ev = 0; Bs.left -= 3; shake(12); flash(0.35, "#ff8a1a"); play("thump"); say("PUNCHED", "-3 seconds", "#ff8a1a"); buzz("boom"); }
  }else if(k === "megarig"){
    Bs.heat += dt * 0.085;
    D.opts.heat = Bs.heat;
    if(Bs.heat >= 1){ Bs.heat = 0.25; D.hp = Math.min(D.max, D.hp + D.max * 0.06); play("fan"); say("OVERHEAT", "it healed. hit the fans", "#ff4a1a"); }
  }else if(k === "mainframe"){
    if(Bs.firewall <= 0){ Bs.fwBack -= dt; if(Bs.fwBack <= 0){ Bs.firewall = Bs.B.hp * 0.12; play("alarm"); say("FIREWALL BACK UP", "", "#ff3a3a"); } }
  }else if(k === "reality"){
    Bs.spotT -= dt;
    const ph = D.hp / D.max < 0.33 ? 2 : D.hp / D.max < 0.66 ? 1 : 0;
    if(ph > Bs.phase){ Bs.phase = ph; Bs.spotT = 0; flash(0.6, "#b07bff"); shake(12); play("glitch"); play("universe"); say("REALITY SHIFTS", "", "#b07bff"); }
  }
  if(Bs.left <= 0 && D.hp > 0) bossLose();
}
function bossLose(){
  const Bs = G2.boss;
  G2.boss = null;
  say("TIME'S UP", Bs.B.name.replace("THE ", "the ") + " got away", "var(--bad)");
  play("nope"); play("powerdown");
  G2.dev = G2.parked || null; G2.parked = null;
  if(G2.dev) layoutDev(G2.dev);
  G2.mode = G2.dev ? "device" : "idle";
  paintHud();
}
function bossWin(D){
  const Bs = G2.boss, B = Bs.B;
  G2.boss = null;
  const first = !save.g2.bossesWon[B.id];
  save.g2.bossesWon[B.id] = 1;
  save.g2.stats.bosses++; missionTick(2, "bosses", 1);
  const pay = B.cash * cashMulAll2();
  earn("cash", pay);
  floatText("+" + fmt(pay), W / 2, H * 0.3, "#5fd38a", 26, 1.6);
  announce("Boss down!", true);
  if(B.gem && first) setTimeout(() => grantGem(B.gem), 900);
  if(B.final) setTimeout(() => startForge(), 1500);
  else showDialog({ title:B.name + " IS DOWN", text:(first && B.gem ? "It dropped a gem. " : "") + "You got " + fmt(pay) + " cash.", buttons:[{ t:"NICE" }] });
  checkAchSoon(); persist();
}
function grantGem(id){
  if(save.g2.gems.includes(id)) return;

  const gm = GEMS.find(x => x.id === id);
  play("rare"); flash(0.4, gm.col); shake(6);

const SNP = { t:0, done:false };

  }else G2.mode = "idle";

/* ---------- the frame update ---------- */
function updateG2(dt){
  G2.t += dt;
  const g2 = save.g2;
  if(G2.comboT > 0){ G2.comboT -= dt; if(G2.comboT <= 0) G2.combo = 0; }
  if(G2.freeze > 0) G2.freeze -= dt;
  if(G2.power > 0) G2.power -= dt;
  G2.bulbSwing = Math.max(0.03, G2.bulbSwing - dt * 0.12);
  for(let i = G2.buffs.length - 1; i >= 0; i--){ G2.buffs[i].left -= dt; if(G2.buffs[i].left <= 0){ G2.buffs.splice(i, 1); play("chime"); paintBuff(true); } }
  for(let i = G2.swings.length - 1; i >= 0; i--){ G2.swings[i].t += dt; if(G2.swings[i].t > 0.22) G2.swings.splice(i, 1); }
  if(G2.jar){ G2.jar.born += dt; G2.jar.life -= dt; if(G2.jar.life <= 0) G2.jar = null; }
  updateVisitor2(dt);
  updateEvents(dt);
  const D = G2.dev;
  if(D){
    D.shake = Math.max(0, D.shake - dt * 4); D.flash = Math.max(0, D.flash - dt * 5);
    if(D.key !== W + "|" + H + "|" + DPR) layoutDev(D);
    if(D.fire && Math.random() < dt * 20 && D.holes.length){ const h = pickR(D.holes); spawn({ x:D.x + h.x * D.w, y:D.y + h.y * D.h, vx:(Math.random() - 0.5) * 30, vy:-60, life:0.6, size:4, col:pickR(["#ffb03a", "#ff6a1a", "#ffd23a"]), type:"ember", g:-60 }); }
    const dm = 1 - D.hp / D.max;
    if(dm > 0.5 && Math.random() < dt * 3 && D.holes.length){ const h = pickR(D.holes); burst(3, { x:D.x + h.x * D.w, y:D.y + h.y * D.h, speed:160, life:0.3, size:2, type:"spark", col:"#bfefff", g:400 }); if(Math.random() < 0.3) play("spark"); }
    if(dm > 0.7 && Math.random() < dt * 4 && D.holes.length){ const h = pickR(D.holes); spawn({ x:D.x + h.x * D.w, y:D.y + h.y * D.h, vx:(Math.random() - 0.5) * 20, vy:-40, life:1.4, size:6, col:"#5a5a5a", type:"smoke", g:-20 }); }
  }
  /* robot arm */
  const armL = up2("arm");
  if(armL > 0 && D && (G2.mode === "device" || G2.mode === "boss")){
    if(!G2.arm) G2.arm = { t:0, swing:0, hit:false, tx:0, ty:0 };
    const A = G2.arm;
    A.t += dt;
    const every = 1 / armRate(armL);
    if(A.t >= every){ A.t -= every; A.anim = 0; A.hit = false; A.tx = D.x + (Math.random() - 0.5) * D.w * 0.5; A.ty = D.y + (Math.random() - 0.5) * D.h * 0.5; }
    if(A.anim !== undefined){
      A.anim += dt;
      const ph = Math.min(1, A.anim / Math.min(0.28, every * 0.8));
      A.swing = ph < 0.6 ? easeIn(ph / 0.6) : 1 - (ph - 0.6) / 0.4;
      if(ph >= 0.6 && !A.hit){ A.hit = true; hitDevice(A.tx, A.ty, "arm"); }
      if(ph >= 1){ A.anim = undefined; A.swing = 0; }
    }
  }else if(G2.arm){ G2.arm.swing = Math.max(0, G2.arm.swing - dt * 4); }
  switch(G2.mode){
    case "intro":
      if(G2.t > 1.7 && !G2.intro.lightOn){ G2.intro.lightOn = true; tone(60, 0.4, "sawtooth", 0.05, 120); play("chime"); }
      if(G2.t > 5.2){ G2.intro = null; dropCrate(0, true); tip("smash"); }
      break;
    case "idle":
      if(up2("autoc") > 0 && g2.autoOn && !dialogOpen()){
        G2.autoT += dt;
        if(G2.autoT > [99, 2.4, 1, 0.3][up2("autoc")]){ G2.autoT = 0; buyCrate(true); }
      }
      break;
    case "drop": {
      const C = G2.crate, b = crateBox();
      C.vy += 2600 * dt; C.y += C.vy * dt;
      if(C.y >= 0){ C.y = 0; C.landed = true; G2.mode = "crate"; G2.t = 0; play("thump"); shake(4); burst(10, { x:b.x, y:benchY(), jx:b.s * 2, speed:100, ang:-Math.PI / 2, spread:2.4, life:0.6, size:5, type:"smoke", col:"rgba(200,190,170,.6)", g:-30 }); if(!save.meta.tips.crate) tip("crate"); }
      break; }
    case "crate":
      if(up2("autoc") > 0 && g2.autoOn){ G2.autoT += dt; if(G2.autoT > [99, 0.9, 0.45, 0.12][up2("autoc")]){ G2.autoT = 0; hitCrate(); } }
      break;
    case "reveal":
      if(G2.t > 0.55 + (D ? D.ri * 0.08 : 0)){ G2.mode = "device"; G2.t = 0; G2.t0dev = performance.now(); maybeVisitor2("during"); }
      break;
    case "breaking":
      for(const c of G2.chunks){ c.vy += 1500 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.vr * dt; c.life -= dt; if(c.y > floorY2() - c.ch / 2 && c.vy > 0){ c.y = floorY2() - c.ch / 2; c.vy *= -0.3; c.vx *= 0.6; c.vr *= 0.5; } }
      if(G2.t > 0.75){
        G2.chunks = [];
        if(G2.parked){ G2.dev = G2.parked; G2.parked = null; layoutDev(G2.dev); G2.mode = "device"; saveDevice(); }
        else G2.mode = "idle";
        G2.autoT = 0;
      }
      break;
    case "falling": {
      const Df = G2.dev; if(!Df){ G2.mode = "idle"; break; }
      Df.fallVy += 1800 * dt; Df.x += 220 * dt; Df.y += Df.fallVy * dt;
      if(Df.y > floorY2() - Df.h * 0.3){ const x = Df.x, y = Df.y; Df.hp = 0; G2.mode = "device"; Df.cash *= 2; breakDevice(Df, x, y); }
      break; }
    case "boss":
      updateBoss(dt);
      break;
    case "forge":
      if(G2.t > 4.2) finishForge();
      break;
    case "snap": updateSnap(dt); break;
  }
}

/* ---------- input ---------- */
function g2Press(x, y){
  if(G2.mode === "intro"){ if(G2.t < 4.8) G2.t = 4.8; return; }
  if(G2.mode === "snap" || G2.mode === "forge") return;
  /* the jar */
  if(G2.jar){ const p = jarPos(); if(Math.abs(x - p.x) < p.s * 1.4 && y > p.y - p.s * 2.2 && y < p.y + p.s * 0.6){ smashJar(); return; } }
  /* ghost pixels on the haunted arcade */
  if(G2.boss && G2.boss.ghosts.length){
    for(let i = G2.boss.ghosts.length - 1; i >= 0; i--){ const gp = G2.boss.ghosts[i]; if(Math.hypot(x - gp.x, y - gp.y) < 26){ G2.boss.ghosts.splice(i, 1); play("pop"); burst(10, { x:gp.x, y:gp.y, speed:160, life:0.5, size:4, type:"pixel", col:["#9aff7a", "#ffffff"], g:0 }); return; } }
  }
  if(G2.mode === "crate" && G2.crate){ hitCrate(); return; }
  if(G2.mode === "reveal"){ G2.mode = "device"; G2.t = 0; G2.t0dev = performance.now(); }
  if((G2.mode === "device" || G2.mode === "boss") && G2.dev){
    if(insideDev(G2.dev, x, y)) hitDevice(x, y, "tap");
    else play("click");
    return;
  }
  if(G2.mode === "idle") buyCrate(false);
}
function g2Main(){
  if(save.g2.forged && G2.mode === "idle"){ beginSnapAsk(); return; }
  if(G2.mode === "intro"){ if(G2.t < 4.8) G2.t = 4.8; return; }
  if(G2.mode === "idle"){ buyCrate(false); return; }
  if(G2.mode === "crate"){ hitCrate(); return; }
  if(G2.mode === "reveal"){ G2.mode = "device"; G2.t = 0; G2.t0dev = performance.now(); return; }
  if((G2.mode === "device" || G2.mode === "boss") && G2.dev){
    /* no mouse: you still aim at a weak spot about a third of the time */
    const D = G2.dev, ws = weakSpots(D);
    let x = D.x + (Math.random() - 0.5) * D.w * 0.6, y = D.y + (Math.random() - 0.5) * D.h * 0.6;
    if(ws.length && Math.random() < 0.33){ const s = pickR(ws); x = D.x + s.x; y = D.y + s.y; }
    hitDevice(x, y, "tap");
  }
}
function beginSnapAsk(){
  showDialog({ spooky:true, title:"SNAP?", text:"Everything here will be gone. There is no going back.", buttons:[{ t:"SNAP", fn:() => beginSnap() }, { t:"NOT YET", alt:true }] });
}

/* test hook */
function dev2(what, a){
  if(what === "cash") earn("cash", a || 1e6);
  if(what === "weapon"){ save.g2.weapon = clamp(a | 0, 0, WEAPONS.length - 2); bsm.key = ""; }
  if(what === "crate"){ save.g2.crate = clamp(a | 0, 0, CRATES.length - 1); }

  if(what === "boss"){ const B = BOSSES2.find(b => b.id === a) || BOSSES2[0]; save.g2.weapon = Math.max(save.g2.weapon, B.needW); if(B.final) save.g2.gems = GEMS.map(g => g.id); fightBoss(B); }
  if(what === "visitor") startVisitor2(a || "rat");
  if(what === "jar") spawnJar();
  if(what === "forge"){ save.g2.gems = GEMS.map(g => g.id); startForge(); }
  paintHud();
}

/* ---------- small drawing helpers ---------- */
function dvRect(g, x, y, w, h, r, c1, c2, edge){
  const gr = g.createLinearGradient(0, y, 0, y + h); gr.addColorStop(0, c1); gr.addColorStop(1, c2);
  g.fillStyle = gr; rrect(g, x, y, w, h, r); g.fill();
  if(edge){ g.strokeStyle = edge; g.lineWidth = 1.2; g.stroke(); }
}
function dvShine(g, x, y, w, h, r){
  const gr = g.createLinearGradient(0, y, 0, y + h * 0.5); gr.addColorStop(0, "rgba(255,255,255,.22)"); gr.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = gr; rrect(g, x + 2, y + 2, w - 4, h * 0.45, r); g.fill();
}
function dvScreen(g, x, y, w, h, r, kind, t){
  g.save();
  rrect(g, x, y, w, h, r); g.clip();
  if(kind === "lcd"){ g.fillStyle = "#9aa88a"; g.fillRect(x, y, w, h); }
  else if(kind === "off"){ g.fillStyle = "#0b0d10"; g.fillRect(x, y, w, h); }
  else if(kind === "home"){
    const gr = g.createLinearGradient(x, y, x + w, y + h); gr.addColorStop(0, "#2a3a8a"); gr.addColorStop(1, "#8a2a7a");
    g.fillStyle = gr; g.fillRect(x, y, w, h);
    const cols = 4, sz = w / cols * 0.62;
    for(let i = 0; i < 16; i++){
      const cx = x + (i % cols + 0.5) * w / cols, cy = y + h * 0.12 + Math.floor(i / cols) * w / cols * 0.95;
      if(cy > y + h * 0.82) break;
      g.fillStyle = ["#4fd6a0", "#ffcc1a", "#ff6b5a", "#56c7ff", "#c08aff", "#ffffff"][i % 6];
      rrect(g, cx - sz / 2, cy - sz / 2, sz, sz, sz * 0.25); g.fill();
    }
    g.fillStyle = "rgba(255,255,255,.25)"; rrect(g, x + w * 0.08, y + h * 0.86, w * 0.84, h * 0.08, h * 0.04); g.fill();
  }else if(kind === "tv"){
    const gr = g.createLinearGradient(x, y, x, y + h); gr.addColorStop(0, "#6ab0e0"); gr.addColorStop(0.6, "#f0d8a0"); gr.addColorStop(0.61, "#3a8a4a"); gr.addColorStop(1, "#2a5a2a");
    g.fillStyle = gr; g.fillRect(x, y, w, h);
    g.fillStyle = "#fff3b0"; g.beginPath(); g.arc(x + w * 0.75, y + h * 0.3, h * 0.1, 0, TAU); g.fill();
  }else if(kind === "game"){
    g.fillStyle = "#0a0a20"; g.fillRect(x, y, w, h);
    for(let i = 0; i < 18; i++){ g.fillStyle = "#fff"; g.fillRect(x + hash01(i) * w, y + ((hash01(i + 5) * h + t * 20) % h), 1.5, 1.5); }
    g.fillStyle = "#39ff14"; for(let i = 0; i < 5; i++) g.fillRect(x + w * (0.15 + i * 0.16), y + h * 0.25, w * 0.08, h * 0.08);
    g.fillStyle = "#ff3fd0"; g.fillRect(x + w * 0.45 + Math.sin(t * 2) * w * 0.3, y + h * 0.8, w * 0.1, h * 0.06);
  }else if(kind === "code"){
    g.fillStyle = "#06120a"; g.fillRect(x, y, w, h);
    g.fillStyle = "#39ff7a";
    for(let i = 0; i < 9; i++) g.fillRect(x + w * 0.08, y + h * 0.1 + i * h * 0.09, w * (0.2 + hash01(i + Math.floor(t * 2)) * 0.6), Math.max(1, h * 0.03));
  }else if(kind === "blue"){
    g.fillStyle = "#1a5ab0"; g.fillRect(x, y, w, h);
    g.fillStyle = "rgba(255,255,255,.85)"; g.fillRect(x + w * 0.1, y + h * 0.3, w * 0.8, h * 0.08); g.fillRect(x + w * 0.1, y + h * 0.5, w * 0.5, h * 0.08);
  }
  /* glass reflection */
  g.fillStyle = "rgba(255,255,255,.1)";

      for(let i = 0; i < 4; i++) dvBtn(g, -w * 0.32 + i * w * 0.1, y0 + h * 0.1, w * 0.025, "#9aa0a4");
      g.fillStyle = "#9aa0a4"; g.beginPath(); g.arc(0, h * 0.1, m * 0.36, 0, TAU); g.fill();
      g.fillStyle = "#1a2a3a"; g.beginPath(); g.arc(0, h * 0.1, m * 0.29, 0, TAU); g.fill();
      g.save(); g.beginPath(); g.arc(0, h * 0.1, m * 0.28, 0, TAU); g.clip();
      g.fillStyle = "rgba(120,180,220,.4)"; g.fillRect(-m * 0.3, h * 0.1 + Math.sin(t * 3) * 3, m * 0.6, m * 0.3);
      g.rotate(t * 4); g.fillStyle = ["#ff6b5a", "#4fd6a0", "#ffcc1a"][0]; g.fillRect(-m * 0.1, h * 0.1 + m * 0.05, m * 0.15, m * 0.08);
      g.restore();
      g.fillStyle = "rgba(255,255,255,.2)"; g.beginPath(); g.arc(-m * 0.08, h * 0.03, m * 0.12, 0, TAU); g.fill();
      dvLabel(g, "SPINCYCLE", -w * 0.1, y0 + h * 0.1, h * 0.04, "#6a6e72");
      break; }
    case "datacenter": {
      dvRect(g, x0, y0, w, h, 4, "#4a5058", "#24282c", "#0a0c0e");
      for(let c = 0; c < 4; c++){
        const cx = x0 + w * 0.04 + c * w * 0.24;
        g.fillStyle = "#15171a"; g.fillRect(cx, y0 + h * 0.06, w * 0.21, h * 0.62);
        for(let i = 0; i < 10; i++){ const on = hash01(c * 13 + i + Math.floor(t * 5)) > 0.35; g.fillStyle = on ? (i % 3 ? "#3aff7a" : "#3a8aff") : "#2a2a2a"; g.fillRect(cx + w * 0.02, y0 + h * 0.09 + i * h * 0.058, w * 0.03, h * 0.02); g.fillStyle = "#2a2d32"; g.fillRect(cx + w * 0.07, y0 + h * 0.09 + i * h * 0.058, w * 0.12, h * 0.03); }
      }
      for(let i = 0; i < 3; i++) dvFan(g, x0 + w * (0.2 + i * 0.3), h * 0.34, m * 0.12, t * (1 + i * 0.2), "#3a3f44");
      dvLabel(g, "MEGACLOUD", 0, -y0 - h * 0.04, h * 0.035, "#9aa0a4");
      break; }
    case "alientech": {
      const pulse = 0.5 + 0.5 * Math.sin(t * 3);
      if(useGlow()) glowAdd(g, 0, 0, m * 0.9, "#39ff14", 0.25 + pulse * 0.2);
      g.fillStyle = "#1a2a24";
      g.beginPath(); for(let i = 0; i < 6; i++){ const a = i / 6 * TAU + Math.PI / 6; g.lineTo(Math.cos(a) * m * 0.48, Math.sin(a) * m * 0.48); } g.closePath(); g.fill();
      g.strokeStyle = "#39ff14"; g.lineWidth = 2; g.stroke();
      g.save(); g.rotate(t * 0.5);
      g.strokeStyle = "rgba(57,255,20,.7)"; g.lineWidth = 1.2;
      for(let i = 0; i < 6; i++){ g.rotate(TAU / 6); g.beginPath(); g.moveTo(m * 0.12, 0); g.lineTo(m * 0.32, m * 0.05); g.lineTo(m * 0.36, -m * 0.05); g.stroke(); }
      g.restore();
      g.fillStyle = "#9aff7a"; g.beginPath(); g.arc(0, 0, m * (0.12 + pulse * 0.02), 0, TAU); g.fill();
      for(let i = 0; i < 3; i++){ const a = t * (1 + i * 0.3) + i * 2; g.fillStyle = "#3a5a4a"; g.beginPath(); g.arc(Math.cos(a) * m * 0.6, Math.sin(a) * m * 0.3 - m * 0.1, m * 0.06, 0, TAU); g.fill(); }
      break; }
    case "quantum": {
      g.fillStyle = "rgba(200,230,255,.12)"; rrect(g, x0, y0, w, h, m * 0.1); g.fill();
      g.strokeStyle = "rgba(220,240,255,.6)"; g.lineWidth = 1.5; g.stroke();
      for(let i = 0; i < 4; i++){
        const yy = y0 + h * (0.14 + i * 0.2), ww = w * (0.8 - i * 0.12);
        const gg = g.createLinearGradient(-ww / 2, 0, ww / 2, 0); gg.addColorStop(0, "#8a5a0a"); gg.addColorStop(0.5, "#ffe08a"); gg.addColorStop(1, "#8a5a0a");
        g.fillStyle = gg; g.fillRect(-ww / 2, yy, ww, h * 0.035);
        g.strokeStyle = "#d9a630"; g.lineWidth = 1;
        for(let k = 0; k < 6; k++){ const xx = -ww / 2 + (k + 0.5) * ww / 6; g.beginPath(); g.moveTo(xx, yy + h * 0.035); g.quadraticCurveTo(xx + w * 0.02, yy + h * 0.1, xx * 0.85, yy + h * 0.2); g.stroke(); }
      }
      glowAdd(g, 0, h * 0.38, m * 0.25, "#9fe8ff", 0.6 + 0.3 * Math.sin(t * 5));
      g.fillStyle = "#e8faff"; g.beginPath(); g.arc(0, h * 0.38, m * 0.05, 0, TAU); g.fill();
      dvLabel(g, "QUBITCORE", 0, y0 + h * 0.06, h * 0.035, "#ffe08a");
      break; }
    /* ----- bosses ----- */
    case "supercomputer": {
      dvRect(g, x0, y0, w, h, 4, "#1d1f24", "#0b0c0e", "#000");
      for(let c = 0; c < 5; c++){
        const cx = x0 + w * 0.03 + c * w * 0.195;
        g.fillStyle = "#15171b"; g.fillRect(cx, y0 + h * 0.04, w * 0.18, h * 0.92);
        for(let i = 0; i < 14; i++){ const on = hash01(c * 31 + i + Math.floor(t * 6)) > 0.45; g.fillStyle = on ? (o.angry ? "#ff3a3a" : "#3aa8ff") : "#202226"; g.fillRect(cx + w * 0.02, y0 + h * 0.08 + i * h * 0.06, w * 0.03, h * 0.02); }
      }
      /* the eye */
      const ey = -h * 0.05, ew = w * 0.36, eh = h * 0.1, charge = o.charge || 0;
      g.fillStyle = "#050505"; rrect(g, -ew / 2 - 6, ey - eh / 2 - 6, ew + 12, eh + 12, eh); g.fill();
      const eg = g.createLinearGradient(-ew / 2, 0, ew / 2, 0); eg.addColorStop(0, "rgba(120,0,0,.5)"); eg.addColorStop(0.5, charge > 0 ? "#ffd0d0" : "#ff2a2a"); eg.addColorStop(1, "rgba(120,0,0,.5)");
      g.fillStyle = eg; rrect(g, -ew / 2, ey - eh / 2, ew, eh, eh / 2); g.fill();
      if(useGlow()) glowAdd(g, 0, ey, ew * (0.6 + charge), "#ff2a2a", 0.4 + charge * 0.5);
      g.strokeStyle = "#2a2a2a"; g.lineWidth = 3;
      for(let i = 0; i < 5; i++){ g.beginPath(); g.moveTo(x0 + w * (0.1 + i * 0.2), -y0); g.quadraticCurveTo(x0 + w * (0.1 + i * 0.2) + 10, -y0 + 14, x0 + w * (0.15 + i * 0.2), -y0 + 20); g.stroke(); }
      break; }
    case "roguerobot": {
      g.fillStyle = "#2a2f33"; g.fillRect(-w * 0.35, h * 0.32, w * 0.7, h * 0.18);
      g.fillStyle = "#ffcc1a"; for(let i = 0; i < 7; i++){ g.save(); g.translate(-w * 0.33 + i * w * 0.1, h * 0.41); g.rotate(-0.6); g.fillRect(-2, -10, 5, 20); g.restore(); }
      dvRect(g, -w * 0.3, -h * 0.25, w * 0.6, h * 0.58, m * 0.08, "#ff8a1a", "#a04a00", "#3a1a00");
      dvRect(g, -w * 0.18, -h * 0.48, w * 0.36, h * 0.26, m * 0.06, "#3a3f44", "#1a1d20", "#000");
      g.fillStyle = "#111"; g.fillRect(-w * 0.14, -h * 0.4, w * 0.28, h * 0.08);
      glowAdd(g, 0, -h * 0.36, w * 0.18, "#ff2a2a", 0.8); g.fillStyle = "#ff8a8a"; g.fillRect(-w * 0.12 + (Math.sin(t * 3) + 1) * w * 0.09, -h * 0.385, w * 0.06, h * 0.05);
      g.strokeStyle = "#3a3f44"; g.lineWidth = m * 0.1; g.beginPath(); g.moveTo(-w * 0.3, -h * 0.15); g.lineTo(-w * 0.45, h * 0.05); g.stroke();
      g.beginPath(); g.moveTo(w * 0.3, -h * 0.15); g.lineTo(w * 0.46, h * 0.0); g.stroke();
      g.fillStyle = "#5a5f64"; rrect(g, w * 0.38, -h * 0.02, w * 0.14, h * 0.14, 4); g.fill();
      dvLabel(g, "ROGUE", 0, h * 0.05, h * 0.06, "#3a1a00");
      break; }
    case "megarig": {
      dvRect(g, x0, y0, w, h, 6, "#1d1f24", "#08090a", "#000");
      const heat = o.heat || 0;
      for(let r = 0; r < 2; r++) for(let c = 0; c < 3; c++){
        const fx = x0 + w * (0.2 + c * 0.3), fy = y0 + h * (0.28 + r * 0.42);
        dvFan(g, fx, fy, m * 0.16, t * (1.5 + c * 0.2) * (1 + heat), heat > 0.6 ? "#5a1a0a" : "#1a3a5a");
        if(useGlow()) glowAdd(g, fx, fy, m * 0.22, heat > 0.6 ? "#ff4a1a" : "#3a8aff", 0.25 + heat * 0.3);
      }
      if(heat > 0.3){ g.save(); g.globalCompositeOperation = "lighter"; g.fillStyle = "rgba(255,80,20," + (heat * 0.25).toFixed(3) + ")"; g.fillRect(x0, y0, w, h); g.restore(); }
      dvLabel(g, "MEGA RIG", 0, -y0 - h * 0.04, h * 0.04, "#7a8088");
      break; }
    case "mainframe": {
      dvRect(g, x0, y0, w, h, 4, "#dfe2e6", "#9aa0a6", "#5a6066");
      for(let i = 0; i < 2; i++){
        const rx = -w * 0.22 + i * w * 0.44, ry = -h * 0.2;
        g.fillStyle = "#1a1a1a"; g.beginPath(); g.arc(rx, ry, m * 0.17, 0, TAU); g.fill();
        g.save(); g.translate(rx, ry); g.rotate(t * (i ? -2 : 2));
        g.fillStyle = "#5a5a5a"; for(let k = 0; k < 3; k++){ g.rotate(TAU / 3); g.fillRect(-2, 0, 4, m * 0.15); }
        g.fillStyle = "#c9cdd0"; g.beginPath(); g.arc(0, 0, m * 0.05, 0, TAU); g.fill();
        g.restore();
      }
      g.fillStyle = "#2a2d32"; g.fillRect(x0 + w * 0.06, h * 0.08, w * 0.88, h * 0.34);
      for(let i = 0; i < 24; i++){ const on = hash01(i + Math.floor(t * 4)) > 0.5; g.fillStyle = on ? ["#ff3a3a", "#ffcc1a", "#3aff7a"][i % 3] : "#3a3d44"; g.beginPath(); g.arc(x0 + w * (0.12 + (i % 8) * 0.1), h * (0.15 + Math.floor(i / 8) * 0.1), m * 0.015, 0, TAU); g.fill(); }
      g.fillStyle = "#ff3a3a"; g.beginPath(); g.arc(0, h * 0.0, m * 0.06, 0, TAU); g.fill(); glowAdd(g, 0, 0, m * 0.15, "#ff3a3a", 0.6);
      break; }
    case "reality": {
      const R = m * 0.48;
      if(useGlow()) glowAdd(g, 0, 0, R * 1.6, "#b07bff", 0.3);
      for(let i = 0; i < 3; i++){
        g.save(); g.rotate(t * (0.4 + i * 0.25) * (i % 2 ? -1 : 1)); g.scale(1, 0.35 + i * 0.25);
        g.strokeStyle = ["#d9a630", "#c9d1d6", "#b07bff"][i]; g.lineWidth = m * 0.04;
        g.beginPath(); g.arc(0, 0, R * (0.95 - i * 0.12), 0, TAU); g.stroke();
        for(let k = 0; k < 8; k++){ const a = k / 8 * TAU; g.fillStyle = "#fff"; g.fillRect(Math.cos(a) * R * (0.95 - i * 0.12) - 2, Math.sin(a) * R * (0.95 - i * 0.12) - 2, 4, 4); }
        g.restore();
      }
      const cg = g.createRadialGradient(0, 0, 2, 0, 0, R * 0.42); cg.addColorStop(0, "#ffffff"); cg.addColorStop(0.3, "#c9a8ff"); cg.addColorStop(1, "#1a0a3a");
      g.fillStyle = cg; g.beginPath(); g.arc(0, 0, R * 0.42, 0, TAU); g.fill();
      g.save(); g.beginPath(); g.arc(0, 0, R * 0.4, 0, TAU); g.clip();
      drawSpiral(g, 0, 0, R * 0.36, t, 0.5, "#e8d8ff", t * 0.3);
      g.restore();
      break; }
    default:
      dvRect(g, x0, y0, w, h, m * 0.1, "#6a7078", "#3a3f44", "#1a1d20");
  }
}

/* ---------- the real stuff inside ---------- */
function drawInsidesPart(g, kind, x, y, s, t, rnd){
  switch(kind){
    case "board": break;
    case "chips":
      for(let i = 0; i < 3; i++){ const cx = x + (rnd() - 0.5) * s, cy = y + (rnd() - 0.5) * s * 0.6;
        g.fillStyle = "#151517"; g.fillRect(cx - s * 0.16, cy - s * 0.16, s * 0.32, s * 0.32);
        g.fillStyle = "#c9a64a"; for(let k = 0; k < 5; k++){ g.fillRect(cx - s * 0.2, cy - s * 0.13 + k * s * 0.065, s * 0.04, 1.5); g.fillRect(cx + s * 0.16, cy - s * 0.13 + k * s * 0.065, s * 0.04, 1.5); }
        g.fillStyle = "rgba(255,255,255,.2)"; g.beginPath(); g.arc(cx - s * 0.1, cy - s * 0.1, 1.5, 0, TAU); g.fill(); }
      break;
    case "battery":
      dvRect(g, x - s * 0.45, y - s * 0.3, s * 0.9, s * 0.6, 4, "#c9d1d6", "#7a848a", "#4a545a");
      g.fillStyle = "#2a5ad6"; g.fillRect(x - s * 0.35, y - s * 0.12, s * 0.7, s * 0.24);
      dvLabel(g, "Li-ion", x, y + 0.5, s * 0.14, "#fff");
      break;
    case "battery2":
      for(let i = 0; i < 2; i++){ const bx = x - s * 0.3 + i * s * 0.36; g.fillStyle = "#1a1a1a"; g.fillRect(bx, y - s * 0.35, s * 0.26, s * 0.7); g.fillStyle = "#c9a64a"; g.fillRect(bx, y - s * 0.35, s * 0.26, s * 0.18); g.fillStyle = "#c9cdd0"; g.fillRect(bx + s * 0.08, y - s * 0.4, s * 0.1, s * 0.05); }
      break;
    case "fan": dvFan(g, x, y, s * 0.42, t, "#3a3f44"); break;
    case "hdd":
      dvRect(g, x - s * 0.42, y - s * 0.5, s * 0.84, s, 3, "#8a959d", "#5a646a", "#2a3238");
      { const pg = g.createRadialGradient(x - s * 0.06, y - s * 0.06, 1, x, y, s * 0.34); pg.addColorStop(0, "#ffffff"); pg.addColorStop(0.5, "#c9d1d6"); pg.addColorStop(1, "#7a848a");
        g.fillStyle = pg; g.beginPath(); g.arc(x, y - s * 0.05, s * 0.34, 0, TAU); g.fill(); }
      g.strokeStyle = "#2a2a2a"; g.lineWidth = s * 0.05; g.beginPath(); g.moveTo(x + s * 0.32, y + s * 0.38); g.lineTo(x + s * 0.02, y - s * 0.02); g.stroke();
      break;
    case "psu":
      dvRect(g, x - s * 0.45, y - s * 0.4, s * 0.9, s * 0.8, 3, "#5a5f64", "#2a2d30", "#111");
      dvGrill(g, x - s * 0.3, y - s * 0.28, s * 0.6, s * 0.56, 4);
      g.strokeStyle = "#ffcc1a"; g.lineWidth = 2; g.beginPath(); g.moveTo(x - s * 0.45, y + s * 0.2); g.quadraticCurveTo(x - s * 0.7, y + s * 0.4, x - s * 0.6, y + s * 0.7); g.stroke();
      break;
    case "gpu":
      dvRect(g, x - s * 0.6, y - s * 0.25, s * 1.2, s * 0.5, 4, "#2a2d32", "#141518", "#000");
      dvFan(g, x - s * 0.3, y, s * 0.2, t, "#3a3f44"); dvFan(g, x + s * 0.3, y, s * 0.2, t * 1.1, "#3a3f44");
      g.fillStyle = "#c9a64a"; g.fillRect(x - s * 0.5, y + s * 0.25, s * 0.7, s * 0.06);
      break;
    case "coil":
      g.fillStyle = "#5a5f64"; g.fillRect(x - s * 0.08, y - s * 0.4, s * 0.16, s * 0.8);
      for(let i = 0; i < 12; i++){ g.fillStyle = i % 2 ? "#e0893a" : "#b8622a"; rrect(g, x - s * 0.3, y - s * 0.36 + i * s * 0.06, s * 0.6, s * 0.06, s * 0.03); g.fill(); }
      break;
    case "wires":
      for(let i = 0; i < 4; i++){ g.strokeStyle = ["#c4302c", "#1a1a1a", "#ffcc1a", "#2a6ad6"][i]; g.lineWidth = Math.max(1.5, s * 0.05);
        g.beginPath(); g.moveTo(x - s * 0.5, y - s * 0.3 + i * s * 0.12); g.bezierCurveTo(x - s * 0.1, y - s * 0.6 + i * s * 0.2, x + s * 0.1, y + s * 0.5 - i * s * 0.1, x + s * 0.5, y + s * 0.1 * i); g.stroke(); }
      break;
    case "magnetron":
      dvRect(g, x - s * 0.35, y - s * 0.35, s * 0.7, s * 0.7, 3, "#c9cdd0", "#7a7e82", "#3a3e42");
      g.fillStyle = "#5a5e62"; for(let i = 0; i < 6; i++) g.fillRect(x - s * 0.45, y - s * 0.3 + i * s * 0.11, s * 0.9, s * 0.04);
      break;
    case "motor":
      { const mg = g.createLinearGradient(0, y - s * 0.3, 0, y + s * 0.3); mg.addColorStop(0, "#c9cdd0"); mg.addColorStop(0.5, "#6a6e72"); mg.addColorStop(1, "#3a3e42");
        g.fillStyle = mg; rrect(g, x - s * 0.45, y - s * 0.3, s * 0.9, s * 0.6, s * 0.15); g.fill(); }
      g.fillStyle = "#b8622a"; g.fillRect(x - s * 0.2, y - s * 0.3, s * 0.4, s * 0.6);
      g.fillStyle = "#9aa0a4"; g.fillRect(x + s * 0.45, y - s * 0.04, s * 0.2, s * 0.08);
      break;
    case "keys":
      for(let i = 0; i < 6; i++) dvKey(g, x - s * 0.45 + (i % 3) * s * 0.32, y - s * 0.25 + Math.floor(i / 3) * s * 0.3, s * 0.26, s * 0.24, "#3a3d44");
      break;
    case "sensor": case "camera": case "lens":
      for(let i = 0; i < (kind === "lens" ? 2 : 1); i++){ const lx = x + (kind === "lens" ? (i ? s * 0.25 : -s * 0.25) : 0);
        g.fillStyle = "#1a1a1a"; g.beginPath(); g.arc(lx, y, s * 0.22, 0, TAU); g.fill();
        const lg = g.createRadialGradient(lx - s * 0.06, y - s * 0.06, 1, lx, y, s * 0.15); lg.addColorStop(0, "#9fe8ff"); lg.addColorStop(1, "#1a2a5a");
        g.fillStyle = lg; g.beginPath(); g.arc(lx, y, s * 0.15, 0, TAU); g.fill(); }
      break;
    case "ink":
      for(let i = 0; i < 3; i++){ g.fillStyle = ["#2ad6e8", "#e82aa0", "#ffd21a"][i]; rrect(g, x - s * 0.4 + i * s * 0.28, y - s * 0.3, s * 0.22, s * 0.6, 3); g.fill(); }
      break;
    case "magnet":
      g.fillStyle = "#5a5f64"; g.beginPath(); g.arc(x, y, s * 0.38, 0, TAU); g.fill(); g.fillStyle = "#2a2d30"; g.beginPath(); g.arc(x, y, s * 0.16, 0, TAU); g.fill();
      break;
    case "dish":
      g.fillStyle = "#e8eaec"; g.beginPath(); g.ellipse(x, y, s * 0.4, s * 0.25, -0.3, 0, TAU); g.fill(); g.fillStyle = "#9aa0a4"; g.fillRect(x - 1, y - s * 0.4, 2, s * 0.4);
      break;
    case "cash":
      for(let i = 0; i < 4; i++){ g.fillStyle = "#5fbf6a"; g.fillRect(x - s * 0.4 + i * 3, y - s * 0.2 - i * 4, s * 0.8, s * 0.36); g.strokeStyle = "#2f7a3a"; g.lineWidth = 1; g.strokeRect(x - s * 0.4 + i * 3, y - s * 0.2 - i * 4, s * 0.8, s * 0.36); }
      break;
    case "snacks":
      for(let i = 0; i < 3; i++){ g.fillStyle = ["#ffcc1a", "#ff6b5a", "#3aa8ff"][i]; rrect(g, x - s * 0.45 + i * s * 0.3, y - s * 0.3, s * 0.26, s * 0.6, 4); g.fill(); }
      break;
    case "coin":
      for(let i = 0; i < 5; i++) drawCoinPickup(g, x + (rnd() - 0.5) * s * 0.6, y + (rnd() - 0.5) * s * 0.4, s * 0.1, i);
      break;
    case "crt":
      g.fillStyle = "#2a3a2a"; g.beginPath(); g.moveTo(x - s * 0.5, y - s * 0.4); g.lineTo(x + s * 0.1, y - s * 0.1); g.lineTo(x + s * 0.1, y + s * 0.1); g.lineTo(x - s * 0.5, y + s * 0.4); g.closePath(); g.fill();
      g.fillStyle = "#b8622a"; g.fillRect(x + s * 0.05, y - s * 0.16, s * 0.18, s * 0.32);
      g.fillStyle = "#5a5f64"; g.fillRect(x + s * 0.2, y - s * 0.06, s * 0.3, s * 0.12);
      break;
    case "vinyl":
      g.fillStyle = "#111"; g.beginPath(); g.arc(x, y, s * 0.42, 0, TAU); g.fill();
      g.strokeStyle = "#2a2a2a"; for(let i = 1; i < 5; i++){ g.beginPath(); g.arc(x, y, s * 0.08 * i + s * 0.08, 0, TAU); g.stroke(); }
      g.fillStyle = "#c4302c"; g.beginPath(); g.arc(x, y, s * 0.1, 0, TAU); g.fill();
      break;
    case "drum":
      g.fillStyle = "#c9cdd0"; g.beginPath(); g.arc(x, y, s * 0.45, 0, TAU); g.fill();
      g.fillStyle = "#6a6e72"; for(let i = 0; i < 20; i++){ const a = i / 20 * TAU; g.beginPath(); g.arc(x + Math.cos(a) * s * 0.3, y + Math.sin(a) * s * 0.3, 1.5, 0, TAU); g.fill(); }
      break;
    case "engine":
      dvRect(g, x - s * 0.5, y - s * 0.35, s, s * 0.7, 6, "#6a6e72", "#3a3e42", "#1a1d20");
      for(let i = 0; i < 4; i++){ g.fillStyle = "#9aa0a4"; g.fillRect(x - s * 0.4 + i * s * 0.22, y - s * 0.5, s * 0.14, s * 0.2); }
      g.strokeStyle = "#1a1a1a"; g.lineWidth = s * 0.06; g.beginPath(); g.arc(x, y + s * 0.1, s * 0.18, 0, TAU); g.stroke();
      break;
    case "core":
      if(useGlow()) glowAdd(g, x, y, s * 0.8, "#ff8a1a", 0.6);
      g.fillStyle = "#ffe0a0"; g.beginPath(); g.arc(x, y, s * 0.2, 0, TAU); g.fill();
      break;
    case "crystal":
      if(useGlow()) glowAdd(g, x, y, s * 0.7, "#39ff14", 0.5);
      g.fillStyle = "#9aff7a"; g.beginPath(); g.moveTo(x, y - s * 0.45); g.lineTo(x + s * 0.18, y); g.lineTo(x, y + s * 0.45); g.lineTo(x - s * 0.18, y); g.closePath(); g.fill();
      break;
  }
}
function drawInsides(g, list, w, h, seed, t){
  const rnd = mulberry(seed || 1);
  /* chassis */
  const cg = g.createLinearGradient(0, -h / 2, 0, h / 2); cg.addColorStop(0, "#3a3f44"); cg.addColorStop(1, "#1d2023");
  g.fillStyle = cg; g.fillRect(-w / 2, -h / 2, w, h);
  if(list.includes("board") || list.includes("chips")){
    /* green circuit board with copper traces */
    g.fillStyle = "#1f6b3a"; g.fillRect(-w * 0.45, -h * 0.45, w * 0.9, h * 0.9);
    g.strokeStyle = "rgba(201,166,74,.55)"; g.lineWidth = 1;
    for(let i = 0; i < 26; i++){
      let x = -w * 0.43 + rnd() * w * 0.86, y = -h * 0.43 + rnd() * h * 0.86;
      g.beginPath(); g.moveTo(x, y);
      for(let k = 0; k < 3; k++){ if(rnd() < 0.5) x += (rnd() - 0.5) * w * 0.4; else y += (rnd() - 0.5) * h * 0.4; g.lineTo(clamp(x, -w * 0.44, w * 0.44), clamp(y, -h * 0.44, h * 0.44)); }
      g.stroke();
    }
    g.fillStyle = "#c9a64a"; for(let i = 0; i < 30; i++){ g.beginPath(); g.arc(-w * 0.43 + rnd() * w * 0.86, -h * 0.43 + rnd() * h * 0.86, 1.3, 0, TAU); g.fill(); }
    /* capacitors */
    for(let i = 0; i < 5; i++){ const x = -w * 0.4 + rnd() * w * 0.8, y = -h * 0.4 + rnd() * h * 0.8; g.fillStyle = "#1a3a8a"; g.beginPath(); g.arc(x, y, Math.min(w, h) * 0.035, 0, TAU); g.fill(); g.fillStyle = "#c9cdd0"; g.beginPath(); g.arc(x, y, Math.min(w, h) * 0.02, 0, TAU); g.fill(); }
  }
  /* the parts, spread out in a grid */
  const parts = list.filter(p => p !== "board");
  const n = parts.length, cols = Math.ceil(Math.sqrt(n * w / h)), rows = Math.ceil(n / Math.max(1, cols));
  const cw = w / Math.max(1, cols), chh = h / Math.max(1, rows), s = Math.min(cw, chh) * 0.8;
  parts.forEach((p, i) => {
    const cx = -w / 2 + (i % cols + 0.5) * cw, cy = -h / 2 + (Math.floor(i / cols) + 0.5) * chh;
    g.save(); drawInsidesPart(g, p, cx, cy, s, t, rnd); g.restore();
  });
  /* screws in the corners */
  g.fillStyle = "#9aa0a4";
  for(const c of [[-1, -1], [1, -1], [-1, 1], [1, 1]]){ g.beginPath(); g.arc(c[0] * w * 0.46, c[1] * h * 0.46, Math.max(1.5, Math.min(w, h) * 0.02), 0, TAU); g.fill(); }
}

/* one device: insides show through the holes, the shell on top */
function insideCanvas(D){
  const key = D.w.toFixed(1) + "|" + D.h.toFixed(1) + "|" + DPR;
  if(D.inC && D.inKey === key) return D.inC;
  const c = mkCanvas(D.w * DPR, D.h * DPR), g = c.getContext("2d");
  g.setTransform(DPR, 0, 0, DPR, D.w / 2 * DPR, D.h / 2 * DPR);
  try{ drawInsides(g, D.d.insides || ["board", "chips"], D.w, D.h, D.seed, 0); }catch(e){}
  /* holes look deep: dark edges */
  const vg = g.createRadialGradient(0, 0, Math.min(D.w, D.h) * 0.2, 0, 0, Math.max(D.w, D.h) * 0.7);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.45)");
  g.fillStyle = vg; g.fillRect(-D.w / 2, -D.h / 2, D.w, D.h);
  D.inC = c; D.inKey = key;
  return c;
}
function renderDevice(g, D, t, still){
  const pad = 0.32, cw = D.w * (1 + pad * 2), ch = D.h * (1 + pad * 2);
  const pw = Math.ceil(cw * DPR), ph = Math.ceil(ch * DPR);
  if(!G2.scratch || G2.scratch.width < pw || G2.scratch.height < ph){ G2.scratch = mkCanvas(Math.max(pw, G2.scratch ? G2.scratch.width : 0), Math.max(ph, G2.scratch ? G2.scratch.height : 0)); G2.sg = G2.scratch.getContext("2d"); }
  const sg = G2.sg;
  sg.setTransform(1, 0, 0, 1, 0, 0);
  sg.clearRect(0, 0, pw + 2, ph + 2);
  sg.setTransform(DPR, 0, 0, DPR, cw / 2 * DPR, ch / 2 * DPR);
  sg.save();
  try{ drawDeviceBody(sg, D.kind, D.w, D.h, still ? 0 : t, D.opts); }catch(e){ console.error(e); }
  sg.restore();
  const paths = D.paths || [];
  if(paths.length){
    sg.globalCompositeOperation = "destination-out";
    for(const p of paths) if(!p.glass) sg.fill(p.hole);
    sg.globalCompositeOperation = "source-atop";
    sg.lineCap = "round"; sg.lineJoin = "round";
    for(const p of paths){
      if(p.glass){ sg.strokeStyle = "rgba(235,248,255,.9)"; sg.lineWidth = 1.1; sg.stroke(p.crack); sg.fillStyle = "rgba(255,255,255,.25)"; sg.fill(p.hole); }
      else { sg.strokeStyle = "rgba(0,0,0,.55)"; sg.lineWidth = 2.4; sg.stroke(p.hole); sg.strokeStyle = "rgba(0,0,0,.45)"; sg.lineWidth = 1.1; sg.stroke(p.crack); }
    }
  }
  sg.globalCompositeOperation = "source-atop";
  const dm = 1 - D.hp / Math.max(1e-9, D.max);
  if(dm > 0.15){ sg.fillStyle = "rgba(25,18,12," + (dm * 0.32).toFixed(3) + ")"; sg.fillRect(-cw / 2, -ch / 2, cw, ch); }
  if(D.flash > 0){ sg.fillStyle = "rgba(255,255,255," + (D.flash * 0.45).toFixed(3) + ")"; sg.fillRect(-cw / 2, -ch / 2, cw, ch); }
  sg.globalCompositeOperation = "source-over";
  /* insides, only where there are holes */
  const real = paths.filter(p => !p.glass);
  if(real.length){
    g.save();
    const clip = new Path2D();
    for(const p of real) clip.addPath(p.hole);
    g.clip(clip);
    g.drawImage(insideCanvas(D), -D.w / 2, -D.h / 2, D.w, D.h);
    g.restore();
  }
  g.drawImage(G2.scratch, 0, 0, pw, ph, -cw / 2, -ch / 2, cw, ch);
}

function drawWeakSpots(g, D, t, dark){
  for(const s of weakSpots(D)){
    const p = 0.5 + 0.5 * Math.sin(t * 6 + s.x);
    glowAdd(g, s.x, s.y, s.r * (1.3 + p * 0.4), dark ? "#ffd84a" : "#ffb020", dark ? 0.9 : 0.35 + p * 0.25);
    g.strokeStyle = "rgba(255,220,120," + (0.55 + p * 0.4).toFixed(2) + ")"; g.lineWidth = 2;
    g.beginPath(); g.arc(s.x, s.y, s.r * (0.75 + p * 0.15), 0, TAU); g.stroke();
    g.beginPath(); g.moveTo(s.x - s.r * 0.25, s.y); g.lineTo(s.x + s.r * 0.25, s.y); g.moveTo(s.x, s.y - s.r * 0.25); g.lineTo(s.x, s.y + s.r * 0.25); g.stroke();
  }
}

/* the weapon swinging in at the tap */
function drawSwing(g, S, t){
  const k = S.t / 0.22, s = Math.min(W, H) * 0.09 * (S.crit ? 1.15 : 1);
  const hitAt = 0.35;
  let ang;
  if(k < hitAt) ang = lerp(-1.3, 0, easeIn(k / hitAt)); else ang = lerp(0, -0.35, (k - hitAt) / (1 - hitAt));
  const a = k < 0.8 ? 1 : (1 - k) / 0.2;
  g.save(); g.globalAlpha = a;
  const id = S.wid;
  if(id === "press"){
    /* comes down from the top */
    const y = lerp(-H * 0.2, S.y - s * 0.4, Math.min(1, k / hitAt));
    g.translate(S.x, y); drawWeaponIcon(g, id, s * 1.4, t);
  }else if(id === "wreck"){
    g.translate(S.x - s * 2.4, S.y - s * 3.2); g.rotate(-0.6 + Math.min(1, k / hitAt) * 0.6);
    g.translate(0, s * 2.6); drawWeaponIcon(g, id, s * 1.2, t);
  }else if(id === "laser"){
    g.strokeStyle = "rgba(255,80,110,.9)"; g.lineWidth = 5 * (1 - k);
    g.beginPath(); g.moveTo(W + 20, S.y - 40); g.lineTo(S.x, S.y); g.stroke();
    glowAdd(g, S.x, S.y, s, "#ff3a5a", 0.8 * (1 - k));
  }else if(id === "storm"){
    g.strokeStyle = "rgba(200,245,255,.95)"; g.lineWidth = 2.5;
    g.beginPath(); let x = S.x + (hash01(S.x) - 0.5) * 40, y = 0; g.moveTo(x, y);
    while(y < S.y){ y += 22; x += (Math.random() - 0.5) * 30; g.lineTo(y > S.y ? S.x : x, Math.min(y, S.y)); }
    g.stroke(); glowAdd(g, S.x, S.y, s * 1.2, "#9fe8ff", 0.8 * (1 - k));
  }else if(id === "bhgun"){
    const r = s * 0.5 * Math.sin(k * Math.PI);
    g.fillStyle = "#000"; g.beginPath(); g.arc(S.x, S.y, r, 0, TAU); g.fill();
    g.strokeStyle = "#b07bff"; g.lineWidth = 2; g.beginPath(); g.ellipse(S.x, S.y, r * 1.8, r * 0.5, t * 4, 0, TAU); g.stroke();
  }else{
    /* swung in from the lower right */
    g.translate(S.x + s * 0.9, S.y + s * 1.2); g.rotate(ang - 0.5);
    g.translate(0, -s * 1.1);
    drawWeaponIcon(g, id, s, t);
  }
  g.restore();
  if(k > hitAt && k < hitAt + 0.25){
    const q = (k - hitAt) / 0.25;
    g.strokeStyle = "rgba(255,255,255," + (0.7 * (1 - q)).toFixed(2) + ")"; g.lineWidth = 3 * (1 - q);
    g.beginPath(); g.arc(S.x, S.y, s * (0.2 + q * 0.7), 0, TAU); g.stroke();
  }
}

/* dust for the snap */
const DUST = { snap:null, pts:[] };
function makeDust(){
  const sw = 64, shh = Math.max(32, Math.round(64 * H / Math.max(1, W)));
  const small = mkCanvas(sw, shh), sg = small.getContext("2d");
  sg.drawImage(cv, 0, 0, sw, shh);
  let data = null;
  try{ data = sg.getImageData(0, 0, sw, shh).data; }catch(e){}
  DUST.snap = mkCanvas(W * DPR, H * DPR); DUST.snap.getContext("2d").drawImage(cv, 0, 0);
  DUST.pts = [];
  for(let y = 0; y < shh; y++) for(let x = 0; x < sw; x++){
    if((x + y) % 2) continue;
    const i = (y * sw + x) * 4;
    const col = data ? "rgb(" + data[i] + "," + data[i + 1] + "," + data[i + 2] + ")" : "#888";
    DUST.pts.push({ x:(x + 0.5) / sw * W, y:(y + 0.5) / shh * H, col:col, d:x / sw * 1.7 + Math.random() * 0.35, vx:30 + Math.random() * 90, vy:-20 - Math.random() * 70, s:W / sw * 1.4 });
  }
}
function drawSnap(g, t){
  const st = SNP.t;
  if(st < 0.7){
    /* the gauntlet, raised */
    glowAdd(g, W / 2, H * 0.42, Math.min(W, H) * 0.5, "#ffd27a", 0.25 + st * 0.5);
    g.save(); g.translate(W / 2, H * 0.42 + (1 - easeOut3(Math.min(1, st / 0.4))) * H * 0.4); g.rotate(Math.sin(st * 30) * 0.03 * st);
    drawWeaponIcon(g, "omni", Math.min(W, H) * 0.22, t); g.restore();
    return;
  }
  if(!DUST.snap) makeDust();
  const dt2 = st - 0.7, front = dt2 / 1.7 * W * 1.15;
  if(st < 3.2){
    g.save(); g.beginPath(); g.rect(front, 0, W, H); g.clip();
    g.drawImage(DUST.snap, 0, 0, DUST.snap.width, DUST.snap.height, 0, 0, W, H);
    g.restore();
    g.fillStyle = "#000"; g.fillRect(0, 0, Math.min(W, front), H);
    const fg = g.createLinearGradient(front - 30, 0, front + 6, 0); fg.addColorStop(0, "rgba(255,210,120,0)"); fg.addColorStop(1, "rgba(255,210,120,.35)");
    g.fillStyle = fg; g.fillRect(front - 30, 0, 36, H);
    for(const p of DUST.pts){
      const a = dt2 - p.d; if(a <= 0 || p.x > front + 4) continue;
      const life = Math.max(0, 1 - a / 1.6); if(life <= 0) continue;
      g.globalAlpha = life; g.fillStyle = a < 0.25 ? "#ffe2a0" : p.col;
      g.fillRect(p.x + p.vx * a, p.y + p.vy * a - a * a * 12, p.s * (0.4 + life * 0.6), p.s * (0.4 + life * 0.6));
    }
    g.globalAlpha = 1;
  }else{
    const w2 = clamp((st - 3.2) / 0.8, 0, 1), out = clamp((st - 4.6) / 0.8, 0, 1);
    g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
    if(st > 4.6){
      /* stars rushing past: out of the house, past the Earth, into space */
      for(let i = 0; i < 90; i++){
        const a = hash01(i) * TAU, sp = (st - 4.6) * (220 + hash01(i + 3) * 500), r0 = (sp + hash01(i + 9) * 300) % (Math.max(W, H) * 0.8);
        g.strokeStyle = "rgba(255,255,255," + (0.3 + hash01(i + 1) * 0.6).toFixed(2) + ")"; g.lineWidth = 1.2;
        g.beginPath(); g.moveTo(W / 2 + Math.cos(a) * r0, H / 2 + Math.sin(a) * r0); g.lineTo(W / 2 + Math.cos(a) * (r0 + 14 + sp * 0.02), H / 2 + Math.sin(a) * (r0 + 14 + sp * 0.02)); g.stroke();
      }
      const ta = st < 5.4 ? (st - 4.6) / 0.8 : st < 6.9 ? 1 : Math.max(0, 1 - (st - 6.9) / 0.6);
      g.globalAlpha = ta; ctext(g, "NOTHING IS TOO BIG NOW.", W / 2, H * 0.45, Math.min(30, W * 0.07), "#e8dcff", "center", null, false); g.globalAlpha = 1;
    }
    if(w2 > 0 && out < 1){ g.fillStyle = "rgba(255,250,235," + (w2 * (1 - out)).toFixed(3) + ")"; g.fillRect(0, 0, W, H); }
  }
}

/* ---------- the frame ---------- */
function drawG2(t, dt){
  updateParts(dt, 0);
  if(G2.mode === "snap" && SNP.t >= 0.7){ ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H); drawSnap(ctx, t); drawParts(ctx); drawFlash(ctx); return; }
  if(G2.mode !== "snap") DUST.snap = null;
  const sh = shakeOffset();
  ctx.save(); ctx.translate(sh[0], sh[1]);
  ctx.drawImage(basementCache(), 0, 0, W, H);
  const env = envNow();
  /* rain on the little window */
  if(env.weather === "rain" || env.weather === "storm"){
    const wx = W * 0.07, wy = H * 0.11, ww = Math.max(70, W * 0.26), wh = H * 0.1;
    ctx.save(); ctx.beginPath(); ctx.rect(wx, wy, ww, wh); ctx.clip();
    ctx.strokeStyle = "rgba(210,225,240,.5)"; ctx.lineWidth = 1; ctx.beginPath();
    for(let i = 0; i < 18; i++){ const x = wx + hash01(i * 3.3) * ww, y = wy + ((hash01(i * 7.1) * wh + t * 200) % wh); ctx.moveTo(x, y); ctx.lineTo(x - 2, y + 7); }
    ctx.stroke(); ctx.restore();
  }
  /* dad on the stairs */
  const E = G2.visitor;
  if(E && E.v.id === "dad"){
    const q = E.t / E.dur, down = q < 0.35 ? q / 0.35 : q > 0.7 ? 1 - (q - 0.7) / 0.3 : 1;
    const s = Math.min(W, H) * 0.08, x = W * 0.94, y = H * 0.1 + down * H * 0.22;
    ctx.save(); ctx.fillStyle = "rgba(255,240,200,.25)"; ctx.fillRect(W * 0.88, 0, W * 0.12, H * 0.42); ctx.restore();
    ctx.save(); ctx.translate(x, y); drawDadLegs(ctx, s, t, E.t * 3); ctx.restore();
    if(q > 0.3 && q < 0.75){
      ctx.fillStyle = "#fff"; rrect(ctx, W * 0.36, H * 0.14, W * 0.52, 36, 10); ctx.fill();
      ctext(ctx, "WHAT IS THAT NOISE", W * 0.62, H * 0.14 + 18, 14, "#c4302c", "center", "16px Anton, Impact, sans-serif", false);
    }
  }
  /* the jar */
  if(G2.jar){ const p = jarPos(), pop = Math.min(1, G2.jar.born * 4); ctx.save(); ctx.translate(p.x, p.y); ctx.scale(pop, pop); drawJar(ctx, 0, 0, p.s, t, G2.jar.kind); ctx.restore(); if(G2.jar.life < 3 && Math.sin(t * 12) > 0){ ctx.globalAlpha = 0.5; drawJar(ctx, p.x, p.y, p.s, t, G2.jar.kind); ctx.globalAlpha = 1; } }
  /* the bulb */
  const lightOn = G2.mode !== "intro" || (G2.intro && G2.intro.lightOn) || (G2.t > 0.55 && G2.t < 0.65) || (G2.t > 0.95 && G2.t < 1.02);
  const bulb = drawBulb(ctx, t, G2.bulbSwing, lightOn && G2.power <= 0);
  /* the crate */
  if(G2.crate && (G2.mode === "drop" || G2.mode === "crate")){
    const b = crateBox(), C = G2.crate;
    ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.beginPath(); ctx.ellipse(b.x, benchY() + 2, b.s * 1.1, b.s * 0.18, 0, 0, TAU); ctx.fill();
    ctx.save(); ctx.translate(b.x, b.y + C.y); drawCrate(ctx, C.ci, b.s, t, C.dmg); ctx.restore();
    if(G2.mode === "crate"){ const pulse = 0.5 + 0.5 * Math.sin(t * 6); ctext(ctx, "TAP TO OPEN", b.x, b.y - b.s * 1.25, 12, "rgba(255,255,255," + (0.5 + pulse * 0.4).toFixed(2) + ")", "center", "700 12px 'Space Grotesk', sans-serif", true); }
  }
  /* the device */
  const D = G2.dev;
  if(D && G2.mode !== "breaking" && G2.mode !== "intro"){
    const shx = (Math.random() - 0.5) * D.shake * 6, shy = (Math.random() - 0.5) * D.shake * 4;
    const rv = G2.mode === "reveal" ? clamp(G2.t / 0.35, 0, 1) : 1;
    /* reveal: a beam of light in the rarity color */
    if(G2.mode === "reveal" && D.ri >= 1){
      const col = RARITIES[D.ri].col, a = (1 - clamp((G2.t - 0.2) / 0.5, 0, 1));
      const bg = ctx.createLinearGradient(0, 0, 0, benchY()); bg.addColorStop(0, withAlpha(col, 0)); bg.addColorStop(1, withAlpha(col, 0.45 * a));
      ctx.fillStyle = bg; ctx.fillRect(D.x - D.w * 0.7, 0, D.w * 1.4, benchY());
      if(D.ri >= 4) burst(2, { x:D.x + (Math.random() - 0.5) * D.w, y:benchY(), speed:120, ang:-Math.PI / 2, spread:0.6, life:0.8, size:3, type:"glow", col:col, g:-100 });
    }
    ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.beginPath(); ctx.ellipse(D.x, benchY() + 2, D.w * 0.55, Math.max(4, D.h * 0.05), 0, 0, TAU); ctx.fill();
    if(D.ri >= 2 && !D.boss){ const col = D.ri === 6 ? hsl(t * 120, 100, 60) : RARITIES[D.ri].col; glowAdd(ctx, D.x, D.y, Math.max(D.w, D.h) * 0.8, col, 0.18 + 0.08 * Math.sin(t * 3) + D.ri * 0.02); }
    ctx.save();
    ctx.translate(D.x + shx, D.y + shy + (1 - rv) * -30);
    ctx.globalAlpha = rv;
    if(D.ri === 6 && !D.boss && Math.floor(t * 8) % 7 === 0){
      /* glitched: it can't hold itself together */
      ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = 0.5; ctx.translate(-4, 0); renderDevice(ctx, D, t); ctx.restore();
    }
    renderDevice(ctx, D, t);
    if(G2.mode === "device" || G2.mode === "boss") drawWeakSpots(ctx, D, t, G2.power > 0);
    ctx.restore();
    /* name + health */
    const R = RARITIES[D.ri];
    const top = D.y - D.h / 2 - 26;
    const bw = Math.min(W * 0.6, Math.max(120, D.w));
    const hpk = clamp(D.hp / D.max, 0, 1);
    ctx.fillStyle = "rgba(0,0,0,.55)"; rrect(ctx, D.x - bw / 2, top, bw, 7, 3.5); ctx.fill();
    ctx.fillStyle = D.boss ? "#ff3a3a" : (D.ri === 6 ? hsl(t * 120, 100, 60) : R.col); rrect(ctx, D.x - bw / 2, top, bw * hpk, 7, 3.5); ctx.fill();
    const label = D.boss ? D.d.name : R.name.toUpperCase() + "  " + D.d.name;
    ctext(ctx, label, D.x, top - 10, 12, D.boss ? "#ff8a8a" : (D.ri === 6 ? hsl(t * 120, 100, 70) : R.col), "center", "700 12px 'Space Grotesk', sans-serif", true);
    if(!D.boss) ctext(ctx, fmt(D.hp) + " / " + fmt(D.max), D.x, top + 16, 10, "rgba(255,255,255,.7)", "center", "700 10px 'Space Grotesk', sans-serif", true);
  }
  /* boss extras */
  if(G2.boss && G2.dev){ drawBossUI(ctx, G2.dev, t); }
  /* chunks of a broken device */
  if(G2.mode === "breaking"){
    for(const c of G2.chunks){
      ctx.save(); ctx.globalAlpha = clamp(c.life, 0, 1);
      ctx.translate(c.x, c.y); ctx.rotate(c.rot);
      ctx.drawImage(c.snap, c.sx * DPR, c.sy * DPR, c.cw * DPR, c.ch * DPR, -c.cw / 2, -c.ch / 2, c.cw, c.ch);
      ctx.restore();
    }
  }
  /* the robot arm */
  if(up2("arm") > 0){
    const A = G2.arm || { swing:0, tx:W / 2, ty:benchY() - 40 };
    drawRobotArm(ctx, t, A.swing || 0, A.tx || W / 2, A.ty || benchY() - 40, up2("arm"));
  }
  /* visitors on the bench */
  if(E && (E.v.id === "rat" || E.v.id === "cat2")){
    const q = E.t / E.dur, s = Math.min(W, H) * (E.v.id === "rat" ? 0.04 : 0.07);
    if(E.v.id === "rat"){
      const x = lerp(-60, W + 60, q), y = benchY();
      ctx.save(); ctx.translate(x, y); drawRat(ctx, s, t, q > 0.5); ctx.restore();
    }else{
      const x = q < 0.45 ? lerp(-80, W / 2 - (G2.dev ? G2.dev.w * 0.6 : 40), q / 0.45) : lerp(W / 2 - (G2.dev ? G2.dev.w * 0.6 : 40), -90, (q - 0.55) / 0.45);
      ctx.save(); ctx.translate(x, benchY() - s * 0.1); ctx.scale(q < 0.5 ? -1 : 1, 1); drawCat(ctx, s / 30 * 1.6, t, q > 0.4 && q < 0.55 ? 1 : 0); ctx.restore();
    }
  }
  /* weapon swings */
  for(const S of G2.swings) drawSwing(ctx, S, t);
  drawParts(ctx);
  drawFloats(ctx);
  ctx.restore();
  /* lights out */
  if(G2.power > 0){
    const a = clamp(Math.min(G2.power, 10 - G2.power) * 2, 0, 0.88);
    ctx.fillStyle = "rgba(0,0,6," + a.toFixed(3) + ")"; ctx.fillRect(0, 0, W, H);
    if(G2.dev){ ctx.save(); ctx.translate(G2.dev.x, G2.dev.y); drawWeakSpots(ctx, G2.dev, t, true); ctx.restore(); }
  }
  /* the intro: darkness, the light flickers on, the title */
  if(G2.mode === "intro"){
    const it = G2.t;
    const dark = it < 1.7 ? (lightOn ? 0.55 : 0.97) : Math.max(0, 0.97 - (it - 1.7) * 2.5);
    ctx.fillStyle = "rgba(0,0,0," + dark.toFixed(3) + ")"; ctx.fillRect(0, 0, W, H);
    if(it < 1.7 && !lightOn) glowAdd(ctx, bulb[0], bulb[1], 10, "#3a3020", 0.4);
    if(it > 2.1 && it < 4.9){
      const a = it < 2.6 ? (it - 2.1) / 0.5 : it < 4.4 ? 1 : (4.9 - it) / 0.5;
      ctx.globalAlpha = clamp(a, 0, 1);
      ctext(ctx, "SMASH", W / 2, H * 0.36, Math.min(86, W * 0.2), "#ffcc1a", "center", null, true);
      ctext(ctx, "Everything down here breaks.", W / 2, H * 0.36 + Math.min(56, W * 0.13), 14, "#ece6d6", "center", "500 14px 'Space Grotesk', sans-serif", true);
      ctx.globalAlpha = 1;
    }
  }
  /* the forge: six gems fly into the gauntlet */
  if(G2.mode === "forge"){
    const ft = G2.t;
    ctx.fillStyle = "rgba(0,0,0," + Math.min(0.85, ft * 0.6).toFixed(3) + ")"; ctx.fillRect(0, 0, W, H);
    const s = Math.min(W, H) * 0.2, cx = W / 2, cy = H * 0.45;
    glowAdd(ctx, cx, cy, s * 2, "#ffd27a", 0.2 + Math.min(1, ft / 4) * 0.5);
    ctx.save(); ctx.translate(cx, cy); drawWeaponIcon(ctx, "omni", s, t); ctx.restore();
    GEMS.forEach((gm, i) => {
      const at = 0.4 + i * 0.45, q = clamp((ft - at) / 0.45, 0, 1);
      if(q >= 1) return;
      const a0 = i / 6 * TAU, sx = cx + Math.cos(a0) * W * 0.5, sy = cy + Math.sin(a0) * H * 0.4;
      const x = lerp(sx, cx, easeIn(q)), y = lerp(sy, cy, easeIn(q));
      glowAdd(ctx, x, y, 22, gm.col, 0.9); ctx.fillStyle = gm.col; ctx.beginPath(); ctx.arc(x, y, 7, 0, TAU); ctx.fill();
      if(q > 0.95 && !gm._hit){ gm._hit = true; }
    });
    if(ft > 3.4){ ctx.fillStyle = "rgba(255,248,225," + clamp((ft - 3.4) * 2, 0, 1).toFixed(3) + ")"; ctx.fillRect(0, 0, W, H); }
  }
  if(G2.mode === "snap") drawSnap(ctx, t);
  vignette(ctx, 0.35);
  /* the dust is made from this exact frame, right before the snap */
  if(G2.mode === "snap" && SNP.t > 0.6 && !DUST.snap) makeDust();
  drawFlash(ctx);
}

function drawBossUI(g, D, t){

  ctext(g, fmtClock(sec), W / 2, H * 0.1, 26, col, "center", null, true);
  if(G2.freeze > 0){ g.fillStyle = "rgba(160,220,255,.18)"; g.fillRect(0, 0, W, H); ctext(g, "FROZEN", W / 2, H * 0.17, 16, "#9fe8ff", "center", null, true); }
  if(k === "roguerobot" && Bs.shield){

    g.strokeStyle = "rgba(120,200,255,.8)"; g.lineWidth = 3; g.fillStyle = "rgba(120,200,255,.12)";
    g.beginPath(); g.ellipse(0, 0, D.w * 0.62, D.h * 0.62, 0, 0, TAU); g.fill(); g.stroke();
    g.restore();
  }

    for(let yy = -D.h / 2; yy < D.h / 2; yy += hx * 1.5) for(let xx = -D.w / 2 + ((Math.round(yy / (hx * 1.5)) % 2) ? hx * 0.87 : 0); xx < D.w / 2; xx += hx * 1.74){
      g.beginPath(); for(let i = 0; i < 6; i++){ const a = i / 6 * TAU + Math.PI / 6; g.lineTo(xx + Math.cos(a) * hx, yy + Math.sin(a) * hx); } g.closePath(); g.stroke();
    }
