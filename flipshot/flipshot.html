        }
        case "uranus": { const bands = Math.sin(lat * 6 + n) * 6; put(i, 150 + bands, 220 + bands, 228 + bands); break; }
        case "neptune": {
          const bands = Math.sin(lat * 7 + n * 2) * 14;
          let r = 50 + bands, gg = 100 + bands, b = 220 + bands;
          const sx = sx2 - 100, sy = sy2 - 76; if((sx * sx) / 200 + (sy * sy) / 50 < 1){ r -= 30; gg -= 50; b -= 70; }
          if(n2 > 0.68){ r += 120; gg += 110; b += 30; }
          put(i, r, gg, b); break;
        }
        case "pluto": {
          let r = 190 + n * 40, gg = 160 + n * 35, b = 130 + n * 30;
          const hx = sx2 - 128, hy = sy2 - 64;
          const heart = Math.pow(hx / 28, 2) + Math.pow((hy + Math.abs(hx) * 0.45 - 4) / 22, 2) < 1;
          if(heart){ r = 245; gg = 238; b = 228; }
          else if(Math.abs(lat) < 0.25 && n2 > 0.45){ r -= 90; gg -= 80; b -= 70; }
          put(i, r, gg, b); break;
        }
        case "io": { let r = 230, gg = 205 + n * 30, b = 80 + n * 40; if(n2 > 0.64){ r = 200; gg = 90; b = 30; } if(n2 > 0.72){ r = 40; gg = 30; b = 20; } put(i, r, gg, b); break; }
        case "europa": {
          let r = 225 + n * 20, gg = 215 + n * 20, b = 200 + n * 15;
          const line = Math.abs(Math.sin(sx2 * 0.11 + sy2 * 0.07 + n * 6)) < 0.05 || Math.abs(Math.sin(sx2 * 0.05 - sy2 * 0.13 + n2 * 5)) < 0.04;
          if(line){ r = 150; gg = 90; b = 60; }
          put(i, r, gg, b); break;
        }
        case "titan": { const b2 = Math.sin(lat * 4 + n) * 10; put(i, 215 + b2, 150 + b2, 60 + b2); break; }
        case "ganymede": { const v = 140 + n * 60; put(i, v, v - 8, v - 18); break; }
        case "guarded": {
          /* steel-blue rock laced with glowing shield lines */
          let r = 70 + n * 60, gg = 88 + n * 62, b = 118 + n * 64;
          const ln = Math.abs(Math.sin(sx2 * 0.09 + sy2 * 0.05 + n * 5)) < 0.045 || Math.abs(Math.sin(sx2 * 0.04 - sy2 * 0.11 + n2 * 4)) < 0.035;
          if(ln){ r = 110; gg = 235; b = 255; }
          put(i, r, gg, b); break;
        }
        case "armada": {
          /* a dark violet storm world, lit up by alien city lights */
          const bands = Math.sin(lat * 9 + n * 3);
          let r = 70 + bands * 26 + n * 20, gg = 34 + bands * 12, b = 96 + bands * 30 + n * 20;
          if(n2 > 0.66 && hash01(x * 0.37 + y * 1.71) > 0.55){ r = 255; gg = 170; b = 255; }
          put(i, r, gg, b); break;
        }
        default: put(i, 128 + n * 80, 128 + n * 80, 128 + n * 80);
      }
    }
  }
  g.putImageData(img, 0, 0);
  texCache.set(kind, c);
  return c;
}
/* draw a textured, lit, spinning sphere using vertical strips */
function texStrip(g, tex, u0, uw, dx, dy, dw, dh){
  const TW = tex.width, TH = tex.height;
  u0 = ((u0 % 1) + 1) % 1;
  const sx = u0 * TW, sw = Math.max(0.5, uw * TW);
  if(sx + sw <= TW){ g.drawImage(tex, sx, 0, sw, TH, dx, dy, dw, dh); return; }
  const a = TW - sx, fa = a / sw;
  if(a > 0.01) g.drawImage(tex, sx, 0, a, TH, dx, dy, dw * fa + 0.3, dh);
  g.drawImage(tex, 0, 0, Math.max(0.5, sw - a), TH, dx + dw * fa, dy, dw * (1 - fa), dh);
}
function drawSphere(g, kind, x, y, r, spin, opts){
  opts = opts || {};
  if(r < 0.6) return;
  const tex = planetTex(kind);
  g.save();
  g.beginPath(); g.arc(x, y, r, 0, TAU); g.clip();
  const strips = clamp(Math.round(r / 2.2), 10, 72);
  const ct = opts.clouds ? planetTex("clouds") : null, cs = spin * 1.3;
  for(let s = 0; s < strips; s++){
    const x0 = -1 + 2 * s / strips, x1 = -1 + 2 * (s + 1) / strips;
    const lon0 = Math.asin(clamp(x0, -1, 1)), lon1 = Math.asin(clamp(x1, -1, 1));
    const uw = (lon1 - lon0) / Math.PI * 0.5;
    const dx = x + x0 * r, dw = (x1 - x0) * r + 0.7;
    texStrip(g, tex, spin + lon0 / Math.PI * 0.5, uw, dx, y - r, dw, r * 2);
    if(ct){ g.globalAlpha = 0.85; texStrip(g, ct, cs + lon0 / Math.PI * 0.5, uw, dx, y - r, dw, r * 2); g.globalAlpha = 1; }
  }

  const lx = opts.lightX === undefined ? -0.55 : opts.lightX, ly = opts.lightY === undefined ? -0.45 : opts.lightY;
  const sh = g.createRadialGradient(x + lx * r * 0.6, y + ly * r * 0.6, r * 0.1, x, y, r * 1.08);
  sh.addColorStop(0, "rgba(255,255,255,.12)"); sh.addColorStop(0.55, "rgba(0,0,0,0)"); sh.addColorStop(0.85, "rgba(0,0,0," + (opts.night === undefined ? 0.45 : opts.night) + ")"); sh.addColorStop(1, "rgba(0,0,0,.85)");

  const ll = Math.hypot(lx, ly) || 1, ux = lx / ll, uy = ly / ll;
  const tm = g.createLinearGradient(x + ux * r, y + uy * r, x - ux * r, y - uy * r);
  tm.addColorStop(0, "rgba(0,0,0,0)"); tm.addColorStop(0.5, "rgba(0,0,0,0)"); tm.addColorStop(0.78, "rgba(0,0,0,.32)"); tm.addColorStop(1, "rgba(0,0,0,.62)");

  g.restore();

}
function drawRings(g, x, y, r, tilt, front, col, thin){
  g.save(); g.translate(x, y); g.rotate(tilt || -0.35);
  const rr = [1.35, 1.6, 1.85, 2.2];

function drawStar(g, x, y, r, col, t){

  const sg = g.createRadialGradient(x - r * 0.2, y - r * 0.2, 1, x, y, r);
  sg.addColorStop(0, "#ffffff"); sg.addColorStop(0.5, lighten(col, 0.4)); sg.addColorStop(1, col);

function drawSunDisk(g, x, y, r, t){

/* a star's boiling skin: a cached sheet of bright granules with dark lanes, turning slowly, darker at the edge */
const granCache = new Map();
function granTex(core, col){
  const key = core + "|" + col;
  let c = granCache.get(key);
  if(c) return c;
  const S = 256, r = mulberry(strSeed(key));
  c = mkCanvas(S, S);
  const g = c.getContext("2d");
  g.save(); g.beginPath(); g.arc(S / 2, S / 2, S / 2, 0, TAU); g.clip();
  g.fillStyle = withAlpha(darken(col, 0.35), 0.3); g.fillRect(0, 0, S, S);
  for(let i = 0; i < 650; i++){
    const a = r() * TAU, d = Math.sqrt(r()) * S / 2, gx = S / 2 + Math.cos(a) * d, gy = S / 2 + Math.sin(a) * d, s = 3 + r() * 6;

    gg.addColorStop(0, withAlpha(lighten(core, 0.3), 0.5)); gg.addColorStop(1, withAlpha(core, 0));

  lg.addColorStop(0, "rgba(0,0,0,0)"); lg.addColorStop(0.72, withAlpha(darken(col, 0.4), 0.12)); lg.addColorStop(1, withAlpha(darken(col, 0.55), 0.55));

function drawGranules(g, x, y, r, t, core, col){
  const tex = granTex(core, col);

  g.translate(x, y);
  g.rotate(t * 0.02); g.globalAlpha = 0.85; g.drawImage(tex, -r, -r, r * 2, r * 2);
  g.rotate(-t * 0.05); g.globalAlpha = 0.3 + 0.1 * Math.sin(t * 1.3); g.drawImage(tex, -r * 1.06, -r * 1.06, r * 2.12, r * 2.12);

/* glowing loops of gas standing on the edge, only ever outside the disk */
function drawProminences(g, x, y, r, t, col, n){
  g.save();

function drawSpiral(g, x, y, R, t, tilt, col, rot){
  g.save(); g.translate(x, y); g.scale(1, tilt); g.rotate(rot || t * 0.05);
  glowAdd(g, 0, 0, R * 0.55, col || "#ffe8c0", 0.9);

  for(let i = 0; i < n; i++){
    const arm = i % 2, f = i / n, d = f * R, a = f * 7 + arm * Math.PI + hash01(i) * 0.5;

/* ---------- star fields (built per size) ---------- */
let starCanvases = null, starGen = -1;
function starLayers(){
  if(starCanvases && starGen === caches.gen) return starCanvases;
  starGen = caches.gen;
  const make = (n, big) => {
    const c = mkCanvas(W * DPR, H * DPR), g = c.getContext("2d");
    g.scale(DPR, DPR);
    for(let i = 0; i < n; i++){
      const x = Math.random() * W, y = Math.random() * H, b = Math.random();
      g.fillStyle = b < 0.1 ? "#ffd9b0" : b < 0.2 ? "#c9d8ff" : "#ffffff";
      g.globalAlpha = 0.35 + Math.random() * 0.65;
      const s = big ? 1.2 + Math.random() * 1.2 : 0.7 + Math.random() * 0.7;
      g.fillRect(x, y, s, s);
    }
    return c;
  };
  starCanvases = [make(QQ().stars, false), make(Math.round(QQ().stars / 4), true)];
  return starCanvases;
}
function drawStarfield(g, a, scroll){
  if(a <= 0.01) return;
  const L = starLayers();
  g.save(); g.globalAlpha = a;
  for(let i = 0; i < 2; i++){
    const off = ((scroll * (i ? 0.35 : 0.15)) % H + H) % H;
    g.drawImage(L[i], 0, off - H, W, H); g.drawImage(L[i], 0, off, W, H);
  }

/* ---------- the ground falling away (seen during launches) ---------- */
const panoCache = new Map();
function panorama(type, env){
  const key = type + "|" + W + "|" + H + "|" + env.bucket + "|" + caches.gen;
  let c = panoCache.get(key); if(c) return c;
  if(panoCache.size > 12) panoCache.clear();
  const ph = Math.round(H * 0.7);
  c = mkCanvas(W * DPR, ph * DPR);
  const g = c.getContext("2d"); g.scale(DPR, DPR);
  const night = env.day < 0.35;
  const rnd = mulberry(strSeed(type));
  const sil = night ? "#0a1018" : "#2a3a46";
  const far = night ? "#121c28" : "#7f97a8";
  /* far layer */
  g.fillStyle = far;
  g.beginPath(); g.moveTo(0, ph);
  for(let x = 0; x <= W; x += 8){
    let yy;
    if(type === "peaks" || type === "forest") yy = ph * 0.35 + Math.abs(Math.sin(x * 0.012 + 1)) * ph * 0.2 + fbm2(x * 0.02, 1, 3, 1) * ph * 0.15;
    else if(type === "desert") yy = ph * 0.45 + (Math.sin(x * 0.01) > 0.3 ? -ph * 0.12 : 0) + fbm2(x * 0.03, 2, 2, 2) * ph * 0.06;
    else if(type === "beach" || type === "ocean") yy = ph * 0.55;
    else if(type === "city" || type === "high" || type === "highway") yy = ph * 0.4 + (Math.floor(x / 26) % 3) * ph * 0.06 - (hash01(Math.floor(x / 26)) * ph * 0.18);
    else yy = ph * 0.5 + fbm2(x * 0.02, 3, 3, 3) * ph * 0.1;
    g.lineTo(x, yy);
  }
  g.lineTo(W, ph); g.closePath(); g.fill();
  /* water */
  if(type === "beach" || type === "ocean"){
    const wg = g.createLinearGradient(0, ph * 0.55, 0, ph);
    wg.addColorStop(0, night ? "#0a1a2a" : "#3a8ac9"); wg.addColorStop(1, night ? "#05101a" : "#1a5a8a");
    g.fillStyle = wg; g.fillRect(0, ph * 0.55, W, ph * 0.45);
    g.strokeStyle = "rgba(255,255,255,.25)"; g.lineWidth = 1;
    for(let i = 0; i < 18; i++){ const yy = ph * 0.58 + rnd() * ph * 0.4, xx = rnd() * W; g.beginPath(); g.moveTo(xx, yy); g.lineTo(xx + 20, yy); g.stroke(); }
    if(type === "beach"){ g.fillStyle = night ? "#3a3428" : "#e0c890"; g.beginPath(); g.moveTo(0, ph); g.lineTo(0, ph * 0.82); g.quadraticCurveTo(W * 0.5, ph * 0.76, W, ph * 0.86); g.lineTo(W, ph); g.fill(); }
  }
  /* near layer */
  g.fillStyle = sil;
  if(type === "suburb"){
    for(let x = -20; x < W + 40; x += 70 + rnd() * 30){
      const hw = 34 + rnd() * 20, hh2 = 26 + rnd() * 12, base = ph * 0.8;
      g.fillStyle = sil; g.fillRect(x, base - hh2, hw, hh2 + ph);
      g.beginPath(); g.moveTo(x - 6, base - hh2); g.lineTo(x + hw / 2, base - hh2 - 20); g.lineTo(x + hw + 6, base - hh2); g.fill();
      g.fillStyle = night ? "rgba(255,200,110,.85)" : "rgba(180,210,230,.6)";
      g.fillRect(x + 7, base - hh2 + 8, 8, 8); g.fillRect(x + hw - 15, base - hh2 + 8, 8, 8);
      g.fillStyle = sil; g.beginPath(); g.arc(x + hw + 18, base - 18, 16, 0, TAU); g.fill(); g.fillRect(x + hw + 16, base - 6, 4, 20);
    }
  }else if(type === "city" || type === "high" || type === "highway"){
    for(let x = 0; x < W; x += 30 + rnd() * 26){
      const bw = 26 + rnd() * 30, bh = ph * (0.25 + rnd() * 0.45);
      g.fillStyle = sil; g.fillRect(x, ph - bh, bw, bh);
      g.fillStyle = night ? "rgba(255,210,120,.8)" : "rgba(200,225,240,.35)";
      for(let wy = ph - bh + 6; wy < ph - 6; wy += 9) for(let wx = x + 4; wx < x + bw - 5; wx += 7) if(rnd() < (night ? 0.45 : 0.6)) g.fillRect(wx, wy, 3, 4);
    }
    if(type === "highway"){ g.fillStyle = night ? "#15151a" : "#3a3a40"; g.fillRect(0, ph * 0.9, W, ph * 0.1); g.fillStyle = "#e8d23a"; for(let x = 0; x < W; x += 30) g.fillRect(x, ph * 0.95, 14, 2); }
  }else if(type === "peaks" || type === "forest"){
    for(let x = -10; x < W + 20; x += 14 + rnd() * 10){
      const th = 30 + rnd() * 40, base = ph * 0.86 + rnd() * ph * 0.1;
      g.fillStyle = night ? "#0a1410" : "#1f3a2a";
      g.beginPath(); g.moveTo(x, base - th); g.lineTo(x + 12, base); g.lineTo(x - 12, base); g.closePath(); g.fill();
      g.fillStyle = "rgba(255,255,255,.75)"; g.beginPath(); g.moveTo(x, base - th); g.lineTo(x + 4, base - th + 10); g.lineTo(x - 4, base - th + 10); g.fill();
    }
  }else if(type === "desert"){
    for(let i = 0; i < 6; i++){ const x = rnd() * W, base = ph * 0.9;
      g.fillStyle = night ? "#10160c" : "#3a5a2a"; g.fillRect(x, base - 34, 7, 34); g.fillRect(x - 9, base - 24, 6, 4); g.fillRect(x - 9, base - 32, 4, 10); g.fillRect(x + 10, base - 20, 6, 4); g.fillRect(x + 13, base - 28, 4, 10); }
  }else if(type === "volcano"){
    g.fillStyle = "#1a0f0a"; g.beginPath(); g.moveTo(0, ph); g.lineTo(W * 0.2, ph * 0.5); g.lineTo(W * 0.8, ph * 0.5); g.lineTo(W, ph); g.fill();
    const lg = g.createLinearGradient(0, ph * 0.5, 0, ph * 0.62); lg.addColorStop(0, "#ffb020"); lg.addColorStop(1, "rgba(255,80,0,0)");
    g.fillStyle = lg; g.fillRect(W * 0.2, ph * 0.5, W * 0.6, ph * 0.12);
  }
  panoCache.set(key, c);
  return c;
}

/* ---------- Earth (and friends) seen from above ---------- */
function drawHomeBody(g, Lc, t, P){
  const kind = P.group === "mars" ? "mars" : P.group === "moon" ? "moon" : "earth";
  const base = P.group === "orbit" ? 3.9 : P.group === "moon" || P.group === "mars" ? 2.2 : 4.6;
  if(Lc < base - 0.4) return;
  const R = W * 9 * Math.pow(10, -(Lc - base) * 0.62);
  const top = H * 0.74 + (Lc - base) * H * 0.08;
  if(top > H * 1.6 || R < 1) return;
  const cy = top + R;
  const spin = t * 0.004 + 0.3;
  const atmo = kind === "earth" ? "#6ab4ff" : kind === "mars" ? "#ffb08a" : null;
  if(R > W * 3){
    /* still close: draw the curved horizon cheaply */
    g.save();
    g.beginPath(); g.arc(W / 2, cy, R, 0, TAU); g.clip();
    const hg = g.createLinearGradient(0, top, 0, top + H * 0.5);
    if(kind === "earth"){ hg.addColorStop(0, "#9fd0f0"); hg.addColorStop(0.08, "#3a7ab0"); hg.addColorStop(1, "#14304a"); }
    else if(kind === "mars"){ hg.addColorStop(0, "#e0a070"); hg.addColorStop(1, "#7a3a1a"); }
    else { hg.addColorStop(0, "#d0d0d8"); hg.addColorStop(1, "#5a5a66"); }
    g.fillStyle = hg; g.fillRect(0, top, W, H);
    if(kind === "earth"){
      g.globalAlpha = 0.65;
      for(let i = 0; i < 9; i++){ const cx = ((hash01(i * 3) * W * 1.5 + t * 4) % (W * 1.5)) - W * 0.25, cyy = top + 14 + hash01(i * 7) * H * 0.2; g.drawImage(cloudSprite(i + 40, false), cx, cyy, 160, 50); }
      g.globalAlpha = 1;
    }
    g.restore();
  }else drawSphere(g, kind, W / 2, cy, R, spin, { atmo:atmo, clouds:kind === "earth", lightX:-0.7, lightY:-0.6 });
  if(atmo){
    const ag = g.createRadialGradient(W / 2, cy, R * 0.985, W / 2, cy, R * 1.06);
    ag.addColorStop(0, withAlpha(atmo, 0.7)); ag.addColorStop(1, withAlpha(atmo, 0));
    g.fillStyle = ag; g.beginPath(); g.arc(W / 2, cy, R * 1.06, 0, TAU); g.fill();
  }
}

/* ---------- full sky view ---------- */
function drawSkyView(g, Lc, t, P, env){
  const weather = placeWeather(P, env);
  const space = P.group === "orbit" || P.group === "moon" ? 1 : P.group === "mars" ? smooth(clamp((Lc - 2) / 2, 0, 1)) : spaceness(Lc);
  const pal = skyPal(env, P, weather);
  const sp = ["#000004", "#020309", "#060a1c"];
  let c0 = mixc(pal[0], sp[0], space), c1 = mixc(pal[1], sp[1], space), c2 = mixc(pal[2], sp[2], space * 0.92);
  /* underwater: you start in the sea and break the surface */
  if(P.group === "water" && Lc < 1.75){
    const u = clamp(Lc / 1.75, 0, 1);
    c0 = mixc("#0a2a44", pal[0], smooth(u)); c1 = mixc("#0f4a6a", pal[1], smooth(u)); c2 = mixc("#1a6a8a", pal[2], smooth(u));
  }
  /* far out: deep space tints */
  if(Lc > 19){ const u = clamp((Lc - 19) / 3, 0, 1); c0 = mixc(c0, "#05020c", u); c1 = mixc(c1, "#0a0518", u); }
  if(Lc > 26){ const u = clamp((Lc - 26) / 1.2, 0, 1); c1 = mixc(c1, "#3a1408", u * 0.8); c2 = mixc(c2, "#7a3010", u * 0.8); }
  if(Lc > 27.4){ const u = clamp((Lc - 27.4) / 1, 0, 1); c0 = mixc(c0, "#e8e0ff", u * 0.6); c1 = mixc(c1, "#c9b8ff", u * 0.5); c2 = mixc(c2, "#ffffff", u * 0.5); }
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, c0); bg.addColorStop(0.6, c1); bg.addColorStop(1, c2);
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  /* stars: in space, or at night */
  const starA = Math.max(space, env.day < 0.4 && P.group !== "water" ? (0.4 - env.day) * 1.8 * (weather === "clear" ? 1 : 0.25) : 0);
  drawStarfield(g, clamp(starA, 0, 1), Lc * H * PXL_F);
  /* the milky way band glows across deep space */
  if(space > 0.5 && Lc < 19.5){
    g.save(); g.globalAlpha = 0.18 * space; g.translate(W / 2, H / 2); g.rotate(-0.5);
    const mw = g.createLinearGradient(0, -H * 0.2, 0, H * 0.2);
    mw.addColorStop(0, "rgba(200,190,255,0)"); mw.addColorStop(0.5, "rgba(230,215,255,1)"); mw.addColorStop(1, "rgba(200,190,255,0)");
    g.fillStyle = mw; g.fillRect(-W, -H * 0.2, W * 2, H * 0.4);
    g.restore();
  }
  /* sun or moon in the low sky */
  if(P.group !== "water" || Lc > 1.7){
    if(space < 0.9 && env.day > 0.2 && weather !== "storm" && P.group !== "moon" && P.group !== "orbit"){
      const sy = env.phase === "dusk" || env.phase === "dawn" ? H * 0.62 : H * 0.15;
      const sx = W * (env.phase === "dawn" ? 0.18 : env.phase === "dusk" ? 0.82 : 0.78);
      glowAdd(g, sx, sy - (Lc - 0.6) * 4, Math.min(W, H) * 0.2, env.phase === "day" ? "#fff3c4" : "#ffb06a", 0.6 * (1 - space));
      g.fillStyle = "rgba(255,250,230," + (0.9 * (1 - space)).toFixed(2) + ")"; g.beginPath(); g.arc(sx, sy - (Lc - 0.6) * 4, Math.min(W, H) * 0.035, 0, TAU); g.fill();
    }else if(space < 0.7 && env.day <= 0.2){
      const mp = moonPhase(), mx = W * 0.8, my = H * 0.16;
      g.fillStyle = "rgba(235,235,225,.95)"; g.beginPath(); g.arc(mx, my, 14, 0, TAU); g.fill();
      g.fillStyle = mixc(c0, "#000000", 0.2); g.beginPath(); g.arc(mx + (mp - 0.5) * 56, my, 14, 0, TAU); g.fill();
    }
  }
  /* ground falling away */
  if(P.group === "high"){
    /* sky island: the cloud sea is below you */
    const cy = H * 0.86 + (Lc - L_ROOM) * H * 0.35;
    if(cy < H * 1.3){ for(let i = 0; i < 8; i++) g.drawImage(cloudSprite(i + 20, false), i * W / 6 - 60 + Math.sin(t * 0.2 + i) * 10, cy - 30 + (i % 2) * 18, 200, 90); }
  }else if(P.group === "water" && Lc < 2.6){
    const sy = H * 0.42 - (1.7 - Lc) * H * PXL_F;
    if(sy > -40 && sy < H + 40){
      g.fillStyle = "rgba(200,240,255,.55)"; g.fillRect(0, sy - 1, W, 3);
      g.strokeStyle = "rgba(255,255,255,.35)"; g.lineWidth = 1;
      for(let x = 0; x < W; x += 24){ g.beginPath(); g.moveTo(x, sy + Math.sin(t * 2 + x) * 2); g.lineTo(x + 12, sy + Math.sin(t * 2 + x + 1) * 2); g.stroke(); }
    }
    if(Lc < 1.7){
      for(let i = 0; i < 5; i++){ const rx = (i + 0.5) * W / 5 + Math.sin(t * 0.3 + i) * 20; const rg = g.createLinearGradient(rx, 0, rx + 40, H);
        rg.addColorStop(0, "rgba(180,230,255,.18)"); rg.addColorStop(1, "rgba(180,230,255,0)"); g.fillStyle = rg; g.fillRect(rx - 10, 0, 30, H); }
      for(let i = 0; i < 4; i++){ const fx = ((t * 30 * (i % 2 ? 1 : -1) + i * 200) % (W + 80) + W + 80) % (W + 80) - 40, fy = lmY(0.9 + i * 0.22, Lc);
        g.fillStyle = ["#ffb03a", "#4dc9ff", "#ffd23a", "#ff6a8a"][i]; g.beginPath(); g.ellipse(fx, fy, 9, 5, 0, 0, TAU); g.fill(); }
    }
  }else if(P.group !== "orbit"){
    const pano = panorama(P.group === "moon" ? "desert" : P.outside, env);
    const py = H * 0.62 + (Lc - L_ROOM) * H * 0.85;
    if(py < H){
      g.drawImage(pano, 0, py, W, pano.height / DPR);
      if(P.group === "moon"){ g.fillStyle = "rgba(160,160,170,.85)"; g.fillRect(0, py + H * 0.3, W, H); }
    }
  }
  drawHomeBody(g, Lc, t, P);
  /* landmarks near the camera */
  for(const m of LM){
    if(Math.abs(m.L - Lc) > (m.big ? 1.6 : 1.1)) continue;
    if(m.cl && (P.group === "moon" || P.group === "orbit" || P.group === "mars")) continue;
    if((m.kind === "birds" || m.kind === "heli" || m.kind === "hotair" || m.kind === "plane" || m.kind === "wballoon") && (P.group === "moon" || P.group === "orbit" || P.group === "mars")) continue;
    if(m.kind === "iss" && P.group === "orbit") continue;
    drawLandmark(g, m, lmY(m.L, Lc), Lc, t, env, P);
  }
  /* weather in the low sky */
  if(Lc < 4 && (weather === "rain" || weather === "storm")){
    g.strokeStyle = "rgba(200,215,235,.35)"; g.lineWidth = 1;
    g.beginPath();
    for(let i = 0; i < 60; i++){ const x = (hash01(i * 3.1) * W + t * 60) % W, y = (hash01(i * 7.3) * H + t * 900) % H; g.moveTo(x, y); g.lineTo(x - 3, y + 12); }
    g.stroke();
    if(weather === "storm" && (t % 5.3) < 0.08 && save.settings.flash){ g.fillStyle = "rgba(220,230,255,.35)"; g.fillRect(0, 0, W, H); }
  }else if(Lc < 4 && weather === "snow"){
    g.fillStyle = "rgba(255,255,255,.85)";
    for(let i = 0; i < 50; i++){ const x = (hash01(i * 3.1) * W + Math.sin(t + i) * 10) % W, y = (hash01(i * 7.3) * H + t * 50) % H; g.fillRect(x, y, 2, 2); }
  }else if(Lc < 3.2 && weather === "fog"){
    g.fillStyle = "rgba(220,225,230,.25)"; g.fillRect(0, 0, W, H);
  }else if(weather === "ash" && Lc < 3.5){
    g.fillStyle = "rgba(60,50,45,.5)";
    for(let i = 0; i < 40; i++){ const x = (hash01(i * 3.1) * W + t * 20) % W, y = (hash01(i * 7.3) * H - t * 30 + H * 10) % H; g.fillRect(x, y, 2, 2); }
  }
}

/* ---------- where top bottles land ---------- */
function drawCosmicFloor(g, land, t, fy, k){
  const R = W * 3;
  switch(land){
    case "moon": {
      drawSphere(g, "earth", W * 0.78, H * 0.2, Math.min(W, H) * 0.09, t * 0.01, { atmo:"#6ab4ff", clouds:true });
      const mg = g.createLinearGradient(0, fy, 0, H);
      mg.addColorStop(0, "#b8b8c0"); mg.addColorStop(0.2, "#8a8a94"); mg.addColorStop(1, "#4a4a52");
      g.fillStyle = mg; g.beginPath(); g.arc(W / 2, fy + R, R, 0, TAU); g.fill();
      g.fillStyle = "rgba(60,60,70,.35)";
      for(let i = 0; i < 9; i++){ const cx = hash01(i * 4.2) * W, cy = fy + 14 + hash01(i * 2.6) * (H - fy); g.beginPath(); g.ellipse(cx, cy, 16 + i * 2, 4 + i * 0.6, 0, 0, TAU); g.fill(); }
      break;
    }
    case "saturn": {
      const sr = Math.min(W, H) * 0.5;
      drawSphere(g, "saturn", W * 0.5, fy - sr * 0.55, sr, t * 0.01, {});
      g.save();
      const rg = g.createLinearGradient(0, fy - 20, 0, H);
      rg.addColorStop(0, "rgba(230,215,170,.95)"); rg.addColorStop(0.5, "rgba(190,175,140,.7)"); rg.addColorStop(1, "rgba(120,110,90,.4)");
      g.fillStyle = rg; g.fillRect(0, fy, W, H - fy);
      g.fillStyle = "rgba(255,255,255,.55)";
      for(let i = 0; i < 90; i++){ const x = hash01(i * 3.3) * W, y = fy + Math.pow(hash01(i * 7.1), 1.6) * (H - fy); g.fillRect(x + Math.sin(t + i) * 2, y, 2, 1.5); }
      g.fillStyle = "rgba(60,50,40,.3)"; g.fillRect(0, fy + (H - fy) * 0.35, W, 3);
      g.restore();
      break;
    }
    case "galaxy": case "andromeda": {
      if(land === "andromeda") drawSpiral(g, W * 0.2, H * 0.22, Math.min(W, H) * 0.12, t, 0.5, "#ffe8c0");
      const gg = g.createLinearGradient(0, fy - 30, 0, fy + 60);
      gg.addColorStop(0, "rgba(255,240,210,0)"); gg.addColorStop(0.45, "rgba(255,235,200,.95)"); gg.addColorStop(0.55, "rgba(255,225,180,.95)"); gg.addColorStop(1, "rgba(200,180,255,0)");
      g.fillStyle = gg; g.fillRect(0, fy - 30, W, 90);
      glowAdd(g, W / 2, fy + 5, Math.min(W, H) * 0.35, "#fff0d0", 0.8);
      for(let i = 0; i < 160; i++){ const x = hash01(i * 2.7) * W, y = fy - 18 + hash01(i * 5.3) * 46 + Math.sin(x * 0.01 + t * 0.2) * 3;
        g.fillStyle = i % 5 ? "rgba(220,225,255,.8)" : "rgba(255,230,200,.9)"; g.fillRect(x, y, 1.5, 1.5); }
      g.fillStyle = "rgba(60,30,40,.35)"; g.fillRect(0, fy + 4, W, 3);
      break;
    }
    case "cluster": {
      for(let i = 0; i < 22; i++){ const x = hash01(i * 5.5) * W, y = fy + 6 + hash01(i * 2.2) * 50, s = 8 + hash01(i) * 14;
        glowAdd(g, x, y, s * 2, i % 2 ? "#ffe8c0" : "#c9d6ff", 0.8); g.fillStyle = "rgba(255,250,235,.9)"; g.beginPath(); g.ellipse(x, y, s * 0.6, s * 0.25, hash01(i * 9) * 3, 0, TAU); g.fill(); }
      glowAdd(g, W / 2, fy + 10, Math.min(W, H) * 0.3, "#d8d0ff", 0.5);
      break;
    }
    case "web": {
      g.strokeStyle = "rgba(170,150,255,.75)"; g.lineWidth = 6;
      g.beginPath(); g.moveTo(-20, fy + 8); g.quadraticCurveTo(W / 2, fy - 6, W + 20, fy + 12); g.stroke();
      g.lineWidth = 2; g.strokeStyle = "rgba(200,190,255,.5)";
      g.beginPath(); g.moveTo(W / 2, fy); g.lineTo(W * 0.1, H); g.moveTo(W / 2, fy); g.lineTo(W * 0.9, H * 0.95); g.stroke();
      glowAdd(g, W / 2, fy, 60, "#c9b8ff", 0.8);
      break;
    }
    case "edge": {
      const eg = g.createLinearGradient(0, fy, 0, H);
      eg.addColorStop(0, "#ffb07a"); eg.addColorStop(0.3, "#e0603a"); eg.addColorStop(1, "#5a1a0a");
      g.fillStyle = eg; g.fillRect(0, fy, W, H - fy);
      for(let i = 0; i < 70; i++){ const x = hash01(i * 3.9) * W, y = fy + hash01(i * 1.9) * (H - fy); glowAdd(g, x, y, 10 + hash01(i) * 16, i % 2 ? "#ff8a4a" : "#ffd08a", 0.35); }
      g.fillStyle = "rgba(255,240,220,.9)"; g.fillRect(0, fy, W, 2);
      break;
    }
    case "multiverse": {
      const r = Math.min(W, H) * 0.45;
      const bx = W / 2, by = fy + r * 0.98;
      const bg = g.createRadialGradient(bx - r * 0.3, by - r * 0.5, 4, bx, by, r);
      bg.addColorStop(0, "rgba(255,255,255,.18)"); bg.addColorStop(0.85, "rgba(190,170,255,.3)"); bg.addColorStop(1, "rgba(255,255,255,.85)");
      g.fillStyle = bg; g.beginPath(); g.arc(bx, by, r, 0, TAU); g.fill();
      drawSpiral(g, bx, by - r * 0.2, r * 0.35, t, 0.5, "#ffffff");
      for(let i = 0; i < 6; i++){ const ox = hash01(i * 6.1) * W, oy = hash01(i * 3.4) * fy * 0.9, orr = 18 + hash01(i) * 30;
        g.strokeStyle = hsl(i * 60 + t * 20, 80, 80, 0.7); g.lineWidth = 1.5; g.beginPath(); g.arc(ox, oy, orr, 0, TAU); g.stroke(); }
      break;
    }
    case "crack": {
      g.fillStyle = "rgba(255,255,255,.06)"; g.fillRect(0, fy, W, H - fy);
      g.strokeStyle = "rgba(255,255,255,.9)"; g.lineWidth = 2;
      g.beginPath(); g.moveTo(0, fy); g.lineTo(W, fy); g.stroke();
      for(let i = 0; i < 9; i++){ let x = hash01(i * 2.2) * W, y = fy; g.beginPath(); g.moveTo(x, y);
        for(let j = 0; j < 5; j++){ x += (hash01(i * 9 + j) - 0.5) * 50; y += 20 + hash01(i * 3 + j) * 30; g.lineTo(x, y); } g.stroke(); }
      glowAdd(g, W / 2, fy, W * 0.4, "#ffffff", 0.6);
      break;
    }
  }
}


/* =====================================================================
   PLACE KIT: drawing helpers for rooms and outdoor spots
   Places are drawn once into an offscreen canvas (taller than the screen
   so the camera can pan up), then reused every frame.
   ===================================================================== */

/* outside view inside a window (or as a backdrop) */
/* clouds catch less light at night: white clouds fade toward the dark sky */
function cloudLight(env){ return 0.32 + 0.68 * clamp(env.day, 0, 1); }
function drawOutside(g, x, y, w, h, type, env, weather){
  g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
  const P = { group:type === "orbit" ? "orbit" : type === "moon" ? "moon" : type === "mars" ? "mars" : "earth", tags:["earth"], id:"" };
  const pal = skyPal(env, P, weather);
  const sg = g.createLinearGradient(0, y, 0, y + h);
  sg.addColorStop(0, pal[0]); sg.addColorStop(0.65, pal[1]); sg.addColorStop(1, pal[2]);
  g.fillStyle = sg; g.fillRect(x, y, w, h);
  const night = env.day < 0.35;
  if(night || type === "orbit" || type === "moon"){
    const r = mulberry(17);
    g.fillStyle = "#fff";
    for(let i = 0; i < w * h / 900; i++){ g.globalAlpha = 0.3 + r() * 0.7; g.fillRect(x + r() * w, y + r() * h * 0.7, 1.2, 1.2); }
    g.globalAlpha = 1;
  }
  if(!night && type !== "orbit" && type !== "moon" && weather === "clear"){
    g.fillStyle = "rgba(255,250,230,.9)"; g.beginPath(); g.arc(x + w * 0.78, y + h * 0.22, Math.min(w, h) * 0.07, 0, TAU); g.fill();
  }
  const r = mulberry(strSeed(type) + 5);
  const base = y + h;
  if(type === "suburb" || type === "forest"){
    for(let i = 0; i < 5; i++){
      const tx = x + r() * w, th = h * (0.25 + r() * 0.2);
      g.fillStyle = night ? "#0b1410" : (type === "forest" ? "#24402e" : "#3a6a3a");
      if(type === "forest"){ g.beginPath(); g.moveTo(tx, base - th); g.lineTo(tx + th * 0.35, base); g.lineTo(tx - th * 0.35, base); g.fill();
        if(weather === "snow" || env.cold){ g.fillStyle = "rgba(255,255,255,.8)"; g.beginPath(); g.moveTo(tx, base - th); g.lineTo(tx + th * 0.12, base - th * 0.66); g.lineTo(tx - th * 0.12, base - th * 0.66); g.fill(); } }
      else { g.beginPath(); g.arc(tx, base - th * 0.6, th * 0.4, 0, TAU); g.fill(); g.fillRect(tx - 2, base - th * 0.3, 4, th * 0.3); }
    }
    if(type === "suburb"){
      for(let i = 0; i < 3; i++){
        const hx = x + w * (0.1 + i * 0.32) + r() * 10, hw = w * 0.22, hh2 = h * 0.22;
        g.fillStyle = night ? "#141a22" : ["#c9b8a0", "#a8b8c9", "#d9c9a8"][i];
        g.fillRect(hx, base - hh2, hw, hh2);
        g.fillStyle = night ? "#0a0e14" : "#7a4a3a"; g.beginPath(); g.moveTo(hx - 4, base - hh2); g.lineTo(hx + hw / 2, base - hh2 - hh2 * 0.6); g.lineTo(hx + hw + 4, base - hh2); g.fill();
        g.fillStyle = night ? "rgba(255,200,110,.9)" : "rgba(160,200,230,.8)"; g.fillRect(hx + hw * 0.2, base - hh2 * 0.7, hw * 0.2, hh2 * 0.3); g.fillRect(hx + hw * 0.6, base - hh2 * 0.7, hw * 0.2, hh2 * 0.3);
      }
    }
    g.fillStyle = night ? "#0a120c" : (weather === "snow" ? "#e8eef2" : "#4a7a3a"); g.fillRect(x, base - h * 0.06, w, h * 0.06);
  }else if(type === "city" || type === "high" || type === "highway"){
    for(let i = 0; i < 9; i++){
      const bx = x + (i / 9) * w + r() * 6, bw = w / 9 + r() * 6, bh = h * (0.3 + r() * 0.55);
      g.fillStyle = night ? "#0c121c" : "#6f8394"; g.fillRect(bx, base - bh, bw, bh);
      g.fillStyle = night ? "rgba(255,215,130,.85)" : "rgba(220,235,245,.4)";
      for(let wy = base - bh + 4; wy < base - 3; wy += 6) for(let wx = bx + 2; wx < bx + bw - 3; wx += 5) if(r() < 0.5) g.fillRect(wx, wy, 2, 3);
    }
    if(type === "highway"){
      g.fillStyle = night ? "#121218" : "#4a4a52"; g.fillRect(x, base - h * 0.12, w, h * 0.12);
      g.fillStyle = "#e0e0e0"; g.fillRect(x + w * 0.1, base - h * 0.33, w * 0.5, h * 0.05);
      g.fillStyle = "#c4302c"; g.fillRect(x + w * 0.1, base - h * 0.36, w * 0.5, h * 0.03);
      g.fillStyle = "#8a8a8a"; g.fillRect(x + w * 0.15, base - h * 0.28, w * 0.03, h * 0.16); g.fillRect(x + w * 0.52, base - h * 0.28, w * 0.03, h * 0.16);
      g.fillStyle = "#3a6ab0"; g.fillRect(x + w * 0.25, base - h * 0.2, w * 0.06, h * 0.1); g.fillRect(x + w * 0.4, base - h * 0.2, w * 0.06, h * 0.1);
    }
  }else if(type === "beach" || type === "ocean"){
    const sea = y + h * 0.55;
    const wg = g.createLinearGradient(0, sea, 0, base);
    wg.addColorStop(0, night ? "#0a1a2a" : "#3a8ac9"); wg.addColorStop(1, night ? "#05101a" : "#1a5a8a");
    g.fillStyle = wg; g.fillRect(x, sea, w, base - sea);
  }else if(type === "peaks"){
    g.fillStyle = night ? "#1a2230" : "#8aa0b4";
    g.beginPath(); g.moveTo(x, base); for(let i = 0; i <= 6; i++) g.lineTo(x + w * i / 6, base - h * (0.3 + (i % 2) * 0.3 * r())); g.lineTo(x + w, base); g.fill();
  }else if(type === "desert"){
    g.fillStyle = night ? "#2a1a14" : "#c9764a"; g.fillRect(x + w * 0.1, base - h * 0.4, w * 0.25, h * 0.4); g.fillRect(x + w * 0.6, base - h * 0.3, w * 0.3, h * 0.3);
  }else if(type === "orbit"){
    drawSphere(g, "earth", x + w * 0.5, y + h * 1.3, w * 0.9, 0.3, { atmo:"#6ab4ff", clouds:true });
  }
  if(weather === "fog"){ g.fillStyle = "rgba(220,225,230,.45)"; g.fillRect(x, y, w, h); }
  g.restore();
}

function drawWindow(g, x, y, w, h, outside, env, weather, frame){
  drawOutside(g, x, y, w, h, outside, env, weather);
  /* glass reflection */
  const rg = g.createLinearGradient(x, y, x + w, y + h);
  rg.addColorStop(0, "rgba(255,255,255,.12)"); rg.addColorStop(0.45, "rgba(255,255,255,0)"); rg.addColorStop(0.55, "rgba(255,255,255,.06)"); rg.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = rg; g.fillRect(x, y, w, h);
  const fc = frame || "#e8e2d6", fw = Math.max(4, w * 0.04);
  g.fillStyle = fc;
  g.fillRect(x - fw, y - fw, w + fw * 2, fw); g.fillRect(x - fw, y + h, w + fw * 2, fw * 1.6);
  g.fillRect(x - fw, y, fw, h); g.fillRect(x + w, y, fw, h);
  g.fillRect(x + w / 2 - fw * 0.4, y, fw * 0.8, h); g.fillRect(x, y + h / 2 - fw * 0.4, w, fw * 0.8);
  g.fillStyle = "rgba(0,0,0,.2)"; g.fillRect(x - fw, y + h + fw * 1.6, w + fw * 2, 3);
  return { x:x, y:y, w:w, h:h };
}

/* wall surfaces */
function drawWall(g, x, y, w, h, col, pat, rnd){
  g.fillStyle = col; g.fillRect(x, y, w, h);
  if(pat === "tile"){
    g.strokeStyle = "rgba(255,255,255,.18)"; g.lineWidth = 1;
    const s = 22;
    for(let ty = y; ty < y + h; ty += s){ g.beginPath(); g.moveTo(x, ty); g.lineTo(x + w, ty); g.stroke(); }
    for(let tx = x; tx < x + w; tx += s){ g.beginPath(); g.moveTo(tx, y); g.lineTo(tx, y + h); g.stroke(); }
  }else if(pat === "brick"){
    g.fillStyle = "rgba(0,0,0,.18)";
    for(let ty = y, row = 0; ty < y + h; ty += 12, row++){
      g.fillRect(x, ty, w, 1.5);
      for(let tx = x + (row % 2) * 14; tx < x + w; tx += 28) g.fillRect(tx, ty, 1.5, 12);
    }
    for(let i = 0; i < w * h / 600; i++){ g.fillStyle = "rgba(255,255,255," + (rnd() * 0.05).toFixed(3) + ")"; g.fillRect(x + rnd() * w, y + rnd() * h, 10, 4); }
  }else if(pat === "wood"){
    for(let ty = y; ty < y + h; ty += 16){
      g.fillStyle = "rgba(0,0,0," + (0.06 + rnd() * 0.08).toFixed(3) + ")"; g.fillRect(x, ty, w, 16);
      g.fillStyle = "rgba(0,0,0,.25)"; g.fillRect(x, ty + 15, w, 1);
    }
  }else if(pat === "log"){
    for(let ty = y; ty < y + h; ty += 24){
      const lg = g.createLinearGradient(0, ty, 0, ty + 24);
      lg.addColorStop(0, "rgba(0,0,0,.3)"); lg.addColorStop(0.3, "rgba(255,220,170,.12)"); lg.addColorStop(1, "rgba(0,0,0,.4)");
      g.fillStyle = lg; g.fillRect(x, ty, w, 24);
    }
  }else if(pat === "concrete"){
    for(let i = 0; i < w * h / 200; i++){ g.fillStyle = "rgba(" + (rnd() < 0.5 ? "0,0,0" : "255,255,255") + "," + (rnd() * 0.06).toFixed(3) + ")"; g.fillRect(x + rnd() * w, y + rnd() * h, 2 + rnd() * 3, 2 + rnd() * 3); }
  }else if(pat === "wallpaper"){
    g.fillStyle = "rgba(255,255,255,.08)";
    for(let ty = y; ty < y + h; ty += 26) for(let tx = x + ((ty / 26) % 2) * 13; tx < x + w; tx += 26){ g.beginPath(); g.arc(tx, ty, 3, 0, TAU); g.fill(); }
  }else if(pat === "panel"){
    g.strokeStyle = "rgba(0,0,0,.25)"; g.lineWidth = 1;
    for(let tx = x; tx < x + w; tx += 60){ g.strokeRect(tx + 4, y + 4, 52, h - 8); }
  }
}
function lampCone(g, x, y, w, h, col, a){
  const lg = g.createRadialGradient(x, y, 4, x, y + h * 0.6, Math.max(w, h));
  lg.addColorStop(0, withAlpha(col, a)); lg.addColorStop(1, withAlpha(col, 0));
  g.fillStyle = lg; g.fillRect(x - w, y, w * 2, h * 1.6);
}
function drawHangLamp(g, x, y, cord, col, on){
  g.strokeStyle = "#1a1a1a"; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x, y - cord); g.lineTo(x, y); g.stroke();
  g.fillStyle = col; g.beginPath(); g.moveTo(x - 8, y); g.lineTo(x + 8, y); g.lineTo(x + 22, y + 18); g.lineTo(x - 22, y + 18); g.closePath(); g.fill();
  g.fillStyle = "rgba(255,255,255,.2)"; g.fillRect(x - 6, y + 2, 4, 14);
  if(on){ g.fillStyle = "#fff6d8"; g.beginPath(); g.ellipse(x, y + 18, 12, 4, 0, 0, TAU); g.fill(); }
}
function drawPlant(g, x, y, s, rnd){
  g.fillStyle = "#b8653a"; g.beginPath(); g.moveTo(x - s * 0.5, y - s * 0.7); g.lineTo(x + s * 0.5, y - s * 0.7); g.lineTo(x + s * 0.38, y); g.lineTo(x - s * 0.38, y); g.closePath(); g.fill();
  g.fillStyle = "rgba(0,0,0,.2)"; g.fillRect(x - s * 0.5, y - s * 0.7, s, s * 0.12);
  for(let i = 0; i < 7; i++){
    const a = -Math.PI / 2 + (i - 3) * 0.32 + (rnd() - 0.5) * 0.2, l = s * (0.9 + rnd() * 0.6);
    g.fillStyle = i % 2 ? "#3a8a4a" : "#2a6a3a";
    g.beginPath(); g.ellipse(x + Math.cos(a) * l * 0.5, y - s * 0.7 + Math.sin(a) * l * 0.5, l * 0.5, s * 0.16, a, 0, TAU); g.fill();
  }
}
function drawShelf(g, x, y, w, items, rnd){
  g.fillStyle = "#6b4426"; g.fillRect(x, y, w, 5); g.fillStyle = "rgba(0,0,0,.3)"; g.fillRect(x, y + 5, w, 3);
  let cx = x + 6;
  while(cx < x + w - 10){
    const kind = items[Math.floor(rnd() * items.length)];
    if(kind === "book"){ const bw = 5 + rnd() * 4, bh = 18 + rnd() * 10; g.fillStyle = hsl(rnd() * 360, 45, 40); g.fillRect(cx, y - bh, bw, bh); g.fillStyle = "rgba(255,255,255,.25)"; g.fillRect(cx + 1, y - bh + 3, bw - 2, 1.5); cx += bw + 1; }
    else if(kind === "jar"){ g.fillStyle = "rgba(200,230,240,.5)"; g.fillRect(cx, y - 16, 12, 16); g.fillStyle = hsl(rnd() * 60 + 10, 60, 50); g.fillRect(cx + 1, y - 9, 10, 9); g.fillStyle = "#8a6b3a"; g.fillRect(cx - 1, y - 18, 14, 3); cx += 16; }
    else if(kind === "plant"){ drawPlant(g, cx + 8, y, 14, rnd); cx += 20; }
    else if(kind === "box"){ const bw = 14 + rnd() * 10, bh = 10 + rnd() * 10; g.fillStyle = "#b8915a"; g.fillRect(cx, y - bh, bw, bh); g.fillStyle = "rgba(0,0,0,.15)"; g.fillRect(cx, y - bh, bw, 2); cx += bw + 2; }
    else if(kind === "trophy"){ g.fillStyle = "#e0b13a"; g.fillRect(cx + 4, y - 6, 6, 6); g.beginPath(); g.arc(cx + 7, y - 12, 6, 0, Math.PI); g.fill(); cx += 16; }
    else cx += 10;
  }
}
function drawPoster(g, x, y, w, h, kind, rnd){
  g.fillStyle = "rgba(0,0,0,.3)"; g.fillRect(x + 3, y + 3, w, h);
  g.fillStyle = "#f2efe6"; g.fillRect(x, y, w, h);
  const ix = x + w * 0.08, iy = y + h * 0.08, iw = w * 0.84, ih = h * 0.84;
  if(kind === "space"){ const pg = g.createLinearGradient(0, iy, 0, iy + ih); pg.addColorStop(0, "#0a0a2a"); pg.addColorStop(1, "#3a1a5a"); g.fillStyle = pg; g.fillRect(ix, iy, iw, ih);
    g.fillStyle = "#ff8a3a"; g.beginPath(); g.arc(ix + iw * 0.6, iy + ih * 0.45, iw * 0.25, 0, TAU); g.fill(); g.fillStyle = "#fff"; for(let i = 0; i < 10; i++) g.fillRect(ix + rnd() * iw, iy + rnd() * ih, 1, 1); }
  else if(kind === "band"){ g.fillStyle = "#1a1a1a"; g.fillRect(ix, iy, iw, ih); g.fillStyle = "#ff3a5a"; g.font = "700 " + (iw * 0.28).toFixed(0) + "px Anton, sans-serif"; g.textAlign = "center"; g.fillText("LOUD", ix + iw / 2, iy + ih * 0.35); g.fillStyle = "#fff"; g.fillRect(ix + iw * 0.2, iy + ih * 0.55, iw * 0.6, 2); }
  else if(kind === "hoops"){ g.fillStyle = "#ff7a1a"; g.fillRect(ix, iy, iw, ih); g.fillStyle = "#1a1a1a"; g.beginPath(); g.arc(ix + iw / 2, iy + ih * 0.5, iw * 0.3, 0, TAU); g.lineWidth = 2; g.strokeStyle = "#1a1a1a"; g.stroke(); }
  else { g.fillStyle = hsl(rnd() * 360, 50, 55); g.fillRect(ix, iy, iw, ih); g.fillStyle = "rgba(255,255,255,.5)"; g.fillRect(ix + iw * 0.1, iy + ih * 0.7, iw * 0.8, 3); }
}
function drawFrame(g, x, y, w, h, rnd){
  g.fillStyle = "#3a2a1a"; g.fillRect(x - 3, y - 3, w + 6, h + 6);
  const fg = g.createLinearGradient(0, y, 0, y + h); fg.addColorStop(0, hsl(200 + rnd() * 40, 40, 60)); fg.addColorStop(1, hsl(90 + rnd() * 40, 35, 40));
  g.fillStyle = fg; g.fillRect(x, y, w, h);
  g.fillStyle = "rgba(255,255,255,.12)"; g.fillRect(x, y, w, h * 0.3);
}

/* tables: the surface the bottle lands on */
const TABLE_STYLES = {
  wood:    { top:["#9a6436", "#6b4426", "#38210f"], line:"rgba(255,226,170,.22)", grain:true },
  desk:    { top:["#e8e6e0", "#c9c6bd", "#8a877e"], line:"rgba(255,255,255,.5)" },
  lunch:   { top:["#c9ccd0", "#9ea3a8", "#5a5f64"], line:"rgba(255,255,255,.4)", tray:true },
  bench:   { top:["#a8763f", "#7a5228", "#3a2410"], line:"rgba(255,230,180,.3)", grain:true, slats:true },
  counter: { top:["#d9d2c4", "#b0a898", "#6b6458"], line:"rgba(255,255,255,.45)", speck:true },
  office:  { top:["#b9bec4", "#8f959c", "#4a4f55"], line:"rgba(255,255,255,.4)" },
  concrete:{ top:["#8a8a86", "#6a6a66", "#3a3a38"], line:"rgba(255,255,255,.25)", speck:true },
  seat:    { top:["#3a6ab0", "#2a4a80", "#152540"], line:"rgba(200,220,255,.35)" },
  arcade:  { top:["#2a1a3a", "#1a0f26", "#0a0510"], line:"#ff3fd0", neon:true },
  driftwood:{top:["#c9b08a", "#9a8060", "#5a4a34"], line:"rgba(255,245,220,.35)", grain:true },
  deck:    { top:["#b0743a", "#8a5428", "#4a2a10"], line:"rgba(255,230,180,.3)", grain:true, slats:true },
  steel:   { top:["#a8b0b8", "#7a838c", "#3a4148"], line:"rgba(255,255,255,.5)", rivets:true },
  rock:    { top:["#9a8a7a", "#7a6a5a", "#3a3028"], line:"rgba(255,240,220,.25)", speck:true },
  log:     { top:["#8a5a30", "#6b4220", "#2a180a"], line:"rgba(255,220,170,.25)", grain:true },
  basalt:  { top:["#3a3434", "#2a2424", "#0a0606"], line:"#ff7a1a", speck:true },
  dome:    { top:["rgba(170,220,240,.75)", "rgba(110,170,200,.65)", "rgba(30,70,100,.85)"], line:"rgba(220,250,255,.8)", glassy:true },
  moss:    { top:["#7a8a5a", "#5a6a3a", "#2a3418"], line:"rgba(220,255,200,.3)", speck:true, moss:true },
  station: { top:["#c9ced3", "#9ea4aa", "#5a6066"], line:"rgba(255,255,255,.5)", rivets:true, velcro:true },
  lander:  { top:["#d9b04a", "#a8862a", "#5a4410"], line:"rgba(255,240,180,.5)", foil:true },
  rover:   { top:["#c9c9c9", "#9a9a9a", "#4a4a4a"], line:"rgba(255,255,255,.5)", rivets:true }
};
function drawTable(g, fy, w, hc, styleId, skinId, rnd){
  let S = TABLE_STYLES[styleId] || TABLE_STYLES.wood;
  if(skinId && skinId !== "place"){
    const sk = styleItem(TABLES, skinId);
    if(sk && sk.top) S = { top:sk.top, line:sk.line, grain:skinId === "wood", marble:skinId === "marble", glassy:skinId === "glass", neon:skinId === "neon", brushed:skinId === "metal", lava:skinId === "lavarock", gold:skinId === "goldT" };
  }
  const tb = g.createLinearGradient(0, fy - 4, 0, hc);
  tb.addColorStop(0, S.top[0]); tb.addColorStop(0.12, S.top[1]); tb.addColorStop(1, S.top[2]);
  g.fillStyle = tb; g.fillRect(0, fy, w, hc - fy);
  const th = hc - fy;
  if(S.grain){
    g.lineWidth = 1.1;
    for(let gr = 0; gr < 11; gr++){
      const t01 = gr / 10, gy = fy + 6 + Math.pow(t01, 1.6) * th;
      g.strokeStyle = "rgba(0,0,0," + (0.05 + (gr % 3) * 0.045).toFixed(3) + ")";
      g.beginPath(); g.moveTo(-10, gy); g.bezierCurveTo(w * 0.3, gy + (gr % 2 ? 3 : -3), w * 0.65, gy + (gr % 2 ? -4 : 4), w + 10, gy + (gr % 3 ? 2 : -2)); g.stroke();
      if(gr % 4 === 1){ g.strokeStyle = "rgba(0,0,0,.1)"; g.beginPath(); g.ellipse(w * (0.2 + gr * 0.07), gy + 5, 16, 5, 0.2, 0, TAU); g.stroke(); }
    }
  }
  if(S.slats){ g.fillStyle = "rgba(0,0,0,.28)"; for(let i = 1; i < 4; i++) g.fillRect(0, fy + th * i / 4, w, 2); }
  if(S.speck){ for(let i = 0; i < w * th / 60; i++){ g.fillStyle = "rgba(" + (rnd() < 0.5 ? "0,0,0" : "255,255,255") + "," + (rnd() * 0.12).toFixed(3) + ")"; g.fillRect(rnd() * w, fy + rnd() * th, 1.5, 1.5); } }
  if(S.marble){
    g.strokeStyle = "rgba(120,120,130,.3)"; g.lineWidth = 1;
    for(let i = 0; i < 7; i++){ let x = rnd() * w, y = fy + rnd() * th * 0.3; g.beginPath(); g.moveTo(x, y); for(let j = 0; j < 6; j++){ x += (rnd() - 0.3) * 40; y += rnd() * th * 0.2; g.lineTo(x, y); } g.stroke(); }
  }
  if(S.brushed){ for(let i = 0; i < th; i += 2){ g.fillStyle = "rgba(255,255,255," + (rnd() * 0.06).toFixed(3) + ")"; g.fillRect(0, fy + i, w, 1); } }
  if(S.neon){
    g.strokeStyle = withAlpha(S.line, 0.45); g.lineWidth = 1;
    for(let i = 0; i < 8; i++){ const gy = fy + Math.pow(i / 7, 1.5) * th; g.beginPath(); g.moveTo(0, gy); g.lineTo(w, gy); g.stroke(); }
    for(let i = -6; i <= 6; i++){ g.beginPath(); g.moveTo(w / 2 + i * 20, fy); g.lineTo(w / 2 + i * 90, hc); g.stroke(); }
  }
  if(S.lava){ for(let i = 0; i < 9; i++){ let x = rnd() * w, y = fy + rnd() * th; g.strokeStyle = "rgba(255,110,20,.6)"; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x, y); for(let j = 0; j < 4; j++){ x += (rnd() - 0.5) * 30; y += (rnd() - 0.5) * 12; g.lineTo(x, y); } g.stroke(); } }
  if(S.gold){ const gg = g.createLinearGradient(0, fy, w, hc); gg.addColorStop(0, "rgba(255,255,255,0)"); gg.addColorStop(0.5, "rgba(255,250,220,.35)"); gg.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = gg; g.fillRect(0, fy, w, th); }
  if(S.rivets){ g.fillStyle = "rgba(0,0,0,.35)"; for(let x = 14; x < w; x += 46){ g.beginPath(); g.arc(x, fy + 8, 2, 0, TAU); g.fill(); g.beginPath(); g.arc(x, hc - 14, 2.4, 0, TAU); g.fill(); } }
  if(S.velcro){ g.fillStyle = "rgba(40,40,40,.6)"; g.fillRect(w * 0.12, fy + th * 0.3, 30, 10); g.fillRect(w * 0.8, fy + th * 0.5, 30, 10); }
  if(S.foil){ for(let i = 0; i < 30; i++){ g.fillStyle = "rgba(255,255,220," + (rnd() * 0.25).toFixed(3) + ")"; g.beginPath(); g.moveTo(rnd() * w, fy + rnd() * th); g.lineTo(rnd() * w, fy + rnd() * th); g.lineTo(rnd() * w, fy + rnd() * th); g.fill(); } }
  if(S.moss){ for(let i = 0; i < 40; i++){ g.fillStyle = "rgba(90,160,60," + (0.2 + rnd() * 0.3).toFixed(2) + ")"; g.beginPath(); g.ellipse(rnd() * w, fy + rnd() * th * 0.4, 6 + rnd() * 10, 2 + rnd() * 3, 0, 0, TAU); g.fill(); } }
  if(S.tray){ g.fillStyle = "#3a7ac9"; rrect(g, w * 0.08, fy + th * 0.18, w * 0.26, th * 0.4, 6); g.fill(); g.fillStyle = "rgba(255,255,255,.2)"; g.fillRect(w * 0.1, fy + th * 0.2, w * 0.22, 2);
    g.fillStyle = "#e8d29a"; g.beginPath(); g.ellipse(w * 0.16, fy + th * 0.36, 10, 5, 0, 0, TAU); g.fill(); g.fillStyle = "#c4302c"; g.fillRect(w * 0.24, fy + th * 0.28, 9, 12); }
  /* sheen + edges */
  const sheen = g.createLinearGradient(0, fy, 0, hc);
  sheen.addColorStop(0, S.glassy ? "rgba(255,255,255,.3)" : "rgba(255,245,220,.15)"); sheen.addColorStop(0.35, "rgba(255,245,220,.04)"); sheen.addColorStop(1, "rgba(0,0,0,.25)");
  g.fillStyle = sheen; g.fillRect(0, fy, w, th);
  g.fillStyle = S.line; g.fillRect(0, fy, w, 2);
  g.fillStyle = "rgba(0,0,0,.35)"; g.fillRect(0, hc - 9, w, 9);
  g.fillStyle = "rgba(255,255,255,.08)"; g.fillRect(0, hc - 9, w, 1.5);
}
function tableGloss(styleId, skinId){
  if(skinId === "glass" || skinId === "marble" || skinId === "metal" || skinId === "goldT") return 0.42;
  if(skinId === "neon") return 0.3;
  const S = TABLE_STYLES[styleId];
  if(S && (S.glassy || S.rivets)) return 0.35;
  return 0.22;
}

/* seasonal decorations along the top of the room */
function drawSeason(g, w, top, season, indoor, rnd){
  if(!season) return;
  if(season === "halloween" || season === "christmas" || season === "valentine"){
    const cols = season === "halloween" ? ["#ff8a1a", "#9a3aff"] : season === "valentine" ? ["#ff3a7a", "#ffffff"] : ["#ff3a3a", "#3aff6a", "#ffd23a", "#3a8aff"];
    g.strokeStyle = "#1a1a1a"; g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(0, top + 10);
    for(let x = 0; x <= w; x += 40) g.quadraticCurveTo(x + 20, top + 26, x + 40, top + 10);
    g.stroke();
    for(let x = 10, i = 0; x < w; x += 20, i++){
      const yy = top + 10 + Math.sin((x % 40) / 40 * Math.PI) * 12;
      const c = cols[i % cols.length];
      glow(g, x, yy + 4, 9, c, 0.7);
      g.fillStyle = c; g.beginPath(); g.ellipse(x, yy + 4, 2.6, 3.6, 0, 0, TAU); g.fill();
    }
  }
  if(season === "newyear"){
    g.fillStyle = "#ffd76b"; g.font = "16px Anton, Impact, sans-serif"; g.textAlign = "center"; g.fillText("HAPPY NEW YEAR", w / 2, top + 24);
    for(let i = 0; i < 40; i++){ g.fillStyle = hsl(rnd() * 360, 90, 65); g.fillRect(rnd() * w, top + rnd() * 60, 3, 2); }
  }
}
function drawPumpkin(g, x, y, s){
  g.fillStyle = "#e0701a";
  for(let i = -1; i <= 1; i++){ g.beginPath(); g.ellipse(x + i * s * 0.32, y - s * 0.4, s * 0.38, s * 0.42, 0, 0, TAU); g.fill(); }
  g.fillStyle = "rgba(0,0,0,.18)"; g.fillRect(x - s * 0.05, y - s * 0.8, s * 0.1, s * 0.8);
  g.fillStyle = "#3a5a1a"; g.fillRect(x - s * 0.06, y - s * 0.95, s * 0.12, s * 0.18);
  g.fillStyle = "#ffd23a";
  g.beginPath(); g.moveTo(x - s * 0.3, y - s * 0.5); g.lineTo(x - s * 0.14, y - s * 0.62); g.lineTo(x - s * 0.1, y - s * 0.46); g.fill();
  g.beginPath(); g.moveTo(x + s * 0.3, y - s * 0.5); g.lineTo(x + s * 0.14, y - s * 0.62); g.lineTo(x + s * 0.1, y - s * 0.46); g.fill();
  g.beginPath(); g.moveTo(x - s * 0.3, y - s * 0.25); g.quadraticCurveTo(x, y - s * 0.05, x + s * 0.3, y - s * 0.25); g.lineTo(x, y - s * 0.18); g.fill();
}
function drawXmasTree(g, x, y, s, rnd){
  g.fillStyle = "#5a3a1a"; g.fillRect(x - s * 0.08, y - s * 0.2, s * 0.16, s * 0.2);
  for(let i = 0; i < 3; i++){ g.fillStyle = "#1f6b3a"; g.beginPath(); g.moveTo(x, y - s * (1.2 - i * 0.28)); g.lineTo(x + s * (0.35 + i * 0.12), y - s * (0.55 - i * 0.18)); g.lineTo(x - s * (0.35 + i * 0.12), y - s * (0.55 - i * 0.18)); g.fill(); }
  for(let i = 0; i < 12; i++){ const c = ["#ff3a3a", "#ffd23a", "#3a8aff", "#ffffff"][i % 4]; const bx = x + (rnd() - 0.5) * s * 0.7, by = y - s * (0.25 + rnd() * 0.8); glow(g, bx, by, 6, c, 0.6); g.fillStyle = c; g.beginPath(); g.arc(bx, by, 2, 0, TAU); g.fill(); }
  g.fillStyle = "#ffd23a"; g.beginPath(); for(let j = 0; j < 10; j++){ const r = j % 2 ? s * 0.05 : s * 0.11; g.lineTo(x + Math.cos(j * Math.PI / 5 - Math.PI / 2) * r, y - s * 1.2 + Math.sin(j * Math.PI / 5 - Math.PI / 2) * r); } g.fill();
}

  beach(g, w, hc, top, fy, env, wx, rnd){

    g.fillStyle = "#fff"; g.beginPath(); g.moveTo(w * 0.66, fy - 78); g.quadraticCurveTo(w * 0.7, fy - 100, w * 0.74, fy - 78); g.fill();

  canyon(g, w, hc, top, fy, env, wx, rnd){
    drawOutside(g, 0, 0, w, fy, "desert", env, wx);
    const night = env.day < 0.35;
    const cols = night ? ["#2a1810", "#3a2014", "#24140c"] : ["#c9764a", "#a85a32", "#d98a5a", "#8a4a2a"];
    /* layered walls */

      const x0 = side ? w * 0.62 : 0, x1 = side ? w : w * 0.38;
      for(let b = 0; b < 8; b++){ g.fillStyle = cols[b % cols.length]; const y0 = top + (fy - top) * (0.12 + b * 0.1);
        g.beginPath(); g.moveTo(x0, y0); for(let x = x0; x <= x1; x += 12) g.lineTo(x, y0 + Math.sin(x * 0.05 + b) * 3); g.lineTo(x1, fy); g.lineTo(x0, fy); g.fill(); }
    }
    g.fillStyle = night ? "#1a100a" : "#9a5a3a"; g.beginPath(); g.moveTo(w * 0.38, fy); g.lineTo(w * 0.42, fy - (fy - top) * 0.3); g.lineTo(w * 0.58, fy - (fy - top) * 0.32); g.lineTo(w * 0.62, fy); g.fill();
    /* cacti */
    for(const cx of [w * 0.08, w * 0.9]){ g.fillStyle = night ? "#0a140a" : "#3a6a2a"; rrect(g, cx - 6, fy - 70, 12, 70, 6); g.fill(); rrect(g, cx - 22, fy - 50, 10, 26, 5); g.fill(); g.fillRect(cx - 18, fy - 30, 14, 8); rrect(g, cx + 12, fy - 60, 10, 30, 5); g.fill(); g.fillRect(cx + 4, fy - 36, 14, 8); }

  mountain(g, w, hc, top, fy, env, wx, rnd){
    drawOutside(g, 0, 0, w, fy, "peaks", env, wx);
    const night = env.day < 0.35;
    /* clouds below */
    g.globalAlpha = cloudLight(env);
    for(let i = 0; i < 5; i++) g.drawImage(cloudSprite(i + 70, false), w * (i * 0.25 - 0.1), fy - (fy - top) * 0.3 + (i % 2) * 14, 190, 80);

    g.fillStyle = night ? "#2b384c" : "#6f8394";
    g.beginPath(); pk.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.fill();
    /* lit side of the ridge */
    g.fillStyle = night ? "rgba(150,175,215,.18)" : "rgba(255,255,255,.12)";
    g.beginPath(); g.moveTo(w * 0.18, fy - (fy - top) * 0.55); g.lineTo(w * 0.32, fy - (fy - top) * 0.2); g.lineTo(w * 0.32, fy); g.lineTo(w * 0.22, fy); g.fill();

    /* prayer flags */
    g.strokeStyle = "#3a3a3a"; g.lineWidth = 1; g.beginPath(); g.moveTo(w * 0.35, fy - 80); g.quadraticCurveTo(w * 0.65, fy - 50, w * 0.98, fy - 90); g.stroke();
    for(let i = 0; i < 9; i++){ const t = i / 9, x = lerp(w * 0.35, w * 0.98, t), y = lerp(fy - 80, fy - 90, t) + Math.sin(t * Math.PI) * 26;
      g.fillStyle = ["#3a8aff", "#ffffff", "#ff3a3a", "#3ad67a", "#ffd23a"][i % 5]; g.fillRect(x, y, 12, 14); }
    /* old wooden trail sign */

    g.fillStyle = night ? "#2a1d12" : "#5a3d22"; g.fillRect(sx + 34, sy, 6, 64);
    g.fillStyle = night ? "#3a2a1a" : "#8a6238"; rrect(g, sx, sy, 92, 22, 3); g.fill();
    g.fillStyle = "rgba(0,0,0,.25)"; g.fillRect(sx, sy + 17, 92, 5);
    g.fillStyle = "rgba(255,255,255,.08)"; g.fillRect(sx, sy, 92, 2);
    ctext(g, "FEATHERFALL TRAIL", sx + 46, sy + 10, 8.5, night ? "#c9b48a" : "#f4e2b8", "center", "700 8.5px 'Space Grotesk', sans-serif", false);
    g.fillStyle = "rgba(255,255,255,.75)"; g.fillRect(sx + 2, sy - 2, 88, 3);

  underwater(g, w, hc, top, fy, env, wx, rnd){

  skyisland(g, w, hc, top, fy, env, wx, rnd){

    [[0.15, 0.3, 60], [0.82, 0.18, 44], [0.55, 0.42, 30]].forEach(isl => {

      g.fillStyle = "#6b4a2a"; g.beginPath(); g.moveTo(ix - s, iy); g.lineTo(ix + s, iy); g.lineTo(ix + s * 0.2, iy + s * 1.1); g.lineTo(ix - s * 0.3, iy + s * 0.9); g.closePath(); g.fill();

      g.fillStyle = "#2a6a2a"; g.beginPath(); g.arc(ix - s * 0.3, iy - s * 0.3, s * 0.3, 0, TAU); g.fill();
      g.fillStyle = "rgba(200,240,255,.7)"; g.fillRect(ix + s * 0.5, iy, 4, s * 1.4);

  },
  station(g, w, hc, top, fy, env, wx, rnd){

    g.strokeStyle = "#c43a2a"; g.beginPath(); g.moveTo(w, top + 80); g.bezierCurveTo(w * 0.8, top + 120, w * 0.75, top + 60, w * 0.62, top + 100); g.stroke();

  moon(g, w, hc, top, fy, env, wx, rnd){
    g.fillStyle = "#000"; g.fillRect(0, 0, w, fy);
    const r = mulberry(91); g.fillStyle = "#fff"; for(let i = 0; i < 160; i++){ g.globalAlpha = 0.3 + r() * 0.7; g.fillRect(r() * w, r() * fy * 0.8, 1.2, 1.2); } g.globalAlpha = 1;
    /* hills */
    g.fillStyle = "#6a6a72"; g.beginPath(); g.moveTo(0, fy); for(let x = 0; x <= w; x += 10) g.lineTo(x, fy - (fy - top) * 0.22 - Math.abs(Math.sin(x * 0.01)) * 30 - fbm2(x * 0.02, 1, 3, 4) * 26); g.lineTo(w, fy); g.fill();
    g.fillStyle = "#8a8a94"; g.fillRect(0, fy - (fy - top) * 0.12, w, (fy - top) * 0.12);
    /* lander */

    g.fillStyle = "#d9b04a"; g.beginPath(); g.moveTo(lx - 30, ly - 20); g.lineTo(lx + 30, ly - 20); g.lineTo(lx + 24, ly - 46); g.lineTo(lx - 24, ly - 46); g.closePath(); g.fill();
    g.fillStyle = "#c9c9c9"; g.fillRect(lx - 16, ly - 66, 32, 20);

    g.fillStyle = "rgba(40,40,46,.5)"; for(let i = 0; i < 9; i++) g.fillRect(w * 0.2 + i * 18, fy - (fy - top) * 0.06 + (i % 2) * 5, 7, 3);

  mars(g, w, hc, top, fy, env, wx, rnd){

    const sg = g.createLinearGradient(0, 0, 0, fy);

    g.fillStyle = "#a85a32"; g.fillRect(0, fy - (fy - top) * 0.1, w, (fy - top) * 0.1);

    for(let i = 0; i < 2; i++){ const dx = w * (0.12 + i * 0.16), dy = fy - (fy - top) * 0.1; g.fillStyle = "rgba(230,235,240,.9)"; g.beginPath(); g.arc(dx, dy, 22 - i * 6, Math.PI, TAU); g.fill(); g.strokeStyle = "rgba(150,160,170,.6)"; g.lineWidth = 1; for(let a = 1; a < 4; a++){ g.beginPath(); g.arc(dx, dy, (22 - i * 6) * a / 4, Math.PI, TAU); g.stroke(); } }
    /* rover */
    const rx = w * 0.74, ry = fy - (fy - top) * 0.1;

    g.fillStyle = "#3a3a3a"; for(let i = 0; i < 3; i++){ g.beginPath(); g.arc(rx - 22 + i * 22, ry - 6, 7, 0, TAU); g.fill(); }
    g.fillStyle = "#c9c9c9"; g.fillRect(rx + 10, ry - 50, 4, 20); g.fillRect(rx + 6, ry - 54, 14, 7);
    return { dust:true };
  }
};

/* ---------- cache + live layer ---------- */
const placeCache = { key:"", canvas:null, meta:null, top:0, fy:0, hc:0 };
function placeCacheFor(P){
  const env = envNow();
  const wx = placeWeather(P, env);
  const tableId = save.g1.table;
  const key = P.id + "|" + W + "|" + H + "|" + DPR + "|" + env.bucket + "|" + wx + "|" + env.season + "|" + tableId + "|" + caches.gen;
  if(placeCache.key === key && placeCache.canvas) return placeCache;
  const top = Math.round(H * PLACE_EXT), hc = top + H, fy = top + Math.round(H * floorFrac());
  const c = placeCache.canvas && placeCache.canvas.width === Math.ceil(W * DPR) && placeCache.canvas.height === Math.ceil(hc * DPR) ? placeCache.canvas : mkCanvas(W * DPR, hc * DPR);
  const g = c.getContext("2d");
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.clearRect(0, 0, W, hc);
  const rnd = mulberry(strSeed(P.id) + 7);
  let meta = {};
  try{ meta = PLACE_DRAW[P.id](g, W, hc, top, fy, env, wx, rnd) || {}; }catch(e){ g.fillStyle = "#0c2029"; g.fillRect(0, 0, W, hc); }
  /* indoor rooms get a soft light pool, everyone gets the table */
  if(P.indoor){
    const pool = g.createRadialGradient(W / 2, fy - 60, 10, W / 2, fy - 40, Math.max(W, H) * 0.6);
    pool.addColorStop(0, env.day < 0.35 ? "rgba(255,230,180,.16)" : "rgba(255,250,235,.08)"); pool.addColorStop(1, "rgba(255,236,190,0)");
    g.fillStyle = pool; g.fillRect(0, 0, W, hc);
  }
  if(env.season){
    drawSeason(g, W, top + 2, env.season, P.indoor, rnd);
    if(env.season === "christmas" && P.indoor) drawXmasTree(g, W * 0.06, fy, Math.min(70, H * 0.12), rnd);
  }
  drawTable(g, fy, W, hc, P.table, tableId, rnd);
  if(env.season === "halloween") drawPumpkin(g, W * 0.12, fy + 14, 26);
  meta.weather = wx;
  placeCache.key = key; placeCache.canvas = c; placeCache.meta = meta; placeCache.top = top; placeCache.fy = fy; placeCache.hc = hc;
  return placeCache;
}

/* animated bits on top of the cached room. oy = how far the camera has panned up (px) */
function drawPlaceLive(g, P, pc, t, oy){
  const m = pc.meta || {}, top = pc.top, y0 = -top + oy;

  const env = envNow();

    for(const wr of m.windows){
      g.save(); g.beginPath(); g.rect(wr.x, wr.y, wr.w, wr.h); g.clip();
      g.strokeStyle = "rgba(210,225,240,.45)"; g.lineWidth = 1;
      g.beginPath();
      for(let i = 0; i < 26; i++){ const x = wr.x + hash01(i * 3.3) * wr.w, y = wr.y + ((hash01(i * 7.1) * wr.h + t * 260 * (0.8 + hash01(i))) % wr.h); g.moveTo(x, y); g.lineTo(x - 2, y + 9); }
      g.stroke();
      for(let i = 0; i < 8; i++){ const x = wr.x + hash01(i * 5.5) * wr.w, y = wr.y + ((hash01(i * 2.7) * wr.h + t * 14) % wr.h); g.fillStyle = "rgba(220,235,250,.5)"; g.beginPath(); g.arc(x, y, 1.6, 0, TAU); g.fill(); }

  }

      g.save(); g.beginPath(); g.rect(wr.x, wr.y, wr.w, wr.h); g.clip();
      g.fillStyle = "rgba(255,255,255,.9)";
      for(let i = 0; i < 24; i++){ const x = wr.x + ((hash01(i * 3.3) * wr.w + Math.sin(t + i) * 6) % wr.w), y = wr.y + ((hash01(i * 7.1) * wr.h + t * 26 * (0.7 + hash01(i))) % wr.h); g.fillRect(x, y, 2, 2); }

  }
  if(m.clock){

  }
  if(m.wallclock){

    g.strokeStyle = "#1a1a1a"; g.lineWidth = 2; g.beginPath(); g.moveTo(c.x, c.y); g.lineTo(c.x + Math.cos(ha) * 7, c.y + Math.sin(ha) * 7); g.moveTo(c.x, c.y); g.lineTo(c.x + Math.cos(ma) * 11, c.y + Math.sin(ma) * 11); g.stroke();
    g.strokeStyle = "#c4302c"; g.lineWidth = 1; g.beginPath(); g.moveTo(c.x, c.y); g.lineTo(c.x + Math.cos(sa) * 12, c.y + Math.sin(sa) * 12); g.stroke();
  }
  if(m.lamp && m.lamp.on && useGlow()) glowAdd(g, m.lamp.x, m.lamp.y + 6, 60, m.lamp.col, 0.35 + 0.03 * Math.sin(t * 7));
  if(m.screen){

    g.save(); g.beginPath(); g.rect(s.x, s.y, s.w, s.h); g.clip();
    if(s.kind === "code"){ g.fillStyle = "#0a1a10"; g.fillRect(s.x, s.y, s.w, s.h); g.fillStyle = "#4dff7a";
      for(let i = 0; i < 9; i++){ const ln = Math.floor(t * 3) + i; g.globalAlpha = 0.7; g.fillRect(s.x + 4 + (ln * 7 % 4) * 6, s.y + 4 + i * (s.h - 8) / 9, s.w * (0.25 + hash01(ln) * 0.6), 2); } g.globalAlpha = 1; }
    else { const hue = (t * 30) % 360; const sg = g.createLinearGradient(s.x, s.y, s.x + s.w, s.y + s.h); sg.addColorStop(0, hsl(hue, 70, 35)); sg.addColorStop(1, hsl(hue + 80, 70, 20)); g.fillStyle = sg; g.fillRect(s.x, s.y, s.w, s.h);
      g.fillStyle = "#ffd23a"; g.fillRect(s.x + s.w * (0.2 + 0.6 * ((t * 0.3) % 1)), s.y + s.h * 0.6, 6, 6); }

  if(m.bubbles){ g.strokeStyle = "rgba(220,245,255,.6)"; g.lineWidth = 1; for(let i = 0; i < 12; i++){ const bx = hash01(i * 3.7) * W, by = pc.fy - ((t * 30 * (0.6 + hash01(i))) % (pc.fy - top + 40)); g.beginPath(); g.arc(bx + Math.sin(t * 2 + i) * 4, by, 2 + hash01(i * 9) * 3, 0, TAU); g.stroke(); } }
  if(m.steam){ for(let i = 0; i < 3; i++){ const ph = (t * 0.5 + i / 3) % 1; g.fillStyle = "rgba(255,255,255," + (0.25 * (1 - ph)).toFixed(3) + ")"; g.beginPath(); g.arc(m.steam.x + Math.sin(t * 2 + i) * 4, m.steam.y - ph * 30, 3 + ph * 5, 0, TAU); g.fill(); } }

const FLIGHT_T = [0.95, 1.25, 1.7, 2.1, 2.5, 2.95, 3.4, 4.0, 4.6, 5.2, 5.6, 6.0, 6.4, 6.8, 7.2, 7.8, 9.0];
