/* =====================================================================
   MAIN: boot, the frame loop, input, saving, welcome back
   ===================================================================== */
const bootInfo = loadSave();
loadBoard();
const BOOT = { started:false, titleUntil:0, typingUntil:0, hiddenAt:0, lastDay:dayKey(), saveT:0, seenT:0, backupT:0, buffT:0, minuteT:0 };

/* ---------- the frame loop ---------- */
let lastT = 0;
function frame(now){
  requestAnimationFrame(frame);
  if(!lastT) lastT = now;
  let dms = now - lastT; lastT = now;
  if(dms > 1000 || dms < 0) dms = 16.7;
  const dt = Math.min(dms, 50) / 1000;
  const t = now / 1000;
  qualityTick(dms);
  fxTick(dt);
  updateFloats(dt);
  const titleVisible = !BOOT.started || now < BOOT.titleUntil;
  if(titleVisible) drawTitle(t);
  if(BOOT.started){
    try{
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      /* update first, then draw whatever chapter we're in now: when a chapter ends mid-update,
         the very same frame already shows the next one (no flash of the old world) */
      if(save.chapter === 1) updateG1(dt); else if(save.chapter === 2) updateG2(dt); else updateG3(dt);
      if(save.chapter === 1) drawG1(t, dt); else if(save.chapter === 2) drawG2(t, dt); else drawG3(t, dt);
    }catch(e){ console.error(e); }
    checkAchievements(dt);
    if(AU.ctx) ambienceTick(AU.ctx.currentTime);
    musicIntensity(save.chapter === 1 ? Math.min(4, G1.heat) : save.chapter === 2 ? g2Intensity() : g3Intensity());
    if(!document.hidden) save.meta.playTime += dt;
    BOOT.buffT += dt;
    if(BOOT.buffT > 0.1){ BOOT.buffT = 0; paintBuff(false); }
  }
  if(hud.dirty || now - hud.last > 250) paintHudNow();
  animateCards(t);
  if(INS.B) drawInspect(t);
  if(DLG.canvas) drawDialogCanvas(t);
  /* saving */
  BOOT.saveT += dt; BOOT.seenT += dt; BOOT.backupT += dt; BOOT.minuteT += dt;
  if(saveDirty && BOOT.saveT > 1){ BOOT.saveT = 0; persistNow(); }
  /* "last seen" only moves while you're actually playing, so sitting on the title screen never eats your idle earnings */
  if(BOOT.seenT > 10){ BOOT.seenT = 0; if(BOOT.started){ save.meta.seen = Date.now(); persistNow(); } }
  if(BOOT.backupT > 300){ BOOT.backupT = 0; backupNow(); }
  if(BOOT.minuteT > 20){ BOOT.minuteT = 0; dayTick(); }
}

/* a new day while playing: login reward, fresh missions + stock */
function dayTick(){
  const dk = dayKey();
  if(dk === BOOT.lastDay) return;
  BOOT.lastDay = dk;
  const L = loginCheck();
  if(L) showLoginDialog(L);
  paintHud();
}
function showLoginDialog(L){
  const cur = L.cur === "dm" ? "dark matter" : L.cur;
  showDialog({ title:"DAY " + L.day + " REWARD", text:"You came back " + L.streak + " day" + (L.streak > 1 ? "s" : "") + " in a row." + (L.day === 7 ? " Day 7 means a prize." : ""),
    html:'<div class="earn"><span>Reward</span><b>+' + fmt(L.amt) + " " + esc(cur) + "</b></div>" + (L.extra ? '<div class="earn"><span>Prize</span><b>' + esc(L.extra) + "</b></div>" : ""),
    draw:(g, w, hh, t) => drawLoginArt(g, w, hh, t, L.day), cw:180, ch:90, buttons:[{ t:"NICE" }] });
  play("rare");
}
function drawLoginArt(g, w, hh, t, day){
  for(let i = 0; i < 7; i++){
    const x = w / 2 + (i - 3) * 24, on = i < day, cur = i === day - 1;
    const y = hh / 2 + (cur ? Math.sin(t * 4) * 3 : 0);
    if(cur) glowAdd(g, x, y, 22, "#f3b229", 0.6);
    g.fillStyle = on ? (cur ? "#f3b229" : "#4fd6a0") : "rgba(255,255,255,.12)";
    g.beginPath(); g.arc(x, y, cur ? 10 : 8, 0, TAU); g.fill();
    ctext(g, String(i + 1), x, y + 0.5, 9, on ? "#071318" : "#7f9aa4", "center", "700 9px 'Space Grotesk', sans-serif", false);
  }
}

/* ---------- earning while you were away ---------- */
function idleRate(){
  if(save.chapter === 1){
    if(up1("auto") <= 0) return 0;
    const B = equipped(), ht = flipPower(B);
    const cyc = FLIGHT_T[ht] * fallMul(up1("fall")) / Math.pow(curPlace().g, 0.35) + 1.4;
    const pay = basePay(B) * coinMulLv(up1("mult")) * rebirthMul() * heightBonus(ht) * streakMul(4);
    return pay * landChanceBase() / cyc * 0.5;
  }
  if(save.chapter === 2) return idleRate2();
  return idleRate3();
}
function idleHours(){
  if(save.chapter === 1) return IDLE_HOURS[up1("idle")];
  if(save.chapter === 2) return IDLE_HOURS[save.g2.up.idle2 | 0];
  return IDLE_HOURS[save.g3.up.idle3 | 0];
}
function welcomeBack(awaySec){
  if(!(awaySec > 90)) return;
  const rate = idleRate(), cap = idleHours() * 3600;
  const sec = Math.min(awaySec, cap);
  const amt = rate * sec;
  if(!(amt > 0)) return;
  const cur = save.chapter === 1 ? "coins" : save.chapter === 2 ? "cash" : "dm";
  earn(cur, amt);
  const who = save.chapter === 1 ? "Auto Flip kept flipping." : save.chapter === 2 ? "The robot arm kept smashing." : "Your drones kept punching.";
  showDialog({ title:"WELCOME BACK", text:"You were gone " + fmtTime(awaySec) + ". " + who,
    html:'<div class="earn"><span>While you were gone</span><b>+' + fmt(amt) + " " + (cur === "dm" ? "dark matter" : cur) + "</b></div>" +
      (awaySec > cap ? '<div class="earn"><span>Only counted</span><b>' + idleHours() + "h (upgrade Idle Hours)</b></div>" : ""),
    draw:(g, w, hh, t) => drawWelcomeArt(g, w, hh, t), cw:160, ch:90, buttons:[{ t:"COLLECT" }] });
  play("coins", 8);
}
function drawWelcomeArt(g, w, hh, t){
  for(let i = 0; i < 9; i++){
    const ph = (t * 0.7 + i / 9) % 1;
    const x = w / 2 + Math.sin(i * 2.3) * w * 0.3, y = hh - ph * hh * 1.1;
    g.globalAlpha = Math.sin(ph * Math.PI);
    if(save.chapter === 1) drawCoinPickup(g, x, y, 7, t + i);
    else if(save.chapter === 2){ g.fillStyle = "#5fbf6a"; g.fillRect(x - 9, y - 5, 18, 10); g.strokeStyle = "#2f7a3a"; g.strokeRect(x - 9, y - 5, 18, 10); }
    else glowAdd(g, x, y, 10, "#b98bff", 0.9);
  }
  g.globalAlpha = 1;
}

/* ---------- start ---------- */
function startPlay(){
  if(BOOT.started) return;
  BOOT.started = true;
  BOOT.titleUntil = performance.now() + 900;
  audioInit();
  $("title").classList.add("gone");
  dropFocus();   /* the PLAY button would keep eating the space bar */
  resize();
  applyChapter();
  if(save.chapter === 2) g2Resume();
  else if(save.chapter === 3) g3Resume();
  setTimeout(afterTitle, 450);
}
function afterTitle(){
  const M = save.meta;
  if(bootInfo.fresh && bootInfo.veteran && !M.veteran){
    M.veteran = true;
    grantBottle("veteran");
    earn("coins", 500);
    showDialog({ title:"WELCOME BACK, VETERAN", text:"FLIPSHOT got rebuilt from the ground up, so everyone starts fresh. You played the old one, so here's a gift.",
      html:'<div class="earn"><span>Coins</span><b>+500</b></div><div class="earn"><span>Bottle</span><b>Veteran</b></div>',
      draw:(g, w, hh, t) => { const B = byId("veteran"); glowAdd(g, w / 2, hh / 2, hh * 0.6, B.glow, 0.4); g.translate(w / 2, hh / 2); drawBottle(g, B, Math.min(w * 0.25 / B.shape.w, hh * 0.38 / B.shape.h), { time:t }); },
      cw:150, ch:120, buttons:[{ t:"THANKS" }] });
  }
  if(!bootInfo.fresh && M.seen) welcomeBack((Date.now() - M.seen) / 1000);
  if(bootInfo.fresh){ M.login.day = dayKey(); M.login.streak = 1; M.loginBest = Math.max(1, M.loginBest); }
  else { const L = loginCheck(); if(L) showLoginDialog(L); }
  if(bootInfo.restored) toast("SAVE RESTORED", "Your save was damaged, so the newest backup was loaded");
  if(save.chapter === 1) tip("welcome");
  M.seen = Date.now();
  persistNow();
}

/* ---------- pointer ---------- */
function stagePos(e){ const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cv.addEventListener("pointerdown", e => {
  if(!BOOT.started) return;
  e.preventDefault();
  audioInit(); musicSync();
  const p = stagePos(e);
  ptr.x = p[0]; ptr.y = p[1];
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  if(save.chapter === 1) g1Press(p[0], p[1]);
  else if(save.chapter === 2) g2Press(p[0], p[1]);
  else g3Press(p[0], p[1], e.pointerId);
});
cv.addEventListener("pointermove", e => {
  const p = stagePos(e);
  ptr.x = p[0]; ptr.y = p[1];
  if(BOOT.started && save.chapter === 3) g3Move(p[0], p[1], e.pointerId);
});
const endPtr = e => { if(BOOT.started && save.chapter === 3){ const p = stagePos(e); g3Release(p[0], p[1], e.pointerId); } };
cv.addEventListener("pointerup", endPtr);
cv.addEventListener("pointercancel", endPtr);
window.addEventListener("mousemove", e => { const p = stagePos(e); ptr.x = p[0]; ptr.y = p[1]; }, { passive:true });
cv.addEventListener("contextmenu", e => e.preventDefault());

$("sheet-close").addEventListener("click", e => { e.stopPropagation(); closeSheet(); });
$("sheet").addEventListener("click", e => { if(e.target === $("sheet")) closeSheet(); });
$("inspect-close").addEventListener("click", e => { e.stopPropagation(); closeInspect(); });
$("inspect").addEventListener("click", e => { if(e.target === $("inspect")) closeInspect(); });
$("auto").addEventListener("click", e => {
  e.stopPropagation();
  if(save.chapter === 1){ save.g1.autoOn = !save.g1.autoOn; G1.autoWait = 0; play("click"); persist(); paintHud(); }
  else if(save.chapter === 2){ save.g2.autoOn = !save.g2.autoOn; G2.autoT = 0; play("click"); persist(); paintHud(); }
});
$("rivalbtn").addEventListener("click", e => {
  e.stopPropagation();
  const r = rivalAvailable();
  if(!r || G1.duel) return;
  play("rare");
  showDialog({ portrait:r, title:r.name.toUpperCase(), text:"“" + r.line + "” First one to land " + r.target + " in a row wins.",
    buttons:[{ t:"DUEL", fn:() => startDuel(r) }, { t:"LATER", alt:true }] });
});
$("replay").addEventListener("click", e => { e.stopPropagation(); startReplay(); });
$("t-play").addEventListener("click", e => { e.stopPropagation(); startPlay(); });
$("t-settings").addEventListener("click", e => { e.stopPropagation(); audioInit(); openSheet("menu", "settings"); });
$("t-stats").addEventListener("click", e => { e.stopPropagation(); audioInit(); openSheet("menu", "stats"); });
$("file-save").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if(!f) return;
  const r = new FileReader();
  r.onload = () => { const err = importSaveText(String(r.result || "")); if(err){ toast("COULD NOT LOAD", err); play("nope"); } };
  r.onerror = () => toast("COULD NOT LOAD", "That file could not be read");
  r.readAsText(f);
});
$("file-mp3").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if(!f) return;
  audioInit();
  mp3Load(f);
  toast("YOUR SONG", (f.name || "song").slice(0, 40));
  if(SH.name) renderSheet();
});

/* ---------- keyboard ---------- */
function sheetForAction(a){
  const c = save.chapter;
  switch(a){
    case "bottles": return c === 1 ? "bottles" : null;
    case "upgrades": return c === 1 ? "upgrades" : c === 2 ? "upgrades2" : "upgrades3";
    case "missions": return c === 1 ? "missions" : c === 2 ? "missions2" : "missions3";
    case "places": return c === 1 ? "places" : null;
    case "daily": return c === 1 ? "daily" : c === 2 ? "daily2" : "daily3";
    case "style": return c === 1 ? "style" : null;
    case "book": return "book";
    case "trophies": return "trophies";
    case "menu": return "menu";
    case "crates": return c === 2 ? "crates" : null;
    case "weapons": return c === 2 ? "weapons" : null;
    case "bosses": return c === 2 ? "bosses2" : c === 3 ? "bosses3" : null;
    case "targets": return c === 3 ? "targets" : null;
  }
  return null;
}
function moveSheetFocus(dir){
  const list = Array.from($("sheet-body").querySelectorAll("button:not([disabled]), input, select"));
  if(!list.length) return;
  let i = list.indexOf(document.activeElement);
  i = i < 0 ? (dir > 0 ? 0 : list.length - 1) : clamp(i + dir, 0, list.length - 1);
  list[i].focus();
  if(list[i].scrollIntoView) list[i].scrollIntoView({ block:"nearest" });
}
window.addEventListener("keydown", e => {
  /* picking a new key in the Keys menu */
  if(keyWait){
    e.preventDefault();
    const kw = keyWait; keyWait = null;
    if(e.code !== "Escape" && e.code !== "Tab"){
      const keys = Object.assign({}, save.settings.keys || {});
      for(const a of KEY_ACTIONS) if(keyFor(a[0]) === e.code && a[0] !== kw.action) keys[a[0]] = keyFor(kw.action);
      keys[kw.action] = e.code;
      save.settings.keys = keys; persist();
    }
    if(SH.name) renderSheet();
    return;
  }
  const tag = e.target && e.target.tagName;
  if(tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA"){ if(e.key === "Escape") e.target.blur(); return; }
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  /* secret codes: any letter or number you type while playing */
  if(e.key.length === 1 && /[a-z0-9]/i.test(e.key) && !e.repeat) codeKey(e.key);
  if(e.code === "Escape"){
    e.preventDefault();
    if(dialogOpen()) dialogEsc(); else if(INS.B) closeInspect(); else if(SH.name) closeSheet();
    return;
  }
  if(dialogOpen()) return;
  if(e.code === "Tab"){ if(SH.name){ e.preventDefault(); cycleSheetTab(e.shiftKey ? -1 : 1); } return; }
  if(!BOOT.started){
    if((e.code === "Enter" || e.code === "Space") && tag !== "BUTTON" && !SH.name){ e.preventDefault(); startPlay(); }
    return;
  }
  if(SH.name && (e.code === "ArrowDown" || e.code === "ArrowUp")){ e.preventDefault(); moveSheetFocus(e.code === "ArrowDown" ? 1 : -1); return; }
  /* a focused button only keeps the key inside menus; out on the game screen the key is for playing */
  const onButton = tag === "BUTTON" && !!e.target.closest("#sheet, #dlg, #inspect") && e.target.offsetParent !== null;
  if(tag === "BUTTON" && !onButton) e.target.blur();
  if(e.code === keyFor("action") || e.code === "Enter"){
    if(onButton && (e.code === "Space" || e.code === "Enter")) return;   /* let the focused button do its thing */
    if(SH.name || INS.B) return;
    e.preventDefault();
    if(e.repeat) return;
    audioInit(); musicSync();
    mainAction();
    return;
  }
  if(e.repeat) return;
  const now = performance.now();
  const act = KEY_ACTIONS.find(a => a[0] !== "action" && keyFor(a[0]) === e.code);
  if(!act){
    /* typing something that isn't a hotkey (like a code): hotkeys wait a moment */
    if(e.key.length === 1) BOOT.typingUntil = now + 2500;
    return;
  }
  if(now < BOOT.typingUntil){ BOOT.typingUntil = now + 2500; return; }
  const a = act[0];
  if(a === "auto"){
    if(save.chapter === 1 && up1("auto") > 0){ save.g1.autoOn = !save.g1.autoOn; G1.autoWait = 0; play("click"); persist(); paintHud(); toast("AUTO FLIP", save.g1.autoOn ? "on" : "off"); }
    else if(save.chapter === 2 && up2("autoc") > 0){ save.g2.autoOn = !save.g2.autoOn; G2.autoT = 0; play("click"); persist(); paintHud(); toast("AUTO CRATES", save.g2.autoOn ? "on" : "off"); }
    return;
  }
  if(a === "replay"){ if(save.chapter === 1) startReplay(); return; }
  if(a === "chute"){ if(save.chapter === 1) g1Chute(); return; }
  if(a === "throw"){ if(save.chapter === 3){ audioInit(); g3ThrowNext(); } return; }
  const name = sheetForAction(a);
  if(!name) return;
  e.preventDefault();
  if(SH.name === name) closeSheet(); else { closeSheet(); openSheet(name); }
});

/* ---------- tab hidden / shown ---------- */
document.addEventListener("visibilitychange", () => {
  if(document.hidden){
    if(BOOT.started){ BOOT.hiddenAt = Date.now(); save.meta.seen = Date.now(); }
    persistNow();
    if(save.settings.muteHidden){
      AU.hidden = true;
      if(AU.ctx) AU.ctx.suspend().catch(() => {});
      try{ speechSynthesis.cancel(); }catch(e){}
      if(mp3.el) mp3.el.pause();
    }
  }else{
    AU.hidden = false;
    if(AU.ctx && BOOT.started) AU.ctx.resume().catch(() => {});
    if(mus.track === "mine" && mus.on) mp3Play();
    lastT = 0;
    if(BOOT.started && BOOT.hiddenAt){ welcomeBack((Date.now() - BOOT.hiddenAt) / 1000); BOOT.hiddenAt = 0; }
    if(BOOT.started) save.meta.seen = Date.now();
    dayTick();
  }
});
window.addEventListener("pagehide", () => { if(BOOT.started) save.meta.seen = Date.now(); persistNow(); });

/* ---------- voices load late on some browsers ---------- */
voiceLoad();
if("speechSynthesis" in window){ try{ speechSynthesis.onvoiceschanged = () => voiceLoad(); }catch(e){} }
mp3Restore();

/* ---------- go ---------- */
setQualityFromSettings();
document.body.className = "g" + save.chapter;
hud.ch = 0;
paintHudNow();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { caches.gen++; TITLE.g = null; });
window.addEventListener("resize", () => { TITLE.g = null; });

/* test hooks, only with #dev in the address */
if(/dev/.test(location.hash)){
  window.__fs = { save:() => save, G1:G1, G2:G2, G3:G3, startPlay:startPlay, startFlip:startFlip, openSheet:openSheet, closeSheet:closeSheet, earn:earn,
    grantBottle:grantBottle, buyBottle:buyBottle, buyUp1:buyUp1, goPlace:goPlace, persistNow:persistNow, applyChapter:applyChapter,
    beginUniverseBreak:beginUniverseBreak, startDuel:startDuel, RIVALS:RIVALS, VISITORS:VISITORS, pickVisitor:pickVisitor, BOTTLES:BOTTLES, PLACES:PLACES,
    addBuff:addBuff, maybeSpawnGlass:maybeSpawnGlass, EV:EV, RANDOM_EVENTS:RANDOM_EVENTS, showDialog:showDialog, tip:tip, toast:toast,
    claimLegend:claimLegend, doRebirth:doRebirth, startG2Intro:startG2Intro, startG3Intro:startG3Intro, dev2:dev2, dev3:dev3,
    Q:Q, setQ:l => { Q.level = l; resize(); }, FX:FX, parts:parts, openInspect:openInspect, closeInspect:closeInspect, byId:byId,
    g1Key:g1Key, g2Main:g2Main, g3Main:g3Main, g3ThrowNext:g3ThrowNext, AU:AU, ringActive:ringActive, mainAction:mainAction,
    pillowPos:() => { const m = placeCache.meta, r = $("stage").getBoundingClientRect(); if(!m || !m.pillow) return null; return { x:r.left + m.pillow.x + m.pillow.w / 2, y:r.top + m.pillow.y - placeCache.top + G1.roomY + m.pillow.h / 2 }; } };
}
requestAnimationFrame(frame);
})();
