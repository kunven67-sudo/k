/* ---------- small helpers ---------- */
function up1(id){ return save.g1.up[id] | 0; }
function perk(id){ return save.meta.perks[id] | 0; }
function equipped(){ return byId(save.g1.equipped) || byId("classic"); }
function curPlace(){ return placeById(save.g1.place) || PLACES[0]; }
function bottleScale(){ return clamp(Math.min(W / 330, H / 520), 0.6, 1.12); }
function floorY(){ return Math.round(H * floorFrac()); }
function countInTier(t){ let n = 0; for(const id of save.g1.owned){ const b = byId(id); if(b && b.kind === "std" && b.tier === t) n++; } return n; }
function tierUnlocked(t){ return t <= 0 || countInTier(t - 1) >= 5; }
function topTierUnlocked(){ let t = 0; while(t < NTIERS - 1 && tierUnlocked(t + 1)) t++; return t; }
function ownedStd(){ let n = 0; for(const id of save.g1.owned){ const b = byId(id); if(b && b.kind === "std") n++; } return n; }
function fullTiers(){ let n = 0; for(let t = 0; t < NTIERS; t++) if(countInTier(t) >= 10) n++; return n; }
function visitorsMet(){ return VISITORS.filter(v => (save.g1.trophies[v.id] | 0) > 0).length; }
function rebirthMul(){ return Math.pow(2, save.meta.rebirths); }
function weekendMul(){ return isWeekend() ? 2 : 1; }
function heatLevel(s){ return s >= 100 ? 6 : s >= 50 ? 5 : s >= 25 ? 4 : s >= 10 ? 3 : s >= 5 ? 2 : s >= 3 ? 1 : 0; }
function legendDormant(B){
  /* after a rebirth, legends are kept but sleep until you earn them again */
  if(!B || !B.legend) return false;
  return !!(save.g1.dormant && save.g1.dormant[B.id]);
}
function flipPower(B){
  let ht = B.htier;
  if(B.legend && legendDormant(B)) ht = 0;
  if(buffOn("moon") && ht < NTIERS - 1) ht++;
  return ht;
}
function basePay(B){
  if(B.legend) return TIER_PAY[NTIERS - 1] * B.payMul;
  const t = clamp(B.htier, 0, NTIERS - 1);
  return TIER_PAY[t] * (B.kind === "std" ? 1 + B.idx * 0.06 : 1.1);
}
function heightBonus(ht){ return (1 + DEST[clamp(ht, 0, DEST.length - 1)].L * 0.15) * (eventOn("lowgrav") ? 1.5 : 1) * (1 + perk("height") * 0.15); }
function streakMul(s){ return 1 + Math.min(s, 25) * 0.08; }
function coinMulAll(){ return coinMulLv(up1("mult")) * rebirthMul() * weekendMul() * (buffOn("triple") ? 3 : buffOn("coins") ? 2 : 1); }
function payPreview(B){ return basePay(B) * streakMul(save.g1.streak + 1) * coinMulAll() * heightBonus(flipPower(B)); }
function landChanceBase(){
  return Math.min(0.97, baseLand(up1("grip")) + perk("soul") * 0.02 + (buffOn("grip") ? 0.2 : 0));
}
function goldenChance(){ return eventOn("goldrush") ? 0.25 : 0.02 + perk("golden") * 0.005; }
function visitorChance(){
  let p = (1 / 500) * luckMul(up1("luck")) * (1 + perk("star") * 0.15);
  if(buffOn("lucky")) p *= 3;
  return Math.min(p, 1 / 25);
}
function lootMulAll(){ return lootMul(up1("loot")) * (1 + perk("star") * 0.15); }
function ringWindows(tier){
  const wide = eyeMul(up1("eye")) * (buffOn("perfect") ? 1.8 : 1) * (1 + perk("hawk") * 0.1);
  return { good:Math.max(0.05, 0.11 - tier * 0.0035) * wide, perfect:Math.max(0.018, 0.035 - tier * 0.001) * wide };
}
function earn(cur, amt, src){
  if(!(amt > 0) || !isFinite(amt)) return 0;
  if(cur === "coins"){ save.g1.coins += amt; save.g1.stats.earned += amt; }
  else if(cur === "cash"){ save.g2.cash += amt; save.g2.stats.earned += amt; }
  else if(cur === "dm"){ save.g3.dm += amt; save.g3.stats.earned += amt; }
  else if(cur === "tokens"){ save.meta.tokens += Math.round(amt); }
  persist();
  return amt;
}

/* every bottle you get goes through here so the book remembers it forever */
function grantBottle(id){
  if(!byId(id)) return false;
  save.meta.found[id] = 1;
  if(save.g1.owned.includes(id)) return false;
  save.g1.owned.push(id);
  persist();
  return true;
}

/* ---------- buffs ---------- */
function buffOn(id){ for(const b of G1.buffs) if(b.id === id && b.left > 0) return true; return false; }
function addBuff(id, dur){
  dur = dur || buffDurLv(up1("glass"));
  for(const b of G1.buffs) if(b.id === id){ b.left = Math.max(b.left, dur); b.full = Math.max(b.full, dur); return; }
  G1.buffs.push({ id:id, left:dur, full:dur });
  while(G1.buffs.length > 3) G1.buffs.shift();
}

/* ---------- the flip ---------- */
function rotTable(f){
  /* spin slows down at the top (slow motion), then speeds up again */
  const N = 64, cum = [0];
  for(let i = 1; i <= N; i++){
    const u = i / N;
    let w = 1;
    if(!f.room){ if(u > f.ph.up && u < f.ph.hang) w = 0.22; else if(u < f.ph.launch) w = 0.6; }
    cum.push(cum[i - 1] + w);
  }
  return cum.map(c => c / cum[N]);
}
function rotProgress(f, u){
  const N = f.rt.length - 1, x = clamp(u, 0, 1) * N, i = Math.min(N - 1, Math.floor(x));
  return lerp(f.rt[i], f.rt[i + 1], x - i);
}
function startFlip(auto){
  if(save.chapter !== 1 || G1.mode !== "idle") return false;
  const B = equipped();
  if(B.id === "omega" && !legendDormant(B) && !G1.omegaOk){ showOmegaWarning(); return false; }
  audioInit();
  const P = curPlace();
  const ht = flipPower(B);
  const D = DEST[ht];
  const fm = fallMul(up1("fall")) * (buffOn("speed") ? 0.6 : 1) * (eventOn("lowgrav") ? 1.25 : 1) / Math.pow(P.g, 0.35);
  const room = ht <= 1;
  const k = bottleScale(), hB = B.shape.h * k;
  const f = {
    B:B, ht:ht, D:D, Lmax:D.L, T:FLIGHT_T[ht] * fm, T0:FLIGHT_T[ht], t:0, room:room, cosmic:!room && D.land !== "table", land:D.land,
    spins:room ? (Math.random() < 0.55 ? 1 : 2) : clamp(2 + ht, 3, 14),
    capTry:Math.random() < 0.04, golden:Math.random() < goldenChance(),
    drift:room ? (Math.random() * 2 - 1) * 16 + G1.wind * 0.6 : (Math.random() * 2 - 1) * 10,
    loot:[], tap:null, touchT:-1, resolved:false, vis:null, auto:!!auto, hB:hB,
    apexPx:ht === 0 ? Math.min(H * 0.46, 330 * k) : H * 0.9, omega:B.id === "omega" && !legendDormant(B),
    ph:{ launch:0.07, up:0.5, hang:0.62, down:0.93 }
  };
  if(f.cosmic) f.ph = { launch:0.07, up:0.56, hang:0.66, down:1 };
  if(f.omega){ f.T = FLIGHT_T[16]; f.cosmic = true; }
  if(up1("chute") > 0 && save.g1.autoChute && !f.omega) f.chuteQ = true;   /* auto parachute */
  f.rt = rotTable(f);
  f.rotEnd = f.spins * TAU + (f.capTry ? Math.PI : 0);
  spawnLoot(f);
  rollVisitor(f);
  G1.flight = f; G1.mode = "flight"; G1.t = 0; G1.replayB = B;
  G1.squash = 1; G1.alpha = 1; G1.gone = false; G1.dent = 0; G1.mix = 0; G1.trail.length = 0; G1.cosmicLand = null;
  G1.replayFrames = []; G1.replayOK = 0; G1.warpAfter = 0; G1.land = null;
  G1.sloshV += (Math.random() * 2 - 1) * 1.4;
  save.g1.stats.flips++;
  missionTick(1, "flips", 1);
  if(G1.lastFlipT && performance.now() - G1.lastFlipT < 450) G1.fastFlips = (G1.fastFlips || 0) + 1; else G1.fastFlips = 0;
  G1.lastFlipT = performance.now();
  if(room) play("flip"); else { play("flip"); play("launch", clamp(ht / 10, 0, 1)); }
  buzz("tap");
  if(!room && ht >= 6 && !save.meta.tips.space) tip("space");
  persist();
  return true;
}

/* where the bottle is, frame by frame */
function updateFlight(dt){
  const f = G1.flight;
  if(f.chuteQ && !f.chute && f.t >= chuteFrom(f)) openChute(f);
  if(f.chute) f.chute.age += dt;
  f.t += dt * (f.chute ? chuteRate(f) : 1);
  const u = clamp(f.t / f.T, 0, 1);
  const fy = floorY();
  if(f.vis && !f.vis.started && f.t >= f.vis.at){ startVisitor(f); return; }
  if(f.room){
    const a = f.apexPx * 4 * u * (1 - u);
    G1.altPx = a; G1.blend = 0; G1.camL = 0;
    G1.x = f.drift * u;
    /* pan the room up a little on ceiling flips */
    const topY = fy - f.hB * 2 - a;
    G1.roomY = Math.max(0, Math.min(H * PLACE_EXT * 0.95, H * 0.08 - topY));
  }else{
    const p = f.ph, T = f.T;
    const exitPx = fy + f.hB * 2 + 20;
    const tl = p.launch * T, tu = p.up * T, th = p.hang * T, td = p.down * T;
    if(f.t < tl){
      const v = f.t / tl;
      G1.altPx = exitPx * easeIn(v);
      G1.roomY = H * PLACE_EXT * 0.9 * easeIn(v);
      G1.camL = lerp(0, L_ROOM, v);
    }else if(f.t < tu){
      const v = (f.t - tl) / (tu - tl);
      G1.camL = lerp(L_ROOM, f.Lmax, easeOut3(v));
      G1.altPx = exitPx;
    }else if(f.t < th){
      const v = (f.t - tu) / (th - tu);
      G1.camL = f.Lmax + Math.sin(v * Math.PI) * 0.08;
    }else if(!f.cosmic){
      if(f.t < td){
        const v = (f.t - th) / (td - th);
        G1.camL = lerp(f.Lmax, L_ROOM, easeIn(v));
        G1.altPx = exitPx;
      }else{
        const v = clamp((f.t - td) / (T - td), 0, 1);
        G1.camL = lerp(L_ROOM, 0, v);
        G1.altPx = exitPx * (1 - easeIn(v));
        G1.roomY = H * PLACE_EXT * 0.9 * (1 - easeIn(v));
      }
    }else{
      G1.camL = f.Lmax;
      G1.cosmicLand = f.omega ? "break" : f.land;
    }
    /* view blend: room <-> sky */
    const b1 = clamp((f.t - tl * 0.6) / (tl * 0.55), 0, 1);
    const b2 = f.cosmic ? 1 : 1 - clamp((f.t - (td - T * 0.015)) / (T * 0.04), 0, 1);
    G1.blend = Math.min(b1, b2);
    /* cosmic floor slides in */
    G1.floorIn = f.cosmic ? clamp((f.t - (tu - T * 0.03)) / (T * 0.08), 0, 1) : 0;
    G1.x = Math.sin(f.t * 1.3) * 6 * (1 - Math.abs(u - 0.5) * 2) + f.drift * u;
  }
  G1.rot = f.rotEnd * rotProgress(f, u);
  G1.mix = Math.min(1, G1.mix + dt * 2.5);
  G1.sloshV += Math.sin(f.t * 17) * 0.9 * dt;
  /* the omega flip breaks everything at the top */
  if(f.omega && f.t > f.T * 0.6 && !f.broke){ f.broke = true; beginUniverseBreak(); return; }
  /* sky loot magnet */
  lootMagnet(f, dt);
  /* trail of ghost bottles */
  G1.trail.push({ L:G1.camL, px:G1.altPx, x:G1.x, rot:G1.rot, blend:G1.blend, roomY:G1.roomY });
  if(G1.trail.length > 40) G1.trail.shift();
  if(f.t >= f.T && f.touchT < 0) touchdown();
  if(f.touchT >= 0){
    const win = ringWindows(f.ht).good;
    if(f.t >= f.T + Math.min(0.12, win) && !f.resolved) resolveLanding();
  }
  recordReplay();
}

/* ---------- stick the landing ---------- */
function ringTime(f){ return Math.min(0.78, f.T * 0.62); }
/* no timing ring: landings are pure chance (better bottles and upgrades = better odds) */
function ringActive(f){ return false; }
function ringTap(f){
  const w = ringWindows(f.ht), err = f.t - f.T;
  let res = "miss";
  if(Math.abs(err) <= w.perfect) res = "perfect";
  else if(Math.abs(err) <= w.good) res = "good";
  f.tap = { res:res, err:err };
  if(res === "perfect"){ play("perfect"); buzz("big"); floatText("PERFECT", W / 2, bottleScreenY() - f.hB * 1.5, "#ffe08a", 22, 0.9); }
  else if(res === "good"){ play("good"); buzz("tap"); floatText("GOOD", W / 2, bottleScreenY() - f.hB * 1.5, "#4fd6a0", 18, 0.8); }
  else { play("click"); floatText(err < 0 ? "EARLY" : "LATE", W / 2, bottleScreenY() - f.hB * 1.5, "#9fb8c2", 15, 0.7); }
}

/* ---------- parachute ---------- */
/* while it's open the way down runs on the chute's own speed, so Fall Speed upgrades don't rush it */
/* the chute can open once the bottle starts coming down */
function chuteFrom(f){ return (f.room ? 0.5 : f.ph.hang) * f.T; }
function chuteRate(f){ return CHUTES[f.chute.lvl - 1].slow * clamp(f.T / (f.T0 || f.T), 0.4, 1.3); }
function canChute(f){ return !!f && up1("chute") > 0 && !f.omega && G1.mode === "flight" && !f.chute && f.touchT < 0 && f.t < f.T * 0.97; }
function g1Chute(){
  const f = G1.flight;
  if(!canChute(f)) return false;
  /* pressed on the way up: it opens by itself at the top */
  if(f.t < chuteFrom(f)){ if(!f.chuteQ){ f.chuteQ = true; play("click"); floatText("PARACHUTE READY", W / 2, bottleScreenY() - f.hB * 1.4, "#9fe8ff", 15, 0.9); } return true; }
  openChute(f);
  return true;
}
function openChute(f){
  f.chute = { lvl:clamp(up1("chute"), 1, CHUTES.length), age:0 };
  f.chuteQ = false;
  play("whoosh", 1.4); play("flop"); buzz("tap");
}

/* ---------- touchdown + the roll ---------- */
function touchdown(){
  const f = G1.flight;
  f.touchT = f.t;
  if(f.chute) G1.chuteFall = { lvl:f.chute.lvl, t:0 };
  G1.altPx = 0; G1.roomY = 0;
  if(!f.cosmic){ G1.blend = 0; G1.camL = 0; }
  G1.rot = f.rotEnd;
  G1.squash = 0.86;
  G1.sloshV += 2.6;
  const m = f.B.mat;
  if(m === "glass" || m === "crystal") play("landGlass"); else if(m === "metal") play("landMetal"); else if(m === "energy") play("landEnergy"); else play("landPlastic");
  dustPuff(f, false);
}
function landChanceFor(f){
  let c = landChanceBase();
  if(f.tap){ if(f.tap.res === "perfect") c += 0.3; else if(f.tap.res === "good") c += 0.15; }
  return Math.min(f.tap && f.tap.res === "perfect" ? 0.99 : 0.97, c);
}
function resolveLanding(){
  const f = G1.flight;
  f.resolved = true;
  const c = landChanceFor(f), r = Math.random();
  const win = f.golden || r < c;
  const close = !f.golden && Math.abs(r - c) < 0.12;
  G1.land = { win:win, wobble:close, t:0, f:f };
  if(close){ G1.mode = "wobble"; G1.t = 0; play("wobble"); if(!save.meta.tips.wobble) tip("wobble"); }
  else finishLanding();
}
function finishLanding(){
  const L = G1.land, f = L.f;
  if(L.win) landWin(f, L.wobble); else landMiss(f, L.wobble);
}
function landWin(f, clutch){
  const g1 = save.g1;
  g1.streak++;
  let pay = basePay(f.B) * streakMul(g1.streak) * coinMulAll() * heightBonus(f.ht);
  const tags = [];
  if(f.room && f.spins === 2){ pay *= 1.5; tags.push("DOUBLE SPIN"); }
  if(f.capTry){ pay *= 5; tags.push("CAP STAND"); g1.stats.caps++; }
  if(f.golden){ pay *= 10; tags.push("GOLDEN FLIP"); g1.stats.golden++; }
  if(clutch){ pay *= 1.5; tags.push("CLUTCH"); g1.stats.clutch++; missionTick(1, "clutch", 1); }
  if(Math.random() < perfectChance(up1("eye"), perk("hawk"))){ pay *= 1.5; tags.push("PERFECT"); g1.stats.perfects++; missionTick(1, "perfects", 1); }
  earn("coins", pay);
  g1.stats.lands++; g1.runLands++;
  if(g1.streak > g1.runBest) g1.runBest = g1.streak;
  if(pay > g1.stats.bestPay){ g1.stats.bestPay = pay; setRecord("bestPay", pay); }
  if(!f.room){ g1.stats.high++; missionTick(1, "high", 1); }
  if(f.ht > g1.maxH){ g1.maxH = f.ht; setRecord("maxH", f.ht); }
  missionTick(1, "lands", 1);
  missionMax(1, "streak", g1.streak);
  const newBest = g1.streak > g1.best;
  if(newBest){ g1.best = g1.streak; setRecord("best", g1.best); }
  if(g1.up.keeper > 0 && g1.shields < g1.up.keeper){ g1.refill++; if(g1.refill >= 4){ g1.refill = 0; g1.shields++; } }
  const big = f.golden || f.capTry || clutch;
  const tag = tags.length ? tags[tags.length - 1] : (f.cosmic ? "LANDED ON " + f.D.name.toUpperCase() : "STUCK IT");
  say(tag, "+" + fmt(pay), f.golden || f.capTry ? "var(--gold)" : "var(--good)");
  if(f.golden) announce("Golden flip!"); else if(f.capTry) announce("Cap stand!"); else if(clutch) announce("Clutch!");
  else if(f.room && f.spins === 2 && Math.random() < 0.3) announce("Double spin!");
  play("coin"); buzz(big ? "big" : "land");
  shake(big ? 9 : 3);
  floatText("+" + fmt(pay), W / 2 + G1.x, floorY() - f.hB * 2 - 26, "#f3b229", 18);
  if(newBest && g1.streak >= 5) floatText("NEW BEST", W / 2, floorY() - f.hB * 2 - 60, "#4fd6a0", 22);
  landingFX(f);
  milestone();
  if(Math.random() < 0.06) dropPickup(basePay(f.B) * coinMulAll() * 6);
  G1.mode = "settle"; G1.t = 0;
  G1.squash = 0.84;
  if(big) G1.replayOK = 1;
  afterLanding(true, f);
}
function landMiss(f, wobbled){
  const g1 = save.g1;
  let saved = "";
  if(buffOn("guard")){ saved = "HELD ON"; play("shield"); }
  else if(g1.shields > 0){ g1.shields--; saved = "SAVED"; play("shield"); }
  else{ if(g1.streak >= 10) announce("Ouch."); g1.streak = 0; }
  if(saved) say(saved, "streak safe", "var(--steel)"); else say("TIPPED", "", "var(--bad)");
  buzz("miss"); shake(2);
  /* how it falls depends on what it's made of */
  const m = f.B.pillow ? "cloth" : f.B.mat;
  const dir = Math.random() < 0.5 ? -1 : 1;
  G1.land = { kind:m === "glass" || m === "crystal" || m === "clay" ? "shatter" : m === "metal" ? "clang" : m === "energy" ? "dissolve" : m === "cloth" ? "flop" : "bounce",
    t:0, dir:dir, fromRot:G1.rot, f:f, fromX:G1.x, broke:false };
  G1.mode = "miss"; G1.t = 0;
  afterLanding(false, f);
}
function afterLanding(win, f){
  maybeSpawnGlass();
  duelAfterFlip(win);
  if(f.cosmic) G1.warpAfter = 1.15;
  checkAchSoon();
  persist();
}

/* landing dust / cosmetic landing effects */
function dustPuff(f, big){
  const x = W / 2 + G1.x, y = floorY();
  const col = f.cosmic ? "#e8e0ff" : "#d9c9a8";
  burst(big ? 18 : 10, { x:x, y:y - 2, jx:f.hB * 0.8, speed:90, ang:-Math.PI / 2, spread:2.6, life:0.5, size:4, col:withAlpha(col, 0.6), type:"smoke", g:-40, drag:0.06 });
}
function landingFX(f){
  const x = W / 2 + G1.x, y = floorY();
  const id = save.g1.landfx;
  if(id === "shock"){ spawn({ x:x, y:y, vx:0, vy:0, life:0.6, size:30, col:"#ffffff", type:"ring", g:0 }); spawn({ x:x, y:y, vx:0, vy:0, life:0.8, size:20, col:"#9fe8ff", type:"ring", g:0 }); }
  else if(id === "coinburst") burst(18, { x:x, y:y - 20, speed:260, ang:-Math.PI / 2, spread:2.2, life:1.1, size:5, type:"coin", g:700, vr:12, floor:y + 6 });
  else if(id === "flowers") burst(22, { x:x, y:y - 10, speed:200, ang:-Math.PI / 2, spread:2.6, life:1.3, size:5, type:"petal", col:["#ff8ab0", "#ffd23a", "#ffffff", "#c08aff"], g:200, vr:6, drag:0.03 });
  else if(id === "glitchpop") burst(26, { x:x, y:y - 30, speed:220, life:0.5, size:6, type:"pixel", col:["#ff00e6", "#00f0ff", "#ffffff", "#39ff14"], g:0, drag:0.08 });
  else if(id === "supernova"){ spawn({ x:x, y:y - 20, vx:0, vy:0, life:0.9, size:40, col:"#ffd27a", type:"ring", g:0 }); burst(30, { x:x, y:y - 20, speed:320, life:0.8, size:4, type:"ember", col:"#ffb03a", g:0, drag:0.05 }); flash(0.3, "#fff3c4"); }
  else dustPuff(f, true);
  if(f.golden){ burst(30, { x:x, y:y - 40, speed:300, life:1.2, size:5, type:"star", col:["#ffd23a", "#fff3c4"], g:500, vr:8 }); flash(0.35, "#ffe08a"); }
  if(f.capTry) burst(24, { x:x, y:y - 40, speed:260, life:1.1, size:4, type:"rect", col:["#f3b229", "#4fd6a0", "#56c7ff", "#ff6b5a", "#c08aff"], g:600, vr:12 });
}

/* landing animations: settle, wobble, the miss falls, then back to idle */
function updateLanding(dt){
  const L = G1.land;
  if(G1.mode === "settle"){
    G1.t += dt;
    const s = Math.min(1, G1.t / 0.3);
    G1.squash = 1 + Math.sin(s * Math.PI) * -0.13 * (1 - s);
    if(s >= 1){ G1.squash = 1; afterSettle(); }
  }else if(G1.mode === "wobble"){
    G1.t += dt;
    const d = 0.95, s = Math.min(1, G1.t / d);
    const base = G1.land.f.rotEnd;
    G1.rot = base + Math.sin(s * Math.PI * 4) * 0.22 * (L.win ? (1 - s) : 1) * (1 - s * 0.3);
    if(s >= 1){ G1.rot = L.win ? base : base + (Math.random() < 0.5 ? 0.2 : -0.2); finishLanding(); }
  }else if(G1.mode === "miss"){
    G1.t += dt;
    const t = G1.t, dir = L.dir, k = bottleScale(), hB = L.f.hB;
    const base = L.fromRot;
    const target = base + dir * Math.PI / 2;
    if(L.kind === "bounce"){
      if(t < 0.5){ const e = easeOut3(t / 0.5); G1.rot = lerp(base, target, e); G1.x = L.fromX + dir * 22 * e; G1.altPx = Math.abs(Math.sin(e * Math.PI)) * 14 * k; }
      else if(t < 0.95){ const e = (t - 0.5) / 0.45; G1.x = L.fromX + dir * (22 + 30 * easeOut(e)); G1.rot = target + dir * e * 1.4; G1.altPx = 0; if(!L.b1){ L.b1 = 1; play("bounce"); } }
      else beginReset(0.45);
    }else if(L.kind === "clang"){
      if(t < 0.42){ const e = easeIn(t / 0.42); G1.rot = lerp(base, target, e); G1.x = L.fromX + dir * 24 * e; }
      else if(!L.broke){ L.broke = true; play("clang"); shake(4); G1.dent = 1; burst(8, { x:W / 2 + G1.x + dir * hB, y:floorY() - 6, speed:200, life:0.4, size:3, type:"spark", col:"#ffe08a", g:300 }); }
      else if(t > 1.1) beginReset(0.45);
    }else if(L.kind === "shatter"){
      if(t < 0.38){ const e = easeIn(t / 0.38); G1.rot = lerp(base, target, e); G1.x = L.fromX + dir * 26 * e; }
      else if(!L.broke){
        L.broke = true; G1.gone = true;
        const cx = W / 2 + G1.x + dir * hB * 0.6, cy = floorY() - 10;
        const B = L.f.B;
        play("shatter"); shake(6); buzz("smash");
        burst(36, { x:cx, y:cy, jx:hB * 1.2, speed:300, ang:-Math.PI / 2, spread:2.8, life:1.1, size:5, type:"shard", col:B.mat === "clay" ? "#b7774a" : "rgba(220,240,255,.85)", g:900, vr:14, floor:floorY() + 6 });
        burst(26, { x:cx, y:cy, jx:hB, speed:220, ang:-Math.PI / 2, spread:2.4, life:0.9, size:3.5, type:"round", col:(B.layers ? B.layers[0] : B.liq[0]), g:800, floor:floorY() + 4 });
        G1.puddle = { x:cx, col:B.layers ? B.layers[1] : B.liq[0], t:0 };
      }else if(t > 1.0) beginDropIn();
    }else if(L.kind === "dissolve"){
      if(t < 0.35){ const e = easeIn(t / 0.35); G1.rot = lerp(base, target, e); }
      else if(!L.broke){ L.broke = true; G1.gone = true; play("dissolve");
        burst(40, { x:W / 2 + G1.x, y:floorY() - hB * 0.6, jx:hB * 1.6, jy:hB, speed:90, life:0.9, size:5, type:"pixel", col:[L.f.B.liq[0], L.f.B.glow || "#ffffff", "#ffffff"], g:-60 }); }
      else if(t > 0.9) beginDropIn(true);
    }else{ /* flop: a pillow just flops over */
      if(t < 0.4){ const e = easeOut3(t / 0.4); G1.rot = lerp(base, target, e); if(!L.b1){ L.b1 = 1; play("flop"); } }
      else if(t > 0.9) beginReset(0.45);
    }
  }else if(G1.mode === "reset"){
    G1.t += dt;
    const r = G1.resetFrom, s = Math.min(1, G1.t / r.dur), e = easeOut3(s);
    G1.rot = r.rot * (1 - e); G1.x = r.x * (1 - e); G1.altPx = Math.sin(s * Math.PI) * 16 + r.alt * (1 - e);
    G1.dent = Math.max(0, G1.dent - dt * 1.4);
    G1.blend = r.blend * (1 - e); G1.roomY = r.roomY * (1 - e);
    if(s >= 1){ G1.rot = 0; G1.x = 0; G1.altPx = 0; G1.blend = 0; G1.roomY = 0; G1.camL = 0; afterSettle(); }
  }else if(G1.mode === "dropin"){
    G1.t += dt;
    const s = Math.min(1, G1.t / 0.42);
    G1.gone = false; G1.alpha = 1;
    G1.altPx = (1 - easeIn(s)) * H * 0.7; G1.x = 0; G1.rot = 0;
    if(G1.land && G1.land.pixel) G1.alpha = s;
    if(s >= 1){ G1.altPx = 0; G1.squash = 0.86; play("landPlastic"); G1.mode = "settle"; G1.t = 0; }
  }
}
function cosmicHold(){
  /* a miss out on a planet or galaxy: no walking it back, just warp home */
  const f = G1.flight;
  if(f && f.cosmic && G1.warpAfter > 0){ G1.mode = "hold"; G1.t = 0; G1.warpAfter = 0.35; return true; }
  return false;
}
function beginReset(dur){
  if(cosmicHold()) return;
  G1.resetFrom = { rot:wrapAngle(G1.rot), x:G1.x, alt:G1.altPx, dur:dur || 0.4, blend:G1.blend, roomY:G1.roomY };
  G1.mode = "reset"; G1.t = 0;
}
function beginDropIn(pixel){
  if(cosmicHold()) return;
  G1.mode = "dropin"; G1.t = 0; G1.gone = false; G1.rot = 0; G1.x = 0;
  if(G1.land) G1.land.pixel = !!pixel;
}
function afterSettle(){
  const f = G1.flight;
  if(f && f.cosmic && G1.warpAfter > 0){ G1.mode = "hold"; G1.t = 0; return; }
  /* a cap stand stays on its cap for a moment, then hops back upright (no snapping) */
  if(f && f.capTry && G1.mode === "settle" && Math.abs(wrapAngle(G1.rot)) > 0.5 && !f.capBack){ f.capBack = true; G1.mode = "capwait"; G1.t = 0; return; }
  endFlip();
}
function endFlip(){
  G1.mode = "idle"; G1.t = 0; G1.flight = null; G1.land = null; G1.cosmicLand = null;
  G1.rot = 0; G1.x = 0; G1.altPx = 0; G1.blend = 0; G1.camL = 0; G1.roomY = 0; G1.floorIn = 0; G1.gone = false; G1.alpha = 1;
  G1.trail.length = 0;
  if(G1.replayOK && G1.replayFrames.length > 20) showReplayButton();
  paintHud();
}
/* top bottles landed on a planet or galaxy: hold, then warp home */
function updateHold(dt){
  G1.t += dt;
  if(G1.mode === "hold" && G1.t >= G1.warpAfter){ beginWarp(); }
  else if(G1.mode === "warp"){
    const s = Math.min(1, G1.t / 0.75);
    G1.camL = lerp(G1.warpFrom, 0, easeIn(s));
    G1.floorIn = Math.max(0, 1 - s * 3);
    if(G1.camL < L_ROOM) G1.cosmicLand = null;
    G1.blend = s < 0.8 ? G1.warpBlend : G1.warpBlend * (1 - (s - 0.8) / 0.2);
    G1.rot = G1.warpRot * (1 - easeOut3(s)); G1.x = G1.warpX * (1 - s); G1.altPx = G1.warpAlt * (1 - s); G1.roomY = G1.warpRoomY * (1 - s);
    G1.dent = Math.max(0, G1.dent - dt * 2);
    if(s >= 1){
      G1.warpAfter = 0; G1.blend = 0; G1.camL = 0; G1.floorIn = 0; G1.cosmicLand = null; G1.roomY = 0;
      G1.rot = 0; G1.x = 0; G1.altPx = 0;
      /* it broke out there (or something took it): a fresh one drops in */
      if(G1.gone) beginDropIn(!!(G1.land && G1.land.kind === "dissolve"));
      else endFlip();
    }
  }
}

function beginWarp(){
  G1.mode = "warp"; G1.t = 0; G1.warpFrom = G1.camL; G1.warpBlend = Math.max(G1.blend, 0.001);
  G1.warpRot = wrapAngle(G1.rot); G1.warpX = G1.x; G1.warpAlt = G1.altPx; G1.warpRoomY = G1.roomY;
  play("whoosh", 2);
}

/* ---------- sky loot ---------- */
function spawnLoot(f){
  const meteors = eventOn("meteors") ? 3 : 1, lucky = buffOn("lucky") ? 2 : 1;
  const unit = basePay(f.B) * coinMulAll() * lootMulAll();
  if(f.room){
    if(Math.random() < 0.3 * meteors) f.loot.push({ room:true, x:0.5 + (Math.random() < 0.5 ? -1 : 1) * (0.2 + Math.random() * 0.15), px:f.apexPx * (0.6 + Math.random() * 0.35), kind:"coin", value:unit * 0.4, got:false });
    return;
  }
  const top = f.cosmic ? f.Lmax - 0.3 : f.Lmax - 0.1;
  const n = Math.round(clamp((2 + f.Lmax * 0.85) * meteors * lucky, 0, 36));
  for(let i = 0; i < n; i++){
    const r = Math.random();
    const kind = r < 0.62 ? "coin" : r < 0.88 ? "star" : "gem";
    const side = Math.random() < 0.5 ? -1 : 1;
    f.loot.push({ L:lerp(L_ROOM + 0.35, top, (i + Math.random()) / n), x:0.5 + side * (0.16 + Math.random() * 0.26), kind:kind,
      value:unit * (kind === "coin" ? 0.12 : kind === "star" ? 0.3 : 0.8), got:false });
  }
}
function lootBase(l){
  if(l.room) return { x:l.x * W, y:floorY() - l.px + G1.roomY };
  return { x:l.x * W, y:lmY(l.L, G1.camL) };
}
/* where the loot is drawn: a magnet pulls it in toward the bottle */
function lootScreen(l){
  const p = lootBase(l);
  if(l.pull > 0){ const e = l.pull * l.pull; p.x = lerp(p.x, W / 2 + G1.x, e); p.y = lerp(p.y, bottleScreenY(), e); }
  return p;
}
function collectLoot(l, auto){
  l.got = true;
  earn("coins", l.value);
  save.g1.stats.loot++;
  missionTick(1, "loot", 1);
  const p = lootScreen(l);
  play("loot");
  floatText("+" + fmt(l.value), p.x, p.y - 14, l.kind === "gem" ? "#7affff" : "#ffe08a", 14, 0.8);
  burst(8, { x:p.x, y:p.y, speed:120, life:0.5, size:3, type:"glow", col:l.kind === "gem" ? "#7affff" : "#ffd23a", g:0, world:true });
  if(!auto && !save.meta.tips.loot) save.meta.tips.loot = 1;
}
function lootMagnet(f, dt){
  const range = Math.max(magnetRange(up1("magnet")), buffOn("magnet") ? 260 : 0);
  if(!range) return;
  /* measured from where the bottle really is; loot that zipped past the bottle since last frame still counts.
     Caught loot flies into the bottle so you can see the magnet working */
  const by = bottleScreenY(), bx = W / 2 + G1.x;
  for(const l of f.loot){
    if(l.got) continue;
    if(!l.pull){
      const p = lootBase(l), dx = p.x - bx, dy = p.y - by, pdy = l.pdy;
      l.pdy = dy;
      if(Math.hypot(dx, dy * 0.8) < range || (pdy !== undefined && Math.sign(pdy) !== Math.sign(dy) && Math.abs(dx) < range)) l.pull = 0.001;
    }
    if(l.pull){ l.pull = Math.min(1, l.pull + dt * 5); if(l.pull >= 1) collectLoot(l, true); }
  }
}

/* ---------- screen positions ---------- */
/* the bottle on screen: the one in the air (or in the replay), else the equipped one */
function drawnBottle(){
  if(G1.mode === "replay" && G1.replayB) return G1.replayB;
  return (G1.flight && G1.flight.B) || equipped();
}
function bottleScreenY(){
  const fy = floorY(), hB = drawnBottle().shape.h * bottleScale();
  const roomY = fy - hB - G1.altPx + G1.roomY;
  let skyY = H * 0.42;
  const f = G1.flight;
  if(f && f.cosmic && (G1.mode === "flight" || G1.mode === "settle" || G1.mode === "wobble" || G1.mode === "miss" || G1.mode === "hold" || G1.mode === "capwait")){
    const T = f.T, td = f.ph.hang * T;
    const s = G1.mode === "flight" ? clamp((f.t - td) / (T - td), 0, 1) : 1;
    skyY = lerp(H * 0.42, fy - hB, easeIn(s)) - (G1.mode === "miss" ? 0 : 0);
    if(G1.mode !== "flight") skyY = fy - hB - G1.altPx;
  }
  return lerp(roomY, skyY, G1.blend);
}

/* ---------- replay ---------- */
function recordReplay(){
  if(G1.replayFrames.length > 900) return;
  G1.replayFrames.push({ rot:G1.rot, x:G1.x, alt:G1.altPx, roomY:G1.roomY, blend:G1.blend, camL:G1.camL, floorIn:G1.floorIn, cl:G1.cosmicLand, squash:G1.squash, mix:G1.mix });
}

/* ---------- the main idle loop bits ---------- */
function updateG1(dt){
  const g1 = save.g1;
  switch(G1.mode){
    case "flight": updateFlight(dt); break;
    case "settle": case "wobble": case "miss": case "reset": case "dropin": updateLanding(dt); if(G1.mode !== "idle") recordReplay(); break;
    case "capwait": G1.t += dt; if(G1.t > 0.6) beginReset(0.5); break;
    case "hold": case "warp": updateHold(dt); break;
    case "event": updateVisitor(dt); break;
    case "reveal": G1.t += dt; if(G1.t > 2.6){ const E = G1.reveal && G1.reveal.E; G1.reveal = null; visitorAftermath(E); } break;
    case "replay": updateReplay(dt); break;
    case "break": updateBreak(dt); break;
    case "idle":
      if(g1.up.auto > 0 && g1.autoOn && !uiBlocking()){
        G1.autoWait += dt;
        if(G1.autoWait > 0.45){ G1.autoWait = 0; startFlip(true); }
      }else G1.autoWait = 0;
      break;
  }
  /* liquid physics */
  G1.sloshV += -G1.slosh * 46 * dt;
  G1.sloshV *= Math.pow(0.02, dt);
  G1.slosh = clamp(G1.slosh + G1.sloshV * dt, -0.5, 0.5);
  if(G1.mode !== "flight") G1.mix = Math.max(0, G1.mix - dt * 0.6);
  G1.fizz = Math.max(0, G1.fizz - dt * 0.8);
  if(G1.mode === "settle") G1.fizz = 1;
  /* wind */
  G1.windT -= dt;
  if(G1.windT <= 0){ G1.windT = 6 + Math.random() * 10; G1.wind = Math.random() < 0.4 ? (Math.random() * 2 - 1) * 24 : 0; }
  /* buffs tick */
  for(let i = G1.buffs.length - 1; i >= 0; i--){ G1.buffs[i].left -= dt; if(G1.buffs[i].left <= 0){ G1.buffs.splice(i, 1); play("chime"); paintHud(); } }
  /* table stuff */
  if(G1.glass){ G1.glass.born += dt; G1.glass.life -= dt; if(G1.glass.life <= 0) G1.glass = null; }
  for(let i = G1.pickups.length - 1; i >= 0; i--){ const p = G1.pickups[i]; p.born += dt; p.life -= dt; if(p.life <= 0) G1.pickups.splice(i, 1); }
  if(G1.puddle){ G1.puddle.t += dt; if(G1.puddle.t > 3) G1.puddle = null; }
  G1.heat = heatLevel(g1.streak);
  G1.replayOK = G1.replayOK || 0;
  updateEvents(dt);
}

/* tap on the stage */
function g1Press(x, y){
  if(G1.mode === "replay"){ stopReplay(); return; }
  /* coins on the table */
  for(let i = G1.pickups.length - 1; i >= 0; i--){
    const p = G1.pickups[i], py = floorY() - 12 + G1.roomY;
    if(Math.abs(x - p.x) < 28 && Math.abs(y - py) < 30){ collectPickup(i); return; }
  }
  if(G1.glass && G1.blend < 0.5){
    const k = bottleScale(), gy = floorY() - 22 * k + G1.roomY;
    if(Math.abs(x - G1.glass.x) < 34 * k && Math.abs(y - gy) < 44 * k){ smashGlass(); return; }
  }
  if(G1.mode === "idle"){
    /* secret: the pillow on the bedroom bed */
    if(save.g1.place === "bedroom" && placeCache.meta && placeCache.meta.pillow){
      const pl = placeCache.meta.pillow, py = pl.y - placeCache.top;
      if(x > pl.x && x < pl.x + pl.w && y > py && y < py + pl.h){ pillowTap(); return; }
    }
    startFlip(false);
    return;
  }
  const f = G1.flight;
  if(G1.mode === "flight" && f){
    /* sky loot first */
    for(const l of f.loot){
      if(l.got) continue;
      const p = lootScreen(l);
      if(Math.hypot(x - p.x, y - p.y) < 38){ collectLoot(l, false); return; }
    }
    if(ringActive(f)) ringTap(f);
  }
}
function g1Key(){
  if(G1.mode === "idle"){ startFlip(false); return; }
  const f = G1.flight;
  if(G1.mode === "flight" && f && ringActive(f)) ringTap(f);
  else if(G1.mode === "flight" && f) g1Chute();
  else if(G1.mode === "replay") stopReplay();
}


/* =====================================================================
   CHAPTER 1 DRAWING
   ===================================================================== */
let ptr = { x:-9999, y:-9999 };

/* the tier look outside the glass: glow, motes, rings, halos, lens, quantum ghosts */
function drawBottleAura(g, B, k, x, y, rot, t, front){
  const G = bottleGeom(B.shape, k), h = G.h, w = G.w;
  const tier = B.legend ? 15 : B.tier;
  const gl = B.glow;
  if(!front){
    if(gl && useGlow()) glowAdd(g, x, y, h * (tier >= 9 ? 1.9 : 1.5), gl, tier >= 6 ? 0.5 : 0.35);
    if(B.voidglass){
      /* light bending around a black hole: a bright ring with a dark core */
      g.save(); g.translate(x, y);
      const R = h * 1.25;
      const lg = g.createRadialGradient(0, 0, R * 0.55, 0, 0, R);
      lg.addColorStop(0, "rgba(0,0,0,0)"); lg.addColorStop(0.8, withAlpha(gl || "#ffffff", 0.0)); lg.addColorStop(0.9, withAlpha(gl || "#ffffff", 0.35)); lg.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = lg; g.beginPath(); g.arc(0, 0, R, 0, TAU); g.fill();
      g.rotate(t * 0.6); g.scale(1, 0.32);
      g.strokeStyle = withAlpha(gl || "#ffb020", 0.55); g.lineWidth = 3;
      g.beginPath(); g.arc(0, 0, R * 0.95, Math.PI, TAU); g.stroke();
      g.restore();
    }
    if(B.halo || tier === 13){
      /* light rays behind divine bottles */
      g.save(); g.translate(x, y); g.rotate(t * 0.15);
      g.globalCompositeOperation = "lighter";
      for(let i = 0; i < 12; i++){
        g.rotate(TAU / 12);
        const rg = g.createLinearGradient(0, 0, 0, -h * 1.8);
        rg.addColorStop(0, "rgba(255,248,220,.22)"); rg.addColorStop(1, "rgba(255,248,220,0)");
        g.fillStyle = rg; g.beginPath(); g.moveTo(-6 * k, 0); g.lineTo(6 * k, 0); g.lineTo(16 * k, -h * 1.8); g.lineTo(-16 * k, -h * 1.8); g.closePath(); g.fill();
      }
      g.globalCompositeOperation = "source-over";
      g.restore();
    }
    if(tier >= 7 && !B.legend){
      const mc = gl || "#ffffff";
      for(let m = 0; m < 9; m++){
        const ma = (m / 9) * TAU + t * 0.6, mr = h * (0.82 + 0.22 * Math.sin(t * 1.4 + m));
        glowAdd(g, x + Math.cos(ma) * mr * 0.6, y + Math.sin(ma) * mr, 3.5 * k, mc, 0.5 + 0.4 * Math.abs(Math.sin(t * 2 + m)));
      }
    }
    if(tier === 10){
      /* comets circling cosmic bottles */
      for(let c = 0; c < 2; c++){
        const a = t * (1.2 + c * 0.4) + c * 3, R = h * (1.15 + c * 0.2);
        const cx = x + Math.cos(a) * R * 0.75, cy = y + Math.sin(a) * R * 0.4;
        glowAdd(g, cx, cy, 6 * k, "#cfefff", 1);
        g.strokeStyle = "rgba(200,240,255,.35)"; g.lineWidth = 2; g.beginPath();
        for(let j = 0; j < 8; j++){ const aa = a - j * 0.06; g.lineTo(x + Math.cos(aa) * R * 0.75, y + Math.sin(aa) * R * 0.4); }
        g.stroke();
      }
    }
  }else{
    if(tier >= 9 && !B.legend){
      g.save(); g.translate(x, y); g.rotate(t * 0.9); g.scale(1, 0.3);
      g.strokeStyle = withAlpha(gl || "#ffffff", 0.55); g.lineWidth = 2;
      g.beginPath(); g.arc(0, 0, h * 1.08, 0, Math.PI); g.stroke();
      g.restore();
    }
    if(B.halo || tier === 13){
      g.save(); g.translate(x, y); g.rotate(rot);
      const hy = -h - 12 * k + Math.sin(t * 2) * 2;
      glowAdd(g, 0, hy, 22 * k, "#fff3c4", 0.6);
      g.strokeStyle = "#ffe8a8"; g.lineWidth = 2.6 * k; g.beginPath(); g.ellipse(0, hy, w * 0.9, 5 * k, 0, 0, TAU); g.stroke();
      g.restore();
    }
  }
}
function drawStreakHeat(g, x, y, h, lv, t, front){
  if(lv <= 0) return;
  if(!front){
    const col = lv === 1 ? "#ffb03a" : lv === 2 ? hsl(t * 60, 100, 60) : lv === 3 ? "#ff5a1a" : lv === 4 ? "#9fd8ff" : lv === 5 ? "#c08aff" : hsl(t * 120, 100, 65);
    glowAdd(g, x, y, h * (1.4 + lv * 0.18), col, 0.3 + lv * 0.06);
    if(lv >= 5){
      g.save(); g.translate(x, y); g.rotate(-t * 0.4); g.scale(1, 0.45);
      for(let i = 0; i < 24; i++){ const a = i / 24 * TAU; glowAdd(g, Math.cos(a) * h * 1.35, Math.sin(a) * h * 1.35, 3, i % 2 ? "#ffffff" : "#c9b8ff", 0.8); }
      g.restore();
    }
    return;
  }
  if(lv >= 3){
    /* flames licking up the sides */
    for(let i = 0; i < 6; i++){
      const side = i % 2 ? 1 : -1, ph = (t * 2.2 + i * 0.37) % 1;
      const fx = x + side * h * (0.28 + 0.05 * Math.sin(t * 7 + i)), fy = y + h * (0.9 - ph * 1.3);
      const fh = h * (0.32 + noise1(t * 4 + i * 7) * 0.25) * (1 - ph * 0.5);
      const fg = g.createLinearGradient(fx, fy, fx, fy - fh);
      fg.addColorStop(0, "rgba(255,230,140,0)"); fg.addColorStop(0.2, "rgba(255,200,90,.75)"); fg.addColorStop(0.6, "rgba(255,90,20,.5)"); fg.addColorStop(1, "rgba(200,20,0,0)");
      g.fillStyle = fg; g.beginPath(); g.moveTo(fx - fh * 0.2, fy); g.quadraticCurveTo(fx - fh * 0.15, fy - fh * 0.6, fx + (noise1(t * 6 + i) - 0.5) * fh * 0.4, fy - fh); g.quadraticCurveTo(fx + fh * 0.15, fy - fh * 0.6, fx + fh * 0.2, fy); g.fill();
    }
  }
  if(lv >= 4){
    const slot = Math.floor(t * 12);
    g.save(); g.globalCompositeOperation = "lighter";
    g.strokeStyle = "rgba(190,230,255,.9)"; g.lineWidth = 1.6;
    for(let a = 0; a < 3; a++){
      if(hash01(slot * 7 + a) < 0.35) continue;
      const a0 = hash01(slot * 3 + a) * TAU, a1 = a0 + 0.8 + hash01(slot + a) * 1.2, R = h * 1.15;
      g.beginPath();
      for(let s = 0; s <= 8; s++){ const aa = lerp(a0, a1, s / 8), rr = R * (0.85 + hash01(slot * 11 + a * 5 + s) * 0.3); g.lineTo(x + Math.cos(aa) * rr * 0.62, y + Math.sin(aa) * rr); }
      g.stroke();
    }
    g.restore();
  }
  if(lv >= 6){
    const hy = y - h * 1.25;
    glowAdd(g, x, hy, h * 0.5, hsl(t * 100, 100, 70), 0.7);
    g.strokeStyle = hsl(t * 100 + 60, 100, 75); g.lineWidth = 3;
    g.beginPath(); g.ellipse(x, hy, h * 0.45, h * 0.1, 0, 0, TAU); g.stroke();
  }
}

/* draws the bottle with everything around it */
function drawBottleAt(g, B, x, y, rot, sq, t, o){
  const k = bottleScale();

  const opts = { rot:rot, slosh:G1.slosh, time:t, mix:G1.mix, fizz:G1.fizz, dent:G1.dent, ptr:{ x:(ptr.x - x), y:(ptr.y - y) } };
  const one = (dx, alpha) => {

    if(sq && sq !== 1) g.scale(1 / Math.max(0.5, sq), sq);

  };
  if(B.tier === 11 && B.kind === "std"){

    g.save(); g.globalCompositeOperation = "lighter";

function drawShadowRef(g, B, t){
  const k = bottleScale(), fy = floorY() + G1.roomY, hB = B.shape.h * k;

    g.globalAlpha = a * gloss * 0.75 * (1 - Math.min(1, lift / 160));

  const sr = 54 * k * (1 + tt * 0.9);
  const sg = g.createRadialGradient(x, fy + 4, 2, x, fy + 4, sr);
  sg.addColorStop(0, "rgba(0,0,0," + (0.42 * (1 - tt * 0.7)).toFixed(3) + ")"); sg.addColorStop(1, "rgba(0,0,0,0)");

  g.restore();
  if(tt < 0.5 && !G1.gone){ g.globalAlpha = a * 0.5 * (1 - tt * 2); g.fillStyle = "#000"; g.beginPath(); g.ellipse(x, fy + 3, 26 * k, 5 * k, 0, 0, TAU); g.fill(); }
  /* glowing liquid lights the table */
  if(B.glow && useGlow() && !G1.gone){ g.globalAlpha = a * 0.35 * (1 - tt); glowAdd(g, x, fy + 6, hB * 1.2, B.glow, 0.55); }
  g.restore();
}

function drawTableStuff(g, t){

function drawRing(g, f, t){
  if(!f || G1.mode !== "flight" || f.auto) return;
  const rt = ringTime(f);
  const start = f.T - rt;
  if(f.t < start - 0.05) return;
  const x = W / 2 + G1.x, y = bottleScreenY(), hB = f.hB;
  const prog = clamp((f.t - start) / rt, 0, 1.3);
  const r0 = hB * 2.5, r1 = hB * 1.08;
  const r = lerp(r0, r1, Math.min(1, prog)) - Math.max(0, prog - 1) * hB * 0.3;
  const w = ringWindows(f.ht);
  const near = Math.abs(f.t - f.T) <= w.good;
  const nearP = Math.abs(f.t - f.T) <= w.perfect;
  if(!f.tap && !save.meta.tips.ring && prog > 0.15){ tip("ring"); }
  g.save();
  g.translate(x, y); g.scale(0.62, 1);
  g.strokeStyle = nearP ? "rgba(255,230,140,.95)" : near ? "rgba(120,255,190,.85)" : "rgba(255,255,255,.35)";
  g.lineWidth = 3;
  g.beginPath(); g.arc(0, 0, r1, 0, TAU); g.stroke();
  if(!f.tap){
    g.strokeStyle = "rgba(255,255,255," + (0.5 + 0.5 * Math.min(1, prog)).toFixed(2) + ")"; g.lineWidth = 2.4;
    g.beginPath(); g.arc(0, 0, Math.max(r1 * 0.6, r), 0, TAU); g.stroke();
  }else{
    const col = f.tap.res === "perfect" ? "#ffe08a" : f.tap.res === "good" ? "#4fd6a0" : "#9fb8c2";
    g.strokeStyle = col; g.lineWidth = 5; g.globalAlpha = 0.8;
    g.beginPath(); g.arc(0, 0, r1 + (f.t - f.T + 0.2) * 40, 0, TAU); g.stroke();
  }
  g.restore();
}

function drawTrail(g, B, t){
  if(G1.mode !== "flight" || !G1.flight || G1.flight.room) return;
  const k = bottleScale(), Gm = bottleGeom(B.shape, k);
  const n = Math.min(7, QQ().trail), list = G1.trail;

  for(let i = 0; i < n; i++){

    if(idx < 0) break;
    const p = list[idx];
    let y;
    if(G1.blend > 0.5) y = lmY(p.L, G1.camL) + (by - H * 0.42);
    else y = floorY() - B.shape.h * k - p.px + G1.roomY;

}

/* ---------- parachutes ---------- */
/* x, y = the bottle; hB = bottle height on screen; open = 0..1 how far it has opened */
function drawChute(g, x, y, hB, lvl, open, t, alpha){
  const s = open < 1 ? 1 + 2.2 * Math.pow(open - 1, 3) + 1.2 * Math.pow(open - 1, 2) : 1;   /* pops open with a little overshoot */
  const cw = hB * (lvl === 2 ? 1.9 : 1.55) * s, dh = cw * (lvl === 2 ? 0.2 : 0.42);
  const cy = y - hB * 1.25 - cw * 0.1, sway = Math.sin(t * 1.7) * 0.07;
  g.save(); g.globalAlpha = alpha;
  /* lines from the canopy edge down to the bottle */
  g.strokeStyle = lvl === 3 ? "rgba(255,230,160,.8)" : "rgba(235,240,245,.7)"; g.lineWidth = 1;
  const n = lvl === 2 ? 7 : 6;
  for(let i = 0; i <= n; i++){
    const rx = -cw / 2 + cw * i / n;
    g.beginPath(); g.moveTo(x + Math.cos(sway) * rx, cy + Math.sin(sway) * rx + 2); g.lineTo(x, y - hB * 0.3); g.stroke();
  }
  g.translate(x, cy); g.rotate(sway);
  if(lvl === 3) glowAdd(g, 0, -dh * 0.4, cw * 0.9, "#ffd76b", 0.35 + 0.1 * Math.sin(t * 4));
  if(lvl === 2){
    /* ram-air racing wing: an arched strip of cells, red and black */
    const outer = new Path2D(); outer.moveTo(-cw / 2, 4); outer.quadraticCurveTo(0, -dh * 2.2, cw / 2, 4); outer.lineTo(cw / 2, -4); outer.quadraticCurveTo(0, -dh * 2.2 - 12, -cw / 2, -4); outer.closePath();
    g.save(); g.clip(outer);
    for(let i = 0; i < 9; i++){ g.fillStyle = i % 2 ? "#141414" : "#e0242a"; g.fillRect(-cw / 2 + cw * i / 9, -dh * 3, cw / 9 + 1, dh * 4 + 20); }
    const sh = g.createLinearGradient(0, -dh * 2.4, 0, 6); sh.addColorStop(0, "rgba(255,255,255,.35)"); sh.addColorStop(1, "rgba(0,0,0,.35)");
    g.fillStyle = sh; g.fillRect(-cw / 2, -dh * 3, cw, dh * 4 + 20);
    g.restore();
    g.strokeStyle = "rgba(0,0,0,.6)"; g.lineWidth = 1.2; g.stroke(outer);
  }else{
    /* round canopy: gores that meet at the top */
    const dome = new Path2D(); dome.moveTo(-cw / 2, 0); dome.bezierCurveTo(-cw / 2, -dh * 1.35, cw / 2, -dh * 1.35, cw / 2, 0);
    for(let i = n; i > 0; i--){ const x1 = -cw / 2 + cw * i / n, x0 = -cw / 2 + cw * (i - 1) / n; dome.quadraticCurveTo((x0 + x1) / 2, -dh * 0.16, x0, 0); }
    dome.closePath();
    g.save(); g.clip(dome);
    for(let i = 0; i < n; i++){
      const x0 = -cw / 2 + cw * i / n, x1 = -cw / 2 + cw * (i + 1) / n;
      g.fillStyle = lvl === 3 ? (i % 2 ? "#f6c945" : "#c98a0e") : (i % 2 ? "#f4f1ea" : "#f07a1a");
      g.beginPath(); g.moveTo(0, -dh * 1.05); g.lineTo(x0 * 1.2, 2); g.lineTo(x1 * 1.2, 2); g.closePath(); g.fill();
    }
    const hl = g.createRadialGradient(-cw * 0.18, -dh * 0.9, 2, 0, -dh * 0.4, cw * 0.62);
    hl.addColorStop(0, "rgba(255,255,255,.4)"); hl.addColorStop(0.5, "rgba(255,255,255,0)"); hl.addColorStop(1, "rgba(0,0,0,.3)");
    g.fillStyle = hl; g.fillRect(-cw / 2, -dh * 1.4, cw, dh * 1.5);
    g.restore();
    g.strokeStyle = lvl === 3 ? "rgba(255,240,190,.9)" : "rgba(60,40,20,.45)"; g.lineWidth = lvl === 3 ? 1.6 : 1; g.stroke(dome);
    if(lvl === 3){
      /* a star on top and sparkles falling off the edge */
      g.fillStyle = "#fff6d0"; g.beginPath();
      for(let i = 0; i < 10; i++){ const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? cw * 0.035 : cw * 0.085; g.lineTo(Math.cos(a) * r, -dh * 0.62 + Math.sin(a) * r); }
      g.fill();
      for(let i = 0; i < 6; i++){ const ph = (t * 0.8 + i / 6) % 1; glowAdd(g, (hash01(i) - 0.5) * cw, ph * hB * 0.9, 3 + hash01(i + 2) * 3, "#ffe7a0", 1 - ph); }
    }
  }
  g.restore();
}

    const tw = g.measureText(v.verdict).width + 26 * s, th = fs + 14 * s;
    g.lineWidth = 3 * s; g.strokeStyle = "#ff5a4a"; rrect(g, -tw / 2, -th / 2, tw, th, 6 * s); g.stroke();
    ctext(g, v.verdict, 0, 1, fs, "#ff5a4a", "center", fs + "px Anton, Impact, sans-serif", false);
    g.restore();
  }
  g.restore();
}

let lastCamL = 0;
function drawG1(t, dt){
  if(G1.mode === "break" && SHT.on){ updateParts(dt, 0); drawBreakTakeover(t, dt); return; }
  const f = G1.flight;
  const P = curPlace(), B = drawnBottle(), k = bottleScale(), fy = floorY();
  /* camera moved this frame: world particles move with it */
  const camDY = (G1.camL - lastCamL) * H * PXL_F * (G1.blend > 0.5 ? 1 : 0);
  lastCamL = G1.camL;
  updateParts(dt, camDY);
  emitTrail(B, t, dt);
  const sh = shakeOffset();
  ctx.save(); ctx.translate(sh[0], sh[1]);
  /* slow motion near the top of high flights */
  let slow = 0;
  if(f && G1.mode === "flight" && !f.room && f.ht >= 3){
    const u = f.t / f.T, a = f.ph.up - 0.03, b = f.ph.hang + 0.02;
    if(u > a && u < b) slow = Math.sin((u - a) / (b - a) * Math.PI);
  }
  musicFilter(slow > 0.1 ? 700 + (1 - slow) * 6000 : 18000, 0.12);
  if(slow > 0){ const z = 1 + 0.07 * slow; ctx.translate(W / 2, H * 0.42); ctx.scale(z, z); ctx.translate(-W / 2, -H * 0.42); }
  /* background */
  if(G1.blend < 0.999){
    const pc = placeCacheFor(P);
    ctx.drawImage(pc.canvas, 0, -pc.top + G1.roomY, W, pc.hc);
    drawPlaceLive(ctx, P, pc, t, G1.roomY);
    if(G1.heat >= 5){
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = 0.12 + 0.06 * Math.sin(t * 4);
      glowAdd(ctx, W / 2, fy, W * 0.8, G1.heat >= 6 ? hsl(t * 80, 100, 60) : "#c08aff", 0.5);
      ctx.restore();
    }
  }
  if(G1.blend > 0.001){
    ctx.save(); ctx.globalAlpha = G1.blend;
    drawSkyView(ctx, G1.camL, t, P, envNow());
    ctx.restore();
  }
  if(G1.cosmicLand && G1.floorIn > 0 && G1.cosmicLand !== "break"){
    const yoff = (1 - easeOut3(G1.floorIn)) * H * 0.7;
    drawCosmicFloor(ctx, G1.cosmicLand, t, fy + yoff, k);
  }
  drawShadowRef(ctx, B, t);
  drawTableStuff(ctx, t);
  /* sky loot */
  if(f && G1.mode === "flight"){
    for(const l of f.loot){ if(l.got) continue; const p = lootScreen(l); if(p.y < -40 || p.y > H + 40) continue; drawLoot(ctx, l, p.x, p.y, t); }
  }
  drawTrail(ctx, B, t);
  /* the bottle (or the visitor scene) */
  if(G1.mode === "event" && G1.ev){
    const E = G1.ev;
    drawUfoBeam(ctx, E, t);
    if(!E.gone) drawBottleAt(ctx, B, E.bx, E.by, E.brot, 1, t, { heat:0 });
    drawVisitor(ctx, E, t);
  }else if(G1.mode === "break"){
    drawBreak(ctx, t);
  }else if(!G1.gone && G1.mode !== "reveal"){
    const x = W / 2 + G1.x, y = bottleScreenY();
    if(f && f.golden && (G1.mode === "flight" || G1.mode === "settle")) glowAdd(ctx, x, y, B.shape.h * k * 1.8, "#ffd166", 0.6);
    drawBottleAt(ctx, B, x, y, G1.rot, G1.squash, t, { heat:G1.heat, alpha:G1.alpha });
    const hBc = B.shape.h * k;
    if(f && f.chute && G1.mode === "flight" && f.touchT < 0) drawChute(ctx, x, y, hBc, f.chute.lvl, Math.min(1, f.chute.age / 0.35), t, 1);
    else if(G1.chuteFall){
      /* after landing the chute drops down over the bottle and fades */
      const cf = G1.chuteFall; cf.t += dt;
      if(cf.t > 0.8) G1.chuteFall = null;
      else drawChute(ctx, x + cf.t * 30, y + cf.t * cf.t * hBc * 1.4, hBc * (1 - cf.t * 0.35), cf.lvl, 1, t, 1 - cf.t / 0.8);
    }
    if(f && f.golden && (G1.mode === "flight" || G1.mode === "settle")){
      ctx.save(); ctx.translate(x, y); ctx.rotate(G1.rot); ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = 0.35;
      ctx.fillStyle = "#ffcf4a"; ctx.fill(bottleGeom(B.shape, k).body); ctx.restore();
    }
  }
  /* (the old timing ring is gone) */
  drawParts(ctx);
  drawFloats(ctx);

    ctx.save(); ctx.globalCompositeOperation = "lighter";
    for(let i = 0; i < 40; i++){ const a = hash01(i) * TAU, r0 = (t * 900 + hash01(i * 3) * 600) % (Math.max(W, H)); ctx.strokeStyle = "rgba(220,235,255,.35)"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(W / 2 + Math.cos(a) * r0, H * 0.42 + Math.sin(a) * r0); ctx.lineTo(W / 2 + Math.cos(a) * (r0 + 60), H * 0.42 + Math.sin(a) * (r0 + 60)); ctx.stroke(); }
    ctx.restore();
  }
  ctx.restore();
  drawHeightMeter(ctx, t);
  if(slow > 0.05){ ctx.fillStyle = "rgba(10,14,30," + (0.18 * slow).toFixed(3) + ")"; ctx.fillRect(0, 0, W, H); vignette(ctx, 0.5 * slow); }
  if(G1.heat >= 6) vignette(ctx, 0.3, hsl(t * 80, 100, 50, 0.35));
  vignette(ctx, 0.4);
  if(G1.mode === "reveal") drawReveal(ctx, t);
  if(G1.mode === "replay"){
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, 26); ctx.fillRect(0, H - 26, W, 26);
    ctext(ctx, "REPLAY", W / 2, 14, 13, "#ffffff", "center", "700 12px 'Space Grotesk', sans-serif", false);
  }
  if(FX.crack > 0) drawCracks(ctx, t, FX.crack);
  if(G1.mode === "break" && BRK.t > 2.6){ const a = clamp((BRK.t - 2.6) / 1.1, 0, 1); glitchSlices(ctx, a); staticNoise(ctx, a * 0.35); }
  drawFlash(ctx);
}

/* ---------- rare visitors ---------- */
function rollVisitor(f){
  if(G1.duel) return;
  if(Math.random() >= visitorChance()){
    /* hidden visitors have their own (still rare) roll when their moment comes */
    const hid = VISITORS.filter(v => (v.hidden || v.holiday) && v.cond && v.cond() && v.ok(curPlace()));
    if(!hid.length || Math.random() > 1 / 40) return;
    return pickVisitor(f, hid);
  }
  const P = curPlace();
  const pool = VISITORS.filter(v => {
    if(!v.ok(P)) return false;
    if(v.cond && !v.cond()) return false;
    if(v.when === "air") return !f.room && f.Lmax >= v.band[0] + 0.15;
    if(v.when === "low") return true;
    return true;
  });
  if(pool.length) pickVisitor(f, pool);
}
function pickVisitor(f, pool){
  let tot = 0; for(const v of pool) tot += v.w;
  let r = Math.random() * tot, v = pool[0];
  for(const c of pool){ r -= c.w; if(r <= 0){ v = c; break; } }
  let at;
  if(v.when === "table") at = 0.02;
  else if(v.when === "low") at = f.room ? f.T * 0.42 : f.T * f.ph.launch * 0.55;
  else{
    /* when does the camera reach the visitor's height? */
    const Lv = clamp(v.band[0] + Math.random() * (Math.min(v.band[1], f.Lmax) - v.band[0]), L_ROOM + 0.2, f.Lmax - 0.05);
    const tl = f.ph.launch * f.T, tu = f.ph.up * f.T;
    const prog = (Lv - L_ROOM) / Math.max(0.01, f.Lmax - L_ROOM);
    at = tl + (1 - Math.sqrt(Math.max(0, 1 - prog))) * (tu - tl);
  }
  f.vis = { v:v, at:at, started:false };
}
function startVisitor(f){
  const v = f.vis.v;
  f.vis.started = true;
  const sky = G1.blend > 0.5;
  const by = bottleScreenY(), bx = W / 2 + G1.x;
  const first = (save.g1.trophies[v.id] | 0) === 0;
  G1.ev = { v:v, t:0, dur:2.2, sky:sky, bx:bx, by:by, brot:G1.rot, ax:0, ay:0, attached:false, gone:false, first:first, side:Math.random() < 0.5 ? -1 : 1, f:f };
  const E = G1.ev;
  const s = E.side;
  switch(v.id){
    case "cat": E.dur = 2.2; play("meow"); break;
    case "vacuum": E.dur = 2.6; play("vacuum"); break;
    case "mom": E.dur = 2.6; break;
    case "raccoon": E.dur = 2.2; break;
    case "dog": E.dur = 2.0; play("bark"); break;
    case "kid": E.dur = 2.0; break;
    case "ball": E.dur = 1.6; break;
    case "monkey": E.dur = 2.0; play("monkey"); break;
    case "knife": E.dur = 1.2; play("slash"); flash(0.6); break;
    case "ghost": E.dur = 2.2; break;
    case "howler": E.dur = 2.6; break;
    case "witching": E.dur = 2.8; play("void"); break;
    case "hawk": E.dur = 1.8; play("screech"); break;
    case "seagull": E.dur = 1.8; play("gull"); break;
    case "plane": E.dur = 2.4; play("jet"); break;
    case "astro": E.dur = 2.4; play("radio"); break;
    case "meteor": E.dur = 1.6; break;
    case "whale": E.dur = 3.0; play("whale"); break;
    case "ufo": E.dur = 2.6; play("beam"); break;

  }
  E.ax = s > 0 ? W + 120 : -120; E.ay = by;
  G1.mode = "event"; G1.t = 0;
  save.g1.stats.visitors++;
  missionTick(1, "visitors", 1);
}
function updateVisitor(dt){
  const E = G1.ev; if(!E) { beginReset(0.3); return; }
  E.t += dt;
  const q = clamp(E.t / E.dur, 0, 1), s = E.side, v = E.v.id;
  const fy = floorY();
  const walkIn = (x0, x1, y, a, b) => { const u = clamp((q - a) / (b - a), 0, 1); return [lerp(x0, x1, smooth(u)), y]; };
  if(v === "dog" || v === "kid" || v === "raccoon"){
    /* the bottle keeps falling until it's low enough to reach, they run in, leap, and catch it right where it is */
    const meet = 0.45, base = visGround(v), k = bottleScale();
    const reach = (v === "dog" ? 170 : v === "kid" ? 70 : 30) * k;
    if(E.by0 === undefined){ E.by0 = E.by; E.rot0 = E.brot; E.catchY = Math.max(E.by, base + 18 - reach); }
    if(q < meet){
      const u = q / meet;
      E.by = lerp(E.by0, E.catchY, easeIn(u)); E.brot = E.rot0 + u * 2.4 * s;
      const p = walkIn(s > 0 ? W + 90 : -90, E.bx + s * 30, 0, 0, meet); E.ax = p[0];
      /* leap for the last part of the run so the mouth or hands arrive exactly at the bottle */
      const lu = clamp((q - (meet - 0.18)) / 0.18, 0, 1);
      E.ay = lerp(base, Math.min(base, E.by - 18), Math.sin(lu * Math.PI / 2));
    }else{
      if(!E.attached){ E.attached = true; E.ayc = E.ay; E.axc = E.ax; play("thump"); }
      const u = (q - meet) / (1 - meet);
      E.ax = lerp(E.axc, s > 0 ? -160 : W + 160, easeIn(u));
      E.ay = lerp(E.ayc, base, easeIn(clamp(u / 0.3, 0, 1)));
    }
  }else if(v === "cat"){
    E.ax = E.bx + s * 70; E.ay = visGround("cat");
    if(q > 0.4 && !E.hit){ E.hit = true; play("thump"); E.bvx = -s * 420; E.bvy = -300; }
    if(E.hit){ E.bx += E.bvx * dt; E.by += E.bvy * dt; E.bvy += 1400 * dt; E.brot += -s * 9 * dt; }
  }else if(v === "vacuum"){
    E.ax = lerp(s > 0 ? W + 60 : -60, s > 0 ? -80 : W + 80, q); E.ay = H - 20;
    if(q > 0.45 && !E.hit){ E.hit = true; play("thump"); shake(8); }
    if(E.hit){ E.brot = lerp(E.brot, s * Math.PI / 2, Math.min(1, dt * 6)); E.bx += s * 30 * dt; }
  }else if(v === "mom"){
    E.ax = s > 0 ? W - 60 : 60; E.ay = visGround("mom") + 26 * visK("mom");
    if(q > 0.25 && !E.hit){ E.hit = true; play("tip"); announce("Stop throwing that!", true); }
    if(E.hit){ E.by = Math.min(fy - E.f.hB, E.by + 900 * dt); E.brot = lerp(E.brot, 0, Math.min(1, dt * 8)); }
  }else if(v === "ball"){
    const u = clamp(q / 0.4, 0, 1);
    if(!E.hit){ E.ax = lerp(s > 0 ? W + 40 : -40, E.bx, u); E.ay = lerp(E.by - 120, E.by, u) - Math.sin(u * Math.PI) * 40; if(u >= 1){ E.hit = true; play("thump"); E.bvx = -s * 380; E.bvy = -260; E.avx = s * 200; } }
    else { E.bx += E.bvx * dt; E.by += E.bvy * dt; E.bvy += 1300 * dt; E.brot += -s * 10 * dt; E.ax += E.avx * dt; E.ay += 200 * dt; }
  }else if(v === "monkey"){
    const meet = 0.35;
    if(q < meet){ const u = q / meet; E.ax = lerp(s > 0 ? W + 60 : -60, E.bx, smooth(u)); E.ay = lerp(visGround("monkey"), E.by + 20, u) - Math.sin(u * Math.PI) * 30; }
    else{
      E.attached = q < 0.7;
      if(q >= 0.7){
        /* it tosses the bottle back down onto the table with a spin, then leaves */
        if(E.mby === undefined){ E.mby = E.by; E.mbx = E.bx; E.max0 = E.ax; }
        const u = (q - 0.7) / 0.3;
        E.by = lerp(E.mby, fy - E.f.hB, easeIn(Math.min(1, u * 1.6))); E.brot += 14 * dt * (1 - u);
        E.ax = lerp(E.max0, s > 0 ? -80 : W + 80, u);
      }
    }
  }else if(v === "knife"){
    E.ax = lerp(-140, W + 140, q / 0.5); E.ay = E.by - 4;
    if(q > 0.2 && !E.hit){ E.hit = true; E.gone = true; const B = E.f.B;
      burst(20, { x:E.bx, y:E.by, speed:240, life:0.8, size:3.5, type:"round", col:B.liq[0], g:900 });
      burst(14, { x:E.bx, y:E.by, speed:200, life:0.9, size:4, type:"shard", col:"rgba(220,240,255,.8)", g:800, vr:12 }); }
  }else if(v === "ghost"){
    E.ax = E.bx; E.ay = lerp(fy + 40, E.by - 30, smooth(clamp(q / 0.5, 0, 1)));
    if(q > 0.55 && !E.hit){ E.hit = true; E.gone = true; play("void"); burst(20, { x:E.bx, y:E.by, speed:90, life:1, size:6, type:"smoke", col:"#e8f0ff", g:-50 }); }
  }else if(v === "howler"){
    E.ax = s > 0 ? W - 60 : 60; E.ay = fy - 50;
    if(q > 0.25 && !E.hit){ E.hit = true; tone(320, 1.2, "sawtooth", 0.06, 620); tone(330, 1.2, "triangle", 0.05, 640, 0.05); shake(3); }
    if(E.hit) E.brot = Math.sin(E.t * 30) * 0.06;
  }else if(v === "witching"){
    E.ax = E.bx + s * 80; E.ay = fy - 70;
    if(q > 0.6 && !E.hit){ E.hit = true; E.gone = true; flash(0.4, "#000000"); }
  }else if(v === "hawk" || v === "seagull" || v === "sleigh"){
    const meet = 0.45;
    if(q < meet){ const u = q / meet; E.ax = lerp(s > 0 ? W + 120 : -120, E.bx, smooth(u)); E.ay = lerp(E.by - 160, E.by - 26, smooth(u)); }
    else{
      /* flies off from the spot where it grabbed the bottle */
      if(!E.attached){ E.attached = true; E.hx0 = E.ax; E.hy0 = E.ay; }
      const u = (q - meet) / (1 - meet);
      E.ax = lerp(E.hx0, s > 0 ? -180 : W + 180, easeIn(u)); E.ay = lerp(E.hy0, E.hy0 - 174, easeIn(u));
    }
  }else if(v === "plane"){
    E.ax = lerp(s > 0 ? W + 260 : -260, s > 0 ? -320 : W + 320, q); if(!E.attached) E.ay = E.by + 10;
    if(!E.attached && (s > 0 ? E.ax <= E.bx : E.ax >= E.bx)) E.attached = true;
  }else if(v === "astro"){
    const meet = 0.45;
    if(q < meet){ const u = q / meet; E.ax = lerp(s > 0 ? W + 80 : -80, E.bx + s * 46, smooth(u)); E.ay = E.by - 10 + Math.sin(E.t * 2) * 8; }
    else{ if(!E.hit){ E.hit = true; play("perfect"); } E.bx += -s * 70 * dt; E.brot += -s * 6 * dt; E.ax += s * 40 * dt; }
  }else if(v === "meteor"){
    const u = clamp(q / 0.4, 0, 1);
    E.ax = lerp(s > 0 ? W + 80 : -80, E.bx, u); E.ay = lerp(-80, E.by, u);
    if(u >= 1 && !E.hit){ E.hit = true; E.gone = true; play("boom"); shake(12); flash(0.5, "#ffb06a");
      burst(30, { x:E.bx, y:E.by, speed:320, life:1, size:4, type:"ember", col:"#ff8a2a", g:0, drag:0.04 }); burst(16, { x:E.bx, y:E.by, speed:240, life:1, size:5, type:"rock", col:"#5a4a3a", g:0, vr:8 }); }
  }else if(v === "whale"){
    const meet = 0.5;
    E.ax = lerp(s > 0 ? W + 300 : -300, s > 0 ? -340 : W + 340, q); E.ay = E.by + 12;
    E.mouth = Math.abs(E.ax - E.bx) < 160 ? 1 : 0;
    if(q > meet && !E.hit){ E.hit = true; E.gone = true; play("thump"); }
  }else if(v === "ufo"){
    E.ax = E.bx; E.ay = lerp(-80, E.by - 150, smooth(clamp(q / 0.3, 0, 1)));
    if(q > 0.3 && q < 0.75){ E.by = lerp(E.by, E.ay + 30, Math.min(1, dt * 2)); E.brot += dt * 4; E.beam = true; }
    if(q >= 0.75){ E.gone = true; E.beam = false; E.ax = lerp(E.bx, W * 1.5, easeIn((q - 0.75) / 0.25)); E.ay -= dt * 60; }
  }
  /* once caught, the bottle keeps exactly the spot where it was grabbed, so it never jumps */
  if(E.attached){
    if(E.mo === undefined){ E.mo = E.ax - E.bx; E.my = E.by - E.ay; }
    E.bx = E.ax - E.mo; E.by = E.ay + E.my; E.brot = lerp(E.brot, 0.6 * s, Math.min(1, dt * 12));
  }
  if(q >= 1) finishVisitor();
}
function finishVisitor(){
  const E = G1.ev; if(!E) return;

function duelAfterFlip(win){

function missionUnit(c){
  if(c === 1){ const B = equipped(); return basePay(B) * coinMulLv(up1("mult")) * rebirthMul() * heightBonus(flipPower(B)); }
  if(c === 2) return typeof cashUnit === "function" ? cashUnit() : 10;
  return typeof dmUnit === "function" ? dmUnit() : 10;
}
function rollMissions(c){
  const M = MISSIONS[c];
  let s = save.missions[c];
  const dk = dayKey(), wk = weekKey();
  const valid = s && typeof s === "object" && Array.isArray(s.d) && Array.isArray(s.w);
  if(!valid) s = save.missions[c] = { day:"", week:"", d:[], w:[] };
  if(s.day !== dk){
    const rnd = mulberry(strSeed(dk + ":" + c));
    const idx = M.daily.map((m, i) => i);
    s.d = [];
    for(let i = 0; i < 3 && idx.length; i++){ const j = Math.floor(rnd() * idx.length); s.d.push({ i:idx.splice(j, 1)[0], tier:Math.floor(rnd() * 3), prog:0, done:false }); }
    s.day = dk;
  }
  if(s.week !== wk){
    const rnd = mulberry(strSeed(wk + ":" + c));
    const idx = M.weekly.map((m, i) => i);
    s.w = [];
    for(let i = 0; i < 2 && idx.length; i++){ const j = Math.floor(rnd() * idx.length); s.w.push({ i:idx.splice(j, 1)[0], tier:0, prog:0, done:false }); }
    s.week = wk;
  }
  return s;
}
function missionList(c){
  const s = rollMissions(c), M = MISSIONS[c];
  const out = [];
  s.d.forEach(m => { const def = M.daily[m.i]; if(def) out.push({ m:m, def:def, goal:def.goal[m.tier] || def.goal[0], pay:def.pay[m.tier] || def.pay[0], weekly:false }); });
  s.w.forEach(m => { const def = M.weekly[m.i]; if(def) out.push({ m:m, def:def, goal:def.goal[0], pay:def.pay[0], weekly:true }); });
  return out;
}
function missionTick(c, key, amt){
  if(save.chapter !== c && c !== 0) return;
  for(const it of missionList(c)) if(it.def.k === key && !it.m.done && !it.def.max) it.m.prog += amt;
}
function missionMax(c, key, v){
  for(const it of missionList(c)) if(it.def.k === key && !it.m.done && it.def.max) it.m.prog = Math.max(it.m.prog, v);
}
function missionsReady(c){ return missionList(c).some(it => !it.m.done && it.m.prog >= it.goal); }
function claimMission(c, it){
  if(it.m.done || it.m.prog < it.goal) return;
  it.m.done = true;
  const cur = c === 1 ? "coins" : c === 2 ? "cash" : "dm";

/* ---------- secrets ---------- */
/* every key remembers when it was typed: a code only counts if all of it came in the last minute */
const codeBuf = { keys:[] };
const CODE_SET = new Map(CODES.map(c => [c.hash, c]));
function codeKey(ch){
  const now = performance.now(), K = codeBuf.keys;
  K.push({ c:ch.toLowerCase(), t:now });
  if(K.length > 24) K.shift();
  let str = "";
  for(let n = 1; n <= K.length; n++){
    const k = K[K.length - n];
    if(now - k.t > CODE_WINDOW * 1000) break;
    str = k.c + str;
    if(n >= 4){
      const c = CODE_SET.get(cyrb53(str));
      if(c){ K.length = 0; redeemCode(c); return true; }
    }
  }
  return false;
}
function codeText(str){
  /* typed into the settings box: same 60 second rule from your first key */
  let hit = false;
  for(const ch of str) if(codeKey(ch)) hit = true;
  return hit;
}
function redeemCode(c){
  const parts = c.reward.split(":");
  const kind = parts[0], id = parts[1];
  save.meta.secrets[c.hash] = 1;
  if(kind === "bottle"){

    grantBottle(id);
    toast("SECRET FOUND", byId(id).name + " is yours");

  checkAchSoon(); persist(); paintHud();
}

  const bh = Math.max(14, h * 0.05), bw = bh * 2.1;
  for(let row = 0, y = 0; y < fy; row++, y += bh){
    const off = row % 2 ? bw / 2 : 0;
    for(let x = -off; x < w; x += bw){
      const t = 0.9 + rnd() * 0.16;
      g.fillStyle = "rgb(" + Math.round(98 * t) + "," + Math.round(96 * t) + "," + Math.round(90 * t) + ")";
      g.fillRect(x + 1.5, y + 1.5, bw - 3, bh - 3);
      g.fillStyle = "rgba(255,255,255,.05)"; g.fillRect(x + 1.5, y + 1.5, bw - 3, 2);
      g.fillStyle = "rgba(0,0,0,.08)"; g.fillRect(x + 1.5, y + bh - 4, bw - 3, 2.5);
      if(rnd() < 0.18){ g.fillStyle = "rgba(0,0,0,.12)"; g.beginPath(); g.arc(x + rnd() * bw, y + rnd() * bh, 1 + rnd() * 2, 0, TAU); g.fill(); }
    }
  }
  /* mortar texture speckle */
  for(let i = 0; i < w * fy / 90; i++){ g.fillStyle = rnd() < 0.5 ? "rgba(0,0,0,.07)" : "rgba(255,255,255,.04)"; g.fillRect(rnd() * w, rnd() * fy, 1.5, 1.5); }
  /* water stains under the window + a long crack */
  const sg = g.createLinearGradient(0, h * 0.2, 0, h * 0.55);
  sg.addColorStop(0, "rgba(60,50,30,.28)"); sg.addColorStop(1, "rgba(60,50,30,0)");
  g.fillStyle = sg;
  for(let i = 0; i < 5; i++){ const x = w * 0.08 + rnd() * w * 0.2; g.fillRect(x, h * 0.2, 4 + rnd() * 10, h * (0.15 + rnd() * 0.2)); }
  g.strokeStyle = "rgba(20,18,15,.55)"; g.lineWidth = 1.3;
  g.beginPath(); let cx = w * 0.64, cy = h * 0.16; g.moveTo(cx, cy);
  for(let i = 0; i < 9; i++){ cx += (rnd() - 0.4) * 16; cy += 8 + rnd() * 12; g.lineTo(cx, cy); }
  g.stroke();
  /* ceiling: joists, insulation, pipes, duct */
  const ch = h * 0.065;
  g.fillStyle = "#2a2118"; g.fillRect(0, 0, w, ch);
  for(let x = 0; x < w; x += w / 7){
    const jg = g.createLinearGradient(x, 0, x + 18, 0); jg.addColorStop(0, "#6b4f33"); jg.addColorStop(1, "#4a3420");
    g.fillStyle = jg; g.fillRect(x, 0, 18, ch + 4);
    g.fillStyle = "#c9a07a"; g.globalAlpha = 0.35; g.fillRect(x + 20, 2, w / 7 - 22, ch - 6); g.globalAlpha = 1;
  }
  g.fillStyle = "rgba(0,0,0,.4)"; g.fillRect(0, ch, w, 4);
  /* silver duct */
  const dg = g.createLinearGradient(0, ch, 0, ch + h * 0.05); dg.addColorStop(0, "#c9cfd4"); dg.addColorStop(0.5, "#8a9299"); dg.addColorStop(1, "#5a6067");
  g.fillStyle = dg; g.fillRect(0, ch, w * 0.42, h * 0.05);
  g.strokeStyle = "rgba(0,0,0,.25)"; g.lineWidth = 1; for(let x = 30; x < w * 0.42; x += 46){ g.beginPath(); g.moveTo(x, ch); g.lineTo(x, ch + h * 0.05); g.stroke(); }
  /* copper pipe with joints */
  const py = ch + h * 0.065;
  const cg = g.createLinearGradient(0, py - 4, 0, py + 4); cg.addColorStop(0, "#f2b48a"); cg.addColorStop(0.5, "#b8673a"); cg.addColorStop(1, "#6b3216");
  g.fillStyle = cg; g.fillRect(0, py - 3.5, w, 7);
  for(let x = w * 0.18; x < w; x += w * 0.27){ g.fillStyle = "#9a5a2e"; g.fillRect(x - 5, py - 5, 10, 10); g.fillStyle = "#3a3a3a"; g.fillRect(x - 3, py - 12, 6, 7); }
  /* gray drain pipe coming down on the right */
  const gx = w * 0.9;
  const pg = g.createLinearGradient(gx - 7, 0, gx + 7, 0); pg.addColorStop(0, "#9aa0a4"); pg.addColorStop(0.4, "#d6dadc"); pg.addColorStop(1, "#6a7074");
  g.fillStyle = pg; g.fillRect(gx - 7, ch, 14, fy - ch);
  g.fillStyle = "#7a8084"; g.fillRect(gx - 9, ch + h * 0.2, 18, 8); g.fillRect(gx - 9, h * 0.6, 18, 8);
  /* the little window up high */
  const wx = w * 0.07, wy = h * 0.11, ww = Math.max(70, w * 0.26), wh = h * 0.1;
  const sky = env.phase === "night" ? ["#0a1026", "#1a2140"] : env.phase === "dawn" || env.phase === "dusk" ? ["#f0a070", "#6a7ab0"] : env.phase === "evening" ? ["#2a2a5a", "#7a5a7a"] : ["#8fc4ec", "#d8ecf8"];
  const wg = g.createLinearGradient(0, wy, 0, wy + wh); wg.addColorStop(0, sky[0]); wg.addColorStop(1, sky[1]);
  g.fillStyle = "#3a3026"; g.fillRect(wx - 6, wy - 6, ww + 12, wh + 12);
  g.fillStyle = wg; g.fillRect(wx, wy, ww, wh);
  /* ground level outside: dirt + grass + a fence post */
  g.fillStyle = env.weather === "snow" ? "#e8eef4" : "#4a3a26"; g.fillRect(wx, wy + wh * 0.62, ww, wh * 0.38);
  g.strokeStyle = env.weather === "snow" ? "#c9d6e0" : env.day > 0.3 ? "#4f8a3a" : "#24402a"; g.lineWidth = 1.3;
  for(let i = 0; i < ww / 3; i++){ const x = wx + i * 3 + rnd() * 2, gh = wh * (0.12 + rnd() * 0.22); g.beginPath(); g.moveTo(x, wy + wh * 0.66); g.lineTo(x + (rnd() - 0.5) * 4, wy + wh * 0.66 - gh); g.stroke(); }
  if(env.phase === "night") for(let i = 0; i < 6; i++){ g.fillStyle = "#fff"; g.fillRect(wx + rnd() * ww, wy + rnd() * wh * 0.45, 1.2, 1.2); }
  /* dirty glass + window bars */
  g.fillStyle = "rgba(200,190,160,.12)"; g.fillRect(wx, wy, ww, wh);
  g.fillStyle = "#2a241c"; g.fillRect(wx + ww / 2 - 2, wy, 4, wh);
  for(let i = 1; i < 5; i++) g.fillRect(wx + ww * i / 5 - 1, wy, 2, wh);
  g.strokeStyle = "rgba(255,255,255,.18)"; g.lineWidth = 2; g.beginPath(); g.moveTo(wx + 6, wy + wh - 6); g.lineTo(wx + ww * 0.3, wy + 6); g.stroke();
  /* fuse box */
  const fx = w * 0.7, fyy = h * 0.13, fw = Math.max(34, w * 0.09), fh = h * 0.1;
  g.fillStyle = "#3a3f44"; g.fillRect(fx + fw / 2 - 3, ch, 6, fyy - ch);
  const fg = g.createLinearGradient(fx, 0, fx + fw, 0); fg.addColorStop(0, "#8d969c"); fg.addColorStop(1, "#5d656b");
  g.fillStyle = fg; g.fillRect(fx, fyy, fw, fh);
  g.strokeStyle = "#2a2f33"; g.lineWidth = 1; g.strokeRect(fx + 3, fyy + 3, fw - 6, fh - 6);
  g.fillStyle = "#ffd21a"; g.beginPath(); g.moveTo(fx + fw / 2, fyy + fh * 0.3); g.lineTo(fx + fw / 2 + 7, fyy + fh * 0.62); g.lineTo(fx + fw / 2 - 7, fyy + fh * 0.62); g.closePath(); g.fill();
  g.fillStyle = "#111"; g.fillRect(fx + fw / 2 - 1, fyy + fh * 0.4, 2, 6);
  /* pegboard with the weapons you own */
  const px0 = w * 0.1, px1 = w * 0.9, py0 = h * 0.3, py1 = by - h * 0.04;
  g.fillStyle = "#8a6a44"; g.fillRect(px0, py0, px1 - px0, py1 - py0);
  g.fillStyle = "#6b4f2e"; g.fillRect(px0, py0, px1 - px0, 4); g.fillRect(px0, py1 - 4, px1 - px0, 4);
  g.fillStyle = "rgba(40,25,10,.55)";
  for(let y = py0 + 10; y < py1 - 6; y += 11) for(let x = px0 + 8; x < px1 - 4; x += 11){ g.beginPath(); g.arc(x, y, 1.3, 0, TAU); g.fill(); }
  const own = save.g2.weapon;
  const slots = [];
  for(let i = 1; i <= Math.min(own, 16); i++) slots.push(i);
  const sw = (px1 - px0) / Math.max(8, slots.length + 2);
  slots.forEach((wi, n) => {
    /* hang them around the edges so the device in the middle doesn't hide them all */
    const side = n % 2 === 0 ? -1 : 1, k = Math.floor(n / 2);
    const x = w / 2 + side * (devSize() * 0.75 + k * sw * 0.9);
    if(x < px0 + 10 || x > px1 - 10) return;
    g.save(); g.translate(x, py0 + (py1 - py0) * 0.45); g.rotate(side * 0.08);
    g.fillStyle = "#c9c9c9"; g.fillRect(-1, -(py1 - py0) * 0.42, 2, 6);
    drawWeaponIcon(g, WEAPONS[wi].id, Math.min(sw * 0.42, (py1 - py0) * 0.3), 0);
    g.restore();
  });
  /* shelves on the right with boxes */
  const sx = w * 0.84;
  g.fillStyle = "#5a4630";
  for(let i = 0; i < 3; i++){
    const yy = h * (0.18 + i * 0.13);
    g.fillRect(sx, yy, w - sx, 5);
    for(let b = 0; b < 3; b++){
      const bw2 = 18 + rnd() * 16, bh2 = 14 + rnd() * 16, bx = sx + 4 + b * 22;
      if(bx > w) break;
      g.fillStyle = ["#b8915a", "#a07a48", "#c9a46a"][b % 3]; g.fillRect(bx, yy - bh2, bw2, bh2);
      g.fillStyle = "rgba(0,0,0,.18)"; g.fillRect(bx, yy - bh2, bw2, 3);
      g.fillStyle = "rgba(255,255,255,.5)"; g.fillRect(bx + 3, yy - bh2 * 0.6, bw2 * 0.5, 3);
      g.fillStyle = "#5a4630";
    }
  }
  /* water heater on the left */
  const hx = -w * 0.02, hw = Math.max(40, w * 0.11);
  const hg = g.createLinearGradient(hx, 0, hx + hw, 0); hg.addColorStop(0, "#9aa4aa"); hg.addColorStop(0.45, "#e2e6e8"); hg.addColorStop(1, "#7a8288");
  g.fillStyle = hg; rrect(g, hx, h * 0.24, hw, fy - h * 0.24, 10); g.fill();
  g.fillStyle = "#c9302c"; g.fillRect(hx + hw * 0.3, h * 0.3, hw * 0.4, 6);
  g.fillStyle = "#3a3f44"; g.fillRect(hx + hw * 0.4, h * 0.2, 6, h * 0.05);
  /* floor */
  const flg = g.createLinearGradient(0, fy, 0, h); flg.addColorStop(0, "#6a6862"); flg.addColorStop(1, "#46443f");
  g.fillStyle = flg; g.fillRect(0, fy, w, h - fy);
  g.fillStyle = "rgba(0,0,0,.25)"; g.beginPath(); g.ellipse(w * 0.3, fy + (h - fy) * 0.55, w * 0.08, (h - fy) * 0.2, 0, 0, TAU); g.fill();
  g.fillStyle = "#2a2a28"; g.beginPath(); g.ellipse(w * 0.72, fy + (h - fy) * 0.5, 9, 3.5, 0, 0, TAU); g.fill();
  /* the workbench */
  const bx0 = w * 0.03, bx1 = w * 0.97, bt = Math.max(10, h * 0.03);
  g.fillStyle = "#3a2a1a"; g.fillRect(bx0 + 10, by + bt, 12, fy - by - bt); g.fillRect(bx1 - 22, by + bt, 12, fy - by - bt);
  g.fillStyle = "#4a3624"; g.fillRect(bx0 + 10, by + (fy - by) * 0.62, bx1 - bx0 - 20, 7);
  /* stuff on the bottom shelf: a toolbox + paint cans */
  const sy2 = by + (fy - by) * 0.62;
  g.fillStyle = "#b8302a"; rrect(g, w * 0.16, sy2 - 26, 54, 26, 3); g.fill(); g.fillStyle = "#7a1a16"; g.fillRect(w * 0.16 + 18, sy2 - 31, 18, 5);
  for(let i = 0; i < 3; i++){ g.fillStyle = ["#c9c9c9", "#e0d6a0", "#9ab0c9"][i]; g.fillRect(w * 0.62 + i * 24, sy2 - 22, 20, 22); g.fillStyle = "rgba(0,0,0,.3)"; g.fillRect(w * 0.62 + i * 24, sy2 - 22, 20, 3); }
  const tg = g.createLinearGradient(0, by, 0, by + bt); tg.addColorStop(0, "#b58a5a"); tg.addColorStop(1, "#7a5532");
  g.fillStyle = tg; g.fillRect(bx0, by, bx1 - bx0, bt);
  g.fillStyle = "#5a3d22"; g.fillRect(bx0, by + bt, bx1 - bx0, Math.max(6, h * 0.018));
  g.strokeStyle = "rgba(60,35,15,.35)"; g.lineWidth = 1;
  for(let i = 0; i < 4; i++){ const yy = by + 2 + i * bt / 4; g.beginPath(); g.moveTo(bx0, yy); g.bezierCurveTo(w * 0.3, yy + 1.5, w * 0.6, yy - 1.5, bx1, yy + 1); g.stroke(); }
  /* dents and scratches from all the smashing */
  for(let i = 0; i < 14; i++){ g.strokeStyle = "rgba(40,25,10,.4)"; const x = bx0 + rnd() * (bx1 - bx0); g.beginPath(); g.moveTo(x, by + 2 + rnd() * bt * 0.6); g.lineTo(x + 6 + rnd() * 10, by + 2 + rnd() * bt * 0.6); g.stroke(); }
  /* vise on the left end */
  const vx = bx0 + 8;
  g.fillStyle = "#2f4f6a"; g.fillRect(vx, by - 22, 34, 22); g.fillStyle = "#1f3549"; g.fillRect(vx + 30, by - 18, 18, 14);
  g.fillStyle = "#9aa4aa"; g.fillRect(vx + 46, by - 13, 16, 4); g.fillRect(vx + 58, by - 18, 4, 14);
  /* bulb light on the wall */
  const lx = w / 2, ly = h * 0.15;
  const lg = g.createRadialGradient(lx, ly, 10, lx, ly + h * 0.15, Math.max(w, h) * 0.75);
  lg.addColorStop(0, "rgba(255,226,170,.30)"); lg.addColorStop(0.4, "rgba(255,210,150,.08)"); lg.addColorStop(1, "rgba(0,0,0,.55)");
  g.fillStyle = lg; g.fillRect(0, 0, w, h);
}

/* the bulb on its cord, live (it swings when you hit hard) */
function drawBulb(g, t, swing, on){
  const ax = W / 2, ay = H * 0.065, len = H * 0.075;
  const a = Math.sin(t * 2.4) * swing;
  const bx = ax + Math.sin(a) * len, by = ay + Math.cos(a) * len;
  g.strokeStyle = "#151515"; g.lineWidth = 1.6; g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke();
  g.fillStyle = "#3a3a3a"; g.fillRect(bx - 4, by - 2, 8, 7);
  /* pull chain */
  g.strokeStyle = "#8a8a7a"; g.lineWidth = 1; g.setLineDash([2, 2]); g.beginPath(); g.moveTo(bx + 3, by + 3); g.lineTo(bx + 3 + Math.sin(a * 1.4) * 4, by + 26); g.stroke(); g.setLineDash([]);
  g.fillStyle = on ? "#fff4cc" : "#6b6658";
  g.beginPath(); g.ellipse(bx, by + 12, 7, 9, 0, 0, TAU); g.fill();
  if(on && useGlow()){ glowAdd(g, bx, by + 12, 70, "#ffd890", 0.55); glowAdd(g, bx, by + 12, 16, "#ffffff", 0.8); }
  return [bx, by + 12];
}

/* ---------- weapons ---------- */
/* drawn pointing up, handle at the bottom; s = half length */
function drawWeaponIcon(g, id, s, t){
  g.save();
  g.lineCap = "round"; g.lineJoin = "round";
  const wood = (x0, y0, x1, y1, wd) => { const gr = g.createLinearGradient(x0 - wd, 0, x0 + wd, 0); gr.addColorStop(0, "#7a4f28"); gr.addColorStop(0.5, "#c08a52"); gr.addColorStop(1, "#6b4220"); g.strokeStyle = gr; g.lineWidth = wd; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); };
  const steel = (y0, y1) => { const gr = g.createLinearGradient(0, y0, 0, y1); gr.addColorStop(0, "#e6ecf0"); gr.addColorStop(0.5, "#8d979e"); gr.addColorStop(1, "#4a5258"); return gr; };
  switch(id){
    case "fists": case "punch": {
      g.fillStyle = "#e8b48a"; rrect(g, -s * 0.38, -s * 0.5, s * 0.76, s * 0.66, s * 0.18); g.fill();
      g.strokeStyle = "rgba(120,60,30,.55)"; g.lineWidth = Math.max(1, s * 0.04);
      for(let i = 1; i < 4; i++){ g.beginPath(); g.moveTo(-s * 0.38 + i * s * 0.19, -s * 0.5); g.lineTo(-s * 0.38 + i * s * 0.19, -s * 0.22); g.stroke(); }
      g.fillStyle = "#d89a70"; rrect(g, -s * 0.46, -s * 0.2, s * 0.3, s * 0.24, s * 0.1); g.fill();
      g.fillStyle = "#3a5a8a"; g.fillRect(-s * 0.32, s * 0.16, s * 0.64, s * 0.5);
      break; }
    case "hammer":
      wood(0, s, 0, -s * 0.6, s * 0.14);
      g.fillStyle = steel(-s, -s * 0.6); g.beginPath(); g.moveTo(-s * 0.5, -s * 0.95); g.lineTo(s * 0.15, -s * 0.95); g.lineTo(s * 0.15, -s * 0.62); g.lineTo(-s * 0.5, -s * 0.66); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(s * 0.15, -s * 0.9); g.quadraticCurveTo(s * 0.5, -s * 0.9, s * 0.55, -s * 0.6); g.lineTo(s * 0.4, -s * 0.66); g.quadraticCurveTo(s * 0.35, -s * 0.74, s * 0.15, -s * 0.7); g.fill();
      break;
    case "crowbar": case "bar":
      g.strokeStyle = "#c4302c"; g.lineWidth = s * 0.11;
      g.beginPath(); g.moveTo(s * 0.1, s); g.lineTo(0, -s * 0.6); g.quadraticCurveTo(-s * 0.05, -s * 0.95, -s * 0.38, -s * 0.85); g.stroke();
      g.strokeStyle = "#e8e8e8"; g.lineWidth = s * 0.03; g.beginPath(); g.moveTo(s * 0.06, s * 0.9); g.lineTo(-s * 0.02, -s * 0.5); g.stroke();
      break;
    case "bat": {
      const gr = g.createLinearGradient(-s * 0.2, 0, s * 0.2, 0); gr.addColorStop(0, "#b07a40"); gr.addColorStop(0.5, "#e8c08a"); gr.addColorStop(1, "#8a5a28");
      g.fillStyle = gr; g.beginPath(); g.moveTo(-s * 0.05, s); g.lineTo(s * 0.05, s); g.lineTo(s * 0.17, -s * 0.85); g.quadraticCurveTo(0, -s * 1.05, -s * 0.17, -s * 0.85); g.closePath(); g.fill();
      g.fillStyle = "#1a1a1a"; g.fillRect(-s * 0.07, s * 0.55, s * 0.14, s * 0.4);
      break; }
    case "golf": case "club":
      g.strokeStyle = "#c9d1d6"; g.lineWidth = s * 0.05; g.beginPath(); g.moveTo(0, s); g.lineTo(0, -s * 0.8); g.stroke();
      g.fillStyle = "#1a1a1a"; g.fillRect(-s * 0.05, s * 0.55, s * 0.1, s * 0.45);
      g.fillStyle = steel(-s, -s * 0.7); g.beginPath(); g.ellipse(s * 0.12, -s * 0.86, s * 0.2, s * 0.12, -0.3, 0, TAU); g.fill();
      break;
    case "sledge":
      wood(0, s, 0, -s * 0.62, s * 0.13);
      g.fillStyle = steel(-s, -s * 0.55); rrect(g, -s * 0.42, -s, s * 0.84, s * 0.42, s * 0.05); g.fill();
      g.fillStyle = "rgba(0,0,0,.25)"; g.fillRect(-s * 0.42, -s * 0.66, s * 0.84, s * 0.08);
      break;
    case "pickaxe": case "pick":
      wood(0, s, 0, -s * 0.7, s * 0.12);
      g.fillStyle = steel(-s, -s * 0.6); g.beginPath(); g.moveTo(-s * 0.7, -s * 0.55); g.quadraticCurveTo(0, -s * 1.08, s * 0.7, -s * 0.55); g.quadraticCurveTo(0, -s * 0.85, -s * 0.7, -s * 0.55); g.fill();
      break;
    case "chainsaw": case "saw":
      g.fillStyle = "#e86a1a"; rrect(g, -s * 0.28, s * 0.1, s * 0.56, s * 0.6, s * 0.1); g.fill();
      g.fillStyle = "#1a1a1a"; g.fillRect(-s * 0.18, s * 0.66, s * 0.36, s * 0.3);
      g.fillStyle = "#c9d1d6"; rrect(g, -s * 0.12, -s, s * 0.24, s * 1.12, s * 0.12); g.fill();
      g.fillStyle = "#3a3a3a"; for(let i = 0; i < 9; i++){ const yy = -s * 0.95 + ((i * s * 0.12 + t * s * 3) % (s * 1.05)); g.fillRect(-s * 0.15, yy, s * 0.05, s * 0.05); g.fillRect(s * 0.1, yy, s * 0.05, s * 0.05); }
      break;
    case "jack":
      g.fillStyle = "#e8c41a"; rrect(g, -s * 0.25, -s * 0.5, s * 0.5, s * 0.75, s * 0.08); g.fill();
      g.strokeStyle = "#1a1a1a"; g.lineWidth = s * 0.08; g.beginPath(); g.moveTo(-s * 0.55, -s * 0.62); g.lineTo(s * 0.55, -s * 0.62); g.moveTo(0, -s * 0.62); g.lineTo(0, -s * 0.5); g.stroke();

      break;
    case "grinder":
      g.fillStyle = "#2a6ad6"; rrect(g, -s * 0.16, -s * 0.2, s * 0.32, s * 1.1, s * 0.1); g.fill();
      g.fillStyle = "#1a1a1a"; g.fillRect(-s * 0.14, s * 0.5, s * 0.28, s * 0.4);
      g.save(); g.translate(0, -s * 0.45); g.rotate(t * 30);
      g.fillStyle = "#8a8f94"; g.beginPath(); g.arc(0, 0, s * 0.42, 0, TAU); g.fill();
      g.strokeStyle = "#5a5f64"; g.lineWidth = 1; for(let i = 0; i < 6; i++){ g.rotate(TAU / 6); g.beginPath(); g.moveTo(0, 0); g.lineTo(s * 0.4, 0); g.stroke(); }
      g.restore();
      break;
    case "press":
      g.fillStyle = steel(-s, s); g.fillRect(-s * 0.55, -s, s * 0.14, s * 2); g.fillRect(s * 0.41, -s, s * 0.14, s * 2);
      g.fillStyle = "#c4302c"; g.fillRect(-s * 0.2, -s, s * 0.4, s * 0.8);

    case "wreck":

      { const rg = g.createRadialGradient(-s * 0.15, s * 0.35, 2, 0, s * 0.5, s * 0.5); rg.addColorStop(0, "#6a6a6a"); rg.addColorStop(1, "#141414");
        g.fillStyle = rg; g.beginPath(); g.arc(0, s * 0.5, s * 0.48, 0, TAU); g.fill(); }
