<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071318">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="FLIPSHOT: flip bottles higher and higher, all the way past the edge of the universe.">
<title>FLIPSHOT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#071318; --panel:#0c2029; --card:#0f2a35; --card2:#132f3c; --line:#1d4455;
  --text:#dfeae8; --mute:#7f9aa4; --ink:#071318;
  --accent:#f3b229; --accent2:#ffd979; --accent-d:#a8760f;
  --good:#4fd6a0; --bad:#ff6b5a; --steel:#cfe0ea; --gold:#f3b229;
  --btn:#1b3a47; --btn-d:#0e2630; --btn-live:#1f5a4a;
  --hud-font:"Anton",Impact,"Arial Narrow Bold",sans-serif;
  --ui-font:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
body.g2{
  --bg:#111110; --panel:#1b1a17; --card:#25241f; --card2:#2d2b25; --line:#3b382e;
  --text:#ece6d6; --mute:#9a927c; --ink:#141308;
  --accent:#ffcc1a; --accent2:#ffe27a; --accent-d:#a07c00;
  --btn:#2e2c25; --btn-d:#171611; --btn-live:#4a3f12;
}
body.g3{
  --bg:#06031a; --panel:#110a2b; --card:#1a1140; --card2:#21164f; --line:#33256b;
  --text:#efe8ff; --mute:#9c8fc7; --ink:#12062b;
  --accent:#b98bff; --accent2:#e2ccff; --accent-d:#6a3fc0;
  --btn:#241a52; --btn-d:#130c33; --btn-live:#3c2a86;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--ui-font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none;transition:background .4s}
button{font-family:var(--ui-font);font-weight:700;border:0;border-radius:13px;cursor:pointer;color:var(--ink);
  touch-action:manipulation}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button[disabled]{cursor:default}
svg.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l)}
#main{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}

/* ---------- HUD ---------- */
#hud{display:flex;align-items:center;gap:10px;padding:8px 12px 2px;min-height:44px}
.money{display:flex;align-items:center;gap:6px;min-width:0;flex:1}
.money canvas{width:24px;height:24px;flex:none}
#money-n{font-family:var(--hud-font);font-size:24px;letter-spacing:.5px;line-height:1;color:var(--accent);
  white-space:nowrap}
#money-l{font-size:10px;color:var(--mute);white-space:nowrap}
#shields{display:flex;gap:3px}
#shields i{width:8px;height:12px;background:var(--good);border-radius:2px 2px 4px 4px}
#shields i.spent{background:#2b4a56}
.best{display:flex;align-items:baseline;gap:4px}
.best .n{font-family:var(--hud-font);font-size:20px;line-height:1}
.best .l{font-size:10px;color:var(--mute)}
.iconbtn{background:var(--btn);color:var(--text);width:40px;height:36px;border-radius:11px;display:flex;
  align-items:center;justify-content:center;box-shadow:0 3px 0 var(--btn-d);position:relative}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--btn-d)}
#subhud{display:flex;justify-content:space-between;gap:8px;padding:0 12px 4px;font-size:11px;color:var(--mute);
  white-space:nowrap;overflow:hidden}
#subhud b{color:var(--text);font-weight:700}
#subhud .r{text-align:right;overflow:hidden;text-overflow:ellipsis}

/* ---------- STAGE ---------- */
#stage{flex:1;position:relative;min-height:0;overflow:hidden}
canvas#c{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
#streak{position:absolute;top:2px;left:0;right:0;text-align:center;pointer-events:none}
#streak .v{font-family:var(--hud-font);font-size:54px;line-height:.9;opacity:.13;transition:opacity .2s,color .2s}
#streak.hot .v{opacity:.5;color:var(--accent)}
#streak .c{font-size:10px;letter-spacing:.14em;color:var(--mute);opacity:.8}
#verdict{position:absolute;left:0;right:0;bottom:16%;text-align:center;font-family:var(--hud-font);font-size:28px;
  letter-spacing:1px;opacity:0;pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.45);padding:0 10px}
#verdict.show{animation:pop 1s ease-out}
#verdict small{display:block;font-family:var(--ui-font);font-size:12px;font-weight:700;letter-spacing:.08em;opacity:.85}
@keyframes pop{0%{opacity:0;transform:translateY(14px) scale(.9)}15%{opacity:1;transform:none}72%{opacity:1}
  100%{opacity:0;transform:translateY(-6px)}}
#toasts{position:absolute;top:56px;left:10px;right:10px;display:flex;flex-direction:column;align-items:center;gap:6px;
  pointer-events:none;z-index:3}
.toast{background:rgba(6,16,22,.92);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;
  padding:8px 12px;font-size:12px;max-width:380px;box-shadow:0 6px 18px rgba(0,0,0,.35);pointer-events:auto;
  animation:tin .25s ease-out}
.toast b{display:block;font-family:var(--hud-font);font-weight:400;font-size:14px;letter-spacing:.5px;color:var(--accent)}
.toast.out{animation:tout .3s ease-in forwards}
.toast.tip{border-left-color:var(--good);max-width:330px}
.toast.tip b{color:var(--good)}
body.g2 .toast{background:rgba(20,19,15,.94)} body.g3 .toast{background:rgba(14,8,36,.94)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}
#buff{position:absolute;left:8px;bottom:8px;width:min(52%,230px);display:none;flex-direction:column;gap:5px;
  pointer-events:none;z-index:2}
#buff.on{display:flex}
#buff.pop .bslot:last-child{animation:tin .3s ease-out}
#buff .bslot{background:rgba(7,22,28,.86);border-radius:10px;padding:5px 9px 6px;border-left:3px solid var(--c)}
body.g2 #buff .bslot{background:rgba(24,22,16,.9)} body.g3 #buff .bslot{background:rgba(16,9,40,.9)}
#buff .brow{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--hud-font);font-size:13px;
  letter-spacing:.5px}
#buff .bt{font-family:var(--ui-font);font-size:10px;font-weight:700;color:var(--mute)}
#buff .bd{font-size:9.5px;color:var(--mute);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#buff .btrack{height:3px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:4px;overflow:hidden}
#buff .bbar{height:100%;border-radius:3px;transition:width .1s linear}
.stagebtn{position:absolute;z-index:2;background:rgba(10,24,30,.82);color:var(--text);border:1px solid var(--line);
  font-size:11px;padding:7px 11px;border-radius:999px;display:none;align-items:center;gap:6px}
.stagebtn.on{display:flex}
.stagebtn.live{background:var(--btn-live);border-color:var(--good)}
#auto{top:8px;left:8px}
#replay{bottom:12px;right:10px;background:var(--accent);color:var(--ink);border:0;font-size:12px;padding:8px 13px}
#rivalbtn{top:8px;right:8px;background:#5a1f28;border-color:#ff6b5a;color:#ffd7d0}
#eventbadge{position:absolute;top:44px;left:8px;z-index:2;font-size:10px;font-weight:700;letter-spacing:.06em;
  background:rgba(0,0,0,.5);border:1px solid var(--accent);color:var(--accent);padding:4px 9px;border-radius:999px;
  display:none;pointer-events:none}
#eventbadge.on{display:block}
#fps{position:absolute;right:6px;bottom:4px;font:700 10px/1 monospace;color:#9fe8b0;background:rgba(0,0,0,.5);
  padding:3px 5px;border-radius:5px;display:none;pointer-events:none;z-index:4}
#fps.on{display:block}
#duel{position:absolute;left:8px;right:8px;top:62px;display:none;justify-content:space-between;gap:8px;
  pointer-events:none;z-index:2}
#duel.on{display:flex} body.g2 #duel,body.g3 #duel{display:none}
body.g2 #replay,body.g3 #replay{display:none}
body.g3 #streak{display:none}
#hud,#subhud,#foot,#streak,#buff,#eventbadge,#toasts,.stagebtn,#duel{transition:opacity .9s}
body.cinema #hud,body.cinema #subhud,body.cinema #foot,body.cinema #streak,body.cinema #buff,body.cinema #eventbadge,
body.cinema #toasts,body.cinema .stagebtn,body.cinema #duel{opacity:0!important;pointer-events:none!important}
body.cinema{background:#000}
#duel .side{flex:1;background:rgba(5,14,18,.82);border:1px solid var(--line);border-radius:12px;padding:6px 8px;
  display:flex;gap:7px;align-items:center;min-width:0}
#duel .side.them{border-color:#ff6b5a}
#duel canvas{width:34px;height:34px;flex:none;border-radius:8px;background:rgba(255,255,255,.05)}
#duel .nm{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#duel .pips{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
#duel .pips i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.12)}
#duel .pips i.f{background:var(--good)}
#duel .them .pips i.f{background:var(--bad)}

/* ---------- FOOTER ---------- */
#foot{padding:6px 10px 10px;display:flex;flex-direction:column;gap:7px}
.footset{display:none;flex-direction:column;gap:7px}
body.g1 #foot-g1, body.g2 #foot-g2, body.g3 #foot-g3{display:flex}
.big{width:100%;padding:15px 0;font-size:18px;letter-spacing:.12em;
  background:linear-gradient(180deg,var(--accent2),var(--accent));box-shadow:0 6px 0 var(--accent-d);
  transition:transform .07s,box-shadow .07s,opacity .15s;font-family:var(--ui-font)}
.big:active{transform:translateY(5px);box-shadow:0 1px 0 var(--accent-d)}
.big[disabled]{opacity:.45}
.big small{display:block;font-size:10px;letter-spacing:.06em;font-weight:500;margin-top:2px;opacity:.75}
body.g2 .big{background:repeating-linear-gradient(-45deg,#ffcc1a 0 14px,#f0b800 14px 28px)}
.row{display:flex;gap:6px}
.row button{flex:1;min-width:0;padding:8px 0 7px;font-size:11px;background:var(--btn);color:var(--text);
  box-shadow:0 4px 0 var(--btn-d);position:relative;display:flex;flex-direction:column;align-items:center;gap:3px}
.row button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-d)}
.row button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 2px}
.dot{position:absolute;top:5px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--good);display:none}
.dot.on{display:block}

/* ---------- SHEET (menus) ---------- */
.modal{position:fixed;inset:0;background:rgba(3,9,12,.78);display:none;align-items:flex-end;justify-content:center;
  z-index:60}
.modal.open{display:flex}
.sheet{width:100%;max-width:640px;max-height:88%;background:var(--panel);border-radius:22px 22px 0 0;
  padding:14px 14px calc(12px + var(--safe-b));display:flex;flex-direction:column;animation:sheetin .2s ease-out;
  border-top:1px solid var(--line)}
@keyframes sheetin{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head h2{font-family:var(--hud-font);font-weight:400;font-size:22px;margin:0 0 2px;letter-spacing:.6px}
.sheet-head p.sub{margin:0 0 10px;font-size:12px;color:var(--mute)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:var(--btn);color:var(--mute);font-size:11px;padding:7px 11px;border-radius:999px;flex:none}
.tabs button.on{background:var(--accent);color:var(--ink)}
.tabs button.locked{opacity:.5}
.scroll{overflow-y:auto;padding:2px 2px 6px;-webkit-overflow-scrolling:touch;min-height:0;flex:1}
.closer{margin-top:10px;padding:13px;background:var(--btn);color:var(--text);font-size:14px;flex:none}
.sec{display:flex;align-items:center;gap:8px;margin:14px 0 8px}
.sec:first-child{margin-top:2px}
.sec .tl{font-family:var(--hud-font);font-size:14px;letter-spacing:.6px}
.sec .bar{flex:1;height:2px;background:var(--line)}
.sec .ct{font-size:11px;color:var(--mute)}
.sec.lock .tl{color:var(--mute)}
.note{font-size:11.5px;color:var(--mute);background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px;
  line-height:1.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.card{background:var(--card);border:2px solid transparent;border-radius:14px;padding:6px 5px 8px;text-align:center;
  position:relative;min-width:0}
.card.owned{border-color:var(--line)}
.card.on{border-color:var(--accent)}
.card.locked{opacity:.55}
.card canvas{width:64px;height:84px;margin:0 auto;display:block;cursor:pointer}
.card .nm{font-size:10.5px;font-weight:700;margin-top:3px;line-height:1.2;min-height:25px;overflow:hidden}
.card .px{font-size:10.5px;color:var(--accent)}
.card .px.have{color:var(--mute)}
.card .bn{font-size:9.5px;color:var(--mute);margin-top:2px}
.card .bn .gain{color:var(--good);font-weight:700}
.card button{margin-top:6px;width:100%;padding:6px 0;font-size:10.5px;border-radius:9px;background:var(--accent)}
.card button.sel{background:var(--line);color:var(--text)}
.card button[disabled]{background:var(--card2);color:var(--mute)}
.badge{position:absolute;top:5px;left:5px;font-size:8px;font-weight:700;letter-spacing:.06em;padding:2px 5px;
  border-radius:6px;text-transform:uppercase;color:#081014;pointer-events:none}
.rt-common{background:#9aa7ad}.rt-uncommon{background:#5fd38a}.rt-rare{background:#4aa8ff}.rt-epic{background:#b07bff}
.rt-legendary{background:#ffc42e}.rt-mythic{background:#ff4d5e;color:#fff}.rt-glitched{background:linear-gradient(90deg,#ff4df0,#4dfff3,#fff94d);}
.rt-visitor{background:#cfe0ea}.rt-secret{background:#111;color:#39ff14;border:1px solid #39ff14}.rt-legend{background:#fff;}
.rt-rival{background:#ff8f6a}.rt-holiday{background:#ff9d3a}.rt-veteran{background:#d7b46a}.rt-reborn{background:#f6e7ff}
.row-item{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:13px;padding:10px 12px;
  margin-bottom:8px;border:2px solid transparent;min-width:0}
.row-item.on{border-color:var(--accent)}
.row-item.gone{opacity:.5}
.row-item canvas{flex:none;border-radius:8px}
.row-item .info{flex:1;min-width:0}
.row-item .t{font-size:13px;font-weight:700}
.row-item .d{font-size:11px;color:var(--mute);margin-top:2px;line-height:1.35}
.row-item .d b{color:var(--text)}
.row-item .nx{font-size:11px;color:var(--good);margin-top:2px}
.row-item button{padding:9px 11px;font-size:11px;background:var(--accent);min-width:78px;flex:none}
.row-item button.sel{background:var(--line);color:var(--text)}
.row-item button[disabled]{background:var(--card2);color:var(--mute)}
.pips{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
.pips i{width:12px;height:5px;border-radius:3px;background:var(--line)}
.pips i.f{background:var(--accent)}
.track{height:6px;background:var(--line);border-radius:4px;margin-top:7px;overflow:hidden}
.track i{display:block;height:100%;background:var(--good);border-radius:4px}
.old{text-decoration:line-through;color:var(--mute);margin-right:6px}
.st{display:flex;justify-content:space-between;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);font-size:12.5px}
.st span:first-child{color:var(--mute)}
.st span:last-child{font-weight:700;text-align:right}
.set{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:7px}
.set .info{flex:1;min-width:0}
.set .t{font-size:13px;font-weight:700}
.set .d{font-size:11px;color:var(--mute);margin-top:2px}
.set button{padding:8px 12px;font-size:11px;background:var(--accent);min-width:70px}
.set button.off{background:var(--btn);color:var(--text)}
.set select{background:var(--btn);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:7px;
  font-family:var(--ui-font);font-size:12px;max-width:170px}
.set input[type=range]{width:120px;accent-color:var(--accent)}
.set input[type=text]{background:var(--btn);color:var(--text);border:1px solid var(--line);border-radius:9px;
  padding:8px;font-family:var(--ui-font);font-size:13px;width:150px;-webkit-user-select:text;user-select:text}
.keyb{font:700 11px/1 monospace;background:var(--btn);color:var(--text);padding:8px 10px;border-radius:8px;min-width:64px}
.keyb.wait{background:var(--accent);color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:10px}
.cal div{background:var(--card);border-radius:10px;padding:7px 2px;text-align:center;font-size:10px;color:var(--mute);
  border:2px solid transparent}
.cal div b{display:block;font-size:12px;color:var(--text)}
.cal div.got{opacity:.5}
.cal div.today{border-color:var(--accent);color:var(--text)}
.ach{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:12px;padding:9px 11px;margin-bottom:7px}
.ach canvas{width:38px;height:38px;flex:none}
.ach .info{flex:1;min-width:0}
.ach .t{font-size:12.5px;font-weight:700}
.ach .d{font-size:10.5px;color:var(--mute);margin-top:1px}
.ach .rw{font-size:10.5px;color:var(--accent);font-weight:700;flex:none;text-align:right}
.ach.done{border:1px solid var(--good)}
.ach.hidden{opacity:.55}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bk{background:var(--card);border-radius:13px;padding:8px;display:flex;gap:8px;align-items:center;min-width:0}
.bk canvas{width:46px;height:56px;flex:none}
.bk .t{font-size:11.5px;font-weight:700}
.bk .d{font-size:10px;color:var(--mute);margin-top:2px;line-height:1.3}
.bk.no .t{color:var(--mute)}
.lb{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:12px}
.lb td{padding:6px 4px;border-bottom:1px solid var(--line)}
.lb td:first-child{color:var(--mute);width:28px}
.lb td:last-child{text-align:right;font-weight:700}
.lb tr.me td{color:var(--accent)}

/* ---------- DIALOG ---------- */
#dlg{position:fixed;inset:0;background:rgba(2,6,9,.82);display:none;align-items:center;justify-content:center;z-index:70;
  padding:20px}
#dlg.open{display:flex}
.dcard{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;
  text-align:center;animation:sheetin .2s ease-out;max-height:90%;overflow-y:auto}
.dcard h3{font-family:var(--hud-font);font-weight:400;font-size:24px;letter-spacing:.8px;margin:4px 0 6px}
.dcard p{font-size:13px;color:var(--mute);margin:0 0 12px;line-height:1.45}
.dcard canvas{display:block;margin:0 auto 8px}
.dcard .btns{display:flex;gap:8px;margin-top:8px}
.dcard .btns button{flex:1;padding:12px 0;font-size:13px;background:var(--accent)}
.dcard .btns button.alt{background:var(--btn);color:var(--text)}
.dcard input[type=text]{width:100%;background:var(--btn);color:var(--text);border:1px solid var(--line);border-radius:10px;
  padding:10px;font-family:var(--ui-font);font-size:15px;text-align:center;-webkit-user-select:text;user-select:text}
.dcard .earn{display:flex;justify-content:space-between;background:var(--card);border-radius:10px;padding:9px 12px;
  margin-bottom:6px;font-size:13px}
.dcard .earn b{color:var(--accent)}
#dlg.spooky{background:rgba(0,0,0,.94)}

/* ---------- INSPECT ---------- */
#inspect{position:fixed;inset:0;background:rgba(2,7,10,.94);z-index:65;display:none;flex-direction:column;

#inspect .tier{font-size:12px;color:var(--mute);margin-top:2px;text-align:center}
#inspect .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px;width:100%;max-width:360px}
#inspect .stats div{background:var(--card);border-radius:10px;padding:7px 9px;font-size:11px;color:var(--mute)}
#inspect .stats b{display:block;color:var(--text);font-size:12.5px;margin-top:1px}
#inspect button{margin-top:14px;padding:12px 40px;background:var(--btn);color:var(--text);font-size:14px}

/* ---------- TITLE ---------- */
#title{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  background:#040b0f;transition:opacity .6s ease, transform .9s cubic-bezier(.6,0,.3,1)}
#title canvas{position:absolute;inset:0;width:100%;height:100%}
#title .tbtns{position:relative;display:flex;flex-direction:column;gap:10px;width:min(320px,80vw);
  margin-bottom:calc(9vh + var(--safe-b))}
#title .tbtns button{padding:15px 0;font-size:16px;letter-spacing:.14em;background:var(--btn);color:var(--text);
  box-shadow:0 5px 0 var(--btn-d)}
#title .tbtns button.play{background:linear-gradient(180deg,#ffd979,#f3b229);color:#071318;box-shadow:0 6px 0 #a8760f;
  font-size:19px}
#title .tbtns button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--btn-d)}
#title .ver{position:absolute;bottom:calc(8px + var(--safe-b));right:12px;font-size:10px;color:#4c6b77}
#title.gone{opacity:0;transform:scale(1.08);pointer-events:none}

/* ---------- LANDSCAPE ---------- */
@media (orientation:landscape) and (max-height:560px){

  #inspect .ins-info{width:min(48vw,340px)}
  #inspect .stats{margin-top:8px}
  #inspect button{margin-top:10px;padding:10px 36px}
}

}

  let m;
  if(c.charAt(0) === "#"){
    let s = c.slice(1);
    if(s.length === 3) s = s[0] + s[0] + s[1] + s[1] + s[2] + s[2];
    const n = parseInt(s.slice(0, 6), 16);
    r = [(n >> 16) & 255, (n >> 8) & 255, n & 255, s.length === 8 ? parseInt(s.slice(6, 8), 16) / 255 : 1];
  }else if((m = c.match(/^rgba?\(([^)]+)\)/))){
    const p = m[1].split(",").map(x => parseFloat(x));
    r = [p[0], p[1], p[2], p.length > 3 ? p[3] : 1];
  }else if((m = c.match(/^hsla?\(([^)]+)\)/))){
    const p = m[1].split(",").map(x => parseFloat(x));
    const rgb = hsl2rgb(p[0], p[1], p[2]);
    r = [rgb[0], rgb[1], rgb[2], p.length > 3 ? p[3] : 1];

}
function rgba(arr, a){ return "rgba(" + (arr[0] | 0) + "," + (arr[1] | 0) + "," + (arr[2] | 0) + "," + (a === undefined ? arr[3] : a) + ")"; }
function withAlpha(c, a){ return rgba(parseColor(c || "#ffffff"), a); }
function mixc(c1, c2, t, a){
  const x = parseColor(c1), y = parseColor(c2);
  return "rgba(" + (lerp(x[0], y[0], t) | 0) + "," + (lerp(x[1], y[1], t) | 0) + "," + (lerp(x[2], y[2], t) | 0) + "," +
    (a === undefined ? lerp(x[3], y[3], t) : a) + ")";
}
function lighten(c, t, a){ return mixc(c, "#ffffff", t, a); }
function darken(c, t, a){ return mixc(c, "#000000", t, a); }

/* ================= TIME ================= */
function dayKey(d){ d = d || new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
function dayKeyOffset(off){ const d = new Date(); d.setDate(d.getDate() + off); return dayKey(d); }
function weekKey(d){
  d = d ? new Date(d.getTime()) : new Date();
  d.setHours(0, 0, 0, 0);
  const day = (d.getDay() + 6) % 7; /* Monday = 0 */
  d.setDate(d.getDate() - day);
  return "w" + dayKey(d);
}
function msToMidnight(){
  const n = new Date(), m = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1, 0, 0, 0);
  return m - n;
}
function msToWeekEnd(){
  const n = new Date(), day = (n.getDay() + 6) % 7;
  const m = new Date(n.getFullYear(), n.getMonth(), n.getDate() + (7 - day), 0, 0, 0);
  return m - n;
}
/* 0 = new moon, 0.5 = full moon */
function moonPhase(d){
  d = d || new Date();
  const ref = Date.UTC(2000, 0, 6, 18, 14) / 86400000, now = d.getTime() / 86400000;
  const p = ((now - ref) / 29.530588853) % 1;
  return p < 0 ? p + 1 : p;
}
function isWeekend(d){ d = d || new Date(); const w = d.getDay(); return w === 0 || w === 6; }
function holidayNow(d){
  d = d || new Date();
  const m = d.getMonth() + 1, day = d.getDate();
  if(m === 10 && day >= 15) return "halloween";
  if(m === 11 && day === 1) return "halloween";
  if(m === 12 && day === 31) return "newyear";
  if(m === 1 && day <= 2) return "newyear";
  if(m === 12) return "christmas";
  if(m === 2 && day >= 12 && day <= 15) return "valentine";
  return null;
}

const TIER_COST = [55, 210, 820, 3100, 12000, 46000, 180000, 690000, 2.7e6, 1e7, 3.9e7, 1.5e8, 5.8e8, 2.3e9, 8.7e9];

const BOTTLES = [];
const BOTTLE_BY_ID = new Map();
function addBottle(b){ BOTTLES.push(b); BOTTLE_BY_ID.set(b.id, b); return b; }
function byId(id){ return BOTTLE_BY_ID.get(id) || null; }

const SPECIAL_BRAND = { visitor:"RARE FIND", secret:"? ? ?", holiday:"SEASONAL", rival:"RIVAL CUP", veteran:"VETERAN", reborn:"REBORN" };
const FIXED_IDS = { "0-0":"classic", "0-5":"sport", "1-0":"cola", "2-0":"neon", "3-0":"lava", "4-0":"steel", "6-0":"galaxy", "8-0":"gold" };

function finishBottle(id, d, tier, idx, kind){
  const T = TIERS[Math.min(tier, NTIERS - 1)];
  const o = d.o;
  const mat = o.mat || (tier < NTIERS ? T.mat : "glass");
  const liq0 = d.liq[0], liq1 = d.liq[1];
  const glow = o.glow || null;
  const seed = strSeed(id);
  const b = {
    id:id, name:d.name, kind:kind, tier:tier, idx:idx,
    htier:tier, shape:SHAPES[d.shape] || SHAPES.classic, cap:d.cap, capCol:d.capCol,
    mat:mat, metal:o.metal || null,
    tint: o.glass || (mat === "plastic" ? withAlpha(lighten(liq0, .7), .13) :
                      mat === "metal" ? withAlpha(o.metal || "#b9c6cf", .9) :
                      mat === "clay" ? "rgba(150,95,60,.92)" :
                      o.voidglass ? "rgba(4,4,10,.72)" :
                      mat === "energy" ? withAlpha(liq1, .35) :
                      withAlpha(lighten(liq0, .55), .18)),
    rim: o.voidglass ? withAlpha(glow || "#ffffff", .9) : withAlpha(lighten(liq0, .8), mat === "plastic" ? .5 : .75),
    layers: o.layers || null,
    liq:[liq0, liq1], fill:d.fill,
    lava:!!o.lava, glow:glow, pulse:!!o.pulse,
    contents:d.contents, pebbles:!!o.pebbles,
    shimmer:o.shimmer || (tier >= 9 && tier !== 12 ? 1 : 0),
    prism:o.prism || 0, frosted:!!o.frosted, chrome:!!o.chrome, voidglass:!!o.voidglass,
    halo:!!o.halo, rainbowRim:!!o.rainbowRim, window:!!o.window,
    wear:o.wear || {},
    label:{ brand:kind === "std" ? T.brand : (SPECIAL_BRAND[kind] || T.brand), logo:T.logo, text:d.name.toUpperCase() },
    seed:seed,
    payMul:o.payMul || 0, legend:0
  };
  return b;
}

for(let t = 0; t < NTIERS; t++){
  for(let i = 0; i < 10; i++){
    const id = FIXED_IDS[t + "-" + i] || ("b" + t + "_" + i);
    const b = finishBottle(id, BDEF[t][i], t, i, "std");
    b.cost = (t === 0 && i === 0) ? 0 : Math.round(TIER_COST[t] * (1 + i * 0.16));
    b.rank = t * 10 + i;
    b.rarity = TIERS[t].rarity;
    addBottle(b);
  }
}

/* ---- chapter 2 math (pure, so the economy sim can use the exact same numbers) ---- */
function crateOdds(ci, luckLv, boost){
  const o = CRATES[ci].odds.slice();
  const L = 1 + (luckLv || 0) * 0.18;
  for(let r = 2; r < o.length; r++) o[r] *= Math.pow(L, r - 1);
  if(boost) for(let r = 0; r < boost && r < o.length - 1; r++) o[r] = 0;
  let s = 0; for(const x of o) s += x;
  return o.map(x => x / s);
}
function crateDevices(ci){ const c = CRATES[ci]; return DEVICES.filter(d => d.lv >= c.lv[0] && d.lv <= c.lv[1]); }
function devHp(d, ci, ri){ return d.hp * CRATES[ci].hpMul * RARITIES[ri].hp; }
function devCash(d, ci, ri){ return d.cash * CRATES[ci].cashMul * RARITIES[ri].cash; }
function cashMul2(l){ return 1 + l * 0.45; }
function critChance2(w, l, storm){ return Math.min(0.95, w.crit + l * 0.025 + (storm ? 0.4 : 0)); }
function critMul2(w, l, heavy){ return w.cm * (1 + l * 0.4) * (1 + (heavy || 0) * 0.25); }
function armRate(l){ return l * 0.8; }
function armFrac(l){ return l ? 0.35 + l * 0.05 : 0; }

TARGETS.forEach((T, i) => {

  T.dm = T.last ? 0 : Math.round(T_HP0 * Math.pow(T_HPG, i) * T_DM0 * Math.pow(T_DMG, i) * (T.boss ? 2 : 1));
});

function luckMul(l){ return Math.pow(500 / 60, l / 6); }    /* 1 in 500 .. 1 in 60 */
function glassChance(l){ return 0.06 + l * 0.03; }
function buffDurLv(l){ return 30 + l * 6; }
function eyeMul(l){ return 1 + l * 0.12; }
function lootMul(l){ return 1 + l * 0.5; }
function magnetRange(l){ return l ? 90 + l * 45 : 0; }

/* copy known keys from a loaded object onto a fresh default, type-checked */
function mergeInto(dst, src){
  if(!src || typeof src !== "object") return dst;
  for(const k in dst){
    if(!Object.prototype.hasOwnProperty.call(src, k)) continue;
    const d = dst[k], s = src[k];
    if(d === null || d === undefined){ dst[k] = s; continue; }
    if(Array.isArray(d)){ if(Array.isArray(s)) dst[k] = s.slice(); continue; }
    if(typeof d === "object"){
      if(s && typeof s === "object" && !Array.isArray(s)){
        /* open maps (stats, owned flags, trophies...) keep unknown keys, but only numbers/bools/strings */
        if(Object.keys(d).length === 0){
          const o = {};
          for(const kk in s){ const vv = s[kk]; if(typeof vv === "number" || typeof vv === "boolean" || typeof vv === "string") o[kk] = vv; }
          dst[k] = o;
        }else mergeInto(d, s);
      }
      continue;
    }
    if(typeof d === "number"){ if(typeof s === "number" && isFinite(s)) dst[k] = s; continue; }
    if(typeof d === typeof s) dst[k] = s;
  }
  return dst;
}

function sanitize(sv){
  const g1 = sv.g1;
  g1.owned = g1.owned.filter((id, i, a) => typeof id === "string" && byId(id) && a.indexOf(id) === i);
  if(!g1.owned.includes("classic")) g1.owned.unshift("classic");
  for(const id of g1.owned) sv.meta.found[id] = 1;
  for(const id in g1.dormant) if(!g1.owned.includes(id) || !byId(id) || !byId(id).legend) delete g1.dormant[id];
  if(!byId(g1.equipped) || !g1.owned.includes(g1.equipped)) g1.equipped = "classic";
  for(const u of UPG1) g1.up[u.id] = clamp(Math.floor(g1.up[u.id] || 0), 0, u.max);
  g1.shields = clamp(Math.floor(g1.shields), 0, g1.up.keeper);
  g1.places = g1.places.filter((id, i, a) => placeById(id) && a.indexOf(id) === i);
  if(!g1.places.includes("kitchen")) g1.places.unshift("kitchen");
  if(!g1.places.includes(g1.place)) g1.place = "kitchen";
  g1.trails = g1.trails.filter(id => TRAILS.some(t => t.id === id)); if(!g1.trails.includes("streak")) g1.trails.unshift("streak");
  g1.landfxs = g1.landfxs.filter(id => LANDFX.some(t => t.id === id)); if(!g1.landfxs.includes("puff")) g1.landfxs.unshift("puff");
  g1.tables = g1.tables.filter(id => TABLES.some(t => t.id === id)); if(!g1.tables.includes("place")) g1.tables.unshift("place");
  if(!g1.trails.includes(g1.trail)) g1.trail = "streak";
  if(!g1.landfxs.includes(g1.landfx)) g1.landfx = "puff";
  if(!g1.tables.includes(g1.table)) g1.table = "place";
  g1.coins = Math.max(0, g1.coins); g1.best = Math.max(0, Math.floor(g1.best));
  g1.streak = Math.max(0, Math.floor(g1.streak));
  g1.maxH = clamp(Math.floor(g1.maxH), 0, DEST.length - 1);
  const g2 = sv.g2;
  g2.cash = Math.max(0, g2.cash);
  g2.weapon = clamp(Math.floor(g2.weapon), 0, WEAPONS.length - 1);
  if(WEAPONS[g2.weapon].forged && !g2.forged) g2.weapon = WEAPONS.length - 2;
  for(const u of UPG2) g2.up[u.id] = clamp(Math.floor(g2.up[u.id] || 0), 0, u.max);
  g2.gems = g2.gems.filter((id, i, a) => GEMS.some(gm => gm.id === id) && a.indexOf(id) === i);
  g2.crate = clamp(Math.floor(g2.crate), 0, CRATES.length - 1);
  if(g2.device && (typeof g2.device !== "object" || !devById(g2.device.id))) g2.device = null;
  if(g2.pending && (typeof g2.pending !== "object" || !CRATES[g2.pending.ci | 0])) g2.pending = null;
  const g3 = sv.g3;
  g3.dm = Math.max(0, g3.dm);
  for(const u of UPG3) g3.up[u.id] = clamp(Math.floor(g3.up[u.id] || 0), 0, u.max);
  g3.unlocked = clamp(Math.floor(g3.unlocked), 0, TARGETS.length - 1);
  g3.target = clamp(Math.floor(g3.target), 0, g3.unlocked);
  if(![1, 2, 3].includes(sv.chapter)) sv.chapter = 1;
  if(sv.chapter === 2 && !sv.reached[2]) sv.reached[2] = true;
  if(sv.chapter === 3){ sv.reached[2] = true; sv.reached[3] = true; }
  const st = sv.settings;
  if(!["auto", "low", "medium", "high", "ultra"].includes(st.gfx)) st.gfx = "auto";
  st.shake = clamp(st.shake, 0, 100); st.music = clamp(st.music, 0, 100); st.sfx = clamp(st.sfx, 0, 100); st.voice = clamp(st.voice, 0, 100);
  return sv;
}

function loadSave(){
  let raw = null;
  try{ raw = localStorage.getItem(SAVE_KEY); }catch(e){ return { fresh:true, veteran:false }; }
  if(raw){
    try{
      const p = JSON.parse(raw);
      if(p && typeof p === "object" && p.g1){ save = sanitize(mergeInto(freshSave(), p)); return { fresh:false }; }
    }catch(e){}
    /* main save is broken: try the newest backup */
    const b = newestBackup();
    if(b){ save = sanitize(mergeInto(freshSave(), b)); return { fresh:false, restored:true }; }
  }
  /* no v4 save. an older FLIPSHOT save means a veteran */
  let veteran = false;
  try{ for(const k of OLD_KEYS){ if(localStorage.getItem(k)){ veteran = true; break; } } }catch(e){}
  return { fresh:true, veteran:veteran };
}
function newestBackup(){
  let best = null, bestT = -1;
  for(const k of BACKUP_KEYS){
    try{
      const r = localStorage.getItem(k); if(!r) continue;
      const p = JSON.parse(r);
      if(p && p.g1 && (p._t || 0) > bestT){ best = p; bestT = p._t || 0; }
    }catch(e){}
  }
  return best;
}
function listBackups(){
  const out = [];
  BACKUP_KEYS.forEach((k, i) => {
    try{
      const r = localStorage.getItem(k); if(!r) return;
      const p = JSON.parse(r);
      if(p && p.g1) out.push({ slot:i, t:p._t || 0, chapter:p.chapter || 1, rebirths:(p.meta && p.meta.rebirths) || 0,
        best:p.g1.best || 0, owned:(p.g1.owned || []).length });
    }catch(e){}
  });
  return out.sort((a, b) => b.t - a.t);
}

function persistNow(){
  if(saveBlocked) return;
  saveDirty = false;
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){}
}
function persist(){ saveDirty = true; }
function backupNow(){
  if(saveBlocked) return;
  try{
    const copy = JSON.parse(JSON.stringify(save)); copy._t = Date.now();
    /* rotate: always overwrite the oldest (or an empty) slot */
    let oldest = 0, oldestT = Infinity;
    BACKUP_KEYS.forEach((k, i) => {
      let t = 0;
      try{ const r = localStorage.getItem(k); if(r){ const p = JSON.parse(r); t = (p && p._t) || 0; } }catch(e){}
      if(t < oldestT){ oldestT = t; oldest = i; }
    });
    localStorage.setItem(BACKUP_KEYS[oldest], JSON.stringify(copy));
    lastBackup = Date.now();
  }catch(e){}
}
function restoreBackup(slot){
  try{
    const r = localStorage.getItem(BACKUP_KEYS[slot]); if(!r) return false;
    const p = JSON.parse(r); if(!p || !p.g1) return false;
    saveBlocked = true;
    delete p._t;
    localStorage.setItem(SAVE_KEY, JSON.stringify(p));
    location.reload();
    return true;
  }catch(e){ saveBlocked = false; return false; }
}
function eraseAll(){
  saveBlocked = true;
  try{
    localStorage.removeItem(SAVE_KEY);
    for(const k of BACKUP_KEYS) localStorage.removeItem(k);
    for(const k of OLD_KEYS) localStorage.removeItem(k);
  }catch(e){}
  location.reload();
}
function exportSave(){
  const data = JSON.stringify({ game:"FLIPSHOT", v:SAVE_VERSION, t:Date.now(), check:cyrb53(JSON.stringify(save)), save:save });
  const blob = new Blob([data], { type:"application/json" });
  const a = document.createElement("a");
  const d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = "flipshot-save-" + d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") + ".json";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function importSaveText(txt){
  let p;
  try{ p = JSON.parse(txt); }catch(e){ return "That file is not a FLIPSHOT save."; }
  if(!p || p.game !== "FLIPSHOT" || !p.save || typeof p.save !== "object" || !p.save.g1) return "That file is not a FLIPSHOT save.";
  if(cyrb53(JSON.stringify(p.save)) !== p.check) return "That save file was changed or damaged.";
  backupNow();
  saveBlocked = true;
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(p.save)); }catch(e){ saveBlocked = false; return "Could not write the save."; }
  location.reload();
  return null;
}

/* local leaderboard lives in its own key so erasing a save keeps it */
let board = { streak:[], height:[], payout:[] };
function loadBoard(){
  try{
    const r = localStorage.getItem(BOARD_KEY);
    if(r){ const p = JSON.parse(r); if(p && typeof p === "object") for(const k in board) if(Array.isArray(p[k])) board[k] = p[k].filter(e => e && typeof e.n === "string" && typeof e.v === "number").slice(0, 10); }
  }catch(e){}
}
function saveBoard(){ try{ localStorage.setItem(BOARD_KEY, JSON.stringify(board)); }catch(e){} }
function boardQualifies(kind, v){ const b = board[kind]; return v > 0 && (b.length < 10 || v > b[b.length - 1].v); }
function boardAdd(kind, name, v){
  const b = board[kind];
  b.push({ n:String(name).slice(0, 14) || "Player", v:v, t:Date.now() });
  b.sort((x, y) => y.v - x.v);
  board[kind] = b.slice(0, 10);
  saveBoard();
}


/* =====================================================================
   AUDIO: everything is synthesized live, no sound files
   ===================================================================== */
const AU = { ctx:null, master:null, music:null, musicLP:null, sfx:null, amb:null, rev:null, revIn:null,
  noise:null, started:false, hidden:false };

function audioInit(){
  if(AU.ctx) { if(AU.ctx.state === "suspended" && !AU.hidden) AU.ctx.resume().catch(() => {}); return AU.ctx; }
  let c;
  try{ c = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  AU.ctx = c;
  AU.master = c.createGain(); AU.master.gain.value = 0.9;
  const comp = c.createDynamicsCompressor();
  comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
  AU.master.connect(comp); comp.connect(c.destination);
  AU.music = c.createGain();
  AU.musicLP = c.createBiquadFilter(); AU.musicLP.type = "lowpass"; AU.musicLP.frequency.value = 18000; AU.musicLP.Q.value = 0.7;
  AU.music.connect(AU.musicLP); AU.musicLP.connect(AU.master);
  AU.sfx = c.createGain(); AU.sfx.connect(AU.master);
  AU.amb = c.createGain(); AU.amb.connect(AU.master);
  /* a small generated reverb so things sound like they are in a room */
  AU.rev = c.createConvolver();
  const len = Math.floor(c.sampleRate * 2.2), ir = c.createBuffer(2, len, c.sampleRate);
  for(let ch = 0; ch < 2; ch++){ const d = ir.getChannelData(ch); for(let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
  AU.rev.buffer = ir;
  AU.revIn = c.createGain(); AU.revIn.gain.value = 0.22;
  AU.revIn.connect(AU.rev); AU.rev.connect(AU.master);
  /* one shared white noise buffer, played from random offsets */
  const nl = c.sampleRate * 2, nb = c.createBuffer(1, nl, c.sampleRate), nd = nb.getChannelData(0);
  for(let i = 0; i < nl; i++) nd[i] = Math.random() * 2 - 1;
  AU.noise = nb;
  applyVolumes();
  if(c.state === "suspended") c.resume().catch(() => {});
  return c;
}
function vol01(v){ v = clamp(v / 100, 0, 1); return v * v; }
function applyVolumes(){
  if(!AU.ctx) return;
  const st = save.settings, t = AU.ctx.currentTime;
  AU.music.gain.setTargetAtTime(vol01(st.music) * 0.55, t, 0.05);
  AU.sfx.gain.setTargetAtTime(vol01(st.sfx), t, 0.05);
  AU.amb.gain.setTargetAtTime(vol01(st.sfx) * 0.5, t, 0.1);
  if(mp3.el) mp3.el.volume = 1;
}
function sfxOn(){ return AU.ctx && save.settings.sfx > 0 && !AU.hidden; }

function env(g, t, a, peak, d, sustain){
  g.gain.cancelScheduledValues(t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0001, sustain || 0.0001), t + a + d);
}
function tone(freq, dur, type, vol, slideTo, delay, dest){
  if(!sfxOn()) return;
  const c = AU.ctx, t = c.currentTime + (delay || 0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || "sine";
  o.frequency.setValueAtTime(freq, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t + dur);
  env(g, t, 0.006, vol || 0.15, dur);
  o.connect(g); g.connect(dest || AU.sfx);
  o.start(t); o.stop(t + dur + 0.05);
}
function nz(dur, vol, type, freq, freqTo, q, delay, dest){
  if(!sfxOn()) return;
  const c = AU.ctx, t = c.currentTime + (delay || 0);
  /* looped, so long noises (big bang, jet, rain) never cut off at the end of the 2 second buffer */
  const s = c.createBufferSource(); s.buffer = AU.noise; s.loop = true;
  const f = c.createBiquadFilter(); f.type = type || "bandpass";
  f.frequency.setValueAtTime(freq || 1200, t);
  if(freqTo) f.frequency.exponentialRampToValueAtTime(Math.max(20, freqTo), t + dur);
  f.Q.value = q || 1;
  const g = c.createGain(); env(g, t, 0.004, vol || 0.2, dur);
  s.connect(f); f.connect(g); g.connect(dest || AU.sfx);
  s.start(t, Math.random() * 1.5, dur + 0.1);
}
/* inharmonic partials: glass, metal, bells */
function ping(freqs, dur, vol, delay, type){
  if(!sfxOn()) return;
  freqs.forEach((f, i) => tone(f, dur * (1 - i * 0.12), type || "sine", (vol || 0.08) / (1 + i * 0.6), null, delay));
}
function verb(vol){ return AU.revIn; }

function setAmbience(id){
  if(!AU.ctx || amb.cur === id) return;
  amb.cur = id;
  const c = AU.ctx, t = c.currentTime;
  if(amb.nodes){
    const old = amb.nodes;
    old.g.gain.setTargetAtTime(0.0001, t, 0.4);
    setTimeout(() => { try{ old.src.stop(); old.oscs.forEach(o => o.stop()); if(old.lfo) old.lfo.stop(); }catch(e){} }, 2000);
    amb.nodes = null;
  }
  const A = AMB[id]; if(!A) return;
  const g = c.createGain(); g.gain.value = 0.0001; g.connect(AU.amb);
  const src = c.createBufferSource(); src.buffer = AU.noise; src.loop = true;
  const f = c.createBiquadFilter(); f.type = A.nType; f.frequency.value = A.nFreq; f.Q.value = 0.8;
  const ng = c.createGain(); ng.gain.value = A.nVol;
  src.connect(f); f.connect(ng); ng.connect(g);
  let lfo = null;
  if(A.lfo){
    lfo = c.createOscillator(); lfo.frequency.value = A.lfo;
    const lg = c.createGain(); lg.gain.value = A.nVol * 0.7;
    lfo.connect(lg); lg.connect(ng.gain); lfo.start();
  }
  const oscs = [];
  A.hum.forEach(hz => { if(!hz) return; const o = c.createOscillator(); o.frequency.value = hz; const og = c.createGain(); og.gain.value = A.humVol; o.connect(og); og.connect(g); o.start(); oscs.push(o); });
  src.start();
  g.gain.setTargetAtTime(1, t, 0.6);

}

/* ---------- music: three tracks made live ---------- */
const mus = { on:false, track:"", step:0, next:0, timer:null, intensity:0, lp:18000, bpm:82 };
function m2f(m){ return 440 * Math.pow(2, (m - 69) / 12); }
function mOsc(type, freq, at, dur, vol, dest, opt){
  const c = AU.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, at);
  if(opt && opt.det) o.detune.value = opt.det;
  if(opt && opt.slide) o.frequency.exponentialRampToValueAtTime(opt.slide, at + dur);
  const a = (opt && opt.a) || 0.01;
  g.gain.setValueAtTime(0.0001, at);
  g.gain.linearRampToValueAtTime(vol, at + a);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g);
  if(opt && opt.lp){ const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = opt.lp; g.connect(f); f.connect(dest); }
  else g.connect(dest);
  o.start(at); o.stop(at + dur + 0.05);
}
function mNoise(at, dur, vol, type, freq, dest){
  const c = AU.ctx, s = c.createBufferSource(); s.buffer = AU.noise; s.loop = true;
  const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = c.createGain(); g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  s.connect(f); f.connect(g); g.connect(dest);
  s.start(at, Math.random() * 1.5, dur + 0.05);
}
let distCurve = null;
function distortion(){
  if(distCurve) return distCurve;
  const n = 1024; distCurve = new Float32Array(n);
  for(let i = 0; i < n; i++){ const x = i * 2 / n - 1; distCurve[i] = Math.tanh(x * 4); }
  return distCurve;
}
const CHILL = [ [53, [65, 69, 72, 76]], [52, [64, 67, 71, 74]], [50, [62, 65, 69, 72]], [48, [60, 64, 67, 71]] ];
const HARD  = [ 40, 43, 45, 38 ];
const EPIC  = [ [45, [57, 60, 64]], [41, [53, 57, 60]], [48, [55, 60, 64]], [43, [55, 59, 62]] ];
const PENTA = [72, 74, 76, 79, 81, 84, 86];

function musicStep(step, at){
  const d = AU.music, I = mus.intensity, tr = mus.track;
  const beat = 60 / mus.bpm, s16 = beat / 4;
  if(tr === "chill"){
    const bar = Math.floor(step / 16) % 4, ch = CHILL[bar], p = step % 16;
    if(p === 0) ch[1].forEach((n, i) => { mOsc("triangle", m2f(n), at + i * 0.012, beat * 3.6, 0.035, d, { lp:1800, a:0.03 }); mOsc("sine", m2f(n), at, beat * 3.6, 0.02, d, { det:7 }); });
    if(p === 8 && I >= 1) ch[1].forEach(n => mOsc("triangle", m2f(n), at, beat * 1.6, 0.022, d, { lp:1400 }));
    if(I >= 1 && (p === 0 || p === 10)) mOsc("sine", 110, at, 0.28, 0.32, d, { slide:42 });
    if(I >= 1 && (p === 4 || p === 12)){ mNoise(at, 0.16, 0.13, "bandpass", 1900, d); mOsc("triangle", 190, at, 0.08, 0.06, d); }
    if(I >= 2 && p % 2 === 0) mNoise(at, 0.035, p % 4 === 2 ? 0.05 : 0.03, "highpass", 7000, d);
    if(I >= 3 && (p === 0 || p === 6 || p === 10)) mOsc("sine", m2f(ch[0] - 12 + (p === 6 ? 7 : 0)), at, beat * 0.9, 0.12, d);
    if(I >= 4 && p % 2 === 0 && Math.random() < 0.55) mOsc("sine", m2f(PENTA[(step * 7 + bar * 3) % PENTA.length]), at, beat * 0.7, 0.035, d, { a:0.02 });
    if(Math.random() < 0.18) mNoise(at + Math.random() * s16, 0.012, 0.025, "highpass", 3000, d);
  }else if(tr === "hard"){
    const bar = Math.floor(step / 16) % 4, root = HARD[bar], p = step % 16;
    if(p % 4 === 0){ mOsc("sine", 140, at, 0.22, 0.45, d, { slide:38 }); mNoise(at, 0.02, 0.1, "highpass", 2000, d); }
    if(p === 4 || p === 12){ mNoise(at, 0.2, 0.2, "bandpass", 1600, d); mOsc("triangle", 210, at, 0.09, 0.08, d); }
    if(I >= 1) mNoise(at, 0.03, p % 2 ? 0.025 : 0.045, "highpass", 8000, d);
    if(I >= 1 && p % 2 === 0){
      const c = AU.ctx, o = c.createOscillator(), ws = c.createWaveShaper(), f = c.createBiquadFilter(), g = c.createGain();
      o.type = "sawtooth"; o.frequency.value = m2f(root - 12); ws.curve = distortion(); f.type = "lowpass"; f.frequency.value = 900;
      g.gain.setValueAtTime(0.06, at); g.gain.exponentialRampToValueAtTime(0.0001, at + s16 * 1.8);
      o.connect(ws); ws.connect(f); f.connect(g); g.connect(d); o.start(at); o.stop(at + s16 * 2);
    }
    if(I >= 2 && (p === 0 || p === 3 || p === 6)) [0, 7, 12].forEach(iv => {
      const c = AU.ctx, o = c.createOscillator(), ws = c.createWaveShaper(), g = c.createGain();
      o.type = "sawtooth"; o.frequency.value = m2f(root + 12 + iv); ws.curve = distortion();
      g.gain.setValueAtTime(0.03, at); g.gain.exponentialRampToValueAtTime(0.0001, at + s16 * 2.5);
      o.connect(ws); ws.connect(g); g.connect(d); o.start(at); o.stop(at + s16 * 3);
    });
    if(I >= 3 && p % 4 === 2) mOsc("square", m2f(root + 24 + [0, 3, 5, 7][(step >> 2) % 4]), at, s16 * 1.5, 0.02, d, { lp:2400 });
  }else if(tr === "epic"){
    const bar = Math.floor(step / 16) % 4, ch = EPIC[bar], p = step % 16;
    if(p === 0){
      ch[1].forEach(n => { mOsc("sawtooth", m2f(n), at, beat * 4.2, 0.018, d, { lp:900, a:0.6 }); mOsc("sawtooth", m2f(n), at, beat * 4.2, 0.012, d, { lp:900, a:0.6, det:12 }); });
      mOsc("sine", m2f(ch[0] - 12), at, beat * 4, 0.14, d, { a:0.2 });
    }
    if(I >= 1 && (p === 0 || p === 8 || p === 14)){ mOsc("sine", 75, at, 0.6, 0.3, d, { slide:45 }); mNoise(at, 0.25, 0.06, "lowpass", 400, d); }
    if(I >= 2 && p % 2 === 0) mOsc("sine", m2f(ch[1][(p >> 1) % 3] + 12), at, s16 * 1.8, 0.035, d, { a:0.01 });
    if(I >= 3 && p === 8){
      const c = AU.ctx; ch[1].forEach(n => { const o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
        o.type = "sawtooth"; o.frequency.value = m2f(n + 12); f.type = "bandpass"; f.frequency.value = 900; f.Q.value = 6;
        g.gain.setValueAtTime(0.0001, at); g.gain.linearRampToValueAtTime(0.05, at + 0.4); g.gain.exponentialRampToValueAtTime(0.0001, at + beat * 3.5);
        o.connect(f); f.connect(g); g.connect(d); o.start(at); o.stop(at + beat * 3.6); });
    }
  }
}
function musicTrackFor(){
  const t = save.settings.track;
  if(t === "off") return "";
  if(t === "mine") return mp3.url ? "mine" : (save.chapter === 2 ? "hard" : save.chapter === 3 ? "epic" : "chill");
  if(t === "chill" || t === "hard" || t === "epic") return t;
  return save.chapter === 2 ? "hard" : save.chapter === 3 ? "epic" : "chill";
}
function musicSync(){
  if(!AU.ctx) return;
  const want = save.settings.music > 0 ? musicTrackFor() : "";
  if(want === mus.track && (mus.on || !want)) return;
  musicStop();
  if(!want) return;
  mus.track = want;
  if(want === "mine"){ mp3Play(); mus.on = true; return; }
  mus.bpm = want === "hard" ? 140 : want === "epic" ? 88 : 82;
  mus.on = true; mus.step = 0; mus.next = AU.ctx.currentTime + 0.12;
  mus.timer = setInterval(() => {
    if(!AU.ctx || AU.hidden) return;
    const now = AU.ctx.currentTime;
    if(mus.next < now - 0.5) mus.next = now + 0.05;   /* we fell behind (tab was asleep): skip ahead */
    while(mus.next < now + 0.3){ try{ musicStep(mus.step, mus.next); }catch(e){} mus.next += 60 / mus.bpm / 4; mus.step++; }
  }, 60);
}
function musicStop(){
  if(mus.timer){ clearInterval(mus.timer); mus.timer = null; }
  if(mus.track === "mine") mp3Pause();
  mus.on = false; mus.track = "";
}
function musicIntensity(n){ mus.intensity = clamp(n, 0, 4); }
function musicFilter(hz, time){
  if(!AU.ctx) return;
  const target = clamp(hz, 200, 18000);
  if(Math.abs(target - mus.lp) < 10) return;
  mus.lp = target;
  AU.musicLP.frequency.setTargetAtTime(target, AU.ctx.currentTime, time || 0.15);
}

/* ---------- your own song (kept in IndexedDB so it survives a reload) ---------- */
const mp3 = { el:null, url:"", name:"", node:null };
function idb(){
  return new Promise((res, rej) => {
    let r;
    try{ r = indexedDB.open("flipshot", 1); }catch(e){ rej(e); return; }
    r.onupgradeneeded = () => { r.result.createObjectStore("media"); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function idbPut(key, val){ return idb().then(db => new Promise((res, rej) => { const tx = db.transaction("media", "readwrite"); tx.objectStore("media").put(val, key); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); })); }
function idbGet(key){ return idb().then(db => new Promise((res, rej) => { const tx = db.transaction("media", "readonly"); const q = tx.objectStore("media").get(key); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); })); }
function mp3Load(file){
  if(!file || !/^audio\//.test(file.type || "audio/")) return;
  if(mp3.url) URL.revokeObjectURL(mp3.url);
  mp3.url = URL.createObjectURL(file); mp3.name = file.name || "your song";
  if(mp3.el){ mp3.el.src = mp3.url; }
  idbPut("song", { blob:file, name:mp3.name }).catch(() => {});
  save.settings.track = "mine"; persist();
  musicStop(); musicSync();
}
function mp3Restore(){
  idbGet("song").then(v => {
    if(v && v.blob){ mp3.url = URL.createObjectURL(v.blob); mp3.name = v.name || "your song"; if(save.settings.track === "mine"){ musicStop(); musicSync(); } }
  }).catch(() => {});
}
function mp3Play(){
  if(!mp3.url || !AU.ctx) return;
  if(!mp3.el){
    mp3.el = new Audio(); mp3.el.loop = true; mp3.el.src = mp3.url; mp3.el.crossOrigin = "anonymous";
    try{ mp3.node = AU.ctx.createMediaElementSource(mp3.el); mp3.node.connect(AU.music); }catch(e){}
  }
  mp3.el.play().catch(() => {});
}
function mp3Pause(){ if(mp3.el) mp3.el.pause(); }

/* ---------- announcer ---------- */
const voice = { list:[], pick:null, good:false, last:0, ready:false };
function voiceScore(v){
  const n = v.name;
  let s = 0;
  if(/natural/i.test(n)) s += 10;
  if(/neural/i.test(n)) s += 9;
  if(/online/i.test(n)) s += 6;
  if(/google/i.test(n)) s += 5;
  if(/premium|enhanced|siri/i.test(n)) s += 6;
  if(/samantha|alex|daniel|karen|moira|aria|jenny|guy|davis|ryan/i.test(n)) s += 3;
  if(/espeak|robot|whisper|zarvox|trinoids|bad news|bells|boing|bubbles|cellos|albert|junior|organ|superstar/i.test(n)) s -= 20;
  if(/^en[-_](US|GB|AU|CA)/i.test(v.lang)) s += 1;
  return s;
}
function voiceLoad(){
  if(!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  if(!vs.length) return;
  voice.list = vs.slice().sort((a, b) => voiceScore(b) - voiceScore(a));
  const chosen = save.settings.voiceName && vs.find(v => v.name === save.settings.voiceName);
  voice.pick = chosen || voice.list[0];
  voice.good = voiceScore(voice.list[0]) >= 5;
  voice.ready = true;
  if(save.settings.voiceOn === null){ save.settings.voiceOn = voice.good; persist(); }
}
function announce(text, force){
  if(!save.settings.voiceOn || !voice.pick || AU.hidden || save.settings.voice <= 0) return;
  const now = performance.now();
  if(!force && now - voice.last < 1100) return;
  voice.last = now;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.voice = voice.pick; u.lang = voice.pick.lang;
    u.rate = 1.04; u.pitch = 0.96; u.volume = clamp(save.settings.voice / 100, 0, 1);
    speechSynthesis.speak(u);
  }catch(e){}
}

const caches = { gen:0 };   /* bump gen to throw away every cached background */
function resize(){
  const r = $("stage").getBoundingClientRect();

  if(nW === W && nH === H && nD === DPR && cv.width === Math.round(nW * nD)) return;
  W = nW; H = nH; DPR = nD;

/* offscreen canvas helper */
function mkCanvas(w, h){
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));

/* glow sprites: a soft radial blob per color, drawn with drawImage instead of shadowBlur */
const glowCache = new Map();
function glowSprite(col){

  const g = s.getContext("2d"), c = parseColor(col);
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, rgba(c, 1)); gr.addColorStop(0.22, rgba(c, 0.55)); gr.addColorStop(0.55, rgba(c, 0.16)); gr.addColorStop(1, rgba(c, 0));

}
function glow(g, x, y, r, col, a){

/* ================= PARTICLES ================= */
const parts = [];
const MAXP = 900;
/* p: x,y,vx,vy,life,size,col,type, g (gravity), drag, rot, vr, world (scrolls with the camera), add (additive) */
function spawn(p){
  if(parts.length >= MAXP * Math.max(0.3, partScale())) return null;
  p.age = 0; p.rot = p.rot || 0; p.vr = p.vr || 0; p.g = p.g === undefined ? 600 : p.g; p.drag = p.drag || 0;

}
function burst(n, base){
  n = Math.max(1, Math.round(n * partScale()));

    const a = base.ang !== undefined ? base.ang + (Math.random() - 0.5) * (base.spread || TAU) : Math.random() * TAU;
    const sp = (base.speed || 200) * (0.4 + Math.random() * 0.8);
    spawn({ x:base.x + (Math.random() - 0.5) * (base.jx || 0), y:base.y + (Math.random() - 0.5) * (base.jy || 0),

      life:(base.life || 0.8) * (0.6 + Math.random() * 0.6), size:(base.size || 3) * (0.6 + Math.random() * 0.8),
      col:Array.isArray(base.col) ? pickR(base.col) : base.col, type:base.type || "dot", g:base.g, drag:base.drag,

function updateParts(dt, camDY){

    if(p.drag) { const k = Math.pow(1 - clamp(p.drag, 0, 0.99), dt * 60); p.vx *= k; p.vy *= k; }
    p.vy += p.g * dt;

      case "round": g.fillStyle = p.col; g.beginPath(); g.arc(p.x, p.y, p.size, 0, TAU); g.fill(); break;
      case "glow": glow(g, p.x, p.y, p.size * (1 + k), p.col, a); break;

      case "rect":

        g.fillStyle = "#2f7a3a"; g.beginPath(); g.arc(0, 0, p.size * 0.45, 0, TAU); g.fill(); g.restore(); break;
      case "chip":

        g.restore(); break;
      case "board":
        g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillStyle = "#1f6b3a"; g.fillRect(-p.size, -p.size * 0.6, p.size * 2, p.size * 1.2);

const floats = [];

function updateFloats(dt){

/* =====================================================================
   BOTTLE RENDERER
   Bottles are 2D, but shaded like round glass: cylinder light, thick base,
   liquid that stays level with the world, caps, labels, wear.
   ===================================================================== */

/* Catmull-Rom subdivision for smooth bottle sides */
function catmull(pts, n){
  const out = [];
  for(let i = 0; i < pts.length - 1; i++){
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    for(let j = 0; j < n; j++){
      const t = j / n, t2 = t * t, t3 = t2 * t;
      out.push([
        0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
        0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)
      ]);
    }
  }
  out.push(pts[pts.length - 1].slice());
  return out;
}
const geomCache = new Map();
const BADGE_SHAPES = { orb:1, potion:1, hourglass:1, flask:1, perfume:1, facet:1, spike:1, shard:1 };
function bottleGeom(S, k){
  const key = S.id + "|" + k.toFixed(3);
  let G = geomCache.get(key);
  if(G) return G;
  const w = S.w * k, h = S.h * k, capH = S.capH * k, neckH = S.neckH * k, nw = S.neckW * k;
  const capTop = -h, capBot = -h + capH, neckTop = -h + capH * 0.72, ySh = -h + capH + neckH, yB = h;
  let pts = S.prof.map(p => [Math.max(0.5, p[1] * w), lerp(yB, ySh, p[0])]);
  if(!S.facet) pts = catmull(pts, 5);
  const body = new Path2D();
  body.moveTo(-pts[0][0], pts[0][1]);
  for(let i = 1; i < pts.length; i++) body.lineTo(-pts[i][0], pts[i][1]);
  body.lineTo(-nw, ySh);
  body.lineTo(-nw, neckTop);
  body.lineTo(nw, neckTop);
  body.lineTo(nw, ySh);
  for(let i = pts.length - 1; i >= 0; i--) body.lineTo(pts[i][0], pts[i][1]);
  body.closePath();
  let handle = null;
  if(S.handle){
    handle = new Path2D();
    const hx = w * 0.92, ht = lerp(yB, ySh, 0.86), hb = lerp(yB, ySh, 0.42);
    handle.moveTo(hx * 0.7, ht);
    handle.bezierCurveTo(w * 1.45, ht - h * 0.05, w * 1.5, hb, hx, hb);
  }
  /* label region */
  const badge = !!BADGE_SHAPES[S.id];
  const ly = lerp(yB, ySh, badge ? 0.34 : 0.2), lh = (yB - ySh) * (badge ? 0.26 : 0.3);
  /* half width at a given y (for droplets and highlights) */
  const widthAt = (y) => {
    if(y < ySh) return nw;
    for(let i = 0; i < pts.length - 1; i++){
      const a = pts[i], b = pts[i + 1];
      if((y <= a[1] && y >= b[1]) || (y >= a[1] && y <= b[1])){
        const t = (y - a[1]) / ((b[1] - a[1]) || 1);
        return lerp(a[0], b[0], t);
      }
    }
    return pts[0][0];
  };
  G = { w:w, h:h, nw:nw, capTop:capTop, capBot:capBot, capH:capH, neckTop:neckTop, ySh:ySh, yB:yB, body:body, handle:handle,
        pts:pts, ly:ly, lh:lh, badge:badge, widthAt:widthAt, k:k };
  if(geomCache.size > 400) geomCache.clear();
  geomCache.set(key, G);
  return G;
}

/* light pass that makes flat shapes read as round */
function cylShade(g, w, h, s, top, bot){
  const cg = g.createLinearGradient(-w, 0, w, 0);
  cg.addColorStop(0.00, "rgba(0,0,0," + (0.55 * s) + ")");
  cg.addColorStop(0.10, "rgba(0,0,0," + (0.2 * s) + ")");
  cg.addColorStop(0.24, "rgba(255,255,255," + (0.3 * s) + ")");
  cg.addColorStop(0.40, "rgba(255,255,255,0)");
  cg.addColorStop(0.72, "rgba(0,0,0," + (0.18 * s) + ")");
  cg.addColorStop(0.88, "rgba(255,255,255," + (0.14 * s) + ")");
  cg.addColorStop(1.00, "rgba(0,0,0," + (0.62 * s) + ")");
  g.fillStyle = cg;
  g.fillRect(-w - 2, top === undefined ? -h - 2 : top, w * 2 + 4, (bot === undefined ? h + 2 : bot) - (top === undefined ? -h - 2 : top));

/* frosted glass speckle pattern, made once */

/* ---------- labels ---------- */
function drawLogo(g, kind, x, y, s, col){

/* ---------- wear: drops, scratches, frost, cracks ---------- */
function drawWear(g, B, G, time){
  const wr = B.wear, w = G.w, h = G.h;
  if(wr.frost || B.frosted){
    g.fillStyle = frostPattern(g); g.globalAlpha = B.frosted ? 0.9 : 0.55;
    g.fillRect(-w - 2, G.ySh, w * 2 + 4, G.yB - G.ySh);
    g.globalAlpha = 1;
    if(wr.frost){
      const fg = g.createLinearGradient(-w, 0, w, 0);
      fg.addColorStop(0, "rgba(235,250,255,.55)"); fg.addColorStop(0.18, "rgba(235,250,255,0)"); fg.addColorStop(0.82, "rgba(235,250,255,0)"); fg.addColorStop(1, "rgba(235,250,255,.55)");
      g.fillStyle = fg; g.fillRect(-w - 2, G.ySh, w * 2 + 4, G.yB - G.ySh);
    }
  }
  if(wr.drops){
    /* cold drops that slowly slide down and come back */
    for(let i = 0; i < 9; i++){
      const r1 = hash01(B.seed + i * 13), r2 = hash01(B.seed * 7 + i);
      const cyc = (time * (0.04 + r2 * 0.05) + r1) % 1;
      const y = lerp(G.ySh + (G.yB - G.ySh) * 0.15, G.yB - 4, cyc);
      const half = G.widthAt(y);
      const x = (r1 * 2 - 1) * half * 0.85;

      g.fillStyle = "rgba(255,255,255,.18)"; g.beginPath(); g.ellipse(x, y, s, s * 1.25, 0, 0, TAU); g.fill();
      g.fillStyle = "rgba(255,255,255,.8)"; g.fillRect(x - s * 0.4, y - s * 0.5, s * 0.4, s * 0.4);
      g.fillStyle = "rgba(0,0,0,.18)"; g.fillRect(x - s * 0.2, y + s * 0.8, s * 0.6, s * 0.25);
    }
  }

    g.strokeStyle = "rgba(255,255,255,.28)"; g.lineWidth = 0.7;
    for(let i = 0; i < 6; i++){

    }

    g.strokeStyle = "rgba(255,255,255,.55)"; g.lineWidth = 0.9;
    const cx = (hash01(B.seed) - 0.5) * w * 0.8, cy = lerp(G.ySh, G.yB, 0.55);

    }
  }

/* ---------- the liquid ---------- */
function drawLiquid(g, B, G, o){
  const w = G.w, h = G.h, time = o.time;
  const span = G.yB - G.neckTop;
  const surf = G.yB - span * B.fill;
  const sway = Math.sin(time * 2.4) * 1.1 + o.slosh * 6;
  const surfY = surf + sway;
  const rx = w * 1.16, ry = Math.max(2.2, w * 0.22 + Math.sin(time * 2.9) * 1.1);
  const reach = h * 2.2;
  g.save();
  g.rotate(-o.rot + o.slosh);
  const mix = o.mix || 0;
  const alpha = B.mat === "energy" ? 0.82 : 0.93;
  g.globalAlpha = alpha;
  if(B.layers && B.layers.length > 1){
    const L = B.layers, n = L.length;
    const avg = L.reduce((a, c) => { const p = parseColor(c); a[0] += p[0] / n; a[1] += p[1] / n; a[2] += p[2] / n; return a; }, [0, 0, 0]);
    const depth = Math.max(10, G.yB + h * 0.25 - surfY);
    for(let i = 0; i < n; i++){
      const y0 = surfY + depth * (i / n), y1 = i === n - 1 ? surfY + reach : surfY + depth * ((i + 1) / n);
      const col = mixc(L[i], rgba(avg), mix * 0.85);
      g.fillStyle = col;

function drawBottle(g, B, k, o){
  o = o || {};

  if(B.legend){ drawLegendBottle(g, B, k, o); return; }
  const G = bottleGeom(B.shape, k);
  const time = o.time;
  if(B.pillow){
    const ph = (time * 0.8) % 1;
    const glitching = ph > 0.86 || ph < 0.06;
    const showPillow = Math.floor(time * 0.8) % 2 === 0;
    if(glitching && !o.simple){

      for(let i = 0; i < 7; i++){

  rim.addColorStop(0, hsl(hue, 100, 78)); rim.addColorStop(0.33, hsl(hue + 90, 100, 72)); rim.addColorStop(0.66, hsl(hue + 180, 100, 76)); rim.addColorStop(1, hsl(hue + 270, 100, 72));
  g.strokeStyle = rim; g.lineWidth = Math.max(1.4, 2.6 * k); g.stroke(G.body);
  drawCap(g, B, G, time);
}


/* =====================================================================
   WHAT'S INSIDE THE BOTTLES
   All drawn in "liquid space": origin at the bottle center, the liquid
   surface at C.surf, the bottom near C.bot. Clipped to the glass already.
   ===================================================================== */
const GLYPHS = "01<>{}[]/\\|=+*#%&$@?!";
function inY(C, f){ return lerp(C.surf + 6 * C.k, C.bot - 4 * C.k, f); }

function drawInside(g, kind, C){
  const t = C.t, k = C.k, w = C.w, h = C.h, seed = C.seed;
  const depth = Math.max(8, C.bot - C.surf);
  switch(kind){
  case "ice":
    for(let i = 0; i < 3; i++){
      const ix = Math.sin(t * 0.6 + i * 2.3 + seed) * w * 0.42, iy = C.surf + 8 * k + i * depth * 0.18 + Math.sin(t * 1.1 + i) * 3;
      const sz = (7 + (i % 2) * 3) * k * 1.4;
      g.save(); g.translate(ix, iy); g.rotate(Math.sin(t * 0.5 + i) * 0.5 + i);
      g.fillStyle = "rgba(235,250,255,.5)"; g.strokeStyle = "rgba(255,255,255,.85)"; g.lineWidth = 1.1;
      g.beginPath(); g.moveTo(-sz, -sz * 0.8); g.lineTo(sz * 0.9, -sz); g.lineTo(sz, sz * 0.85); g.lineTo(-sz * 0.85, sz); g.closePath(); g.fill(); g.stroke();
      g.fillStyle = "rgba(255,255,255,.75)"; g.fillRect(-sz * 0.55, -sz * 0.5, sz * 0.5, sz * 0.2);
      g.restore();
    }
    break;
  case "boba":
    for(let b = 0; b < 10; b++){
      const bx = (((b * 31 + seed) % 100) / 100 - 0.5) * w * 1.5, by = C.bot - 6 * k - (b % 3) * 5 * k + Math.sin(t * 1.4 + b) * 1.4;
      const r = 4.6 * k;
      const bg = g.createRadialGradient(bx - r * 0.3, by - r * 0.35, 0.5, bx, by, r);
      bg.addColorStop(0, "#5a463c"); bg.addColorStop(1, "#120a08");
      g.fillStyle = bg; g.beginPath(); g.arc(bx, by, r, 0, TAU); g.fill();
      g.fillStyle = "rgba(255,255,255,.35)"; g.beginPath(); g.arc(bx - r * 0.33, by - r * 0.38, r * 0.22, 0, TAU); g.fill();
    }
    break;
  case "citrus":
    for(let c = 0; c < 2; c++){
      const cx = (c ? 1 : -1) * w * 0.34 + Math.sin(t * 0.7 + c * 2) * w * 0.12, cy = C.surf + 12 * k + c * depth * 0.32 + Math.sin(t * 1.2 + c) * 3;
      const rr = 15 * k;
      g.save(); g.translate(cx, cy); g.rotate(Math.sin(t * 0.6 + c) * 0.6 + c * 1.2);
      g.fillStyle = "rgba(255,226,120,.92)"; g.beginPath(); g.arc(0, 0, rr, 0, Math.PI); g.closePath(); g.fill();
      g.strokeStyle = "rgba(255,255,255,.8)"; g.lineWidth = 1.3; g.stroke();
      g.strokeStyle = "rgba(255,170,40,.95)"; g.lineWidth = 0.9;
      for(let s = 1; s < 5; s++){ const a = (s / 5) * Math.PI; g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(a) * rr * 0.88, Math.sin(a) * rr * 0.88); g.stroke(); }

    }

  case "glitter": case "goldflake": {
    const col = kind === "goldflake" ? "#ffd86b" : "#ffffff";
    g.fillStyle = col;
    for(let s = 0; s < 24; s++){
      const ang = t * 0.5 + s * 0.7, rad = (((s * 17) % 100) / 100) * w * 0.85;
      const gx = Math.cos(ang) * rad, gy = inY(C, ((s * 41 + seed) % 100) / 100) + Math.sin(t * 0.8 + s) * 4;
      g.globalAlpha = 0.3 + 0.7 * Math.abs(Math.sin(t * 3 + s));
      g.save(); g.translate(gx, gy); g.rotate(ang * 2); g.fillRect(-1.3 * k, -1.3 * k, 2.6 * k, 2.6 * k); g.restore();
    }
    g.globalAlpha = 1; break;
  }
  case "snow":
    g.fillStyle = "#ffffff";
    for(let n = 0; n < 18; n++){
      const cyc = (t * 0.22 + n * 0.11 + (seed % 7) * 0.03) % 1;
      const nx = (((n * 37) % 100) / 100 - 0.5) * w * 1.6 + Math.sin(t * 0.9 + n) * 5, ny = C.surf + 6 + cyc * depth;
      g.globalAlpha = 0.85 * (1 - cyc * 0.4); g.beginPath(); g.arc(nx, ny, (1.5 + (n % 3) * 0.5) * k, 0, TAU); g.fill();

    const cols = 5;
    g.font = (9 * k).toFixed(1) + "px monospace"; g.textAlign = "center";
    for(let cc = 0; cc < cols; cc++){
      const colX = (-w * 0.72) + (cc / (cols - 1)) * w * 1.44, speed = 0.5 + ((cc * 13 + seed) % 7) / 9;
      for(let c2 = 0; c2 < 7; c2++){

    g.globalAlpha = 1; g.textAlign = "start"; break;

      g.beginPath(); g.moveTo(px, py);
      for(let s = 0; s < 4; s++){ px += (hash01(slot * 11 + sp * 5 + s) - 0.5) * 18 * k; py += 9 * k; g.lineTo(px, py); }
      g.stroke();

    }
    break;
  }
  case "orbs":
    for(let o = 0; o < 5; o++){
      const oa = t * 0.4 + o * 1.26, ox = Math.cos(oa) * w * 0.46, oy = C.surf + depth * 0.5 + Math.sin(oa * 1.3) * depth * 0.3;
      glowAdd(g, ox, oy, 11 * k, C.B.glow || "#ffffff", 0.9);

    }
    break;
  case "fizz": {
    const boost = 1 + C.fizz * 3;
    g.fillStyle = "rgba(255,255,255,.75)";
    for(let col = 0; col < 5; col++){
      const x0 = ((hash01(seed + col) - 0.5) * 1.5) * w;
      for(let b = 0; b < 6; b++){
        const cyc = (t * (0.55 + hash01(col * 3 + b) * 0.4) * boost + b / 6 + col * 0.13) % 1;
        const y = lerp(C.bot - 4, C.surf + 2, cyc), x = x0 + Math.sin(t * 6 + b + col) * 1.5 * k;

    }
    g.globalAlpha = 1; break;
  }
  case "bubbles":
    for(let b = 0; b < 7; b++){
      const cyc = (t * 0.25 + hash01(seed + b)) % 1;
      const x = (hash01(seed * 3 + b) - 0.5) * w * 1.3 + Math.sin(t * 2 + b) * 3 * k, y = lerp(C.bot - 4, C.surf, cyc);
      const r = (2.5 + hash01(b * 7) * 3) * k;
      g.strokeStyle = "rgba(255,255,255,.65)"; g.lineWidth = 0.9; g.beginPath(); g.arc(x, y, r, 0, TAU); g.stroke();
      g.fillStyle = "rgba(255,255,255,.7)"; g.beginPath(); g.arc(x - r * 0.35, y - r * 0.35, r * 0.25, 0, TAU); g.fill();
    }
    break;
  case "smoke":
    for(let s = 0; s < 7; s++){

      const x = Math.sin(t * 0.7 + s * 1.7) * w * 0.4, y = lerp(C.bot, C.surf, cyc);
      g.globalAlpha = 0.22 * Math.sin(cyc * Math.PI);

    }
    g.globalAlpha = 1; break;
  case "fog":
    for(let f = 0; f < 4; f++){
      const y = inY(C, 0.15 + f * 0.22), x = Math.sin(t * 0.3 + f * 2) * w * 0.6;
      const fg = g.createRadialGradient(x, y, 1, x, y, w * 1.1);

      g.fillStyle = fg; g.fillRect(x - w * 1.2, y - w * 0.5, w * 2.4, w);

    break;
  case "embers":
    for(let e = 0; e < 12; e++){

      const x = (hash01(seed * 5 + e) - 0.5) * w * 1.4 + Math.sin(t * 3 + e) * 3 * k, y = lerp(C.bot, C.surf, cyc);

      const fg = g.createLinearGradient(0, base, 0, base - fh);
      fg.addColorStop(0, "rgba(255,240,180,.95)"); fg.addColorStop(0.35, "rgba(255,150,30,.85)"); fg.addColorStop(1, "rgba(200,20,0,0)");
      g.fillStyle = fg;

  }
  case "frost":
    g.strokeStyle = "rgba(230,250,255,.7)"; g.lineWidth = 0.8;

      const side = s % 2 ? 1 : -1, y0 = inY(C, 0.15 + s * 0.14), grow = 0.6 + 0.4 * Math.sin(t * 0.4 + s);

      for(let b = 1; b < 4; b++){ const bx = x0 - side * len * b / 4, by = y0 - len * 0.05 * b; g.moveTo(bx, by); g.lineTo(bx - side * len * 0.18, by - len * 0.22); g.moveTo(bx, by); g.lineTo(bx - side * len * 0.18, by + len * 0.12); }

  case "fish":

      const dir = ph < 1 ? 1 : -1, u = ph < 1 ? ph : 2 - ph;
      const x = lerp(-w * 0.7, w * 0.7, smooth(u)), y = inY(C, 0.2 + f * 0.25) + Math.sin(t * 2 + f) * 4 * k;

      }
    }
    break;
  case "octopus": {
    const x = Math.sin(t * 0.4) * w * 0.2, y = inY(C, 0.45) + Math.sin(t * 1.3) * 3 * k, r = 10 * k;
    g.strokeStyle = "#c4486b"; g.lineWidth = 3.2 * k; g.lineCap = "round";
    for(let a = 0; a < 8; a++){

      g.beginPath(); g.moveTo(x + Math.cos(ang) * r * 0.6, y + r * 0.4);

        const rr = r * (0.6 + s * 0.38);

    }

  }
  case "slime":
    for(let s = 0; s < 2; s++){

  case "galaxy": {

    for(let i = 0; i < 70; i++){
      const arm = i % 2, d = (i / 70) * R, a = d / R * 4.2 + arm * Math.PI + t * 0.5;

  }
  case "nebula":
    for(let n = 0; n < 4; n++){

      g.fillStyle = "#ffffff"; g.fillRect(x, y, 1.6 * k, 1.6 * k);
      if(s % 6 === 0){ g.fillRect(x - 2 * k, y + 0.5, 5.6 * k, 0.6); g.fillRect(x + 0.5, y - 2 * k, 0.6, 5.6 * k); }
    }
    g.globalAlpha = 1; break;
  case "planets": {
    const cx = 0, cy = inY(C, 0.5);
    glowAdd(g, cx, cy, 10 * k, "#ffd27a", 1);
    g.fillStyle = "#fff3c4"; g.beginPath(); g.arc(cx, cy, 3.2 * k, 0, TAU); g.fill();
    [[0.35, 1.1, "#4dc9ff", 2.2], [0.6, 0.7, "#ff8a3a", 2.8], [0.88, 0.45, "#e0c9a0", 3.2]].forEach((p, i) => {
      const a = t * p[1] + i * 2, rx = w * p[0], ry = rx * 0.4;
      g.strokeStyle = "rgba(255,255,255,.15)"; g.lineWidth = 0.6; g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, TAU); g.stroke();
      const px = cx + Math.cos(a) * rx, py = cy + Math.sin(a) * ry;
      g.fillStyle = p[2]; g.beginPath(); g.arc(px, py, p[3] * k, 0, TAU); g.fill();
      if(i === 2){ g.strokeStyle = "rgba(255,240,200,.8)"; g.lineWidth = 0.8; g.beginPath(); g.ellipse(px, py, p[3] * k * 2, p[3] * k * 0.6, -0.3, 0, TAU); g.stroke(); }
    });
    break;
  }
  case "sun": {
    const cx = 0, cy = inY(C, 0.45), r = 8 * k * (1 + 0.05 * Math.sin(t * 3));
    glowAdd(g, cx, cy, r * 3.2, "#ff9a2a", 0.9);
    const sg = g.createRadialGradient(cx - r * 0.3, cy - r * 0.3, 1, cx, cy, r);
    sg.addColorStop(0, "#fffbe0"); sg.addColorStop(0.6, "#ffcf4a"); sg.addColorStop(1, "#ff7a1a");
    g.fillStyle = sg; g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.fill();
    g.strokeStyle = "rgba(255,200,80,.7)"; g.lineWidth = 1;
    for(let f = 0; f < 3; f++){ const a = t * 0.5 + f * 2.1; g.beginPath(); g.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, r * 0.5, a + 2, a + 4.5); g.stroke(); }
    break;
  }
  case "moon": {
    const cx = Math.sin(t * 0.3) * w * 0.2, cy = inY(C, 0.45), r = 9 * k;
    const mg = g.createRadialGradient(cx - r * 0.35, cy - r * 0.35, 1, cx, cy, r);
    mg.addColorStop(0, "#f2f2f5"); mg.addColorStop(1, "#8a8a96");
    g.fillStyle = mg; g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.fill();
    g.fillStyle = "rgba(90,90,105,.45)";
    [[-0.3, -0.2, 0.25], [0.35, 0.1, 0.18], [-0.05, 0.4, 0.14], [0.2, -0.45, 0.1]].forEach(c => { g.beginPath(); g.arc(cx + c[0] * r, cy + c[1] * r, c[2] * r, 0, TAU); g.fill(); });

  }
  case "comet": {
    const ph = (t * 0.25 + hash01(seed)) % 1;
    const x = lerp(-w * 1.1, w * 1.1, ph), y = inY(C, 0.2 + ph * 0.5);

   SKY: the trip from the table to the multiverse
   Camera height is in L = log10(meters + 1). Things up there are placed

/* ---------- time of day + weather (real clock) ---------- */
let _env = null, _envT = 0;
function envNow(){
  const now = Date.now();
  if(_env && now - _envT < 15000) return _env;
  _envT = now;
  const d = new Date(), hr = d.getHours() + d.getMinutes() / 60;
  let phase, day;
  if(hr < 5 || hr >= 21){ phase = "night"; day = 0; }
  else if(hr < 7){ phase = "dawn"; day = (hr - 5) / 2; }
  else if(hr < 17){ phase = "day"; day = 1; }
  else if(hr < 19){ phase = "dusk"; day = 1 - (hr - 17) / 2 * 0.7; }
  else { phase = "evening"; day = 0.3 - (hr - 19) / 2 * 0.3; }
  const rnd = mulberry(strSeed(dayKey(d) + ":" + d.getHours()));
  const r = rnd(), month = d.getMonth() + 1, cold = month === 12 || month <= 2;
  let weather = "clear";
  if(r < 0.13) weather = "rain"; else if(r < 0.18) weather = "storm"; else if(r < 0.26) weather = "fog";
  else if(r < 0.42) weather = "cloudy"; else if(r < 0.48 && cold) weather = "snow";
  _env = { hr:hr, phase:phase, day:day, weather:weather, season:holidayNow(d), bucket:phase + Math.floor(hr * 2), rnd:rnd(), cold:cold, month:month };
  return _env;
}
function placeWeather(P, env){
  if(!P.tags.includes("earth") || P.id === "underwater") return "none";
  if(P.id === "volcano") return "ash";
  if(P.id === "skyisland") return env.weather === "rain" || env.weather === "storm" ? "cloudy" : env.weather === "snow" ? "clear" : env.weather;
  if((P.id === "cabin" || P.id === "mountain") && (env.weather === "rain" || env.weather === "storm" || env.rnd < 0.35)) return "snow";
  if(P.id === "canyon" && env.weather === "snow") return "clear";
  return env.weather;
}

/* ---------- value noise for planet textures ---------- */
function vnoise2(x, y, s){
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const hh = (a, b) => hash01(a * 157.31 + b * 113.97 + (s || 0) * 71.3);
  const u = smooth(xf), v = smooth(yf);
  return lerp(lerp(hh(xi, yi), hh(xi + 1, yi), u), lerp(hh(xi, yi + 1), hh(xi + 1, yi + 1), u), v);
}
function fbm2(x, y, oct, s){ let a = 0.5, f = 1, sum = 0, n = 0; for(let i = 0; i < oct; i++){ sum += vnoise2(x * f, y * f, (s || 0) + i * 13) * a; n += a; a *= 0.5; f *= 2.03; } return sum / n; }

/* planet textures: 256 x 128 maps, built once */
const texCache = new Map();
function planetTex(kind){
  let c = texCache.get(kind);

  const TW = 512, TH = 256;
  c = mkCanvas(TW, TH);
  const g = c.getContext("2d"), img = g.createImageData(TW, TH), d = img.data;
  const put = (i, r, gg, b) => { d[i] = r; d[i + 1] = gg; d[i + 2] = b; d[i + 3] = 255; };
  for(let y = 0; y < TH; y++){
    const lat = (y / TH - 0.5) * Math.PI;
    for(let x = 0; x < TW; x++){
      const i = (y * TW + x) * 4;

      const a = x / TW * TAU, nx = Math.cos(a) * 2.2 + 3, nz = Math.sin(a) * 2.2 + 3, ny = y / TH * 3.4;
      const sx2 = x * 0.5, sy2 = y * 0.5;   /* feature coordinates in the old 256x128 space */
      const n = fbm2(nx + nz * 0.7, ny + nz * 0.3, 4, kind.length);
      const n2 = fbm2(nx * 3 + 9, ny * 3 + nz, 3, kind.length + 5);
      const pole = Math.abs(lat) / (Math.PI / 2);
      switch(kind){
        case "moon": { const v = 150 + n * 70 - smooth(clamp((n2 - 0.58) * 9, 0, 1)) * 48; put(i, v, v, v + 6); break; }
        case "mercury": { const v = 110 + n * 70 - smooth(clamp((n2 - 0.57) * 9, 0, 1)) * 32; put(i, v + 6, v, v - 6); break; }
        case "venus": { const b = Math.sin(lat * 6 + n * 4) * 18; put(i, 225 + b, 195 + b, 130 + b * 0.5); break; }
        case "earth": {
          const lf = smooth(clamp((n - 0.515) * 22, 0, 1)) * (pole < 0.84 ? 1 : 0);
          const ice = smooth(clamp((pole - 0.8) * 12 + (n - 0.45) * 2, 0, 1));
          const desert = smooth(clamp((n2 - 0.56) * 10, 0, 1)) * (pole < 0.45 ? 1 : 0);
          const lr = lerp(58 + n2 * 50, 196, desert), lg = lerp(120 + n2 * 40, 170, desert), lb = lerp(52, 110, desert);
          let r = lerp(18 + n * 30, lr, lf), gg = lerp(60 + n * 50, lg, lf), b = lerp(140 + n * 60, lb, lf);
          r = lerp(r, 240, ice); gg = lerp(gg, 245, ice); b = lerp(b, 250, ice);
          put(i, r, gg, b);
          break;
        }
        case "clouds": { const v = fbm2(nx * 1.6 + 4, ny * 2.2, 4, 77); const al = clamp((v - 0.52) * 4, 0, 1); d[i] = 255; d[i + 1] = 255; d[i + 2] = 255; d[i + 3] = al * 230; break; }
        case "mars": {
          let r = 190 + n * 40, gg = 92 + n * 30, b = 52 + n * 20;
          const dk = smooth(clamp((n2 - 0.57) * 8, 0, 1)); r -= 50 * dk; gg -= 30 * dk; b -= 15 * dk;
          const ic = smooth(clamp((pole - 0.83) * 14, 0, 1)); r = lerp(r, 240, ic); gg = lerp(gg, 236, ic); b = lerp(b, 230, ic);
          const vx = sx2 - 150, vy = sy2 - 70; if(Math.abs(vy) < 3 && vx > -30 && vx < 30){ const f = 1 - Math.abs(vy) / 3; r -= 60 * f; gg -= 35 * f; }
          const ox = sx2 - 90, oy = sy2 - 52; const od = Math.hypot(ox, oy); if(od < 9){ r += od < 3 ? 30 : -25; gg += od < 3 ? 20 : -15; }
          put(i, r, gg, b); break;
        }
        case "jupiter": {
          const bands = Math.sin(lat * 13 + n * 2.6);
          let r = 200 + bands * 30, gg = 170 + bands * 30, b = 130 + bands * 25;
          if(bands < -0.4){ r -= 40; gg -= 45; b -= 40; }
          const sx = sx2 - 170, sy = sy2 - 78, sd = (sx * sx) / 320 + (sy * sy) / 60;
          if(sd < 1){ r = 205 - sd * 30; gg = 90 + sd * 40; b = 60 + sd * 30; }
          put(i, r, gg, b); break;
        }
        case "saturn": {
          /* pale gold bands, a darker belt at the equator, grey-blue poles */
          const b1 = Math.sin(lat * 10 + n * 1.5), b2 = Math.sin(lat * 23 + n2 * 2) * 0.5;
          let r = 222 + b1 * 22 + b2 * 10, gg = 196 + b1 * 22 + b2 * 9, b = 138 + b1 * 18 + b2 * 6;
          if(Math.abs(lat) < 0.12){ r -= 16; gg -= 20; b -= 18; }
          const pd = smooth(clamp((pole - 0.6) * 3, 0, 1)) * 0.6;
