<!doctype html><html><head><meta charset="utf-8"><title>THE MASK look</title>
<style>html,body{margin:0;background:#000;overflow:hidden}</style></head><body>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { buildRoom, ROOM, maskStand } from './src/room.js';
import { buildMask } from './src/mask.js';
import { buildHand } from './src/hands.js';
import { loadCopyBase, makeCopy } from './src/copy.js';

const q = new URLSearchParams(location.search), shot = +(q.get('shot') || 1);
const r = new THREE.WebGLRenderer({ antialias: true });
r.setSize(innerWidth, innerHeight); r.setPixelRatio(1);
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.NoToneMapping;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0b0a10);
scene.fog = new THREE.Fog(0x120c12, 7, 18);
const cam = new THREE.PerspectiveCamera(+(q.get('fov') || 72), innerWidth / innerHeight, 0.02, 60);

const room = await buildRoom(scene, '');
const date = new Date(2026, 10, 3, 22, 47, 18);
const T = +(q.get('t') || 3.2);

const mask = buildMask();
const handR = buildHand('right'), handL = buildHand('left');
await loadCopyBase('assets/kk_adv/Rogue_Hooded.glb');

// point a glove: fingers along f, palm facing p
function orient(o, f, p) {
  const z = new THREE.Vector3(...f).normalize().negate();
  let y = new THREE.Vector3(...p).normalize().negate();
  const x = new THREE.Vector3().crossVectors(y, z).normalize(); y = new THREE.Vector3().crossVectors(z, x);
  o.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, y, z));
}
const stand = maskStand(); stand.position.set(-0.17, 0.76, -0.52); stand.rotation.y = -0.42; scene.add(stand);
// put a glove on the mask: wrist + finger/palm directions given in the mask's own space
function holdMask(hand, wrist, f, p) {
  orient(hand, f, p);
  hand.quaternion.premultiply(mask.quaternion);
  hand.position.copy(mask.localToWorld(new THREE.Vector3(...wrist)));
}
if (shot === 1 || shot === 4) {
  // the room: the mask waiting on its stand
  stand.add(mask); mask.position.copy(stand.userData.maskAt); mask.rotation.x = -0.12;
  if (shot === 1) { cam.position.set(-1.35, 1.62, 2.55); cam.lookAt(0.15, 1.05, -1.6); }
  else { cam.fov = 50; cam.updateProjectionMatrix(); cam.position.set(-0.47, 1.12, 0.12); cam.lookAt(-0.12, 0.97, -0.62); }
} else if (shot === 2) {
  // first person: you picked the mask up
  cam.fov = 64; cam.updateProjectionMatrix();
  cam.position.set(0.0, 1.62, 1.05); cam.lookAt(0.0, 1.36, -0.4);
  mask.position.set(0.0, 1.47, 0.64); mask.rotation.set(0.33, 0.08, -0.04); scene.add(mask); mask.updateMatrixWorld();
  // both gloves on the sides of the mask: palms in, fingers up and curled behind the rim, thumbs in front
  holdMask(handR, [0.128, -0.062, -0.026], [0.05, 1, -0.2], [-1, 0, 0]); handR.userData.pose(0.75, 0.75);
  holdMask(handL, [-0.128, -0.062, -0.026], [-0.05, 1, -0.2], [1, 0, 0]); handL.userData.pose(0.75, 0.75);
  scene.add(handR, handL);
} else if (shot === 3) {
  // copies of you around the room + you punching one
  stand.add(mask); mask.position.copy(stand.userData.maskAt); mask.visible = false;
  const a = makeCopy(0x3fd0c4); a.position.set(1.68, 0.0, -2.28); a.rotation.y = -0.75; a.userData.play('Sit_Chair_Idle', 0.5); scene.add(a);
  const b = makeCopy(0xff6f8e); b.position.set(-0.75, 0, -2.3); b.rotation.y = 0.35; b.userData.play('Cheer', 0.55); scene.add(b);
  const c = makeCopy(0xb47cff); c.position.set(-2.1, 0, -0.2); c.rotation.y = 1.3; c.userData.play('Interact', 0.4); scene.add(c);
  const d = makeCopy(0x6fa8ff); d.position.set(-0.05, 0, 0.75); d.rotation.y = -0.2; d.userData.play('Walking_A', 0.3); scene.add(d);
  cam.position.set(-0.45, 1.6, 2.7); cam.lookAt(0.25, 1.0, -1.0);
}
mask.userData.update(date, 0.38);
scene.traverse((o) => { if (o.userData && o.userData.mask) o.userData.mask.userData.update(date, 0.38); });
room.update(T, 0.016, date, 0.38);
if (q.get('flash')) room.setFlash(+q.get('flash'));
room.update(T + 0.001, 0.0, date, 0.38);
r.render(scene, cam);
window.DONE = true;
</script></body></html>
