<title>Keyboard AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Chivo+Mono:wght@400;600&display=swap">
<style>
  /* Layout: one column, keycap controls on top, a long "sheet" the AI types onto below */
  :root {
    --bg: #e9ecf2;
    --panel: #f8f9fc;
    --ink: #161b26;
    --muted: #5a6274;
    --line: #cfd5e1;
    --key: #ffffff;
    --key-edge: #b7bfcf;
    --accent: #2563eb;
    --accent-ink: #ffffff;
    --stop: #c2410c;
    --sheet: #ffffff;
    --caret: #2563eb;
    --font-ui: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-type: "Chivo Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e121a; --panel: #161c27; --ink: #e6e9f0; --muted: #98a1b3; --line: #283142;
      --key: #1f2735; --key-edge: #0a0d13; --accent: #6b9bff; --accent-ink: #0b1220;
      --stop: #fb8b5b; --sheet: #121823; --caret: #6b9bff; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e121a; --panel: #161c27; --ink: #e6e9f0; --muted: #98a1b3; --line: #283142;
    --key: #1f2735; --key-edge: #0a0d13; --accent: #6b9bff; --accent-ink: #0b1220;
    --stop: #fb8b5b; --sheet: #121823; --caret: #6b9bff; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 var(--font-ui);
    padding-inline: 16px;
    padding-block: 18px 32px;
  }
  main { max-width: 760px; margin: 0 auto; display: grid; gap: 16px; }
  header { display: grid; gap: 4px; }
  h1 { margin: 0; font-size: 1.75rem; font-weight: 800; letter-spacing: -.01em; text-wrap: balance; }
  .sub { margin: 0; color: var(--muted); max-width: 60ch; }
  .controls {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    display: grid;
    gap: 14px;
  }
  .field { display: grid; gap: 6px; min-width: 0; }
  .label { font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  textarea {
    width: 100%; font: inherit; color: var(--ink); background: var(--sheet);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; resize: vertical; min-height: 60px;
  }
  textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .keys { display: flex; flex-wrap: wrap; gap: 8px; }
  .key {
    font: 600 .92rem var(--font-ui);
    color: var(--ink);
    background: var(--key);
    border: 1px solid var(--line);
    border-bottom: 3px solid var(--key-edge);
    border-radius: 9px;
    padding: 8px 12px;
    min-height: 42px;
    cursor: pointer;
  }
  .key:active { transform: translateY(2px); border-bottom-width: 1px; }
  .key[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .key:disabled { opacity: .5; cursor: default; }
  .go { flex: 1; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-size: 1.05rem; }
  .stop { flex: 1; background: var(--stop); color: #fff; border-color: var(--stop); font-size: 1.05rem; }
  .status { margin: 0; color: var(--muted); font-size: .92rem; min-height: 1.4em; }
  .sheet {
    background: var(--sheet);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 16px;
    min-height: 45vh;
    max-height: 70vh;
    overflow-y: auto;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font: 400 .95rem/1.65 var(--font-type);
    min-width: 0;
  }
  .sheet .placeholder { color: var(--muted); }
  .caret { display: inline-block; width: .6em; height: 1.15em; background: var(--caret); vertical-align: text-bottom; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
  .counter { font: 400 .8rem var(--font-type); color: var(--muted); font-variant-numeric: tabular-nums; }
  .foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
</style>

<main>
  <header>
    <h1>⌨️ Keyboard AI</h1>
    <p class="sub">Give it a topic and it types out everything about it, section after section, until you press Stop. Free with your Claude account.</p>
  </header>

  <section class="controls">
    <div class="field">
      <label class="label" for="topic">Topic</label>
      <textarea id="topic" rows="2">Tell me everything about Earth</textarea>
    </div>

    <div class="field">
      <span class="label">How long</span>
      <div class="keys" id="lengthKeys">
        <button class="key" data-len="5" aria-pressed="false">5 sections</button>
        <button class="key" data-len="15" aria-pressed="false">15 sections</button>
        <button class="key" data-len="0" aria-pressed="true">♾️ No limit</button>
      </div>
    </div>

    <div class="field">
      <span class="label">Typing speed</span>
      <div class="keys" id="speedKeys">
        <button class="key" data-speed="25" aria-pressed="false">🐢 Slow</button>
        <button class="key" data-speed="70" aria-pressed="true">🙂 Normal</button>
        <button class="key" data-speed="250" aria-pressed="false">⚡ Fast</button>
      </div>
    </div>

    <div class="keys">
      <button class="key go" id="go">▶️ Start typing</button>
      <button class="key stop" id="stop" hidden>⏹ Stop</button>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
  </section>

  <div class="sheet" id="sheet"></div>

  <div class="foot">
    <div class="keys">
      <button class="key" id="copy">📋 Copy</button>
      <button class="key" id="save" hidden>💾 Save .txt</button>
      <button class="key" id="clear">🗑️ Clear</button>
    </div>
    <span class="counter" id="counter"></span>
  </div>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const sheet = $("sheet"), statusEl = $("status"), goBtn = $("go"), stopBtn = $("stop");

  const state = { len: 0, speed: 70 };
  let sample = null, downloads = null;
  let running = false, stopRequested = false, ctl = null, wakeLock = null;

  // ---------- typewriter ----------
  const textNode = document.createTextNode("");
  const caret = document.createElement("span");
  caret.className = "caret";
  let typed = "", queue = "";

  function render() {
    if (!typed && !queue && !running) {
      sheet.innerHTML = '<span class="placeholder">Your writing will be typed out here, letter by letter.</span>';
    } else {
      textNode.data = typed;
      if (sheet.firstChild !== textNode) sheet.replaceChildren(textNode);
      if (running) sheet.appendChild(caret); else caret.remove();
    }
    const words = typed.trim() ? typed.trim().split(/\s+/).length : 0;
    $("counter").textContent = words ? words.toLocaleString() + " words" : "";
  }

  let last = performance.now(), carry = 0;
  function tick(now) {
    const dt = Math.min(0.25, (now - last) / 1000);
    last = now;
    if (queue) {
      carry += dt * state.speed;
      const n = Math.min(queue.length, Math.floor(carry));
      if (n > 0) {
        carry -= n;
        const nearBottom = sheet.scrollHeight - sheet.scrollTop - sheet.clientHeight < 80;
        typed += queue.slice(0, n);
        queue = queue.slice(n);
        render();
        if (nearBottom) sheet.scrollTop = sheet.scrollHeight;
        if (!queue) saveLocal();
      }
    } else carry = 0;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  const type = (t) => { queue += t; };

  // ---------- per-viewer memory ----------
  function saveLocal() {
    try { localStorage.setItem("kai", JSON.stringify({ typed, topic: $("topic").value, ...state })); } catch {}
  }
  try {
    const s = JSON.parse(localStorage.getItem("kai") || "null");
    if (s) { typed = s.typed || ""; if (s.topic) $("topic").value = s.topic; state.len = s.len ?? 0; state.speed = s.speed ?? 70; }
  } catch {}

  function pick(groupId, attr, key) {
    const btns = $(groupId).querySelectorAll("button");
    btns.forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset[attr]) === state[key])));
    btns.forEach((b) => b.addEventListener("click", () => {
      state[key] = Number(b.dataset[attr]);
      btns.forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      saveLocal();
    }));
  }
  pick("lengthKeys", "len", "len");
  pick("speedKeys", "speed", "speed");
  $("topic").addEventListener("change", saveLocal);
  render();

  // ---------- Claude ----------
  const setStatus = (m) => { statusEl.textContent = m; };

  const errorCopy = {
    not_granted: "Keyboard AI needs your OK to use Claude. Reload the page and tap Allow.",
    sampling_disabled: "Claude isn't available on this account.",
    rate_limited: "You've hit your Claude usage limit for now. Try again a bit later.",
    session_expired: "You're signed out. Sign in to Claude and reload.",
    refused: "Claude won't write about that topic. Try a different one.",
  };
  const copyFor = (code) => errorCopy[code] || "The connection dropped. Press Start to keep going.";

  function waitForTyping() {
    return new Promise((res) => {
      const check = () => (!queue || stopRequested) ? res() : setTimeout(check, 120);
      check();
    });
  }

  async function makeOutline(topic, covered) {
    const prompt = covered.length === 0
      ? `A reader asked: "${topic}". Plan a thorough write-up that starts with the basics and gets deeper. ` +
        `Reply with only a JSON array of 8 short section titles (strings).`
      : `A reader asked: "${topic}". These sections are already written: ${JSON.stringify(covered.slice(-60))}. ` +
        `Plan 8 NEW sections that go deeper or cover things not yet covered, and never repeat one. ` +
        `If there is honestly nothing worthwhile left, reply with []. Reply with only a JSON array of short titles (strings).`;
    ctl = new AbortController();
    const list = await sample.json(prompt, { signal: ctl.signal, modelTier: "quick", cache: false });
    return Array.isArray(list) ? list.map(String).filter((t) => t.trim()).slice(0, 8) : [];
  }

  async function writeSection(topic, title, covered) {
    const prompt =
      `A reader asked: "${topic}". You are writing one section of a long write-up that gets typed out live.\n` +
      `Section to write now: "${title}".\n` +
      (covered.length ? `Already written (don't repeat them): ${JSON.stringify(covered.slice(-30))}.\n` : "") +
      `Write 3 to 5 rich paragraphs with real facts, numbers and examples. Plain text only: no markdown, ` +
      `no #, no asterisks, no title line. Use simple dashes if you need a list.`;
    ctl = new AbortController();
    let shown = 0;
    const { text } = await sample(prompt, {
      signal: ctl.signal,
      cache: false,
      onText: ({ text }) => { type(text.slice(shown)); shown = text.length; },
    });
    if (text.length > shown) type(text.slice(shown));
  }

  async function run() {
    const topic = $("topic").value.trim();
    if (!topic) { setStatus("✏️ Type a topic first."); $("topic").focus(); return; }
    if (!sample) { setStatus("Open this page in the Claude app or claude.ai so it can use Claude."); return; }

    running = true; stopRequested = false;
    goBtn.hidden = true; stopBtn.hidden = false;
    $("clear").disabled = true;
    try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}
    if (typed && !typed.endsWith("\n\n")) type("\n\n");
    type(topic.toUpperCase() + "\n\n");
    render();

    const covered = [];
    let failed = false;
    try {
      outer: while (!stopRequested) {
        setStatus(covered.length ? "🔎 Finding deeper things to write about..." : "📝 Planning what to write... (Claude thinks first, this can take a few seconds)");
        const outline = await makeOutline(topic, covered);
        if (!outline.length) { setStatus("✅ Claude says it has covered everything worth saying!"); break; }
        for (const title of outline) {
          if (stopRequested) break outer;
          if (state.len && covered.length >= state.len) break outer;
          setStatus(`⌨️ Writing section ${covered.length + 1}${state.len ? " of " + state.len : ""}: ${title}`);
          type(`${covered.length + 1}. ${title.toUpperCase()}\n\n`);
          await writeSection(topic, title, covered);
          type("\n\n");
          covered.push(title);
          await waitForTyping();
        }
        if (state.len && covered.length >= state.len) break;
      }
    } catch (e) {
      if (e && e.code !== "cancelled") { failed = true; setStatus("⚠️ " + copyFor(e && e.code)); }
    }

    await waitForTyping();
    if (!failed) {
      if (stopRequested) setStatus(`⏹ Stopped after ${covered.length} section${covered.length === 1 ? "" : "s"}.`);
      else if (!statusEl.textContent.startsWith("✅")) setStatus(`✅ Done! Typed ${covered.length} sections.`);
    }
    running = false;
    goBtn.hidden = false; stopBtn.hidden = true;
    $("clear").disabled = false;
    try { await wakeLock?.release(); } catch {}
    wakeLock = null;
    render(); saveLocal();
  }

  goBtn.addEventListener("click", run);
  stopBtn.addEventListener("click", () => {
    stopRequested = true;
    ctl?.abort();
    typed += queue; queue = "";
    render();
    setStatus("Stopping...");
  });

  // ---------- output ----------
  $("copy").addEventListener("click", async () => {
    const all = typed + queue;
    try { await navigator.clipboard.writeText(all); setStatus("📋 Copied! Paste it anywhere."); }
    catch {
      const r = document.createRange(); r.selectNodeContents(sheet);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      setStatus("Text selected. Use your phone's Copy.");
    }
  });
  $("save").addEventListener("click", async () => {
    try { await downloads.save({ filename: "keyboard-ai.txt", data: typed + queue }); } catch {}
  });
  $("clear").addEventListener("click", () => {
    if (running) return;
    typed = ""; queue = ""; render(); saveLocal(); setStatus("");
  });

  // ---------- connect to Claude ----------
  if (!window.claude) {
    setStatus("Open this page through its claude.ai link so it can use Claude.");
    return;
  }
  setStatus("Connecting to Claude...");
  claude.use("sample").then((s) => {
    sample = s;
    setStatus(s ? "Ready! Press ▶️ Start typing." : "Claude isn't available here. Open the link in the Claude app or claude.ai while signed in.");
  });
  claude.use("downloads").then((d) => { downloads = d; $("save").hidden = !d; });
})();
</script>
