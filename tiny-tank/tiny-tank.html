<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TINY TANK</title>
<style>
:root{
  --bg:#0d1014;--panel:rgba(18,22,28,.92);--panel2:rgba(28,34,42,.95);--line:rgba(255,255,255,.09);
  --text:#e8edf2;--dim:#93a0ad;--acc:#7fd3ff;--acc2:#ffd27f;--bad:#ff6b6b;--good:#7dffa8;--warn:#ffb35c;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.35 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;user-select:none}
canvas#view{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
button{font:inherit;color:inherit;background:#26303b;border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{background:#31404e}
button.on{background:#2d5d78;border-color:#5fb6e6}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{font:inherit;color:var(--text);background:#151a20;border:1px solid var(--line);border-radius:7px;padding:6px 8px}
input[type=range]{padding:0}
.hidden{display:none!important}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.45);backdrop-filter:blur(6px)}

/* ---------- main menu ---------- */
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;background:radial-gradient(ellipse at center,rgba(10,14,18,.35),rgba(5,7,9,.85))}
#menuBox{width:min(440px,92vw);padding:30px 30px 24px;text-align:center}
#logo{position:relative;margin:0 auto 6px;width:360px;max-width:100%;height:120px}
#logo canvas{width:100%;height:100%}
#menuBox .sub{color:var(--dim);margin:-2px 0 20px;font-size:13px;letter-spacing:.5px}
#menuBox .big{display:block;width:100%;margin:8px 0;padding:12px;font-size:16px;letter-spacing:1px}
#menuBox .foot{margin-top:14px;color:var(--dim);font-size:12px}

/* ---------- dialogs ---------- */
.dlgWrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:60;background:rgba(0,0,0,.45)}
.dlg{width:min(560px,94vw);max-height:88vh;overflow:auto;padding:20px 22px}
.dlg h2{margin:0 0 12px;font-size:19px;letter-spacing:.5px}
.dlg h3{margin:16px 0 6px;font-size:14px;color:var(--acc2);text-transform:uppercase;letter-spacing:1px}
.row{display:flex;align-items:center;gap:10px;margin:7px 0}
.row label{flex:1;color:var(--dim)}
.row .ctl{flex:1.3;display:flex;gap:6px;align-items:center}
.row .ctl > *{flex:1}
.dlg .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.note{font-size:12px;color:var(--dim);margin:4px 0 8px}
.slot{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;margin:6px 0;background:#161b21}
.slot .meta{flex:1}
.slot .meta b{display:block}
.slot .meta span{color:var(--dim);font-size:12px}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud > *{pointer-events:auto}
#topbar{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:6px 10px}
#clock{min-width:150px;text-align:center;font-weight:600;letter-spacing:.5px}
#clock small{display:block;color:var(--dim);font-weight:400;font-size:11px}
#topbar button{padding:5px 9px;min-width:34px}
#popInfo{color:var(--dim);font-size:12px;padding:0 6px}
#tools{position:absolute;left:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:5px;padding:7px}
#tools button{width:118px;text-align:left;padding:6px 9px;font-size:13px;display:flex;justify-content:space-between}
#tools button kbd{color:var(--dim);font:11px monospace}
#paintOpts{display:flex;flex-direction:column;gap:4px;padding-top:4px;border-top:1px solid var(--line);margin-top:3px}
#paintOpts .sw{display:flex;gap:4px}
#paintOpts .sw button{width:auto;flex:1;padding:4px;font-size:11px;justify-content:center}
#rightCol{position:absolute;right:10px;top:10px;bottom:10px;width:300px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#rightCol > *{pointer-events:auto}
#news{flex:0 1 auto;max-height:38vh;overflow:auto;padding:8px 10px}
#news h4,#info h4{margin:0 0 6px;font-size:12px;color:var(--acc2);letter-spacing:1.2px;text-transform:uppercase}
.ni{padding:4px 6px;border-radius:6px;font-size:12.5px;cursor:pointer;border-left:3px solid transparent}
.ni:hover{background:rgba(255,255,255,.06)}
.ni .t{color:var(--dim);font-size:11px;margin-right:5px}
.ni.bad{border-left-color:var(--bad)}.ni.good{border-left-color:var(--good)}.ni.love{border-left-color:#ff8fd0}.ni.warn{border-left-color:var(--warn)}
#info{overflow:auto;padding:10px 12px;flex:0 1 auto;max-height:58vh}
#info .nm{font-size:17px;font-weight:700}
#info .sub{color:var(--dim);font-size:12px;margin-bottom:6px}
.bar{height:8px;border-radius:5px;background:#0b0e12;overflow:hidden;margin:2px 0 6px}
.bar i{display:block;height:100%;border-radius:5px}
.kv{display:flex;justify-content:space-between;font-size:12.5px;margin:2px 0}
.kv span:first-child{color:var(--dim)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0}
.tag{font-size:11px;padding:2px 7px;border-radius:10px;background:#26303b;border:1px solid var(--line)}
.tag.bad{background:#4a1f24;border-color:#7a2f36}.tag.good{background:#1d4430;border-color:#2d6b49}
#info .think{font-style:italic;color:#c9d6e2;margin:6px 0;font-size:12.5px}
#info .btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
#info .btns button{flex:1;padding:6px}
#bottomBar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:8px;padding:6px 8px}
#bottomBar button{padding:8px 14px}
#hint{position:absolute;left:50%;bottom:66px;transform:translateX(-50%);padding:6px 12px;font-size:12.5px;color:#dfe8f0;pointer-events:none;white-space:nowrap}
#fps{position:absolute;left:10px;top:10px;font:12px monospace;color:var(--good);padding:3px 7px}
#toast{position:absolute;left:50%;top:62px;transform:translateX(-50%);padding:8px 14px;font-size:13px;pointer-events:none;transition:opacity .3s}

/* ---------- spawn menu ---------- */
#spawn{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);width:min(860px,calc(100vw - 460px));min-width:520px;max-height:56vh;display:flex;flex-direction:column}
#spawnTabs{display:flex;gap:4px;padding:8px 8px 0;flex-wrap:wrap}
#spawnTabs button{padding:6px 11px;font-size:13px;border-bottom-left-radius:0;border-bottom-right-radius:0}
#spawnBody{padding:10px;overflow:auto;border-top:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:7px}
.card{background:#161b21;border:1px solid var(--line);border-radius:9px;padding:6px;cursor:pointer;text-align:center;font-size:12px}
.card:hover{border-color:#5fb6e6;background:#1b232c}
.card.sel{border-color:var(--acc2);background:#2a2618}
.card canvas{width:100%;height:70px;display:block;border-radius:6px;background:#0f1317;margin-bottom:4px}
.card b{display:block;font-size:12.5px}
.card span{color:var(--dim);font-size:11px}
#maker{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
#maker .row{margin:3px 0}
#maker .row label{flex:.8}

/* ---------- talk ---------- */
#talk{position:absolute;left:150px;bottom:62px;width:380px;height:330px;display:flex;flex-direction:column}
#talkHead{padding:8px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
#talkHead b{flex:1}
#talkLog{flex:1;overflow:auto;padding:8px 10px;font-size:13px}
#talkLog .m{margin:5px 0;padding:6px 9px;border-radius:9px;max-width:88%}
#talkLog .me{background:#24435a;margin-left:auto}
#talkLog .them{background:#2a2f36}
#talkLog .sys{color:var(--dim);font-size:11.5px;text-align:center;max-width:100%}
#talkForm{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
#talkForm input{flex:1}

/* ---------- bubbles ---------- */
#bubbles{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.bub{position:absolute;transform:translate(-50%,-100%);background:#fff;color:#1a1f25;padding:4px 8px;border-radius:10px;font-size:12px;max-width:190px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.35);white-space:normal;line-height:1.25}
.bub:after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-top-color:#fff;border-bottom:0}
.bub.think{background:#e9edf2;color:#55606b;font-style:italic}
.bub.yell{background:#ffe1e1;color:#7a1010;font-weight:700}
.bub.you{background:#d9f1ff}
.lbl{position:absolute;transform:translate(-50%,-100%);font-size:11px;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000;white-space:nowrap}
.icon{position:absolute;transform:translate(-50%,-100%);width:16px;height:16px;pointer-events:none}

#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:70;transition:opacity .8s}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:80;background:#0d1014;color:var(--dim);font-size:14px;letter-spacing:1px}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
}}

<body>
<canvas id="view" tabindex="0"></canvas>
<div id="vignette" style="position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.42) 100%)"></div>
<div id="bubbles"></div>

<div id="hud" class="hidden">
  <div id="fps" class="panel hidden">-- fps</div>
  <div id="topbar" class="panel">
    <button id="bPause" title="Pause (Space)">II</button>
    <button data-spd="1" class="on" title="Speed 1x">1x</button>
    <button data-spd="2" title="Speed 2x">2x</button>
    <button data-spd="5" title="Speed 5x">5x</button>
    <button data-spd="20" title="Speed 20x">20x</button>
    <div id="clock">Day 1 08:00<small>Spring</small></div>
    <button id="bLights" title="Cage lamp: auto / on / off (L)">Lamp: Auto</button>
    <button id="bHeat" title="Heat lamp on/off (H)">Heat: Off</button>
    <span id="popInfo">0 people</span>
    <button id="bMenu" title="Menu (Esc)">Menu</button>
  </div>
  <div id="tools" class="panel">
    <button data-tool="hand" class="on">Hand <kbd>1</kbd></button>
    <button data-tool="flick">Flick <kbd>2</kbd></button>
    <button data-tool="squish">Squish <kbd>3</kbd></button>
    <button data-tool="medicine">Medicine <kbd>4</kbd></button>
    <button data-tool="tweezers">Tweezers <kbd>5</kbd></button>
    <button data-tool="paint">Paint floor <kbd>6</kbd></button>
    <button data-tool="mist">Mist sprayer <kbd>7</kbd></button>
    <button data-tool="talk">Talk <kbd>T</kbd></button>
    <div id="paintOpts" class="hidden">
      <div class="sw">
        <button data-paint="1" class="on">Dirt</button><button data-paint="2">Grass</button>
      </div>
      <div class="sw">
        <button data-paint="3">Sand</button><button data-paint="4">Water</button>
      </div>
      <div class="sw"><button data-brush="-">Brush -</button><button data-brush="+">Brush +</button></div>
    </div>
  </div>
  <div id="rightCol">
    <div id="info" class="panel hidden"></div>
    <div id="news" class="panel"><h4>News</h4><div id="newsList"></div></div>
  </div>
  <div id="bottomBar" class="panel">
    <button id="bSpawn" title="Spawn menu (Tab)">Spawn menu <kbd style="color:#93a0ad;font:11px monospace">Tab</kbd></button>
    <button id="bJar" title="Look at the timeout jar">Timeout jar</button>
    <button id="bCenter" title="Center camera (C)">Center</button>
  </div>
  <div id="spawn" class="panel hidden">
    <div id="spawnTabs"></div>
    <div id="spawnBody"></div>
  </div>
  <div id="talk" class="panel hidden">
    <div id="talkHead"><b id="talkName">-</b><span id="talkMode" class="tag">built-in brain</span><button id="talkClose">X</button></div>
    <div id="talkLog"></div>
    <form id="talkForm"><input id="talkIn" placeholder="Say something..." autocomplete="off" maxlength="300"><button>Send</button></form>
  </div>
  <div id="hint" class="panel hidden"></div>
  <div id="toast" class="panel hidden"></div>
</div>

<div id="menu">
  <div id="menuBox" class="panel">
    <div id="logo"><canvas id="logoCv" width="720" height="240"></canvas></div>
    <div class="sub">a glass tank full of tiny people</div>
    <button class="big" id="mNew">New Tank</button>
    <button class="big" id="mLoad">Load</button>
    <button class="big" id="mSettings">Settings</button>
    <button class="big hidden" id="mResume">Resume</button>
    <button class="big hidden" id="mSave">Save</button>
    <button class="big hidden" id="mQuit">Quit to title</button>
    <div class="foot" id="menuFoot">PC: mouse + keyboard</div>
  </div>
</div>

<div id="dlg" class="dlgWrap hidden"><div class="dlg panel" id="dlgBox"></div></div>
<div id="fade"></div>
<div id="loading">loading...</div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* =====================================================================
   TINY TANK
   One file. Units are centimeters. The cage floor surface is y = 0.
   An adult tiny person is about 1.8 cm tall (1:100 scale).
   ===================================================================== */

const $ = id => document.getElementById(id);
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const chance = p => Math.random() < p;
const dist2 = (ax, az, bx, bz) => { const dx = ax - bx, dz = az - bz; return Math.sqrt(dx * dx + dz * dz); };
const angLerp = (a, b, t) => { let d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI; return a + d * t; };
let uidCounter = 1;
const uid = () => uidCounter++;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const CAGE = { hx: 40, hz: 25, h: 40 };          // inner half sizes, height
const JAR = { x: 66, z: -8, r: 7, h: 14 };        // timeout jar on the bench, floor y = 0
const BENCH_Y = -3.6;                              // top of the workbench
const GROUND_Y = -93;                              // garage floor
const DAY_SECONDS = 1200;                          // 20 real minutes per in-game day at 1x
const HOUR = DAY_SECONDS / 24;

/* ---------------- settings (per browser) ---------------- */
const DEFAULT_SETTINGS = {
  quality: 'auto', shadows: true, fps: false, music: 0.5, sfx: 0.8, voices: 0.7, ambience: 0.6,
  gore: 'max', subtitles: true, apiKey: '', aiModel: 'claude-opus-5-5', aiPeopleChats: true,
  aiDailyLimit: 1.00, popCap: 45, growDays: 3, invertZoom: false
};
let S = { ...DEFAULT_SETTINGS };
try { Object.assign(S, JSON.parse(localStorage.getItem('tinytank_settings') || '{}')); } catch (e) { }
function saveSettings() { try { localStorage.setItem('tinytank_settings', JSON.stringify(S)); } catch (e) { } }

/* ======================================================================
   AUDIO (all synthesized, nothing to download)
   ====================================================================== */
const AU = {
  ctx: null, master: null, sfx: null, music: null, voice: null, amb: null, noiseBuf: null,
  rainGain: null, humGain: null, musicTimer: 0, musicStep: 0, nextNote: 0, started: false,
  init() {
    if (this.ctx) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    const c = this.ctx;
    this.master = c.createGain(); this.master.connect(c.destination);
    const comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    comp.connect(this.master);
    this.sfx = c.createGain(); this.sfx.connect(comp);
    this.voice = c.createGain(); this.voice.connect(comp);
    this.music = c.createGain(); this.music.connect(comp);
    this.amb = c.createGain(); this.amb.connect(comp);
    this.applyVolumes();
    const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = buf;
    // garage hum + air
    const hum = c.createOscillator(); hum.frequency.value = 60; hum.type = 'sine';
    const hum2 = c.createOscillator(); hum2.frequency.value = 120; hum2.type = 'sine';
    this.humGain = c.createGain(); this.humGain.gain.value = 0.012;
    const h2g = c.createGain(); h2g.gain.value = 0.4;
    hum.connect(this.humGain); hum2.connect(h2g); h2g.connect(this.humGain); this.humGain.connect(this.amb);
    hum.start(); hum2.start();
    const air = c.createBufferSource(); air.buffer = buf; air.loop = true;
    const airF = c.createBiquadFilter(); airF.type = 'lowpass'; airF.frequency.value = 400;
    const airG = c.createGain(); airG.gain.value = 0.02;
    air.connect(airF); airF.connect(airG); airG.connect(this.amb); air.start();
    // rain (mist sprayer)
    const rain = c.createBufferSource(); rain.buffer = buf; rain.loop = true;
    const rf = c.createBiquadFilter(); rf.type = 'bandpass'; rf.frequency.value = 3500; rf.Q.value = 0.6;
    this.rainGain = c.createGain(); this.rainGain.gain.value = 0;
    rain.connect(rf); rf.connect(this.rainGain); this.rainGain.connect(this.sfx); rain.start();
    this.started = true;
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  applyVolumes() {
    if (!this.ctx) return;
    this.sfx.gain.value = S.sfx; this.voice.gain.value = S.voices; this.music.gain.value = S.music * 0.55; this.amb.gain.value = S.ambience;
  },
  // distance attenuation from the camera, in cm
  att(pos) {
    if (!pos) return 1;
    const d = camera.position.distanceTo(pos);
    return clamp(40 / (d + 10), 0.03, 1);
  },
  tone(f, dur, { type = 'sine', gain = 0.2, attack = 0.005, slide = 0, out = null, when = 0, q = 0, filter = 0 } = {}) {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime + when;
    const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain), t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = o;
    if (filter) { const fl = c.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = filter; fl.Q.value = q; o.connect(fl); node = fl; }
    node.connect(g); g.connect(out || this.sfx); o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, { gain = 0.2, freq = 2000, q = 1, type = 'bandpass', attack = 0.002, out = null, when = 0, slide = 0 } = {}) {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime + when;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.playbackRate.value = rand(0.8, 1.2);
    const f = c.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (slide) f.frequency.exponentialRampToValueAtTime(Math.max(40, freq * slide), t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain), t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(out || this.sfx);
    s.start(t, rand(0, 1.5)); s.stop(t + dur + 0.05);
  },
  // ---- named sounds ----
  glassTap(pos) { const a = this.att(pos); this.tone(2400 + rand(400), 0.35, { type: 'sine', gain: 0.18 * a }); this.tone(5200 + rand(600), 0.18, { gain: 0.06 * a }); this.noise(0.03, { gain: 0.12 * a, freq: 4000 }); },
  clink(pos, v = 1) { const a = this.att(pos) * clamp(v, 0.2, 1); this.tone(3800 + rand(800), 0.12, { gain: 0.07 * a }); },
  thud(pos, v = 1) { const a = this.att(pos) * clamp(v, 0.15, 1); this.noise(0.12, { gain: 0.25 * a, freq: 300, q: 0.8, type: 'lowpass' }); this.tone(90, 0.12, { gain: 0.12 * a, slide: 0.5 }); },
  plasticDrop(pos) { const a = this.att(pos); this.noise(0.05, { gain: 0.2 * a, freq: 2500, q: 2 }); this.tone(900 + rand(300), 0.06, { type: 'triangle', gain: 0.08 * a }); },
  step(pos) { const a = this.att(pos); if (a < 0.12) return; this.noise(0.025, { gain: 0.035 * a, freq: 3000 + rand(1500), q: 3 }); },

/* ---------- periodic world stuff ---------- */
let homesT = 0, hourT = 0, hoverT = 0, autosaveT = 60;
function worldTick(gdt, gh) {
  homesT -= gdt; if (homesT <= 0) { homesT = 4; world.assignHomes(); }
  hourT += gh;
  if (hourT >= 1) { hourT -= 1; hourlyTick(); }
  if (world.rainT > 0) world.rainT -= gh;
  for (const it of items) if (it.claim && it.claimT > 0) { it.claimT -= gdt; if (it.claimT <= 0 && !(it.claim.job && it.claim.job.item === it)) it.claim = null; }
}
function hourlyTick() {

      const m = byId(w.partner); if (!m || m.dead || m.sex !== 'm' || m.stage !== 'adult') continue;

      if ((w.r(m.id).love + m.r(w.id).love) / 2 < 60 || w.health < 40) continue;

/* ---------- auto graphics ---------- */
