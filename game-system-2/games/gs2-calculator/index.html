<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<style>
  :root {
    --bg: #070910; --panel: #0e1220; --key: #161b2e; --key-hi: #1f2640; --line: rgba(255,255,255,.08);
    --text: #eef1ff; --muted: #8d93b5; --cyan: #00e5ff; --pink: #ff2bd6; --bad: #ff3d6e;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; }
  body { display: flex; flex-direction: column; }
  .wrap { flex: 1; display: flex; min-height: 0; }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 10px; gap: 10px; }
  .top { display: flex; gap: 6px; align-items: center; }
  .pill { border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 20px; padding: 5px 12px; font-family: inherit; font-size: 12px; font-weight: 600; line-height: 1; letter-spacing: .08em; cursor: pointer; }
  .pill.on { color: #04050a; background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 12px rgba(0,229,255,.5); }
  .pill:focus-visible, .key:focus-visible, .hist-item:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .grow { flex: 1; }
  .screen {
    background: radial-gradient(ellipse at 80% 0%, rgba(0,229,255,.12), transparent 60%), linear-gradient(180deg, #0c1020, #080a14);
    border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; text-align: right; min-height: 104px;
    display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; overflow: hidden;
  }
  .expr { color: var(--muted); font-size: 20px; min-height: 26px; white-space: nowrap; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; direction: ltr; }
  .expr::-webkit-scrollbar { display: none; }
  .expr .cur { display: inline-block; width: 2px; height: 1.1em; vertical-align: -.2em; background: var(--cyan); margin-left: 2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .res { font-size: 44px; font-weight: 700; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; letter-spacing: -.01em; }
  .res.preview { color: rgba(238,241,255,.45); font-size: 30px; }
  .res.err { color: var(--bad); font-size: 22px; }
  .res.flash { animation: flash .35s ease; }
  @keyframes flash { from { text-shadow: 0 0 22px rgba(0,229,255,.9); } }
  .pads { flex: 1; display: flex; gap: 8px; min-height: 0; }
  .pad { display: grid; gap: 8px; flex: 1; min-height: 0; }
  .basic { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(5, 1fr); flex: 4; }
  .sci { grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); flex: 5; display: none; }
  body.sci-on .sci { display: grid; }
  .key {
    border: 0; border-radius: 14px; background: var(--key); color: var(--text); font-family: inherit; font-size: 24px; font-weight: 600; line-height: 1; cursor: pointer;
    box-shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 4px 10px rgba(0,0,0,.35); transition: background .12s, transform .08s;
    min-height: 0; min-width: 0; padding: 0; touch-action: manipulation;
  }
  .key:hover { background: var(--key-hi); }
  .key:active, .key.down { transform: scale(.94); background: var(--key-hi); }
  .key.op { color: var(--cyan); font-size: 31px; font-weight: 500; }
  .key.fn { color: var(--muted); font-size: 19px; }
  .key.ac { color: var(--bad); }
  .key.eq { background: linear-gradient(135deg, var(--cyan), var(--pink)); color: #04050a; font-size: 34px; font-weight: 500; box-shadow: 0 0 18px rgba(255,43,214,.35); }
  .sci .key { font-size: 16px; color: #c7cbea; background: #11162a; }
  .sci .key sup { font-size: .65em; }
  .hist { width: 0; overflow: hidden; transition: width .22s ease; border-left: 1px solid transparent; background: var(--panel); display: flex; flex-direction: column; }
  body.hist-on .hist { width: min(280px, 70vw); border-left-color: var(--line); }
  @media (max-width: 560px) {
    .hist { position: absolute; right: 0; top: 0; bottom: 0; z-index: 5; box-shadow: -20px 0 40px rgba(0,0,0,.6); }
    body.hist-on .hist { width: min(300px, 88vw); }
  }
  .hist-head { display: flex; align-items: center; padding: 12px 12px 8px; gap: 8px; font-weight: 700; font-size: 13px; letter-spacing: .1em; color: var(--muted); white-space: nowrap; }
  .hist-list { flex: 1; overflow-y: auto; padding: 0 8px 10px; }
  .hist-item { display: block; width: 100%; text-align: right; background: none; border: 0; border-radius: 10px; padding: 8px 10px; color: var(--text); cursor: pointer; font: inherit; }
  .hist-item:hover { background: rgba(255,255,255,.05); }
  .hist-item .he { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hist-item .hr { font-size: 19px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 30px 10px; white-space: normal; }
  .toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%) translateY(20px); opacity: 0; background: #1b2140; border: 1px solid rgba(0,229,255,.4); color: var(--text); padding: 8px 14px; border-radius: 20px; font-size: 13px; pointer-events: none; transition: all .2s; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  @media (max-height: 430px) { .screen { min-height: 78px; padding: 8px 12px; } .res { font-size: 32px; } .key { font-size: 18px; border-radius: 10px; } .main { gap: 6px; padding: 6px; } .pads, .pad { gap: 5px; } }
  @media (max-width: 520px) {
    body.sci-on .pads { flex-direction: column; }
    body.sci-on .sci { flex: 3; }
    body.sci-on .basic { flex: 5; }
    .res { font-size: 38px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="main">
    <div class="top">
      <button class="pill" id="b-sci" title="Science buttons">SCI</button>
      <button class="pill" id="b-deg" title="Angles in degrees or radians" hidden>DEG</button>
      <div class="grow"></div>
      <button class="pill" id="b-hist" title="History">HISTORY</button>
    </div>
    <div class="screen">
      <div class="expr" id="expr" aria-label="Calculation"></div>
      <div class="res" id="res" title="Click to copy" aria-live="polite">0</div>
    </div>
    <div class="pads">
      <div class="pad sci" id="sci"></div>
      <div class="pad basic" id="basic"></div>
    </div>
  </div>
  <aside class="hist" aria-label="History">
    <div class="hist-head">HISTORY <div class="grow"></div><button class="pill" id="b-clear-hist">CLEAR</button><button class="pill" id="b-close-hist" aria-label="Close history">✕</button></div>
    <div class="hist-list" id="hist-list"></div>
  </aside>
</div>
<div class="toast" id="toast"></div>
<script>
(function () {
  'use strict';
  /* Save Kit: inside Game System this remembers everything; outside it uses the browser */
  var GS = window.GameSystem || (function () {
    var KEY = 'gs2-calculator';
    return {
      load: function () { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } },
      autoSave: function (fn) {
        function w() { try { localStorage.setItem(KEY, JSON.stringify(fn())); } catch (e) { /* full */ } }
        setInterval(w, 3000); window.addEventListener('pagehide', w);
      }
    };
  })();

  var MAX = 300;
  var state = { expr: '', hist: [], sci: false, deg: true, done: false, ans: 0, hist_on: false, shown: '' };
  var saved = GS.load();
  if (saved && typeof saved === 'object') {
    if (typeof saved.expr === 'string') state.expr = saved.expr.slice(0, MAX);
    if (Array.isArray(saved.hist)) state.hist = saved.hist.filter(function (x) { return x && typeof x.e === 'string' && typeof x.r === 'string'; }).slice(0, 60);
    state.sci = !!saved.sci;
    state.deg = saved.deg !== false;
    state.done = !!saved.done;
    state.ans = typeof saved.ans === 'number' && isFinite(saved.ans) ? saved.ans : 0;
    state.hist_on = !!saved.hist_on;
    state.shown = typeof saved.shown === 'string' ? saved.shown.slice(0, MAX) : '';
  }
  GS.autoSave(function () { return state; }, 3);

  var $ = function (id) { return document.getElementById(id); };
  var exprEl = $('expr'), resEl = $('res');

  /* ---------------- the math ---------------- */
  function tokenize(s) {
    var out = [], i = 0;
    while (i < s.length) {
      var c = s[i];
      if (c === ' ') { i++; continue; }
      if (/[0-9.]/.test(c)) {
        var j = i;
        while (j < s.length && /[0-9.]/.test(s[j])) j++;
        if (s[j] === 'E' && /[-−0-9]/.test(s[j + 1] || '')) { j++; if (s[j] === '-' || s[j] === '−') j++; while (j < s.length && /[0-9]/.test(s[j])) j++; }
        var txt = s.slice(i, j).replace('−', '-');
        if ((txt.match(/\./g) || []).length > 1) throw new Error('Too many dots');
        out.push({ t: 'num', v: parseFloat(txt === '.' ? '0' : txt) });
        i = j; continue;
      }
      var fn = /^(asin|acos|atan|sin|cos|tan|ln|log|abs|√|∛)/.exec(s.slice(i));
      if (fn) { out.push({ t: 'fn', v: fn[1] }); i += fn[1].length; continue; }
      if (s.slice(i, i + 3) === 'Ans') { out.push({ t: 'num', v: state.ans }); i += 3; continue; }
      if (c === 'π') { out.push({ t: 'num', v: Math.PI }); i++; continue; }
      if (c === 'e') { out.push({ t: 'num', v: Math.E }); i++; continue; }
      if ('+−-×*÷/^()%!²'.indexOf(c) >= 0) {
        var map = { '-': '−', '*': '×', '/': '÷' };
        out.push({ t: 'op', v: map[c] || c }); i++; continue;
      }
      throw new Error('Unknown "' + c + '"');
    }
    return out;
  }
  function startsValue(tok) { return tok && (tok.t === 'num' || tok.t === 'fn' || (tok.t === 'op' && tok.v === '(')); }
  function parse(tokens) {
    var p = 0;
    function peek() { return tokens[p]; }
    function take() { return tokens[p++]; }
    function expr() {
      var v = term();
      while (peek() && peek().t === 'op' && (peek().v === '+' || peek().v === '−')) {
        var op = take().v, r = term();
        v = op === '+' ? v + r : v - r;
      }
      return v;
    }
    function term() {
      var v = unary();
      for (;;) {
        var t = peek();
        if (t && t.t === 'op' && (t.v === '×' || t.v === '÷')) {
          take();
          var r = unary();
          if (t.v === '÷') { if (r === 0) throw new Error('div0'); v = v / r; } else v = v * r;
        } else if (startsValue(t)) {
          v = v * unary(); /* 2π, 3(4), (1)(2) */
        } else return v;
      }
    }
    function unary() {
      var t = peek();
      if (t && t.t === 'op' && (t.v === '−' || t.v === '+')) { take(); var v = unary(); return t.v === '−' ? -v : v; }
      return power();
    }
    function power() {
      var b = postfix();
      if (peek() && peek().t === 'op' && peek().v === '^') { take(); return Math.pow(b, unary()); }
      return b;
    }
    function postfix() {
      var v = primary();
      for (;;) {
        var t = peek();
        if (!t || t.t !== 'op') return v;
        if (t.v === '%') { take(); v = v / 100; }
        else if (t.v === '²') { take(); v = v * v; }
        else if (t.v === '!') { take(); v = fact(v); }
        else return v;
      }
    }
    function primary() {
      var t = take();
      if (!t) throw new Error('incomplete');
      if (t.t === 'num') return t.v;
      if (t.t === 'fn') return fn(t.v, power());
      if (t.t === 'op' && t.v === '(') {
        var v = expr();
        var c = take();
        if (!c || c.v !== ')') throw new Error('incomplete');
        return v;
      }
      throw new Error('incomplete');
    }
    var v = expr();
    if (p < tokens.length) throw new Error('Unexpected "' + tokens[p].v + '"');
    return v;
  }
  function fact(n) {
    if (n < 0 || Math.floor(n) !== n) throw new Error('! only works on whole numbers 0 or more');
    if (n > 170) return Infinity;
    var r = 1;
    for (var i = 2; i <= n; i++) r *= i;
    return r;
  }
  function fn(name, x) {
    var k = state.deg ? Math.PI / 180 : 1;
    function clean(v) { return Math.abs(v) < 1e-12 ? 0 : v; }
    switch (name) {
      case 'sin': return clean(Math.sin(x * k));
      case 'cos': return clean(Math.cos(x * k));
      case 'tan':
        if (state.deg && Math.abs(((x % 180) + 180) % 180 - 90) < 1e-9) throw new Error('tan of that is undefined');
        return clean(Math.tan(x * k));
      case 'asin': return Math.asin(x) / k;
      case 'acos': return Math.acos(x) / k;
      case 'atan': return Math.atan(x) / k;
      case 'ln': return Math.log(x);
      case 'log': return Math.log10(x);
      case '√': return Math.sqrt(x);
      case '∛': return Math.cbrt(x);
      case 'abs': return Math.abs(x);
    }
    throw new Error('Unknown ' + name);
  }
  /* close any open brackets, then work it out */
  function closeParens(s) {
    var open = (s.match(/\(/g) || []).length - (s.match(/\)/g) || []).length;
    for (var i = 0; i < open; i++) s += ')';
    return s;
  }
  function evaluate(s) {
    var v = parse(tokenize(closeParens(s)));
    if (typeof v !== 'number' || isNaN(v)) throw new Error('nan');
    return v;
  }
  function fmt(v) {
    if (v === Infinity) return '∞';
    if (v === -Infinity) return '−∞';
    if (v === 0) return '0';
    var a = Math.abs(v);
    if (a >= 1e15 || a < 1e-9) {
      return v.toExponential(9).replace(/\.?0+e/, 'e').replace('e+', 'E').replace('e-', 'E−').replace('-', '−');
    }
    var r = Number(v.toPrecision(12));
    var s = String(Math.abs(r));
    if (/e/.test(s)) s = Math.abs(r).toFixed(12).replace(/\.?0+$/, '');
    var parts = s.split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (r < 0 ? '−' : '') + parts.join('.');
  }
  /* "1,234.5" → "1234.5" so results can be reused */
  function plain(v) {
    if (!isFinite(v)) return '';
    var r = Number(v.toPrecision(12));
    var s = String(r);
    if (/e/.test(s)) s = r.toExponential().replace('e+', 'E').replace('e-', 'E−');
    return s.replace('-', '−');
  }

  /* ---------------- typing ---------------- */
  function lastChar() { return state.expr.slice(-1); }
  function isOp(c) { return '+−×÷^'.indexOf(c) >= 0; }
  function put(s) {
    if (state.expr.length + s.length > MAX) { toast('That\'s long enough!'); return; }
    state.expr += s;
  }
  function press(k) {
    var startFresh = state.done;
    state.done = false;
    if (k === 'AC') { state.expr = ''; render(); return; }
    if (k === '⌫') {
      if (startFresh) { state.expr = ''; render(); return; }
      var m = /(asin\($|acos\($|atan\($|sin\($|cos\($|tan\($|ln\($|log\($|abs\($|√\($|∛\($|Ans$)/.exec(state.expr);
      state.expr = m ? state.expr.slice(0, -m[1].length) : state.expr.slice(0, -1);
      render(); return;
    }
    if (k === '=') { equals(); return; }
    if (/^[0-9]$/.test(k) || k === '.' || k === 'π' || k === 'e' || k === 'Ans' || /^(asin|acos|atan|sin|cos|tan|ln|log|abs|√|∛)\($/.test(k) || k === '(') {
      if (startFresh) state.expr = '';
      if (k === '.') {
        var num = /[0-9.]*$/.exec(state.expr)[0];
        if (num.indexOf('.') >= 0) return;
        if (!num) k = '0.';
      }
      if (/^[0-9]$/.test(k) && /(^|[^0-9.])0$/.test(state.expr)) state.expr = state.expr.slice(0, -1);
      put(k); render(); return;
    }
    if (k === '±') {
      /* flip the sign of the number you're typing */
      var mm = /([0-9.]+(E−?[0-9]+)?|π|e|Ans)$/.exec(state.expr);
      if (!mm) {
        if (!state.expr || isOp(lastChar()) || lastChar() === '(') { if (lastChar() !== '−') put('−'); render(); }
        return;
      }
      var head = state.expr.slice(0, -mm[0].length), numTxt = mm[0];
      var before = head.slice(-1), before2 = head.slice(-2, -1);
      if (before === '−' && (!before2 || isOp(before2) || before2 === '(')) head = head.slice(0, -1);
      else if (before === '−') head = head.slice(0, -1) + '+';
      else if (before === '+') head = head.slice(0, -1) + '−';
      else head = head + '−';
      state.expr = head + numTxt;
      render(); return;
    }
    /* operators keep going from the last answer */
    if (startFresh && state.expr === '') state.expr = plain(state.ans) || '';
    if (isOp(k)) {
      if (state.expr === '' && k !== '−') { if (!state.ans) return; state.expr = plain(state.ans); }
      if (isOp(lastChar()) && !(k === '−' && lastChar() !== '−')) state.expr = state.expr.slice(0, -1);
      if (lastChar() === '(' && k !== '−') return;
      put(k); render(); return;
    }
    if (k === ')') {
      var open = (state.expr.match(/\(/g) || []).length - (state.expr.match(/\)/g) || []).length;
      if (open <= 0 || isOp(lastChar()) || lastChar() === '(') return;
      put(')'); render(); return;
    }
    if (k === '%' || k === '!' || k === '²') {
      if (!state.expr || isOp(lastChar()) || lastChar() === '(') return;
      put(k); render(); return;
    }
    if (k === '1/x') {
      if (!state.expr) return;
      state.expr = '1÷(' + state.expr + ')';
      render(); return;
    }
  }
  function equals() {
    if (!state.expr) return;
    try {
      var v = evaluate(state.expr);
      var shown = closeParens(state.expr);
      state.hist.unshift({ e: shown, r: fmt(v) });
      if (state.hist.length > 60) state.hist.length = 60;
      state.ans = isFinite(v) ? v : 0;
      state.expr = plain(v);
      state.done = true;
      state.shown = shown;
      render({ shown: shown, value: v });
      resEl.classList.remove('flash'); void resEl.offsetWidth; resEl.classList.add('flash');
    } catch (err) {
      state.done = false;
      render({ error: message(err) });
    }
  }
  function message(err) {
    var m = err && err.message;
    if (m === 'div0') return 'Can\'t divide by 0';
    if (m === 'incomplete') return 'That\'s not finished yet';
    if (m === 'nan') return 'That has no answer';
    return m || 'Hmm, that doesn\'t work';
  }

  /* ---------------- drawing the screen ---------------- */
  function render(info) {
    info = info || {};
    if (info.shown == null && state.done && state.shown) info.shown = state.shown;
    exprEl.textContent = info.shown != null ? info.shown + ' =' : state.expr;
    if (info.shown == null) exprEl.appendChild(Object.assign(document.createElement('span'), { className: 'cur' }));
    exprEl.scrollLeft = exprEl.scrollWidth;
    resEl.className = 'res';
    if (info.error) { resEl.textContent = info.error; resEl.classList.add('err'); }
    else if (info.value != null) { resEl.textContent = fmt(info.value); }
    else if (state.done) { resEl.textContent = fmt(state.ans); }
    else {
      var preview = '';
      if (state.expr && /[+−×÷^%!²(√a-zπ]/.test(state.expr.replace(/^−/, ''))) {
        try { preview = fmt(evaluate(state.expr)); } catch (e) { preview = ''; }
      }
      if (preview) { resEl.textContent = preview; resEl.classList.add('preview'); }
      else resEl.textContent = state.expr ? (/^[−0-9.,]+$/.test(state.expr) ? fmt(parseFloat(state.expr.replace('−', '-')) || 0) : '') : '0';
    }
    document.body.classList.toggle('sci-on', state.sci);
    document.body.classList.toggle('hist-on', state.hist_on);
    $('b-sci').classList.toggle('on', state.sci);
    $('b-hist').classList.toggle('on', state.hist_on);
    $('b-deg').hidden = !state.sci;
    $('b-deg').textContent = state.deg ? 'DEG' : 'RAD';
    renderHist();
  }
  var histKey = '';
  function renderHist() {
    var key = state.hist.length + '|' + (state.hist[0] ? state.hist[0].e + state.hist[0].r : '');
    if (key === histKey) return;
    histKey = key;
    var list = $('hist-list');
    list.textContent = '';
    if (!state.hist.length) { list.appendChild(Object.assign(document.createElement('div'), { className: 'empty', textContent: 'Your answers show up here. Click one to use it again.' })); return; }
    state.hist.forEach(function (x) {
      var b = document.createElement('button');
      b.className = 'hist-item';
      b.title = 'Use this answer';
      var e = document.createElement('div'); e.className = 'he'; e.textContent = x.e + ' =';
      var r = document.createElement('div'); r.className = 'hr'; r.textContent = x.r;
      b.appendChild(e); b.appendChild(r);
      b.addEventListener('click', function () {
        var v = parseFloat(x.r.replace(/,/g, '').replace('E−', 'e-').replace('E', 'e').replace('−', '-'));
        if (state.done || !state.expr) state.expr = '';
        if (state.expr && !isOp(lastChar()) && lastChar() !== '(') state.expr += '×';
        put(isFinite(v) ? plain(v) : '');
        state.done = false;
        if (window.innerWidth <= 560) state.hist_on = false;
        render();
      });
      list.appendChild(b);
    });
  }

  /* ---------------- buttons ---------------- */
  var BASIC = [
    ['AC', 'ac', 'Clear'], ['⌫', 'fn', 'Delete'], ['%', 'op', 'Percent'], ['÷', 'op', 'Divide'],
    ['7'], ['8'], ['9'], ['×', 'op', 'Times'],
    ['4'], ['5'], ['6'], ['−', 'op', 'Minus'],
    ['1'], ['2'], ['3'], ['+', 'op', 'Plus'],
    ['±', 'fn', 'Plus/minus'], ['0'], ['.'], ['=', 'eq', 'Equals']
  ];
  var SCI = [
    ['(', null, 'Open bracket'], [')', null, 'Close bracket'], ['x²', null, 'Squared', '²'], ['xʸ', null, 'Power', '^'], ['√', null, 'Square root', '√('],
    ['sin', null, 'Sine', 'sin('], ['cos', null, 'Cosine', 'cos('], ['tan', null, 'Tangent', 'tan('], ['ln', null, 'Natural log', 'ln('], ['log', null, 'Log base 10', 'log('],
    ['sin⁻¹', null, 'Inverse sine', 'asin('], ['cos⁻¹', null, 'Inverse cosine', 'acos('], ['tan⁻¹', null, 'Inverse tangent', 'atan('], ['n!', null, 'Factorial', '!'], ['1/x', null, 'One over x', '1/x'],
    ['π', null, 'Pi'], ['e', null, 'e'], ['Ans', null, 'Last answer'], ['10ˣ', null, 'Ten to the', '10^'], ['eˣ', null, 'e to the', 'e^'],
    ['|x|', null, 'Make positive', 'abs('], ['∛', null, 'Cube root', '∛('], ['x³', null, 'Cubed', '^3'], ['EE', null, 'Times ten to the', '×10^'], ['Rand', null, 'Random number', 'rand']
  ];
  function build(container, keys) {
    keys.forEach(function (k) {
      var b = document.createElement('button');
      b.className = 'key' + (k[1] ? ' ' + k[1] : '');
      b.textContent = k[0];
      b.setAttribute('aria-label', k[2] || k[0]);
      b.dataset.k = k[3] || k[0];
      b.addEventListener('click', function () { tap(b.dataset.k); });
      container.appendChild(b);
    });
  }
  function tap(k) {
    if (k === 'rand') {
      if (state.done) state.expr = '';
      state.done = false;
      if (state.expr && !isOp(lastChar()) && lastChar() !== '(') put('×');
      put(plain(Math.round(Math.random() * 1e6) / 1e6) || '0');
      render(); return;
    }
    if (k === '^3') {
      if (!state.expr || isOp(lastChar()) || lastChar() === '(') return;
      state.done = false;
      put('^3'); render(); return;
    }
    if (k === '×10^') {
      if (!state.expr || isOp(lastChar()) || lastChar() === '(') return;
      state.done = false;
      put('×10^'); render(); return;
    }
    if (k === '10^' || k === 'e^') {
      if (state.done) state.expr = '';
      state.done = false;
      if (state.expr && !isOp(lastChar()) && lastChar() !== '(') put('×');
      put(k === '10^' ? '10^(' : 'e^(');
      render(); return;
    }
    press(k);
  }
  build($('basic'), BASIC);
  build($('sci'), SCI);

  $('b-sci').addEventListener('click', function () { state.sci = !state.sci; render(); });
  $('b-deg').addEventListener('click', function () { state.deg = !state.deg; render(); toast(state.deg ? 'Angles in degrees' : 'Angles in radians'); });
  $('b-hist').addEventListener('click', function () { state.hist_on = !state.hist_on; render(); });
  $('b-clear-hist').addEventListener('click', function () { state.hist = []; render(); });
  $('b-close-hist').addEventListener('click', function () { state.hist_on = false; render(); });
  resEl.addEventListener('click', function () {
    var txt = resEl.textContent;
    if (!txt || resEl.classList.contains('err')) return;
    var raw = txt.replace(/,/g, '').replace(/−/g, '-');
    (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(raw) : Promise.reject()).then(function () { toast('Copied ' + txt); }, function () { toast('Couldn\'t copy'); });
  });

  /* keyboard */
  var KEYMAP = { '*': '×', 'x': '×', '/': '÷', '-': '−', '+': '+', 'Enter': '=', '=': '=', 'Backspace': '⌫', 'Delete': 'AC', 'Escape': 'AC', '^': '^', '%': '%', '(': '(', ')': ')', '.': '.', ',': '.', '!': '!', 'p': 'π', 'e': 'e' };
  window.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'c' && !window.getSelection().toString()) { resEl.click(); e.preventDefault(); }
      return;
    }
    var k = /^[0-9]$/.test(e.key) ? e.key : KEYMAP[e.key];
    if (!k) return;
    e.preventDefault();
    press(k);
    var btn = document.querySelector('.key[data-k="' + (k === '^' ? '^' : k) + '"]');
    if (btn) { btn.classList.add('down'); setTimeout(function () { btn.classList.remove('down'); }, 110); }
  });
  /* paste numbers or whole sums */
  window.addEventListener('paste', function (e) {
    var t = (e.clipboardData && e.clipboardData.getData('text')) || '';
    t = t.replace(/[,\s]/g, '').replace(/\*/g, '×').replace(/\//g, '÷').replace(/-/g, '−');
    if (!t || !/^[0-9.+−×÷^()%!πe]+$/.test(t)) return;
    e.preventDefault();
    if (state.done) state.expr = '';
    state.done = false;
    put(t);
    render();
  });

  var toastTimer = 0;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1600);
  }

  render();
})();
</script>
</body>
</html>
