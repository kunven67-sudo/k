<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery</title>
<style>
  :root {
    --bg: #070910; --panel: #10142a; --hi: #182040; --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.16);
    --text: #eef1ff; --muted: #8d93b5; --acc: #5c8dff; --acc2: #b26bff; --bad: #ff3d6e;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  button, select, input { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, select:focus-visible, input:focus-visible, .tile:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .app { display: flex; flex-direction: column; height: 100%; }
  .top { display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px; flex-wrap: wrap; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, rgba(92,141,255,.08), transparent); }
  .top h1 { margin: 0 6px 0 2px; font-size: 13px; letter-spacing: .18em; color: var(--muted); font-weight: 800; }
  .grow { flex: 1; }
  .btn { border: 1px solid var(--line2); background: var(--panel); border-radius: 10px; padding: 7px 12px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; transition: background .15s, border-color .15s; white-space: nowrap; }
  .btn:hover { background: var(--hi); }
  .btn.primary { background: var(--acc); color: #04081a; border-color: var(--acc); box-shadow: 0 0 14px rgba(92,141,255,.4); }
  .btn.danger { border-color: rgba(255,61,110,.5); color: #ffb3c5; }
  .btn.danger:hover { background: var(--bad); color: #fff; }
  .btn:disabled { opacity: .45; cursor: default; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .chips::-webkit-scrollbar { display: none; }
  .chip { border: 1px solid var(--line2); background: none; border-radius: 20px; padding: 5px 12px; font-size: 12.5px; font-weight: 600; color: var(--muted); white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
  .chip.on { background: var(--acc); border-color: var(--acc); color: #04081a; }
  .chip .n { opacity: .7; font-size: 11px; }
  select { background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; padding: 6px 8px; font-size: 13px; max-width: 170px; }
  .scroll { flex: 1; overflow-y: auto; padding: 4px 12px 24px; }
  .day { margin: 14px 2px 8px; font-size: 13px; font-weight: 800; color: var(--muted); letter-spacing: .04em; display: flex; align-items: baseline; gap: 8px; }
  .day small { font-weight: 600; opacity: .7; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--tile, 150px), 1fr)); gap: 6px; }
  .tile { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: #0d1124; border: 0; padding: 0; display: block; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s; }
  .tile:hover img { transform: scale(1.04); }
  .tile .badge { position: absolute; left: 6px; bottom: 6px; display: inline-flex; align-items: center; gap: 4px; padding: 3px 7px; border-radius: 12px; background: rgba(0,0,0,.65); font-size: 11.5px; font-weight: 700; }
  .tile .badge svg { width: 12px; height: 12px; }
  .tile .kind { position: absolute; right: 6px; top: 6px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,.55); display: grid; place-items: center; }
  .tile .kind svg { width: 12px; height: 12px; }
  .tile .noimg { width: 100%; height: 100%; display: grid; place-items: center; color: var(--muted); }
  .tile .check { position: absolute; left: 6px; top: 6px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; background: rgba(0,0,0,.35); display: none; place-items: center; }
  .selecting .tile .check { display: grid; }
  .tile.sel .check { background: var(--acc); border-color: var(--acc); }
  .tile.sel { box-shadow: 0 0 0 3px var(--acc); }
  .tile.sel img { transform: scale(.92); border-radius: 8px; }
  .selbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: rgba(92,141,255,.1); }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; line-height: 1.6; }
  .empty b { display: block; color: var(--text); font-size: 18px; margin: 10px 0 4px; }
  .empty svg { width: 46px; height: 46px; color: var(--acc); }
  .foot { padding: 6px 12px; font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); display: flex; gap: 8px; }
  /* the big viewer */
  .viewer { position: fixed; inset: 0; background: #03040a; z-index: 20; display: flex; flex-direction: column; }
  .v-top { display: flex; align-items: center; gap: 6px; padding: 8px 10px; }
  .v-title { flex: 1; min-width: 0; }
  .v-title b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .v-title span { font-size: 12px; color: var(--muted); }
  .icon { width: 36px; height: 36px; padding: 0; display: inline-grid; place-items: center; border-radius: 10px; border: 1px solid transparent; background: none; color: var(--text); }
  .icon:hover { background: rgba(255,255,255,.08); }
  .icon.danger:hover { background: var(--bad); }
  .v-stage { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; padding: 6px 54px; }
  .v-stage img, .v-stage video { max-width: 100%; max-height: 100%; border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,.6); background: #000; }
  .v-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 42px; height: 64px; border-radius: 12px; border: 0; background: rgba(255,255,255,.06); display: grid; place-items: center; }
  .v-nav:hover { background: rgba(255,255,255,.14); }
  .v-nav.prev { left: 6px; } .v-nav.next { right: 6px; }
  .v-nav:disabled { opacity: .2; }
  .v-info { padding: 8px 14px 12px; font-size: 12.5px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .v-acts { display: flex; gap: 8px; justify-content: center; padding: 0 12px 14px; flex-wrap: wrap; }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(16px); opacity: 0; pointer-events: none; background: #1b2140; border: 1px solid var(--line2); padding: 9px 14px; border-radius: 22px; font-size: 13px; transition: all .2s; box-shadow: 0 10px 30px rgba(0,0,0,.5); z-index: 40; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .drop { position: fixed; inset: 8px; border: 3px dashed var(--acc); border-radius: 18px; background: rgba(92,141,255,.12); display: grid; place-items: center; font-size: 20px; font-weight: 800; z-index: 30; pointer-events: none; }
  .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; z-index: 50; padding: 16px; }
  .modal { background: var(--panel); border: 1px solid var(--line2); border-radius: 16px; padding: 18px; width: min(380px, 100%); box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  .modal h2 { margin: 0 0 8px; font-size: 17px; }
  .modal p { margin: 0 0 14px; color: var(--muted); font-size: 13.5px; line-height: 1.5; }
  .modal input { width: 100%; background: rgba(0,0,0,.3); border: 1px solid var(--line2); border-radius: 10px; padding: 9px 11px; font-size: 14px; margin-bottom: 14px; }
  .modal .row { display: flex; gap: 8px; justify-content: flex-end; }
  @media (max-width: 560px) {
    .top h1 { display: none; }
    .v-stage { padding: 4px; }
    .v-nav { display: none; }
    :root { --tile: 104px !important; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <h1>GALLERY</h1>
    <select id="game" aria-label="Show from game"><option value="">All games</option></select>
    <div class="grow"></div>
    <button class="btn" id="b-select" title="Pick several"></button>
    <button class="btn primary" id="b-add" title="Add your own photos and videos"></button>
  </div>
  <div class="selbar" id="selbar" hidden>
    <b id="sel-n">0 picked</b><div class="grow"></div>
    <button class="btn" id="b-sel-dl"></button>
    <button class="btn danger" id="b-sel-del"></button>
    <button class="btn" id="b-sel-x">Done</button>
  </div>
  <div class="chips" id="chips" role="tablist" aria-label="What to show"></div>
  <div class="scroll" id="scroll"></div>
  <div class="foot" id="foot"></div>
</div>
<div class="viewer" id="viewer" hidden role="dialog" aria-label="Picture viewer">
  <div class="v-top">
    <button class="icon" id="v-close" aria-label="Back (Esc)" title="Back (Esc)"></button>
    <div class="v-title"><b id="v-name"></b><span id="v-sub"></span></div>
    <button class="icon" id="v-rename" aria-label="Rename" title="Rename"></button>
    <button class="icon danger" id="v-del" aria-label="Delete" title="Delete"></button>
  </div>
  <div class="v-stage" id="v-stage">
    <button class="v-nav prev" id="v-prev" aria-label="Previous"></button>
    <button class="v-nav next" id="v-next" aria-label="Next"></button>
  </div>
  <div class="v-info" id="v-info"></div>
  <div class="v-acts" id="v-acts"></div>
</div>
<div class="drop" id="drop" hidden>Drop photos or videos to add them</div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="image/*,video/*" multiple hidden>

<script>
(function () {
  'use strict';
  var GS = window.GameSystem;
  var hasMedia = !!(GS && GS.media);
  var KEY = 'gs2-gallery';
  var store = GS || {
    load: function () { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } },
    autoSave: function (fn) { function w() { try { localStorage.setItem(KEY, JSON.stringify(fn())); } catch (e) { /* full */ } } setInterval(w, 3000); window.addEventListener('pagehide', w); }
  };

  var ICON = {
    plus: '<path d="M12 5v14M5 12h14"/>',
    check: '<path d="M5 12l5 5 9-10"/>',
    pick: '<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><path d="M14.5 17l2 2 3.5-4"/>',
    image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
    camera: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
    video: '<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/>',
    play: '<path d="M7 4.5v15l13-7.5z" fill="currentColor" stroke="none"/>',
    brush: '<path d="M14 4l6 6-8 8H6v-6z"/><path d="M4 20c2 0 3-1 3-3"/>',
    photo: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    cover: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15l3-4 3 3 2-2 3 3"/>',
    back: '<path d="M15 5l-7 7 7 7"/>',
    prev: '<path d="M15 5l-7 7 7 7"/>',
    next: '<path d="M9 5l7 7-7 7"/>',
    trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>',
    down: '<path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>',
    edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/>',
    gallery: '<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/>'
  };
  function svg(n) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICON[n] || '') + '</svg>'; }
  var $ = function (id) { return document.getElementById(id); };

  var FILTERS = [
    ['all', 'All', 'gallery'], ['shot', 'Screenshots', 'camera'], ['clip', 'Recordings', 'video'],
    ['drawing', 'Drawings', 'brush'], ['photo', 'My photos', 'image'], ['cover', 'Game pictures', 'cover']
  ];
  var state = { f: 'all', g: '', open: null, scroll: 0 };
  var saved = store.load && store.load();
  if (saved && typeof saved === 'object') {
    if (FILTERS.some(function (x) { return x[0] === saved.f; })) state.f = saved.f;
    state.g = typeof saved.g === 'string' ? saved.g : '';
    state.open = typeof saved.open === 'string' ? saved.open : null;
    state.scroll = Number(saved.scroll) || 0;
  }
  if (store.autoSave) store.autoSave(function () { state.scroll = $('scroll').scrollTop; return state; }, 3);

  var items = [], covers = [];
  var urls = [];
  function url(blob) { var u = URL.createObjectURL(blob); urls.push(u); return u; }
  function freeUrls() { urls.forEach(function (u) { URL.revokeObjectURL(u); }); urls = []; }

  /* ---------------- loading ---------------- */
  var firstLoad = true;
  async function load() {
    if (!hasMedia) { renderNoHost(); return; }
    try {
      var res = await Promise.all([GS.media.list({}), GS.media.covers()]);
      items = res[0] || []; covers = res[1] || [];
    } catch (e) { toast('Couldn\'t load the gallery: ' + (e.message || e)); return; }
    fillGames();
    render();
    if (firstLoad) {
      firstLoad = false;
      $('scroll').scrollTop = state.scroll;
    }
    var p = null;
    try { p = await GS.media.pending('gallery'); } catch (e) { p = null; }
    if (p && p.id) { state.f = 'all'; state.g = ''; render(); openViewer(p.id); }
    else if (state.open && $('viewer').hidden && find(state.open)) openViewer(state.open);
  }
  function fillGames() {
    var sel = $('game');
    var used = {};
    items.concat(covers).forEach(function (r) { if (r.g) used[r.g] = r.gname || r.g; });
    var opts = ['<option value="">All games</option>'];
    Object.keys(used).sort(function (a, b) { return String(used[a]).localeCompare(String(used[b])); }).forEach(function (id) {
      opts.push('<option value="' + esc(id) + '">' + esc(used[id]) + '</option>');
    });
    sel.innerHTML = opts.join('');
    if (state.g && !used[state.g]) state.g = '';
    sel.value = state.g;
    sel.hidden = Object.keys(used).length < 1;
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function visible() {
    var list = state.f === 'cover' ? covers : (state.f === 'all' ? items : items.filter(function (r) { return r.kind === state.f || (state.f === 'photo' && r.kind === 'video'); }));
    if (state.g) list = list.filter(function (r) { return r.g === state.g; });
    return list;
  }
  function find(id) { return items.find(function (r) { return r.id === id; }) || covers.find(function (r) { return r.id === id; }) || null; }
  function isVid(r) { return r.kind === 'clip' || r.kind === 'video' || /^video\//.test(r.mime || ''); }

  /* ---------------- the grid ---------------- */
  var selecting = false, picked = {};
  function dayLabel(t) {
    var d = new Date(t); d.setHours(0, 0, 0, 0);
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var diff = Math.round((today - d) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    if (diff < 7) return d.toLocaleDateString(undefined, { weekday: 'long' });
    return d.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: d.getFullYear() === today.getFullYear() ? undefined : 'numeric' });
  }
  function dur(ms) { var s = Math.round((ms || 0) / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function size(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }

  function render() {
    var scroll = $('scroll');
    var keep = scroll.scrollTop;
    freeUrls();
    /* chips with counts */
    var counts = { all: items.length, cover: covers.length };
    items.forEach(function (r) { var k = r.kind === 'video' ? 'photo' : r.kind; counts[k] = (counts[k] || 0) + 1; });
    $('chips').innerHTML = FILTERS.map(function (f) {
      return '<button class="chip' + (state.f === f[0] ? ' on' : '') + '" data-f="' + f[0] + '" role="tab" aria-selected="' + (state.f === f[0]) + '">' + svg(f[2]) + f[1] + (counts[f[0]] ? ' <span class="n">' + counts[f[0]] + '</span>' : '') + '</button>';
    }).join('');
    var list = visible();
    scroll.innerHTML = '';
    if (!list.length) {
      var msg = state.f === 'all' && !state.g
        ? '<b>Nothing here yet</b>Take a screenshot or record a game and it shows up here.<br>Set your keys in Game System: Settings → Screenshots &amp; recording.<br>You can also add your own photos and videos.'
        : '<b>Nothing here</b>Try another filter.';
      scroll.innerHTML = '<div class="empty">' + svg('gallery') + msg + '</div>';
    } else {
      var group = null, grid = null;
      list.forEach(function (r) {
        var label = state.f === 'cover' ? 'Game pictures' : dayLabel(r.t);
        if (label !== group) {
          group = label;
          var hd = document.createElement('div');
          hd.className = 'day';
          hd.textContent = label;
          scroll.appendChild(hd);
          grid = document.createElement('div');
          grid.className = 'grid';
          scroll.appendChild(grid);
        }
        var b = document.createElement('button');
        b.className = 'tile' + (picked[r.id] ? ' sel' : '');
        b.dataset.id = r.id;
        b.setAttribute('aria-label', r.name);
        var pic = r.thumb || (!isVid(r) ? r.blob : null);
        b.innerHTML = (pic ? '<img alt="" loading="lazy" decoding="async" src="' + url(pic) + '">' : '<span class="noimg">' + svg(isVid(r) ? 'video' : 'image') + '</span>') +
          (isVid(r) ? '<span class="badge">' + svg('play') + (r.dur ? dur(r.dur) : 'Video') + '</span>' : '') +
          (r.kind === 'drawing' ? '<span class="kind">' + svg('brush') + '</span>' : '') +
          '<span class="check">' + svg('check') + '</span>';
        grid.appendChild(b);
      });
    }
    var total = items.reduce(function (s, r) { return s + (r.size || 0); }, 0);
    $('foot').textContent = items.length + ' item' + (items.length === 1 ? '' : 's') + ' · ' + size(total) + ' · saved in this browser and in your backups';
    scroll.scrollTop = keep;
    paintSel();
  }

  $('chips').addEventListener('click', function (e) {
    var c = e.target.closest('.chip');
    if (!c) return;
    state.f = c.dataset.f;
    $('scroll').scrollTop = 0;
    render();
  });
  $('game').addEventListener('change', function () { state.g = this.value; render(); });
  $('scroll').addEventListener('click', function (e) {
    var t = e.target.closest('.tile');
    if (!t) return;
    if (selecting) { togglePick(t.dataset.id); return; }
    openViewer(t.dataset.id);
  });
  /* hold a tile = start picking */
  var holdT = 0;
  $('scroll').addEventListener('pointerdown', function (e) {
    var t = e.target.closest('.tile');
    if (!t || selecting) return;
    holdT = setTimeout(function () { setSelecting(true); togglePick(t.dataset.id); holdT = -1; }, 550);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
    $('scroll').addEventListener(ev, function () { if (holdT > 0) clearTimeout(holdT); setTimeout(function () { holdT = 0; }, 0); });
  });
  $('scroll').addEventListener('click', function (e) { if (holdT === -1) { e.stopImmediatePropagation(); } }, true);

  function setSelecting(on) {
    selecting = on;
    if (!on) picked = {};
    $('app').classList.toggle('selecting', on);
    $('selbar').hidden = !on;
    document.querySelectorAll('.tile').forEach(function (t) { t.classList.toggle('sel', !!picked[t.dataset.id]); });
    paintSel();
  }
  function togglePick(id) {
    if (state.f === 'cover' || String(id).indexOf('cover:') === 0) { toast('Game pictures live with their games. Change them in Game System.'); return; }
    if (picked[id]) delete picked[id]; else picked[id] = 1;
    var t = document.querySelector('.tile[data-id="' + CSS.escape(id) + '"]');
    if (t) t.classList.toggle('sel', !!picked[id]);
    paintSel();
  }
  function paintSel() {
    var n = Object.keys(picked).length;
    $('sel-n').textContent = n + ' picked';
    $('b-sel-dl').disabled = $('b-sel-del').disabled = !n;
  }
  $('b-select').innerHTML = svg('pick') + '<span>Select</span>';
  $('b-select').addEventListener('click', function () { setSelecting(!selecting); });
  $('b-sel-x').addEventListener('click', function () { setSelecting(false); });
  $('b-sel-dl').innerHTML = svg('down') + 'Download';
  $('b-sel-del').innerHTML = svg('trash') + 'Delete';
  $('b-sel-dl').addEventListener('click', async function () {
    var ids = Object.keys(picked);
    for (var i = 0; i < ids.length; i++) { await GS.media.download(ids[i]); await new Promise(function (r) { setTimeout(r, 250); }); }
    toast(ids.length + ' downloaded');
  });
  $('b-sel-del').addEventListener('click', async function () {
    var ids = Object.keys(picked);
    if (!ids.length) return;
    if (!(await confirmBox('Delete ' + ids.length + ' item' + (ids.length === 1 ? '' : 's') + '?', 'They\'re gone for good (unless you have a backup).', 'Delete'))) return;
    for (var i = 0; i < ids.length; i++) { try { await GS.media.remove(ids[i]); } catch (e) { /* skip */ } }
    setSelecting(false);
    toast('Deleted');
    load();
  });

  /* ---------------- adding your own ---------------- */
  $('b-add').innerHTML = svg('plus') + '<span>Add</span>';
  $('b-add').addEventListener('click', function () { $('file').click(); });
  $('file').addEventListener('change', function () { addFiles(Array.prototype.slice.call(this.files || [])); this.value = ''; });
  async function addFiles(files) {
    files = files.filter(function (f) { return /^(image|video)\//.test(f.type); });
    if (!files.length) { toast('Only photos and videos can go in the Gallery'); return; }
    if (!hasMedia) return;
    toast('Adding ' + files.length + '…');
    var n = 0;
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      try { await GS.media.add({ blob: f, kind: /^video\//.test(f.type) ? 'video' : 'photo', name: f.name.replace(/\.[^.]+$/, '') }); n++; }
      catch (e) { toast(f.name + ': ' + (e.message || e)); }
    }
    if (n) { toast('Added ' + n); state.f = 'all'; load(); }
  }
  var dragN = 0;
  window.addEventListener('dragenter', function (e) { if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') >= 0) { dragN++; $('drop').hidden = false; } });
  window.addEventListener('dragleave', function () { dragN = Math.max(0, dragN - 1); if (!dragN) $('drop').hidden = true; });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) { e.preventDefault(); dragN = 0; $('drop').hidden = true; addFiles(Array.prototype.slice.call(e.dataTransfer.files || [])); });

  /* ---------------- the viewer ---------------- */
  var vUrl = null, cur = null;
  ['v-close', 'v-prev', 'v-next', 'v-rename', 'v-del'].forEach(function (id) {
    $(id).innerHTML = svg({ 'v-close': 'back', 'v-prev': 'prev', 'v-next': 'next', 'v-rename': 'edit', 'v-del': 'trash' }[id]);
  });
  function openViewer(id) {
    var r = find(id);
    if (!r) return;
    cur = r;
    state.open = r.id;
    var list = visible();
    var i = list.indexOf(r);
    if (vUrl) URL.revokeObjectURL(vUrl);
    vUrl = URL.createObjectURL(r.blob);
    var stage = $('v-stage');
    stage.querySelectorAll('img, video').forEach(function (x) { if (x.pause) x.pause(); x.remove(); });
    var el;
    if (isVid(r)) {
      el = document.createElement('video');
      el.controls = true; el.playsInline = true; el.autoplay = true; el.src = vUrl;
      fixDuration(el);
    } else {
      el = document.createElement('img');
      el.alt = r.name; el.src = vUrl;
    }
    stage.insertBefore(el, $('v-next'));
    $('v-name').textContent = r.name;
    $('v-sub').textContent = (r.gname ? r.gname + ' · ' : '') + new Date(r.t || Date.now()).toLocaleString();
    $('v-prev').disabled = i <= 0;
    $('v-next').disabled = i < 0 || i >= list.length - 1;
    var info = [];
    if (r.w && r.h) info.push(r.w + ' × ' + r.h);
    if (r.dur) info.push(dur(r.dur));
    if (r.size) info.push(size(r.size));
    info.push({ shot: 'Screenshot', clip: 'Recording', drawing: 'Drawing', photo: 'Photo', video: 'Video', cover: 'Game picture' }[r.kind] || '');
    $('v-info').innerHTML = info.filter(Boolean).map(function (x) { return '<span>' + esc(x) + '</span>'; }).join('');
    var cover = r.kind === 'cover';
    $('v-rename').hidden = $('v-del').hidden = cover;
    var acts = [];
    acts.push('<button class="btn" data-a="download">' + svg('down') + 'Download</button>');
    if (!isVid(r) && !cover) acts.push('<button class="btn primary" data-a="use">' + svg('image') + 'Use as a picture</button>');
    if (isVid(r)) acts.push('<button class="btn" data-a="watch">' + svg('video') + 'Open in Video app</button>');
    $('v-acts').innerHTML = acts.join('');
    $('viewer').hidden = false;
    $('v-close').focus();
  }
  /* recordings made in the browser sometimes don't know how long they are: find out */
  function fixDuration(v) {
    v.addEventListener('loadedmetadata', function once() {
      v.removeEventListener('loadedmetadata', once);
      if (v.duration === Infinity) {
        var t = v.currentTime;
        v.addEventListener('timeupdate', function back() { v.removeEventListener('timeupdate', back); v.currentTime = t; });
        v.currentTime = 1e101;
      }
    });
  }
  function closeViewer() {
    $('viewer').hidden = true;
    $('v-stage').querySelectorAll('img, video').forEach(function (x) { if (x.pause) x.pause(); x.remove(); });
    if (vUrl) { URL.revokeObjectURL(vUrl); vUrl = null; }
    state.open = null;
    var t = cur && document.querySelector('.tile[data-id="' + CSS.escape(cur.id) + '"]');
    cur = null;
    if (t) t.focus();
  }
  function step(d) {
    if (!cur) return;
    var list = visible();
    var i = list.indexOf(cur);
    var n = list[i + d];
    if (n) openViewer(n.id);
  }
  $('v-close').addEventListener('click', closeViewer);
  $('v-prev').addEventListener('click', function () { step(-1); });
  $('v-next').addEventListener('click', function () { step(1); });
  $('v-acts').addEventListener('click', async function (e) {
    var b = e.target.closest('button');
    if (!b || !cur) return;
    var a = b.dataset.a;
    try {
      if (a === 'download') { if (cur.kind === 'cover') downloadBlob(cur.blob, cur.name); else await GS.media.download(cur.id); }
      else if (a === 'use') { await GS.media.use(cur.id); }
      else if (a === 'watch') { await GS.media.watch(cur.id); }
    } catch (err) { toast(err.message || String(err)); }
  });
  function downloadBlob(blob, name) {
    var u = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = u; link.download = name + (/png/.test(blob.type) ? '.png' : '.jpg');
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
  }
  $('v-del').addEventListener('click', async function () {
    if (!cur) return;
    if (!(await confirmBox('Delete this?', '"' + cur.name + '" is gone for good (unless you have a backup).', 'Delete'))) return;
    var list = visible();
    var i = list.indexOf(cur);
    var next = list[i + 1] || list[i - 1] || null;
    try { await GS.media.remove(cur.id); } catch (err) { toast(err.message || String(err)); return; }
    items = items.filter(function (r) { return r !== cur; });
    toast('Deleted');
    render();
    if (next) openViewer(next.id); else closeViewer();
  });
  $('v-rename').addEventListener('click', async function () {
    if (!cur) return;
    var name = await promptBox('Rename', cur.name);
    if (!name) return;
    try { var r = await GS.media.rename(cur.id, name); if (r) { cur.name = r.name; $('v-name').textContent = r.name; } } catch (err) { toast(err.message || String(err)); }
  });

  window.addEventListener('keydown', function (e) {
    if (document.querySelector('.modal-back')) return;
    if (!$('viewer').hidden) {
      if (e.key === 'Escape' || e.key === 'Backspace') { e.preventDefault(); closeViewer(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
      else if (e.key === 'Delete') { e.preventDefault(); $('v-del').click(); }
    } else if (e.key === 'Escape' && selecting) { setSelecting(false); }
  });

  /* ---------------- little boxes ---------------- */
  function modal(title, text, withInput, value, okLabel, danger) {
    return new Promise(function (resolve) {
      var back = document.createElement('div');
      back.className = 'modal-back';
      back.innerHTML = '<div class="modal" role="dialog" aria-label="' + esc(title) + '"><h2>' + esc(title) + '</h2>' + (text ? '<p>' + esc(text) + '</p>' : '') +
        (withInput ? '<input maxlength="120">' : '') + '<div class="row"><button class="btn" data-r="0">Cancel</button><button class="btn ' + (danger ? 'danger' : 'primary') + '" data-r="1">' + esc(okLabel || 'OK') + '</button></div></div>';
      document.body.appendChild(back);
      var input = back.querySelector('input');
      if (input) { input.value = value || ''; setTimeout(function () { input.focus(); input.select(); }, 20); }
      else setTimeout(function () { back.querySelector('[data-r="1"]').focus(); }, 20);
      function done(ok) { back.remove(); document.removeEventListener('keydown', key, true); resolve(ok ? (input ? input.value.trim() : true) : null); }
      function key(e) { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(false); } else if (e.key === 'Enter') { e.preventDefault(); done(true); } }
      document.addEventListener('keydown', key, true);
      back.addEventListener('click', function (e) { if (e.target === back) done(false); var b = e.target.closest('[data-r]'); if (b) done(b.dataset.r === '1'); });
    });
  }
  function confirmBox(title, text, ok) { return modal(title, text, false, '', ok, true).then(function (v) { return !!v; }); }
  function promptBox(title, value) { return modal(title, '', true, value, 'Save', false); }
  var toastT = 0;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }
  function renderNoHost() {
    $('scroll').innerHTML = '<div class="empty">' + svg('gallery') + '<b>Open this inside Game System</b>The Gallery shows the screenshots and recordings you make in Game System.</div>';
    $('b-add').disabled = $('b-select').disabled = true;
  }

  /* Game System says something changed (new screenshot, deleted, …) */
  window.addEventListener('gs2media', function () { load(); });
  load();
})();
</script>
</body>
</html>
