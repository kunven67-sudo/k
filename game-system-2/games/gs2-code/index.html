<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code</title>
<link rel="stylesheet" href="../../vendor/codemirror.css">
<style>
  :root {
    --bg: #07080e; --side: #0b0d17; --panel: #10142a; --hi: #182040; --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.16);
    --text: #eef1ff; --muted: #8d93b5; --acc: #3dffa0; --acc2: #00e5ff; --bad: #ff3d6e; --warn: #ffc23d;
    --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  button, input, select, textarea { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }
  svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .app { display: flex; flex-direction: column; height: 100%; }
  .top { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; background: linear-gradient(180deg, rgba(61,255,160,.06), transparent); }
  .top .name { background: none; border: 1px solid transparent; border-radius: 9px; padding: 6px 8px; font-weight: 800; font-size: 15px; min-width: 60px; max-width: 220px; }
  .top .name:hover, .top .name:focus { border-color: var(--line2); background: rgba(0,0,0,.3); outline: none; }
  .grow { flex: 1; }
  .btn { border: 1px solid var(--line2); background: var(--panel); border-radius: 10px; padding: 7px 11px; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: background .15s; }
  .btn:hover { background: var(--hi); }
  .btn.primary { background: var(--acc); color: #00170b; border-color: var(--acc); box-shadow: 0 0 14px rgba(61,255,160,.35); }
  .btn.on { border-color: var(--acc); color: var(--acc); }
  .btn:disabled { opacity: .45; cursor: default; }
  select { background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; padding: 6px 8px; font-size: 13px; max-width: 190px; }
  .body { flex: 1; display: flex; min-height: 0; }
  .code { flex: 1; display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); }
  .ftabs { display: flex; gap: 2px; padding: 6px 8px 0; background: var(--side); border-bottom: 1px solid var(--line); }
  .ftab { border: 1px solid transparent; border-bottom: 0; background: none; border-radius: 9px 9px 0 0; padding: 7px 14px; font-weight: 800; font-size: 12.5px; color: var(--muted); font-family: var(--mono); }
  .ftab.on { background: var(--bg); border-color: var(--line); color: var(--text); margin-bottom: -1px; }
  .ftab .err { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--bad); margin-left: 6px; vertical-align: middle; }
  .editor { flex: 1; min-height: 0; position: relative; }
  .editor .CodeMirror, .editor textarea { position: absolute; inset: 0; height: 100%; width: 100%; }
  .editor textarea { background: var(--bg); border: 0; resize: none; padding: 12px; font-family: var(--mono); font-size: 14px; line-height: 1.55; color: var(--text); outline: none; tab-size: 2; }
  .right { width: 46%; min-width: 280px; display: flex; flex-direction: column; min-height: 0; }
  .pbar { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--side); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .pbar b { color: var(--text); font-size: 12.5px; }
  .live { display: inline-flex; align-items: center; gap: 5px; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 8px var(--acc); }
  .icon { width: 30px; height: 30px; padding: 0; display: inline-grid; place-items: center; border-radius: 8px; border: 1px solid transparent; background: none; color: var(--muted); }
  .icon:hover { background: rgba(255,255,255,.07); color: var(--text); }
  .preview { flex: 1; min-height: 0; background: #fff; position: relative; }
  .preview iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  .console { height: 30%; min-height: 70px; display: flex; flex-direction: column; border-top: 1px solid var(--line); background: #05060b; }
  .console.closed { height: auto; min-height: 0; }
  .chead { display: flex; align-items: center; gap: 6px; padding: 4px 8px; font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .08em; cursor: pointer; user-select: none; }
  .chead .n { background: var(--bad); color: #fff; border-radius: 10px; padding: 0 6px; font-size: 11px; letter-spacing: 0; }
  .clog { flex: 1; overflow-y: auto; font-family: var(--mono); font-size: 12.5px; padding: 2px 0 6px; }
  .console.closed .clog { display: none; }
  .row { padding: 3px 10px; border-bottom: 1px solid rgba(255,255,255,.04); white-space: pre-wrap; word-break: break-word; }
  .row.warn { color: var(--warn); background: rgba(255,194,61,.05); }
  .row.error { color: #ff8aa8; background: rgba(255,61,110,.07); }
  .row.info { color: var(--acc2); }
  .row .ln { float: right; color: var(--muted); cursor: pointer; text-decoration: underline; }
  .empty-c { color: var(--muted); padding: 6px 10px; font-family: system-ui, sans-serif; font-size: 12px; }
  /* examples */
  .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: grid; place-items: center; z-index: 50; padding: 14px; }
  .modal { background: var(--panel); border: 1px solid var(--line2); border-radius: 16px; width: min(760px, 100%); max-height: 90%; display: flex; flex-direction: column; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  .modal header { display: flex; align-items: center; padding: 14px 16px 8px; gap: 8px; }
  .modal header h2 { margin: 0; font-size: 17px; flex: 1; }
  .modal .mbody { overflow-y: auto; padding: 4px 16px 16px; }
  .ex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
  .ex { text-align: left; border: 1px solid var(--line2); background: rgba(255,255,255,.03); border-radius: 12px; padding: 11px; display: flex; flex-direction: column; gap: 4px; }
  .ex:hover, .ex:focus-visible { border-color: var(--acc); background: rgba(61,255,160,.06); }
  .ex b { font-size: 14px; }
  .ex span { font-size: 12.5px; color: var(--muted); line-height: 1.4; }
  .ex em { font-style: normal; font-size: 11px; font-weight: 800; color: var(--acc); letter-spacing: .06em; }
  .modal p { color: var(--muted); font-size: 13.5px; line-height: 1.5; margin: 0 0 12px; }
  .modal input.txt { width: 100%; background: rgba(0,0,0,.3); border: 1px solid var(--line2); border-radius: 10px; padding: 9px 11px; font-size: 14px; margin-bottom: 12px; }
  .modal .acts { display: flex; gap: 8px; justify-content: flex-end; padding: 0 16px 16px; flex-wrap: wrap; }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(16px); opacity: 0; pointer-events: none; background: #13202a; border: 1px solid var(--line2); padding: 9px 14px; border-radius: 22px; font-size: 13px; transition: all .2s; box-shadow: 0 10px 30px rgba(0,0,0,.5); z-index: 60; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .views { display: none; }
  /* dark editor colors */
  .CodeMirror { background: var(--bg); color: #e6e9ff; font-family: var(--mono); font-size: 14px; line-height: 1.55; }
  .CodeMirror-gutters { background: var(--side); border-right: 1px solid var(--line); }
  .CodeMirror-linenumber { color: #4d5478; }
  .CodeMirror-cursor { border-left: 2px solid var(--acc); }
  .CodeMirror-selected, .CodeMirror-focused .CodeMirror-selected { background: rgba(61,255,160,.16) !important; }
  .CodeMirror-activeline-background { background: rgba(255,255,255,.03); }
  .CodeMirror-matchingbracket { color: var(--acc) !important; text-decoration: underline; }
  .cm-s-default .cm-keyword { color: #ff79c6; } .cm-s-default .cm-def { color: #50fa7b; } .cm-s-default .cm-variable-2 { color: #8be9fd; } .cm-s-default .cm-variable-3, .cm-s-default .cm-type { color: #8be9fd; }
  .cm-s-default .cm-string, .cm-s-default .cm-string-2 { color: #f1fa8c; } .cm-s-default .cm-number { color: #bd93f9; } .cm-s-default .cm-comment { color: #6272a4; font-style: italic; }
  .cm-s-default .cm-atom { color: #bd93f9; } .cm-s-default .cm-property { color: #66d9ef; } .cm-s-default .cm-operator { color: #ff79c6; } .cm-s-default .cm-tag { color: #ff79c6; }
  .cm-s-default .cm-attribute { color: #50fa7b; } .cm-s-default .cm-qualifier, .cm-s-default .cm-builtin { color: #8be9fd; } .cm-s-default .cm-meta { color: #ffb86c; } .cm-s-default .cm-bracket { color: #9aa0c3; }
  .cm-s-default .cm-error { color: #ff5555; }
  .err-line { background: rgba(255,61,110,.15); }
  @media (max-width: 760px) {
    .views { display: flex; gap: 4px; }
    .body .right { width: 100%; min-width: 0; }
    .app[data-v="code"] .right { display: none; }
    .app[data-v="preview"] .code { display: none; }
    .code { border-right: 0; }
    .hide-sm { display: none; }
  }
</style>
</head>
<body>
<div class="app" id="app" data-v="code">
  <div class="top">
    <input class="name" id="name" maxlength="60" aria-label="Project name" spellcheck="false">
    <select id="proj" aria-label="Your projects" title="Your projects"></select>
    <button class="btn" id="b-new" title="New project"></button>
    <button class="btn" id="b-ex" title="Examples and lessons"></button>
    <div class="grow"></div>
    <div class="views"><button class="btn" data-v="code">Code</button><button class="btn" data-v="preview">Preview</button></div>
    <button class="btn" id="b-ai" title="Copy your code with a question for an AI"></button>
    <button class="btn primary" id="b-save" title="Save as a game or app in Game System"></button>
  </div>
  <div class="body">
    <section class="code">
      <div class="ftabs" role="tablist">
        <button class="ftab" data-f="html" role="tab">HTML</button>
        <button class="ftab" data-f="css" role="tab">CSS</button>
        <button class="ftab" data-f="js" role="tab">JS</button>
      </div>
      <div class="editor" id="editor"></div>
    </section>
    <section class="right">
      <div class="pbar">
        <span class="live" id="live-dot"><i></i></span><b>Preview</b>
        <label class="hide-sm" style="display:inline-flex;gap:4px;align-items:center;margin-left:6px"><input type="checkbox" id="auto"> auto-run</label>
        <div class="grow"></div>
        <button class="icon" id="b-run" title="Run (Ctrl+Enter)" aria-label="Run"></button>
        <button class="icon" id="b-dl" title="Download as one .html file" aria-label="Download"></button>
      </div>
      <div class="preview" id="preview"></div>
      <div class="console" id="console">
        <div class="chead" id="chead">CONSOLE <span class="n" id="cn" hidden>0</span><div class="grow"></div><button class="icon" id="b-clear" title="Clear" aria-label="Clear console"></button></div>
        <div class="clog" id="clog"></div>
      </div>
    </section>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="../../vendor/codemirror.min.js"></script>
<script>
(function () {
  'use strict';
  var GS = window.GameSystem;
  var KEY = 'gs2-code';
  var store = GS || {
    load: function () { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } },
    autoSave: function (fn) { function w() { try { localStorage.setItem(KEY, JSON.stringify(fn())); } catch (e) { /* full */ } } setInterval(w, 2000); window.addEventListener('pagehide', w); }
  };
  var ICON = {
    plus: '<path d="M12 5v14M5 12h14"/>',
    book: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M8 7h7"/>',
    play: '<path d="M7 4.5v15l13-7.5z" fill="currentColor" stroke="none"/>',
    save: '<path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7M8 21v-7h8v7"/>',
    down: '<path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>',
    clear: '<circle cx="12" cy="12" r="8"/><path d="M6.5 17.5l11-11"/>',
    spark: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
    x: '<path d="M6 6l12 12M18 6L6 18"/>',
    trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>'
  };
  function svg(n) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICON[n] || '') + '</svg>'; }
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function uid() { return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  /* ---------------- examples + lessons ---------------- */
  var EX = [
    { id: 'hello', tag: 'LESSON 1', name: 'Hello, web page', desc: 'What HTML, CSS and JS each do. Change the words and colors!',
      html: '<h1>Hello, bro!</h1>\n<p>This is <b>HTML</b>: it says what is on the page.</p>\n<p>The <b>CSS</b> tab makes it look cool.</p>\n<p>The <b>JS</b> tab makes it do stuff. Click the button:</p>\n<button id="btn">Click me</button>\n<p id="out"></p>',
      css: 'body {\n  font-family: system-ui, sans-serif;\n  background: #0b0f1e;\n  color: white;\n  text-align: center;\n  padding: 30px;\n}\nh1 { color: #3dffa0; font-size: 48px; }\nbutton {\n  font-size: 20px;\n  padding: 10px 24px;\n  border: 0;\n  border-radius: 12px;\n  background: #00e5ff;\n  cursor: pointer;\n}',
      js: '// This runs when the page loads\nconst btn = document.getElementById("btn");\nconst out = document.getElementById("out");\nlet clicks = 0;\n\nbtn.addEventListener("click", () => {\n  clicks = clicks + 1;\n  out.textContent = "You clicked " + clicks + " times!";\n  console.log("click number", clicks);\n});' },
    { id: 'neon', tag: 'CSS', name: 'Neon buttons', desc: 'Glowing buttons with hover effects and animations.',
      html: '<div class="wrap">\n  <button class="neon cyan">PLAY</button>\n  <button class="neon pink">OPTIONS</button>\n  <button class="neon green">QUIT</button>\n</div>',
      css: 'body { margin: 0; height: 100vh; display: grid; place-items: center; background: #05060a; font-family: system-ui, sans-serif; }\n.wrap { display: flex; flex-direction: column; gap: 22px; }\n.neon {\n  --c: #00e5ff;\n  font-size: 26px; font-weight: 900; letter-spacing: 6px;\n  padding: 14px 50px; background: transparent; color: var(--c);\n  border: 3px solid var(--c); border-radius: 14px; cursor: pointer;\n  box-shadow: 0 0 12px var(--c), inset 0 0 12px var(--c);\n  text-shadow: 0 0 8px var(--c);\n  transition: transform .15s, background .2s, color .2s;\n}\n.neon:hover { background: var(--c); color: #05060a; transform: scale(1.06); }\n.pink { --c: #ff2bd6; }\n.green { --c: #3dffa0; animation: pulse 1.6s infinite; }\n@keyframes pulse { 50% { box-shadow: 0 0 30px var(--c), inset 0 0 20px var(--c); } }',
      js: '' },
    { id: 'ball', tag: 'CANVAS', name: 'Bouncing balls', desc: 'Draw on a canvas and animate 60 times a second.',
      html: '<canvas id="c"></canvas>',
      css: 'html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }\ncanvas { display: block; }',
      js: 'const c = document.getElementById("c");\nconst ctx = c.getContext("2d");\nfunction size() { c.width = innerWidth; c.height = innerHeight; }\nsize(); addEventListener("resize", size);\n\nconst balls = [];\nfor (let i = 0; i < 25; i++) {\n  balls.push({\n    x: Math.random() * c.width, y: Math.random() * c.height,\n    vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,\n    r: 10 + Math.random() * 25, hue: Math.random() * 360\n  });\n}\n\nfunction loop() {\n  ctx.fillStyle = "rgba(0,0,0,0.25)"; // leaves a little trail\n  ctx.fillRect(0, 0, c.width, c.height);\n  for (const b of balls) {\n    b.x += b.vx; b.y += b.vy;\n    if (b.x < b.r || b.x > c.width - b.r) b.vx *= -1;\n    if (b.y < b.r || b.y > c.height - b.r) b.vy *= -1;\n    ctx.beginPath();\n    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);\n    ctx.fillStyle = "hsl(" + b.hue + ", 100%, 60%)";\n    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 20;\n    ctx.fill();\n  }\n  requestAnimationFrame(loop);\n}\nloop();\n\n// click to add a ball\nc.addEventListener("click", e => balls.push({ x: e.clientX, y: e.clientY, vx: 6, vy: -6, r: 20, hue: Math.random() * 360 }));' },
    { id: 'stars', tag: 'GAME', name: 'Catch the stars', desc: 'A small game: move with arrow keys or the mouse, catch stars, dodge bombs. Saves your best score.',
      html: '<canvas id="c" width="480" height="640"></canvas>\n<div id="hud">Score: <b id="s">0</b> · Best: <b id="best">0</b></div>',
      css: 'body { margin: 0; height: 100vh; display: grid; place-items: center; background: #070814; font-family: system-ui, sans-serif; color: white; }\ncanvas { background: linear-gradient(#0b1030, #1a0b30); border-radius: 12px; max-width: 100vw; max-height: 85vh; box-shadow: 0 0 40px #4b2bff55; }\n#hud { position: fixed; top: 10px; left: 0; right: 0; text-align: center; font-size: 20px; }',
      js: 'const c = document.getElementById("c"), ctx = c.getContext("2d");\nconst W = c.width, H = c.height;\nlet player = { x: W / 2, w: 70 }, things = [], score = 0, over = false, keys = {};\nlet best = 0;\n\n// In Game System, GameSystem saves stuff for you (best score here)\nif (window.GameSystem) {\n  const saved = GameSystem.load();\n  if (saved) best = saved.best || 0;\n  GameSystem.autoSave(() => ({ best }));\n}\ndocument.getElementById("best").textContent = best;\n\naddEventListener("keydown", e => keys[e.key] = true);\naddEventListener("keyup", e => keys[e.key] = false);\nc.addEventListener("mousemove", e => { const r = c.getBoundingClientRect(); player.x = (e.clientX - r.left) / r.width * W; });\nc.addEventListener("click", () => { if (over) restart(); });\n\nfunction restart() { things = []; score = 0; over = false; }\n\nfunction loop() {\n  if (!over) {\n    if (keys.ArrowLeft) player.x -= 8;\n    if (keys.ArrowRight) player.x += 8;\n    player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));\n    if (Math.random() < 0.04) things.push({ x: Math.random() * W, y: -20, bomb: Math.random() < 0.25, v: 3 + score / 15 });\n    for (const t of things) {\n      t.y += t.v;\n      if (t.y > H - 40 && t.y < H - 10 && Math.abs(t.x - player.x) < player.w / 2) {\n        t.y = H + 100;\n        if (t.bomb) over = true; else score++;\n      }\n    }\n    things = things.filter(t => t.y < H + 50);\n    if (score > best) best = score;\n  }\n  ctx.clearRect(0, 0, W, H);\n  for (const t of things) {\n    ctx.font = "30px serif";\n    ctx.fillText(t.bomb ? "💣" : "⭐", t.x - 15, t.y);\n  }\n  ctx.fillStyle = "#00e5ff";\n  ctx.fillRect(player.x - player.w / 2, H - 30, player.w, 14);\n  if (over) {\n    ctx.fillStyle = "white"; ctx.font = "bold 40px system-ui"; ctx.textAlign = "center";\n    ctx.fillText("BOOM! Click to retry", W / 2, H / 2); ctx.textAlign = "left";\n  }\n  document.getElementById("s").textContent = score;\n  document.getElementById("best").textContent = best;\n  requestAnimationFrame(loop);\n}\nloop();' },
    { id: 'snake', tag: 'GAME', name: 'Snake', desc: 'The classic. Arrow keys or WASD. Shows how a grid game works.',
      html: '<canvas id="c" width="400" height="400"></canvas>\n<p id="msg">Arrow keys to start</p>',
      css: 'body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #050a05; color: #3dff7a; font-family: monospace; }\ncanvas { border: 2px solid #3dff7a; box-shadow: 0 0 20px #3dff7a55; max-width: 95vw; }\n#msg { font-size: 18px; }',

  /* ---------------- phone: code or preview ---------------- */
  function setView(v) { state.view = v; $('app').dataset.v = v; document.querySelectorAll('.views .btn').forEach(function (b) { b.classList.toggle('on', b.dataset.v === v); }); if (v === 'code' && cm) setTimeout(function () { cm.refresh(); }, 0); }
  document.querySelector('.views').addEventListener('click', function (e) { var b = e.target.closest('[data-v]'); if (b) setView(b.dataset.v); });

  /* ---------------- small boxes ---------------- */
  function modal(title, bodyHtml, actions) {
    var back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = '<div class="modal" role="dialog" aria-label="' + esc(title) + '"><header><h2>' + esc(title) + '</h2><button class="icon" data-close aria-label="Close">' + svg('x') + '</button></header><div class="mbody">' + bodyHtml + '</div>' +
      (actions && actions.filter(Boolean).length ? '<div class="acts">' + actions.filter(Boolean).map(function (a, i) { return '<button class="btn' + (a.primary ? ' primary' : '') + '" data-act="' + i + '">' + esc(a.label) + '</button>'; }).join('') + '</div>' : '') + '</div>';
    document.body.appendChild(back);
    var acts = (actions || []).filter(Boolean);
    var m = { box: back, close: function () { back.remove(); document.removeEventListener('keydown', key, true); if (cm) cm.focus(); } };
    function key(e) { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); m.close(); } }
    document.addEventListener('keydown', key, true);
    back.addEventListener('click', function (e) {
      if (e.target === back || e.target.closest('[data-close]')) { m.close(); return; }
      var b = e.target.closest('[data-act]');
      if (!b) return;
      var input = back.querySelector('input.txt');
      var r = acts[Number(b.dataset.act)].run(input ? input.value : '');
      Promise.resolve(r).then(function (v) { if (v !== false) m.close(); });
    });
    return m;
  }
  function ask(title, text, ok) {
    return new Promise(function (resolve) {
      var done = false;
      var m = modal(title, '<p>' + esc(text) + '</p>', [{ label: 'Cancel', run: function () { done = true; resolve(false); } }, { label: ok, primary: true, run: function () { done = true; resolve(true); } }]);
      var obs = new MutationObserver(function () { if (!m.box.isConnected) { obs.disconnect(); if (!done) resolve(false); } });
      obs.observe(document.body, { childList: true });
    });
  }
  var toastT = 0;
  function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, 2800); }

  window.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); }
    else if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) { e.preventDefault(); saveDialog(); }
  });

  /* ---------------- go ---------------- */
  makeEditor();
  fillProjects();
  setView(state.view);
  var c0 = (cur() || {}).cursor;
  showTab(c0 && c0.tab ? c0.tab : state.tab);
  if (cm && c0 && c0.tab === state.tab) cm.setCursor({ line: c0.line || 0, ch: c0.ch || 0 });
  run();
})();
</script>
</body>
</html>
