<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ALTS Clipboard</title>
<style>
:root{--bg:#16161a;--card:#1f1f25;--card2:#26262e;--line:#2c2c35;--text:#ececf1;--dim:#9a9aa6;--acc:#d97757;--pin:#f5c451}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13.5px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none}
body{display:flex;flex-direction:column;border:1px solid var(--line)}
#top{display:flex;gap:4px;padding:10px 10px 6px;align-items:center}
.tab{flex:1;border:0;background:transparent;color:var(--dim);font:600 13px inherit;font-family:inherit;padding:7px 4px;border-radius:8px;cursor:pointer}
.tab:hover{background:var(--card)}
.tab.on{background:var(--card2);color:var(--text)}
#gear{border:0;background:transparent;color:var(--dim);font-size:16px;width:32px;height:32px;border-radius:8px;cursor:pointer}
#gear:hover{background:var(--card)}
#q{margin:0 10px 8px;padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;outline:none}
#q:focus{border-color:#4a4a56}
#list{flex:1;overflow-y:auto;padding:0 10px 10px}
#list::-webkit-scrollbar{width:8px}#list::-webkit-scrollbar-thumb{background:#33333d;border-radius:4px}
.item{position:relative;background:var(--card);border:1px solid transparent;border-radius:10px;padding:9px 11px;margin-bottom:7px;cursor:pointer;transition:background .1s,transform .08s}
.item:hover{background:var(--card2)}
.item.sel{border-color:var(--acc)}
.item:active{transform:scale(.985)}
.item .t{white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;padding-right:58px}
.item img{display:block;max-width:100%;max-height:150px;border-radius:6px;background:repeating-conic-gradient(#2a2a32 0 25%,#222229 0 50%) 0 0/14px 14px}
.item .when{color:var(--dim);font-size:11.5px;margin-top:4px}
.acts{position:absolute;top:6px;right:6px;display:flex;gap:2px;opacity:0;transition:opacity .1s}
.item:hover .acts,.item.sel .acts,.item.pinned .acts{opacity:1}
.acts button{border:0;background:#2f2f38;color:var(--dim);width:26px;height:26px;border-radius:7px;cursor:pointer;font-size:13px}
.acts button:hover{color:var(--text);background:#3a3a45}
.item.pinned .pin{color:var(--pin)}
.empty{color:var(--dim);text-align:center;padding:40px 16px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.st{position:relative;aspect-ratio:1;border-radius:10px;background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid transparent;transition:transform .1s,background .1s}
.st:hover{background:var(--card2);transform:scale(1.05)}
.st.sel{border-color:var(--acc)}
.st img{width:82%;height:82%;object-fit:contain;pointer-events:none}
.st .x{position:absolute;top:2px;right:2px;border:0;background:#2f2f38;color:var(--dim);width:20px;height:20px;border-radius:6px;font-size:11px;cursor:pointer;display:none}
.st:hover .x{display:block}
.h{color:var(--dim);font-size:12px;font-weight:600;margin:10px 2px 6px}
.eg{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.e{font:24px/1 "Segoe UI Emoji","Noto Color Emoji",sans-serif;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer}
.e:hover,.e.sel{background:var(--card2)}
#menu{position:absolute;top:46px;right:10px;background:#202027;border:1px solid var(--line);border-radius:11px;padding:6px;width:250px;box-shadow:0 14px 40px rgba(0,0,0,.55);display:none;z-index:5}
#menu button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--text);font:inherit;padding:8px 10px;border-radius:7px;cursor:pointer}
#menu button:hover{background:var(--card2)}
#menu .note{color:var(--dim);font-size:12px;padding:6px 10px 4px}
#toast{position:absolute;left:12px;right:12px;bottom:12px;background:#2b2b34;border:1px solid #3a3a45;padding:10px 12px;border-radius:10px;display:none;z-index:6}
#hint{color:var(--dim);font-size:11.5px;padding:0 12px 8px;text-align:center}
</style>
</head>
<body>
<div id="top">
  <button class="tab on" data-tab="clip">Clipboard</button>
  <button class="tab" data-tab="stick">Stickers</button>
  <button class="tab" data-tab="emoji">Emoji</button>
  <button id="gear" title="Settings">&#9881;</button>
</div>
<input id="q" placeholder="Search" spellcheck="false" autocomplete="off">
<div id="list"></div>
<div id="hint">Click = paste &#183; &#8593;&#8595; + Enter &#183; Esc = close</div>
<div id="menu">
  <button id="mStart"></button>
  <button id="mStuck">Copy not working? Check it</button>
  <button id="mClear">Clear history (keeps pins)</button>
  <button id="mQuit">Turn off clipboard (until restart)</button>
  <div class="note" id="mNote"></div>
</div>
<div id="toast"></div>
<script>
'use strict';
const send = m => { try { window.chrome.webview.postMessage(JSON.stringify(m)); } catch (e) {} };
const $ = s => document.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
let S = { items: [], mine: [], builtin: [], start: true };
let tab = 'clip', sel = 0, cells = [], emoji = null, emojiReq = null;
let recent = [];
try { recent = JSON.parse(localStorage.getItem('recent') || '[]'); } catch (e) {}

function ago(t) {
  const s = Math.max(0, Date.now() / 1000 - t);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + ' min ago';
  if (s < 86400) return Math.floor(s / 3600) + ' h ago';
  return Math.floor(s / 86400) + ' d ago';
}
function stickerLabel(f) { return f.replace(/\.png$/i, '').replace(/_/g, ' '); }

async function loadEmoji() {
  if (emoji) return emoji;
  if (!emojiReq) emojiReq = fetch('emoji.txt').then(r => r.text()).then(t => {
    emoji = t.split('\n').filter(Boolean).map(l => { const [e, n, g] = l.split('\t'); return { e, n, g }; });
    return emoji;
  }).catch(() => (emoji = []));
  return emojiReq;
}

function button(txt, title, fn) {
  const b = el('button', null, txt);
  b.title = title;
  b.addEventListener('click', e => { e.stopPropagation(); fn(); });
  return b;
}

function draw() {
  const L = $('#list');
  L.textContent = '';
  cells = [];
  const q = $('#q').value.trim().toLowerCase();
  if (tab === 'clip') {
    const items = S.items.filter(it => !q || (it.kind === 'text' && it.text.toLowerCase().includes(q)) || (it.kind === 'pic' && 'picture image'.includes(q)));
    const pinned = items.filter(i => i.pinned), rest = items.filter(i => !i.pinned);
    if (!items.length) L.append(el('div', 'empty', q ? 'Nothing matches.' : 'Copy something (Ctrl+C) and it shows up here.'));
    for (const [title, list] of [['Pinned', pinned], [pinned.length ? 'Recent' : '', rest]]) {
      if (!list.length) continue;
      if (title) L.append(el('div', 'h', title));
      for (const it of list) {
        const d = el('div', 'item' + (it.pinned ? ' pinned' : ''));
        if (it.kind === 'pic') {
          const im = el('img'); im.src = 'pics/' + it.file.replace(/\.png$/, '.thumb.png'); im.alt = '';
          d.append(im, el('div', 'when', it.w + ' x ' + it.h + ' picture · ' + ago(it.at)));
        } else {
          d.append(el('div', 't', it.text.length > 600 ? it.text.slice(0, 600) + '…' : it.text), el('div', 'when', ago(it.at)));
        }
        const a = el('div', 'acts');
        const p = button(it.pinned ? '★' : '☆', it.pinned ? 'Unpin' : 'Pin (kept forever)', () => send({ t: 'pin', id: it.id, on: !it.pinned }));
        p.className = 'pin';
        a.append(p);
        if (it.kind === 'pic') a.append(button('☺', 'Make it one of my stickers', () => { send({ t: 'star', id: it.id }); toast('Added to your stickers'); }));
        a.append(button('✕', 'Delete', () => send({ t: 'del', id: it.id })));
        d.append(a);
        d.addEventListener('click', () => send({ t: 'paste', id: it.id }));
        L.append(d);
        cells.push(d);
      }
    }
  } else if (tab === 'stick') {
    const add = (title, files, mine) => {
      files = files.filter(f => !q || stickerLabel(f).includes(q));
      if (!files.length) return;
      L.append(el('div', 'h', title));
      const g = el('div', 'grid');
      for (const f of files) {
        const c = el('div', 'st');
        c.title = mine ? 'Your sticker' : stickerLabel(f);
        const im = el('img'); im.src = (mine ? 'stickers/' : 'builtin/') + encodeURIComponent(f); im.alt = '';
        c.append(im);
        if (mine) { const x = button('✕', 'Remove', () => send({ t: 'unsticker', file: f })); x.className = 'x'; c.append(x); }
        c.addEventListener('click', () => send({ t: 'sticker', file: f, mine }));
        g.append(c);
        cells.push(c);
      }
      L.append(g);
    };
    add('My stickers', S.mine, true);
    add('Stickers', S.builtin, false);
    if (!S.mine.length && !q) L.append(el('div', 'empty', 'Make your own: copy any picture, then press ☺ on it in Clipboard.'));
    if (!cells.length && q) L.append(el('div', 'empty', 'Nothing matches.'));
  } else {
    if (!emoji) { L.append(el('div', 'empty', 'Loading...')); loadEmoji().then(() => { if (tab === 'emoji') draw(); }); return; }
    const pick = list => { const g = el('div', 'eg'); for (const x of list) { const c = el('div', 'e', x.e); c.title = x.n; c.addEventListener('click', () => useEmoji(x.e)); g.append(c); cells.push(c); } return g; };
    if (q) {
      const hits = emoji.filter(x => x.n.includes(q)).slice(0, 240);
      if (hits.length) L.append(pick(hits)); else L.append(el('div', 'empty', 'Nothing matches.'));
    } else {
      if (recent.length) { L.append(el('div', 'h', 'Recent')); L.append(pick(recent.map(e => ({ e, n: '' })))); }
      let g = null;
      for (const x of emoji) {
        if (x.g !== g) { g = x.g; L.append(el('div', 'h', g)); L.append(pick([])); }
        const last = L.lastChild, c = el('div', 'e', x.e); c.title = x.n; c.addEventListener('click', () => useEmoji(x.e)); last.append(c); cells.push(c);
      }
    }
  }
  sel = Math.min(sel, Math.max(0, cells.length - 1));
  mark(false);
}
function useEmoji(e) {
  recent = [e, ...recent.filter(x => x !== e)].slice(0, 16);
  try { localStorage.setItem('recent', JSON.stringify(recent)); } catch (er) {}
  send({ t: 'emoji', text: e });
}
function mark(scroll) {
  cells.forEach((c, i) => c.classList.toggle('sel', i === sel));
  if (scroll && cells[sel]) cells[sel].scrollIntoView({ block: 'nearest' });
}
function setTab(t) {
  tab = t; sel = 0;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  $('#q').placeholder = t === 'clip' ? 'Search what you copied' : t === 'stick' ? 'Search stickers' : 'Search emoji (like "skull")';
  $('#list').scrollTop = 0;
  draw();
}
function toast(t) { const b = $('#toast'); b.textContent = t; b.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => b.style.display = 'none', 3500); }
function menu(on) {
  const m = $('#menu');
  m.style.display = on ? 'block' : 'none';
  $('#mStart').textContent = (S.start ? '☑' : '☐') + '  Start with Windows';
  $('#mNote').textContent = (S.key || 'Win+V') + ' opens this. Pinned stuff stays forever; the rest keeps the last 200.';
}

document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
$('#q').addEventListener('input', () => { sel = 0; draw(); });
$('#gear').addEventListener('click', e => { e.stopPropagation(); menu($('#menu').style.display !== 'block'); });
document.addEventListener('click', () => menu(false));
$('#mStart').addEventListener('click', e => { e.stopPropagation(); send({ t: 'start', on: !S.start }); });
$('#mStuck').addEventListener('click', () => send({ t: 'stuck' }));
$('#mClear').addEventListener('click', () => send({ t: 'clear' }));
$('#mQuit').addEventListener('click', () => send({ t: 'quit' }));

document.addEventListener('keydown', e => {
  const cols = tab === 'stick' ? 4 : tab === 'emoji' ? 8 : 1;
  if (e.key === 'Escape') { e.preventDefault(); if ($('#menu').style.display === 'block') menu(false); else send({ t: 'hide' }); return; }
  if (e.key === 'Tab') { e.preventDefault(); const order = ['clip', 'stick', 'emoji']; setTab(order[(order.indexOf(tab) + (e.shiftKey ? 2 : 1)) % 3]); return; }
  if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(cells.length - 1, sel + cols); mark(true); return; }
  if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - cols); mark(true); return; }
  if (cols > 1 && e.key === 'ArrowRight' && document.activeElement !== $('#q')) { e.preventDefault(); sel = Math.min(cells.length - 1, sel + 1); mark(true); return; }
  if (cols > 1 && e.key === 'ArrowLeft' && document.activeElement !== $('#q')) { e.preventDefault(); sel = Math.max(0, sel - 1); mark(true); return; }
  if (e.key === 'Enter') { e.preventDefault(); if (cells[sel]) cells[sel].click(); return; }
  if (e.key === 'Delete' && tab === 'clip' && document.activeElement !== $('#q') && cells[sel]) { cells[sel].querySelector('.acts button:last-child').click(); return; }
  if (e.key.length === 1 && !e.ctrlKey && !e.altKey && document.activeElement !== $('#q')) $('#q').focus();
});

window.clip = {
  load(s) { S = Object.assign({ items: [], mine: [], builtin: [], start: true }, s); S.items = S.items || []; S.mine = S.mine || []; S.builtin = S.builtin || []; draw(); if ($('#menu').style.display === 'block') menu(true); },
  shown() { $('#q').value = ''; sel = 0; menu(false); $('#list').scrollTop = 0; draw(); $('#q').focus(); },
  toast,
  stuck(who) { toast(who === '' ? 'Your clipboard works fine right now. Copy something and it shows up here.' : who === '?' ? 'Something is holding the clipboard, but Windows won\'t say what. Restarting the PC clears it.' : who + ' is holding the clipboard open, so copying fails. Close ' + who + ' (or restart it) and copying works again.'); }
};
send({ t: 'ready' });
</script>
</body>
</html>
