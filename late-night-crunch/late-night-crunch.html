<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LATE NIGHT CRUNCH</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1d0f36">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&family=Tilt+Neon&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d0f36; --ink2:#2b1a52; --panel:#2a1d55; --panel2:#35266f; --panel3:#45328f;
  --text:#fff6e8; --muted:#bdb1e6; --yellow:#ffd23f; --orange:#ff8a3d; --pink:#ff4f9a;
  --cyan:#3ee6ff; --green:#57e389; --red:#ff5a5a; --purple:#9b6bff;
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Fredoka','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --neon:'Tilt Neon','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --shop-w:400px;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--ink);color:var(--text);font:500 15px/1.25 var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.hidden{display:none!important}
svg{display:block}

/* ---------- layout ---------- */
#app{position:fixed;inset:0;display:grid;grid-template-columns:1fr var(--shop-w);grid-template-rows:100%}
#stage{position:relative;overflow:hidden;background:#140a2b;touch-action:none;cursor:pointer}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
#shop{position:relative;display:flex;flex-direction:column;min-height:0;background:var(--panel);
  border-left:4px solid var(--ink);box-shadow:inset 4px 0 0 #3d2c7a}

@media (max-width:899px) and (orientation:portrait), (max-width:640px){
  #app{grid-template-columns:100%;grid-template-rows:minmax(280px,60%) 1fr}
  #shop{border-left:0;border-top:4px solid var(--ink);box-shadow:inset 0 4px 0 #3d2c7a}
}
@media (orientation:landscape) and (max-height:520px){
  :root{--shop-w:310px}
}


/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 12px 0 max(12px,env(safe-area-inset-left));
  display:flex;align-items:flex-start;gap:10px;pointer-events:none;z-index:5}
.hudCard{pointer-events:auto;background:rgba(29,15,54,.82);border:3px solid var(--ink);border-radius:16px;
  box-shadow:0 4px 0 var(--ink);}
#coinBox{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;min-width:150px}
#coinBox svg{width:38px;height:38px;flex:none}
#coinText{font:400 28px/1 var(--display);letter-spacing:.5px;color:var(--yellow);text-shadow:0 3px 0 var(--ink)}
#coinText.bump{animation:bump .18s ease-out}
@keyframes bump{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
#cpsText{font:600 13px/1.1 var(--body);color:var(--muted);margin-top:3px}
#chipBadge{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 4px}
#badgeCanvas{width:46px;height:46px;flex:none}
#chipName{font:400 17px/1 var(--display);letter-spacing:.3px}
#chipVal{font:600 12px/1.1 var(--body);color:var(--muted);margin-top:3px}
#hudBtns{margin-left:auto;display:flex;gap:8px;padding-right:max(0px,env(safe-area-inset-right))}
.iconBtn{pointer-events:auto;width:46px;height:46px;display:grid;place-items:center;background:var(--panel3);
  border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);transition:transform .08s}
.iconBtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.iconBtn svg{width:26px;height:26px}
.iconBtn.off{opacity:.55}

#boosts{position:absolute;left:12px;bottom:64px;display:flex;gap:8px;pointer-events:none;z-index:5}
.boost{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;background:rgba(29,15,54,.85);border:3px solid var(--ink);
  border-radius:14px;font:400 15px/1 var(--display)}
.boost canvas{width:30px;height:30px}

#frenzy{position:absolute;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(520px,78%);
  pointer-events:none;z-index:5;text-align:center}
#frenzy .label{font:400 15px/1 var(--display);letter-spacing:1.5px;color:var(--text);text-shadow:0 2px 0 var(--ink);margin-bottom:5px}
#frenzy .bar{height:20px;border:3px solid var(--ink);border-radius:12px;background:rgba(29,15,54,.85);overflow:hidden;box-shadow:0 3px 0 var(--ink)}
#frenzy .fill{height:100%;width:0%;border-radius:8px;background:linear-gradient(90deg,#ff8a3d,#ff4f9a 60%,#ffd23f);
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),inset 0 4px 0 rgba(255,255,255,.35)}
#frenzy.full .fill{animation:fpulse .35s infinite alternate}
#frenzy.on .label{color:var(--yellow);animation:wob .25s infinite alternate}
#frenzy.on .fill{background:linear-gradient(90deg,#ffd23f,#fff3a0,#ffd23f);}
#frenzy.cool .fill{background:#6d5ba8}
@keyframes fpulse{to{filter:brightness(1.35)}}
@keyframes wob{from{transform:rotate(-2deg) scale(1.05)}to{transform:rotate(2deg) scale(1.1)}}

#hint{position:absolute;left:50%;top:66%;transform:translate(-50%,-50%);z-index:6;pointer-events:none;
  padding:10px 16px;background:rgba(29,15,54,.9);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);
  font:600 16px/1.2 var(--body);text-align:center;max-width:min(360px,86%);opacity:0;transition:opacity .3s}
#hint.show{opacity:1}
#hint svg{width:34px;height:34px;margin:0 auto 4px;animation:tapHand 1s infinite}
@keyframes tapHand{0%,100%{transform:translateY(0)}50%{transform:translateY(5px) scale(.94)}}

#toasts{position:absolute;left:12px;top:76px;z-index:20;display:flex;flex-direction:column;gap:8px;
  align-items:flex-start;pointer-events:none;width:min(360px,calc(100% - 24px))}
.toast{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;background:var(--panel2);border:3px solid var(--ink);
  border-radius:16px;box-shadow:0 4px 0 var(--ink);animation:toastIn .35s cubic-bezier(.2,1.6,.4,1) both}
.toast.out{animation:toastOut .3s ease-in both}
.toast canvas{width:40px;height:40px;flex:none}
.toast b{display:block;font:400 16px/1.05 var(--display);color:var(--yellow)}
.toast span{font:600 13px/1.2 var(--body);color:var(--muted)}
@keyframes toastIn{from{transform:translateX(-30px) scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes toastOut{to{transform:translateY(-14px);opacity:0}}

/* ---------- shop ---------- */
#tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px 10px 8px;background:var(--panel);
  border-bottom:3px solid var(--ink)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 5px;background:var(--panel2);
  border:3px solid var(--ink);border-radius:13px;box-shadow:0 3px 0 var(--ink);font:400 12.5px/1 var(--display);letter-spacing:.3px;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab.on{background:var(--yellow);color:var(--ink)}
.tab.on svg *{stroke:var(--ink)}
.tab .dot{position:absolute;top:-6px;right:-5px;width:14px;height:14px;border-radius:50%;background:var(--pink);border:3px solid var(--ink);display:none}
.tab.has .dot{display:block;animation:dotPop .9s infinite alternate}
.tab.locked{opacity:.4}
@keyframes dotPop{to{transform:scale(1.25)}}
#shopBody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:10px 10px 18px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#shopBody::-webkit-scrollbar{width:10px}
#shopBody::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:10px;border:2px solid var(--panel)}
.secTitle{font:400 16px/1 var(--display);letter-spacing:.6px;color:var(--muted);margin:6px 4px 8px;display:flex;align-items:center;gap:8px}
.secTitle small{font:600 12px/1.2 var(--body);letter-spacing:0;color:#9488c4}
.amtRow{display:flex;gap:6px;margin:0 0 10px}
.amtRow button{flex:1;padding:7px 0;background:var(--panel2);border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);
  font:400 15px/1 var(--display);color:var(--muted)}
.amtRow button.on{background:var(--cyan);color:var(--ink)}
.card{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:10px;padding:8px 9px 8px 8px;margin-bottom:9px;background:var(--panel2);
  border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);position:relative}
.card .ico{width:64px;height:64px;border-radius:12px;background:#1f1442;border:3px solid var(--ink);overflow:hidden}
.card .ico canvas{width:100%;height:100%;display:block}
.card .nm{font:400 17px/1.05 var(--display);letter-spacing:.3px}
.card .nm .lv{font:600 12px/1 var(--body);color:var(--cyan);margin-left:5px;letter-spacing:0}
.card .ds{font:500 12.5px/1.25 var(--body);color:var(--muted);margin-top:3px}
.card .st{font:600 12.5px/1.2 var(--body);color:var(--green);margin-top:3px}
.buy{min-width:88px;padding:8px 9px;background:var(--yellow);color:var(--ink);border:3px solid var(--ink);border-radius:13px;box-shadow:0 4px 0 var(--ink);
  font:400 15px/1 var(--display);display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .08s}
.buy small{font:600 10.5px/1 var(--body);opacity:.8}
.buy .pr{display:flex;align-items:center;gap:4px}
.buy .pr svg{width:15px;height:15px}
.buy:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.buy.no{background:#5a4a94;color:#c9bff0;box-shadow:0 4px 0 var(--ink)}
.buy.ready{animation:readyGlow 1.1s infinite alternate}
@keyframes readyGlow{to{background:#ffe680;transform:scale(1.04)}}
.buy.owned{background:var(--green)}
.buy.eq{background:var(--cyan)}
.buy.use{background:var(--pink);color:#fff}
.card.locked .ico canvas{filter:brightness(0) invert(1) opacity(.2)}
.card.locked .nm{color:#8a7fc0}
.card.mystery{opacity:.75}
.card.gold{background:linear-gradient(135deg,#4a3a9c,#35266f)}
.card .cdbar{position:absolute;left:12px;right:12px;bottom:4px;height:4px;border-radius:3px;background:rgba(0,0,0,.35);overflow:hidden}
.card .cdbar i{display:block;height:100%;background:var(--cyan)}
.pill{display:inline-block;padding:2px 7px;border-radius:9px;background:var(--pink);color:#fff;font:600 11px/1.2 var(--body);margin-left:4px;vertical-align:2px}
.note{font:500 13px/1.35 var(--body);color:var(--muted);padding:2px 4px 10px}
.bigBtn{display:block;width:100%;padding:13px;margin:6px 0 12px;background:var(--pink);color:#fff;border:3px solid var(--ink);border-radius:16px;
  box-shadow:0 5px 0 var(--ink);font:400 21px/1 var(--display);letter-spacing:1px;text-shadow:0 2px 0 var(--ink)}
.bigBtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.bigBtn.dim{background:#5a4a94;color:#c9bff0;text-shadow:none}
.styleRow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.styleRow button{padding:8px 11px;background:var(--panel2);border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);
  font:600 13px/1 var(--body);color:var(--text)}
.styleRow button.on{background:var(--cyan);color:var(--ink)}
.styleRow button:disabled{opacity:.4}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(14,6,30,.72);padding:16px}
.panel{width:min(460px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--panel);border:4px solid var(--ink);border-radius:22px;
  box-shadow:0 7px 0 var(--ink);padding:18px;animation:popIn .3s cubic-bezier(.2,1.5,.4,1) both}
@keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.panel h2{font:400 28px/1 var(--display);letter-spacing:.8px;text-align:center;margin-bottom:12px;color:var(--yellow);text-shadow:0 3px 0 var(--ink)}
.panel p{font:500 15px/1.4 var(--body);color:var(--text);text-align:center;margin-bottom:12px}
.panel .row{display:flex;gap:10px}
.panel .row > *{flex:1}
.btn{padding:12px;background:var(--yellow);color:var(--ink);border:3px solid var(--ink);border-radius:15px;box-shadow:0 4px 0 var(--ink);font:400 18px/1 var(--display);letter-spacing:.5px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--panel3);color:var(--text)}
.btn.red{background:var(--red);color:#fff}
.setRow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:2px solid #3a2a77}
.setRow label{flex:1;font:600 15px/1.2 var(--body)}
.setRow input[type=range]{width:46%;accent-color:var(--yellow)}
.seg{display:flex;gap:4px}
.seg button{padding:6px 8px;background:var(--panel2);border:2px solid var(--ink);border-radius:9px;font:600 12px/1 var(--body);color:var(--muted)}
.seg button.on{background:var(--yellow);color:var(--ink)}
.trophyGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.trophy{display:flex;align-items:center;gap:6px;padding:6px;background:var(--panel2);border:3px solid var(--ink);border-radius:13px}
.trophy canvas{width:36px;height:36px;flex:none}
.trophy b{display:block;font:400 13px/1.05 var(--display)}
.trophy span{display:block;font:500 11px/1.2 var(--body);color:var(--muted)}
.trophy.no{opacity:.5}
.trophy.no canvas{filter:grayscale(1) brightness(.6)}
.bigNum{font:400 40px/1 var(--display);color:var(--yellow);text-align:center;text-shadow:0 4px 0 var(--ink);margin:6px 0 12px;display:flex;justify-content:center;align-items:center;gap:10px}
.bigNum svg{width:40px;height:40px}

/* reveal */
#reveal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(10,4,24,.86)}
#revealCanvas{position:absolute;inset:0;width:100%;height:100%}
#revealInfo{position:relative;text-align:center;margin-top:min(52vh,420px);padding:0 16px;animation:popIn .5s .35s both}
#revealInfo .kick{font:400 18px/1 var(--display);letter-spacing:3px;color:var(--cyan);text-shadow:0 3px 0 var(--ink)}
#revealInfo .name{font:400 clamp(34px,8vw,58px)/1 var(--display);letter-spacing:1px;margin:8px 0 6px;text-shadow:0 5px 0 var(--ink)}
#revealInfo .val{font:600 17px/1.3 var(--body);color:var(--text);margin-bottom:6px}
#revealInfo .desc{font:500 15px/1.3 var(--body);color:var(--muted);margin-bottom:16px}

/* title */
#title{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(ellipse at 50% 40%,rgba(40,20,90,.55),rgba(10,4,24,.92) 70%)}
#titleRain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#logo{position:relative;text-align:center;padding:22px 30px 26px;border:5px solid rgba(255,79,154,.95);border-radius:28px;
  box-shadow:0 0 18px rgba(255,79,154,.8),inset 0 0 18px rgba(255,79,154,.55),0 0 60px rgba(255,79,154,.35);
  background:rgba(20,8,40,.55);animation:signHum 4s infinite}
#logo .l1{font:400 clamp(30px,7vw,54px)/1 var(--neon);letter-spacing:6px;color:#ffe3f0;
  text-shadow:0 0 6px #fff,0 0 14px #ff4f9a,0 0 28px #ff4f9a,0 0 48px #ff2d7f}
#logo .l2{font:400 clamp(54px,14vw,112px)/.95 var(--display);letter-spacing:4px;color:#e9fdff;margin-top:6px;
  text-shadow:0 0 6px #fff,0 0 16px #3ee6ff,0 0 34px #3ee6ff,0 0 60px #1fb6ff}
#logo .fl{animation:flick 7s infinite}
#logo .fl2{animation:flick 5.3s 1.4s infinite}
@keyframes flick{0%,40%,44%,46%,100%{opacity:1}42%,45%{opacity:.22}}
@keyframes signHum{0%,100%{filter:brightness(1)}50%{filter:brightness(1.07)}}
#titleBtns{position:relative;display:flex;flex-direction:column;gap:10px;width:min(300px,80%)}
#titleBtns .btn{font-size:24px;padding:14px}
#titleSub{position:relative;font:600 14px/1.3 var(--body);color:var(--muted);text-align:center}
#fade{position:fixed;inset:0;z-index:100;background:#000;opacity:0;pointer-events:none;transition:opacity .6s}
#fade.white{background:#fff}
#fade.on{opacity:1}
@media (max-width:520px){
  #hud{gap:6px;padding-left:8px;padding-right:8px}
  #coinBox{min-width:0;padding:4px 10px 4px 6px;gap:6px}
  #coinBox svg{width:30px;height:30px}
  #coinText{font-size:22px}
  #cpsText{font-size:11.5px}
  #chipBadge{padding:3px 8px 3px 3px}
  #badgeCanvas{width:38px;height:38px}
  #chipName{font-size:14px;max-width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #chipVal{display:none}
  .iconBtn{width:40px;height:40px;border-radius:12px}
  .iconBtn svg{width:22px;height:22px}
  #toasts{top:auto;bottom:62px;left:8px;width:calc(100% - 16px)}
  #hint{top:62px;transform:translate(-50%,0);font-size:14px;padding:7px 12px;max-width:92%}
  #hint svg{width:26px;height:26px}
  .toast{padding:5px 10px 5px 5px;gap:7px}
  .toast canvas{width:30px;height:30px}
  .toast b{font-size:13.5px}
  .toast span{font-size:11.5px}
  #boosts{bottom:auto;top:62px;left:8px}
  .boost{font-size:12.5px}
  .boost canvas{width:24px;height:24px}
  #frenzy .label{font-size:13px}
  #frenzy .bar{height:16px}
  .tab{font-size:11px;padding:5px 1px 4px}
  .tab svg{width:21px;height:21px}
  .card{grid-template-columns:54px 1fr auto;gap:8px}
  .card .ico{width:54px;height:54px}
  .card .nm{font-size:15.5px}
  .card .ds{font-size:12px}
  .buy{min-width:80px;font-size:14px}
}
@media (max-height:520px) and (orientation:landscape){
  #toasts{top:auto;bottom:56px;left:8px;width:min(330px,calc(100% - 16px))}
  .toast{padding:4px 10px 4px 5px;gap:7px}
  .toast canvas{width:28px;height:28px}
  .toast b{font-size:13px}
  .toast span{font-size:11px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="gCoin" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#fff3a6"/><stop offset=".45" stop-color="#ffd23f"/><stop offset="1" stop-color="#f59e0b"/></radialGradient>
  </defs>
  <symbol id="i-coin" viewBox="0 0 40 40">
    <circle cx="20" cy="21" r="17" fill="#b86e00" stroke="#1d0f36" stroke-width="3"/>
    <circle cx="20" cy="19" r="16" fill="url(#gCoin)" stroke="#1d0f36" stroke-width="3"/>
    <circle cx="20" cy="19" r="10.5" fill="none" stroke="#c98500" stroke-width="2.4"/>
    <path d="M13.5 19.5c1.2-4.6 4.2-6.6 7.4-6.3 3.4.3 5.7 2.8 5.6 5.6-.2 3.6-3.6 6.4-7.4 6.2-3.4-.2-6.2-2.3-5.6-5.5z" fill="#fff0a8" stroke="#c98500" stroke-width="1.8"/>
    <path d="M10 12.5c2-3 5-4.6 8.4-4.8" fill="none" stroke="#fffbe0" stroke-width="2.6" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-trophy" viewBox="0 0 32 32">
    <path d="M9 5h14v6c0 5-3 8.5-7 8.5S9 16 9 11z" fill="#ffd23f" stroke="#1d0f36" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M9 7H5.5c0 4 1.6 6 4.2 6.6M23 7h3.5c0 4-1.6 6-4.2 6.6" fill="none" stroke="#1d0f36" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M13.5 19.5h5l1 4.5h-7z" fill="#f5a623" stroke="#1d0f36" stroke-width="2.4" stroke-linejoin="round"/>
    <rect x="9.5" y="24" width="13" height="4.5" rx="1.5" fill="#9b6bff" stroke="#1d0f36" stroke-width="2.4"/>
    <path d="M12.5 8v3.5" stroke="#fff6c8" stroke-width="2.4" stroke-linecap="round"/>

            for (const kk of Object.keys(d)) if (typeof d[kk] === 'boolean' || (typeof d[kk] === 'number' && isFinite(d[kk]))) b[kk] = d[kk];
          } else Save.merge(b, d);
        }
      } else if (typeof b === typeof d && (typeof d !== 'number' || isFinite(d))) base[k] = d;
    }
    return base;
  },
  sanitize(s) {
    s.chip = clamp(Math.floor(s.chip), 0, CHIPS.length - 1);
    s.chipMax = clamp(Math.floor(s.chipMax), 0, CHIPS.length - 1);
    if (s.chip > s.chipMax) s.chip = s.chipMax;
    s.bud = s.bud.map(l => clamp(Math.floor(l) || 0, 0, 100000));
    s.coins = Math.max(0, s.coins || 0);
    s.rebirths = clamp(Math.floor(s.rebirths) || 0, 0, 1e6);
    if (!THEMES.some(t => t.id === s.theme && s.rebirths >= t.reb)) s.theme = 'bedroom';
    const o = s.outfit;
    if (!['classic', 'flame', 'galaxy'].includes(o.hoodie)) o.hoodie = 'classic';
    if (o.hoodie === 'flame' && s.rebirths < OUTFIT_UNLOCKS.hoodieFlame) o.hoodie = 'classic';
    if (o.hoodie === 'galaxy' && s.rebirths < OUTFIT_UNLOCKS.hoodieGalaxy) o.hoodie = 'classic';
    if (!['classic', 'glow'].includes(o.phones) || (o.phones === 'glow' && s.rebirths < OUTFIT_UNLOCKS.phonesGlow)) o.phones = 'classic';
    if (s.rebirths < OUTFIT_UNLOCKS.chain) o.chain = false;
    if (s.rebirths < OUTFIT_UNLOCKS.crown) o.crown = false;
    if (!['auto', 'low', 'medium', 'high'].includes(s.settings.quality)) s.settings.quality = 'auto';
    for (const k of ['music', 'sfx', 'amb']) s.settings[k] = clamp(+s.settings[k] || 0, 0, 1);
    for (const k of Object.keys(s.cd)) s.cd[k] = clamp(s.cd[k], 0, 600);
    for (const k of Object.keys(s.boost)) s.boost[k] = clamp(s.boost[k], 0, 600);
    s.seen.plain = true;
    return s;
  },
  serialize() { S.lastSave = Date.now(); return JSON.stringify(S); },
  save() { try { localStorage.setItem(SAVE_KEY, Save.serialize()); return true; } catch (e) { return false; } },
  parse(text) {
    const data = JSON.parse(text);
    if (!data || typeof data !== 'object' || data.v !== 1) throw new Error('not a LATE NIGHT CRUNCH save');
    return Save.sanitize(Save.merge(freshState(), data));
  },
  load() {
    let raw = null;
    try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
    if (!raw) return false;
    try { S = Save.parse(raw); return true; }
    catch (e) { try { localStorage.setItem(SAVE_KEY + '.broken', raw); } catch (e2) { } return false; }
  },
  download() {
    const blob = new Blob([Save.serialize()], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const d = new Date();
    a.download = `late-night-crunch-save-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
  wipe() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } },
};

/* ---------------- economy ---------------- */
const Eco = {
  trophyCount() { return Object.keys(S.trophies).filter(k => S.trophies[k]).length; },
  roomMult() { let m = 1; for (const r of ROOM_ITEMS) if (S.room[r.id]) m *= r.mult; return m; },
  dipMult() { let m = 1; for (const d of DIPS) if (S.dips[d.id]) m *= d.mult; return m; },
  trophyMult() { return 1 + TROPHY_BONUS * Eco.trophyCount(); },
  rebirthMult() { return 1 + S.rebirths; },
  baseMult() { return Eco.roomMult() * Eco.dipMult() * Eco.trophyMult() * Eco.rebirthMult(); },
  liveMult() { return Eco.baseMult() * (Game.frenzyOn ? 3 : 1) * (S.boost.cola > 0 ? 2 : 1); },
  chipValue(i = S.chip) { return CHIPS[i].v; },
  biteValue(shiny) { return Eco.chipValue() * Eco.liveMult() * (shiny ? 5 : 1); },
  msMult(l) { let m = 1; for (const x of BUD_MILESTONES) if (l >= x) m *= 2; return m; },
  buddyRaw(i) { const l = S.bud[i]; return BUDDIES[i].cps * l * Eco.msMult(l); },
  buddyCpsRaw() { let s = 0; for (let i = 0; i < BUDDIES.length; i++) s += Eco.buddyRaw(i); return s; },
  buddyCps(live = true) { return Eco.buddyCpsRaw() * (live ? Eco.liveMult() * (S.boost.shake > 0 ? 3 : 1) : Eco.baseMult()); },
  autoRate() { return S.boost.coffee > 0 ? 8 : 0.5; },
  perSec() { return Eco.buddyCps(true) + Eco.autoRate() * Eco.chipValue() * Eco.liveMult(); },
  budCost(i, k = 1) {
    const b = BUDDIES[i], n = S.bud[i];
    return b.cost * Math.pow(BUD_GROWTH, n) * (Math.pow(BUD_GROWTH, k) - 1) / (BUD_GROWTH - 1);
  },
  budMaxAfford(i) {
    const b = BUDDIES[i], n = S.bud[i], c0 = b.cost * Math.pow(BUD_GROWTH, n);
    if (S.coins < c0) return 0;
    return Math.max(1, Math.floor(Math.log(S.coins * (BUD_GROWTH - 1) / c0 + 1) / Math.log(BUD_GROWTH)));
  },
  shinyChance() { return S.rebirths <= 0 ? 0 : clamp(0.04 + 0.01 * (S.rebirths - 1), 0.04, 0.1); },
};

/* =========================================================
   AUDIO: lofi music, crunchy sfx, late-night room ambience
   Everything is synthesized live with Web Audio. No files.
   ========================================================= */
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

const AudioSys = {
  ctx: null, ready: false, lastCrunch: 0, lastExtra: 0, lastUi: 0,

  init() {
    if (this.ctx) { this.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    let ctx;
    try { ctx = new AC({ latencyHint: 'interactive' }); } catch (e) { try { ctx = new AC(); } catch (e2) { return; } }
    this.ctx = ctx;
    const g = v => { const n = ctx.createGain(); n.gain.value = v; return n; };
    this.g = g;

    // master chain
    this.limiter = ctx.createDynamicsCompressor();
    this.limiter.threshold.value = -9; this.limiter.knee.value = 6; this.limiter.ratio.value = 10;
    this.limiter.attack.value = 0.003; this.limiter.release.value = 0.2;
    this.master = g(0.9);
    this.master.connect(this.limiter); this.limiter.connect(ctx.destination);

    // buffers
    this.noise = this.makeNoise(2.5);
    this.revIR = this.makeIR(2.6, 2.4);
    this.roomIR = this.makeIR(0.9, 3.5);

    // music bus: instruments -> musicIn -> wow (tape) -> lowpass -> musicOut -> master
    this.musicOut = g(0);
    this.musicLP = ctx.createBiquadFilter(); this.musicLP.type = 'lowpass'; this.musicLP.frequency.value = 3400; this.musicLP.Q.value = 0.4;
    this.wow = ctx.createDelay(1.0); this.wow.delayTime.value = 0.012;
    this.wowLfo = ctx.createOscillator(); this.wowLfo.frequency.value = 0.55;
    this.wowDepth = g(0.0011); this.wowLfo.connect(this.wowDepth).connect(this.wow.delayTime); this.wowLfo.start();
    this.musicIn = g(1);
    this.musicIn.connect(this.wow); this.wow.connect(this.musicLP); this.musicLP.connect(this.musicOut); this.musicOut.connect(this.master);
    this.musicRev = ctx.createConvolver(); this.musicRev.buffer = this.revIR;
    this.revSend = g(0.32); this.revSend.connect(this.musicRev); this.musicRev.connect(this.musicLP);
    // instrument buses
    this.epBus = g(1); this.epTrem = g(1);
    const trem = ctx.createOscillator(); trem.frequency.value = 4.6; const tremD = g(0.13);
    trem.connect(tremD).connect(this.epTrem.gain); trem.start();
    this.epBus.connect(this.epTrem); this.epTrem.connect(this.musicIn); this.epTrem.connect(this.revSend);
    this.drumBus = g(1); this.drumBus.connect(this.musicIn);
    this.snareSend = g(0.35); this.snareSend.connect(this.revSend);
    this.bassBus = ctx.createBiquadFilter(); this.bassBus.type = 'lowpass'; this.bassBus.frequency.value = 520; this.bassBus.connect(this.musicIn);
    this.leadBus = g(1); this.leadBus.connect(this.musicIn); this.leadBus.connect(this.revSend);
    this.echo = ctx.createDelay(2); this.echoFb = g(0.32); this.echoOut = g(0.38);
    this.leadBus.connect(this.echo); this.echo.connect(this.echoFb); this.echoFb.connect(this.echo); this.echo.connect(this.echoOut); this.echoOut.connect(this.musicIn);
    this.padBus = ctx.createBiquadFilter(); this.padBus.type = 'lowpass'; this.padBus.frequency.value = 1100; this.padBus.connect(this.musicIn); this.padBus.connect(this.revSend);
    // vinyl crackle loop (part of the music)
    this.crackleBuf = this.makeCrackle(6);
    this.crackleGain = g(0.55);
    const cr = ctx.createBufferSource(); cr.buffer = this.crackleBuf; cr.loop = true;
    const crHP = ctx.createBiquadFilter(); crHP.type = 'highpass'; crHP.frequency.value = 900;
    cr.connect(crHP).connect(this.crackleGain).connect(this.musicOut); cr.start();

    // sfx bus
    this.sfxOut = g(0); this.sfxOut.connect(this.master);
    this.sfxIn = g(1); this.sfxIn.connect(this.sfxOut);
    this.sfxRev = ctx.createConvolver(); this.sfxRev.buffer = this.roomIR;
    this.sfxRevSend = g(0.5); this.sfxRevSend.connect(this.sfxRev); this.sfxRev.connect(this.sfxOut);
    this.bigRev = ctx.createConvolver(); this.bigRev.buffer = this.revIR;
    this.bigRevSend = g(0.6); this.bigRevSend.connect(this.bigRev); this.bigRev.connect(this.sfxOut);

    // ambience bus
    this.ambOut = g(0); this.ambOut.connect(this.master);
    this.ambRevSend = g(0.8); const ar = ctx.createConvolver(); ar.buffer = this.revIR; this.ambRevSend.connect(ar); ar.connect(this.ambOut);

    this.applyVolumes(true);
    this.ready = true;
    Music.setup();
    Amb.setup();
    document.addEventListener('visibilitychange', () => {
      if (!this.ctx) return;
      if (document.hidden) this.ctx.suspend().catch(() => { }); else if (Game.started) this.resume();
    });
  },
  resume() { if (this.ctx && this.ctx.state !== 'running') this.ctx.resume().catch(() => { }); },
  applyVolumes(instant) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime, st = S.settings;
    const set = (node, v) => { node.gain.cancelScheduledValues(t); if (instant) node.gain.setValueAtTime(v, t); else node.gain.setTargetAtTime(v, t, 0.08); };
    set(this.musicOut, Math.pow(st.music, 1.6) * 0.95);
    set(this.sfxOut, Math.pow(st.sfx, 1.4) * 0.9);
    set(this.ambOut, Math.pow(st.amb, 1.6) * 0.9);
  },

  /* ---------- buffer makers ---------- */
  makeNoise(sec) {
    const ctx = this.ctx, n = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return b;
  },
  makeIR(sec, decay) {
    const ctx = this.ctx, sr = ctx.sampleRate, n = Math.floor(sr * sec), b = ctx.createBuffer(2, n, sr);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch); let lp = 0;
      for (let i = 0; i < n; i++) {
        const t = i / n; lp = lp * 0.6 + (Math.random() * 2 - 1) * 0.4;
        d[i] = lp * Math.pow(1 - t, decay) * (i < sr * 0.01 ? i / (sr * 0.01) : 1);
      }
    }
    return b;
  },
  makeCrackle(sec) {
    const ctx = this.ctx, sr = ctx.sampleRate, n = Math.floor(sr * sec), b = ctx.createBuffer(2, n, sr);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * 0.006;
      const pops = Math.floor(sec * 16);
      for (let p = 0; p < pops; p++) {
        const at = Math.floor(Math.random() * (n - 400)), amp = Math.random() < 0.12 ? rand(0.25, 0.5) : rand(0.03, 0.14), len = randi(20, 160);
        for (let k = 0; k < len; k++) d[at + k] += (Math.random() * 2 - 1) * amp * Math.exp(-k / (len / 4));
      }
    }
    return b;
  },
  makeBabble(sec) { // muffled TV talking: pulse trains through moving formants
    const ctx = this.ctx, sr = ctx.sampleRate, n = Math.floor(sr * sec), b = ctx.createBuffer(1, n, sr), d = b.getChannelData(0);
    const bp = (f, q) => { const w = TAU * f / sr, al = Math.sin(w) / (2 * q), a0 = 1 + al; return { b0: al / a0, b2: -al / a0, a1: -2 * Math.cos(w) / a0, a2: (1 - al) / a0, x1: 0, x2: 0, y1: 0, y2: 0 }; };
    const run = (c, x) => { const y = c.b0 * x + c.b2 * c.x2 - c.a1 * c.y1 - c.a2 * c.y2; c.x2 = c.x1; c.x1 = x; c.y2 = c.y1; c.y1 = y; return y; };
    let i = 0, speaker = 0, pitch = 130, phase = 0;
    while (i < n) {
      if (Math.random() < 0.08) { speaker = 1 - speaker; pitch = speaker ? rand(170, 230) : rand(95, 140); }
      const syl = Math.floor(sr * rand(0.07, 0.19));
      const gap = Math.random() < 0.13 ? Math.floor(sr * rand(0.2, 0.55)) : Math.floor(sr * rand(0.008, 0.04));
      const f1 = bp(rand(300, 850), 5), f2 = bp(rand(1000, 2400), 6);
      const p0 = pitch * rand(0.92, 1.1), p1 = p0 * rand(0.85, 1.1);
      for (let k = 0; k < syl && i + k < n; k++) {
        const u = k / syl, env = Math.pow(Math.sin(Math.PI * u), 0.7);
        phase += (p0 + (p1 - p0) * u) / sr; if (phase > 1) phase -= 1;
        const src = (phase < 0.08 ? 1 : -0.08) + (Math.random() * 2 - 1) * 0.15;
        d[i + k] = (run(f1, src) * 1.0 + run(f2, src) * 0.55) * env * 0.9;
      }
      i += syl + gap;
    }
    return b;
  },
  makeRain(sec) {
    const ctx = this.ctx, sr = ctx.sampleRate, n = Math.floor(sr * sec), b = ctx.createBuffer(2, n, sr);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch); let lp = 0;
      for (let i = 0; i < n; i++) { lp = lp * 0.82 + (Math.random() * 2 - 1) * 0.18; d[i] = lp * 0.55 + (Math.random() * 2 - 1) * 0.12; }
      const drops = Math.floor(sec * 28);
      for (let p = 0; p < drops; p++) {
        const at = Math.floor(Math.random() * (n - 600)), amp = rand(0.08, 0.45), len = randi(60, 260);
        for (let k = 0; k < len; k++) d[at + k] += (Math.random() * 2 - 1) * amp * Math.exp(-k / (len / 5));
      }
    }
    return b;
  },
  makeWaves(sec) {
    const ctx = this.ctx, sr = ctx.sampleRate, n = Math.floor(sr * sec), b = ctx.createBuffer(2, n, sr);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch); let lp = 0;
      for (let i = 0; i < n; i++) {
        const t = i / sr, ph = (t / sec * 2 + ch * 0.07) % 1;
        const env = ph < 0.45 ? Math.pow(ph / 0.45, 2) : Math.exp(-(ph - 0.45) * 5.5);
        lp = lp * 0.9 + (Math.random() * 2 - 1) * 0.1;
        d[i] = (lp * 1.8 * (0.25 + env) + (Math.random() * 2 - 1) * 0.12 * env) * 0.8;
      }
      // smooth the loop seam
      for (let k = 0; k < 2000; k++) { const a = k / 2000; d[k] *= a; d[n - 1 - k] *= a; }
    }
    return b;
  },
  makeCrickets(sec) {
    const ctx = this.ctx, sr = ctx.sampleRate, n = Math.floor(sr * sec), b = ctx.createBuffer(2, n, sr);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch), f = ch ? 4250 : 4650; let t0 = rand(0, 0.3);
      while (t0 < sec - 0.2) {
        for (let pulse = 0; pulse < 3; pulse++) {
          const st = Math.floor((t0 + pulse * 0.028) * sr), len = Math.floor(0.016 * sr);
          for (let k = 0; k < len && st + k < n; k++) d[st + k] += Math.sin(TAU * f * k / sr) * Math.sin(Math.PI * k / len) * 0.22;
        }
        t0 += rand(0.45, 0.9);
      }
    }
    return b;
  },

  /* ---------- primitive voices ---------- */
  nz(t, dur, type, freq, Q, vol, dest, pan) {
    const ctx = this.ctx, src = ctx.createBufferSource(); src.buffer = this.noise;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = Q;
    const gn = ctx.createGain(); gn.gain.setValueAtTime(Math.max(vol, 0.0002), t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(gn);
    if (pan) { const p = ctx.createStereoPanner(); p.pan.value = pan; gn.connect(p); p.connect(dest || this.sfxIn); } else gn.connect(dest || this.sfxIn);
    src.start(t, rand(0, 2.2), dur + 0.03);
    return f;
  },
  tone(t, type, f0, f1, dur, vol, dest, attack = 0.004) {
    const ctx = this.ctx, o = ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t); if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const gn = ctx.createGain(); gn.gain.setValueAtTime(0.0001, t); gn.gain.linearRampToValueAtTime(vol, t + attack); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gn); gn.connect(dest || this.sfxIn); o.start(t); o.stop(t + dur + 0.05);
    return o;
  },
  bell(t, f, dur, vol, dest) { // inharmonic metallic partials
    for (const [r, a] of [[1, 1], [2.76, 0.45], [5.4, 0.25], [8.93, 0.12]]) this.tone(t, 'sine', f * r, null, dur * (1.1 - r / 12), vol * a, dest, 0.002);
  },
  get t() { return this.ctx.currentTime + 0.01; },
  ok() { return this.ready && this.ctx.state === 'running'; },

  /* ---------- sfx ---------- */
  crunch(kind, power = 1, shiny = false) {
    if (!this.ok()) return;
    const t = this.t;
    if (t - this.lastCrunch < 0.045) return;
    this.lastCrunch = t;
    const thick = { bbq: 0.9, lava: 1, blackhole: 1, gold: 0.5, dragon: 0.6, onion: 0.25 }[kind] || 0;
    const crisp = { salt: 1, nacho: 1.2, frost: 0.8, diamond: 0.8, plain: 0.5, hot: 0.6 }[kind] || 0.3;
    const grains = randi(4, 6) + (kind === 'nacho' ? 3 : 0) + (thick > 0.8 ? 1 : 0);
    for (let i = 0; i < grains; i++) {
      const tt = t + i * rand(0.005, 0.015) + rand(0, 0.006);
      const f = rand(1400, 4600) * (1 - thick * 0.38) * (1 + crisp * 0.12);
      this.nz(tt, rand(0.02, 0.055) * (1 + thick * 0.4), 'bandpass', f, rand(0.7, 1.5), rand(0.35, 0.8) * power);
    }
    this.nz(t, 0.08 + thick * 0.04, 'lowpass', 1000 - thick * 300, 0.7, 0.55 * power);
    this.tone(t, 'sine', 150 - thick * 30, 55, 0.08, 0.32 * power);
    if (t - this.lastExtra < 0.12) return;
    this.lastExtra = t;
    const R = this.sfxRevSend, B = this.bigRevSend;
    switch (kind) {
      case 'salt': this.tone(t + 0.02, 'sine', 3800, 3600, 0.12, 0.05); break;
      case 'hot': this.nz(t + 0.04, 0.35, 'highpass', 3500, 0.5, 0.12); break;
      case 'lava': this.nz(t + 0.03, 0.5, 'highpass', 3000, 0.5, 0.16); this.tone(t, 'sine', 70, 38, 0.45, 0.3); break;
      case 'frost': this.nz(t, 0.03, 'highpass', 5000, 0.7, 0.5); this.tone(t + 0.01, 'sine', 2600, 1700, 0.18, 0.09, R); break;
      case 'toxic': for (let i = 0; i < 3; i++) this.tone(t + 0.05 + i * 0.07, 'sine', rand(260, 380), rand(800, 1100), 0.06, 0.08); break;
      case 'gold': this.bell(t + 0.01, 1850, 0.45, 0.06, R); break;
      case 'diamond': this.bell(t + 0.01, 2700, 0.7, 0.05, B); this.tone(t + 0.05, 'sine', 5274, null, 0.4, 0.025, B); break;
      case 'lightning': {
        this.tone(t, 'sawtooth', 1400, 180, 0.16, 0.07); this.nz(t, 0.18, 'highpass', 4000, 0.6, 0.2);
        break;
      }
      case 'glitch': for (let i = 1; i < 4; i++) { this.nz(t + i * 0.035, 0.03, 'bandpass', 2600 + i * 700, 2, 0.4); this.tone(t + i * 0.035, 'square', 880 * i, null, 0.025, 0.035); } break;
      case 'galaxy': this.tone(t + 0.03, 'sine', 620, 1240, 0.5, 0.05, B); this.tone(t + 0.06, 'sine', 1864, null, 0.4, 0.025, B); break;
      case 'dragon': this.nz(t + 0.02, 0.45, 'bandpass', 500, 1.2, 0.3); for (let i = 0; i < 4; i++) this.tone(t + 0.05 + i * 0.045, 'triangle', mtof(84 + [0, 4, 7, 12][i]), null, 0.15, 0.04, R); break;
      case 'blackhole': {
        const f = this.nz(t, 0.55, 'lowpass', 150, 1, 0.5, B); f.frequency.exponentialRampToValueAtTime(3500, t + 0.5);
        this.tone(t + 0.45, 'sine', 60, 28, 0.6, 0.45); break;
      }
    }
    if (shiny) for (let i = 0; i < 4; i++) this.tone(t + 0.04 + i * 0.05, 'sine', mtof(91 + [0, 3, 7, 12][i]), null, 0.25, 0.045, B);
  },
  chew() {
    if (!this.ok()) return;
    const t = this.t;
    if (t - this.lastCrunch < 0.12) return;
    for (let i = 0; i < 2; i++) this.nz(t + i * 0.02, 0.05, 'lowpass', rand(700, 1300), 0.8, rand(0.08, 0.14));
  },

/* ---------------- MUSIC: lofi beat that grows with your chips ---------------- */
const PROG = [ // [bass midi, keys voicing]
  [41, [53, 57, 60, 64, 67]], // Fmaj9
  [40, [52, 55, 59, 62, 67]], // Em7(b13)

  [36, [48, 52, 55, 59, 62]], // Cmaj9
  [45, [55, 60, 64, 67, 71]], // Am9
  [38, [50, 53, 57, 60, 64]], // Dm9
  [43, [53, 59, 64, 69]],     // G13
  [36, [48, 52, 55, 59, 64]], // Cmaj7

const MELODY = [ // [bar, step, midi, len]
  [0, 2, 76, 2], [0, 4, 79, 4], [0, 10, 77, 2], [0, 12, 76, 4],
  [1, 0, 74, 6], [1, 8, 71, 2], [1, 10, 74, 2], [1, 12, 79, 4],
  [2, 2, 77, 2], [2, 4, 76, 2], [2, 6, 74, 4], [2, 12, 72, 2], [2, 14, 74, 2],
  [3, 0, 76, 8], [3, 10, 79, 2], [3, 12, 76, 4],
  [4, 2, 72, 2], [4, 4, 76, 4], [4, 10, 79, 2], [4, 12, 81, 4],
  [5, 0, 84, 4], [5, 6, 81, 2], [5, 8, 77, 4], [5, 14, 76, 2],
  [6, 0, 74, 4], [6, 4, 76, 2], [6, 6, 74, 2], [6, 8, 71, 6],
  [7, 0, 72, 10], [7, 12, 67, 4],

const THEME_MUSIC = { bedroom: [0, 82, 'pluck'], arcade: [2, 88, 'square'], tree: [-3, 76, 'guitar'], beach: [5, 84, 'steel'], space: [-2, 74, 'sine'] };

const Music = {
  on: false, step: 0, nextTime: 0, bpm: 82, trans: 0, lead: 'pluck', timer: null, beatPhase: 0, lastBeatTime: 0,
  setup() {
    this.applyTheme();
    this.nextTime = AudioSys.ctx.currentTime + 0.15; this.step = 0; this.on = true;
    this.timer = setInterval(() => this.tick(), 25);
  },
  applyTheme() { const m = THEME_MUSIC[S.theme] || THEME_MUSIC.bedroom; this.trans = m[0]; this.bpm = m[1]; this.lead = m[2]; },
  get sd() { return 60 / this.bpm / 4; },
  level() { return S.chipMax; },
  tick() {
    const A = AudioSys; if (!A.ready || A.ctx.state !== 'running') return;
    const ct = A.ctx.currentTime;
    if (this.nextTime < ct - 0.2) this.nextTime = ct + 0.05; // recovered from a stall
    while (this.nextTime < ct + 0.13) {
      const sw = (this.step % 2) ? this.sd * 0.26 : 0;
      this.play(this.step, this.nextTime + sw);
      this.nextTime += this.sd;
      this.step = (this.step + 1) % 128;
    }
  },
  // beat phase for the character's head-bob, 0..1 per beat
  phase() {
    const A = AudioSys; if (!A.ready) return (now() * this.bpm / 60) % 1;
    const beatDur = 60 / this.bpm, t = A.ctx.currentTime - (A.ctx.baseLatency || 0);
    return ((t - this.anchor) / beatDur % 1 + 1) % 1;
  },
  anchor: 0,
  play(step, t) {
    const L = this.level(), bar = Math.floor(step / 16), s = step % 16, F = Game.frenzyOn;
    const [bassM, keys] = PROG[bar], tr = this.trans;
    if (s % 4 === 0) this.anchor = t;
    // keys
    if (s === 0) this.chord(t, keys, tr, this.sd * 7, 0.9);
    if (s === 7) this.chord(t, keys.slice(-3), tr, this.sd * 2, 0.5);
    if (s === 10) this.chord(t, keys, tr, this.sd * 6, 0.68);
    // drums
    const kickPat = F ? [0, 4, 8, 10, 12] : [0, 10];
    if (kickPat.includes(s) || (L >= 4 && !F && s === 7 && bar % 2 === 1)) this.kick(t, F ? 1.15 : s === 7 ? 0.55 : 0.9);
    if (s === 4 || s === 12) { if (L >= 2) this.snare(t + 0.012, F ? 1 : 0.8); else this.rim(t + 0.01); }
    if (L >= 3 || F) {
      const sixteenth = L >= 8 || F;
      if (s % 2 === 0 || sixteenth) this.hat(t, s % 4 === 2 ? 0.85 : s % 2 === 0 ? 0.55 : 0.3);
      if (s === 14 && bar % 2 === 1) this.hat(t, 0.6, true);

    if (L >= 9 && s % 2 === 1) this.shaker(t, s % 4 === 3 ? 0.6 : 0.35);

    if (L >= 1) {

    if (L >= 7 && s === 0) this.pad(t, keys.slice(1), tr, this.sd * 16);

    if (L >= 5) for (const [b, st, m, len] of MELODY) if (b === bar && st === s) {

      if (L >= 13) this.flute(t + this.sd * 0.02, m + tr - 12, this.sd * len);

  chord(t, notes, tr, dur, vel) { notes.forEach((m, i) => this.ep(t + i * 0.014 + rand(0, 0.006), m + tr, dur, vel * (i === 0 ? 0.9 : 1))); },
  ep(t, midi, dur, vel) {

  kick(t, v) {

    if (Game.frenzyOn) { // pump the music on kicks

  },
  snare(t, v) {

    A.nz(t, 0.19, 'bandpass', 1750, 0.8, 0.2 * v, A.snareSend);
    A.tone(t, 'triangle', 190, 150, 0.08, 0.16 * v, A.drumBus);
  },
  rim(t) { const A = AudioSys; A.tone(t, 'triangle', 820, 700, 0.03, 0.08, A.drumBus); A.nz(t, 0.02, 'bandpass', 2500, 2, 0.08, A.drumBus); },
  hat(t, v, open) { const A = AudioSys; A.nz(t, open ? 0.22 : 0.04, 'highpass', 7200, 0.7, 0.07 * v, A.drumBus); },
  shaker(t, v) { const A = AudioSys; A.nz(t, 0.06, 'bandpass', 5800, 1.2, 0.05 * v, A.drumBus); },
  bass(t, midi, dur) {
    const A = AudioSys, ctx = A.ctx, f = mtof(midi);
    const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
    const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = f / 2;
    const gn = ctx.createGain(); gn.gain.setValueAtTime(0.0001, t); gn.gain.linearRampToValueAtTime(0.32, t + 0.02);
    gn.gain.setValueAtTime(0.28, t + dur * 0.8); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.08);

  pad(t, notes, tr, dur) {

      case 'sine': o = ctx.createOscillator(); o.type = 'sine'; lp.frequency.value = 3000; rel = 0.9; { const v = ctx.createOscillator(); v.frequency.value = 5; const vg = ctx.createGain(); vg.gain.value = 9; v.connect(vg); vg.connect(o.detune); v.start(t); v.stop(t + dur + rel + 0.1); } break;

/* ---------------- AMBIENCE: the room at 2 AM ---------------- */
const Amb = {
  loops: {}, timer: null, lastClock: 0, nextCar: 0, nextSiren: 0, nextOwl: 0, nextBeep: 0, nextBubble: 0, nextArcade: 0, fridgeOn: true, fridgeT: 0,
  setup() {
    const A = AudioSys;

    const n = performance.now() / 1000;
    this.nextCar = n + rand(8, 20); this.nextSiren = n + rand(70, 150); this.nextOwl = n + rand(15, 40);
    this.refresh();
    this.timer = setInterval(() => this.tick(), 250);
  },
  loop(key, buf, chain, vol) { // start a looping buffer through a filter chain
    const A = AudioSys, ctx = A.ctx;
    if (this.loops[key]) return;
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const gn = ctx.createGain(); gn.gain.value = 0.0001;
    let node = src;
    for (const [type, f, q] of chain) { const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q || 0.7; node.connect(fl); node = fl; }
    node.connect(gn); gn.connect(A.ambOut);
    src.start(ctx.currentTime, rand(0, buf.duration));
    gn.gain.setTargetAtTime(vol, ctx.currentTime, 0.6);
    this.loops[key] = { src, gn, vol };
  },
  osc(key, freqs, vol, lp = 400) {
    const A = AudioSys, ctx = A.ctx;
    if (this.loops[key]) return;

   RENDER CORE: canvas, camera, quality, helpers, particles

const ROOM_W = 2000, FLOOR_Y = 690, OUT = '#1d0f36';

const R = {
  cv: null, ctx: null, W: 1, H: 1, dpr: 1, s: 0.5, camX: 960, camY: 500, camTX: 960, viewW: 1000, viewH: 1000,

  init() {

  qualityTable: {
    low: { dpr: 1, sdpr: 1, parts: 110, fx: 0 },
    medium: { dpr: 1.5, sdpr: 1.25, parts: 220, fx: 1 },
    high: { dpr: 2, sdpr: 1.6, parts: 380, fx: 2 },
  },
  setQuality() {
    let q = S.settings.quality;

    this.q = q; this.qInfo = this.qualityTable[q];
    FX.max = this.qInfo.parts;

  },
  autoQ: null, fpsAcc: 0, fpsN: 0, fpsT: 0, lowStreak: 0,
  watchFps(dt) { // auto quality: only ever steps DOWN, after a sustained slump (no flip-flopping)

    this.fpsAcc += dt; this.fpsN++;

      const fps = this.fpsN / this.fpsAcc; this.fpsAcc = 0; this.fpsN = 0;

/* ---------- drawing helpers (cartoon style: thick ink outlines) ---------- */
function rr(c, x, y, w, h, r) {

    }
  },
  text(x, y, str, col = '#ffd23f', size = 34) {

  },
  update(dt) {

  hair(c, hx, hy, t, chip) {

    line(c, [hx + 40 + pull, hy - 58, hx + 58 + pull, hy - 44], 5, HAIR_L);

  },
  crown(c, x, y, t) {
    c.save(); c.translate(x, y);
    c.beginPath(); c.moveTo(-46, 18); c.lineTo(-52, -20); c.lineTo(-26, 0); c.lineTo(0, -32); c.lineTo(26, 0); c.lineTo(52, -20); c.lineTo(46, 18); c.closePath();

  },
  drawArm(c, A, t) {

  drawDrinkInHand(c, x, y, t) {

/* =========================================================
   SNACK BUDDIES: they hang out and munch on their own
   ========================================================= */
const BI = Object.fromEntries(BUDDIES.map((b, i) => [b.id, i]));
const Buddies = {
  st: {}, popT: {},
  init() {
    for (const b of BUDDIES) this.st[b.id] = { t: rand(0, 3), act: 0, phase: 0 };
    this.st.hamster.x = 400; this.st.hamster.dir = 1; this.st.hamster.spin = 0;
    this.st.vacuum.x = 300; this.st.vacuum.y = 950; this.st.vacuum.tx = 600; this.st.vacuum.ty = 950; this.st.vacuum.ang = 0;
    this.st.alien.x = 1180; this.st.alien.y = 160;
  },
  lv(id) { return S.bud[BI[id]] || 0; },
  has(id) { return this.lv(id) > 0; },
  // how often a buddy takes a bite (seconds), faster at higher levels
  every(id, base) { return base / (1 + Math.log2(Math.max(1, this.lv(id))) * 0.35); },
  pop(id, x, y) { // floating coins over a buddy when it munches
    const n = now(); if ((this.popT[id] || 0) > n) return;
    this.popT[id] = n + 1.4;
    if (x < R.viewL() - 50 || x > R.viewR() + 50) return;
    const i = BI[id], every = this.every(id, this.baseEvery[id] || 3);
    const amt = Eco.buddyRaw(i) * Eco.liveMult() * (S.boost.shake > 0 ? 3 : 1) * every;
    if (amt >= 1) FX.text(x, y, '+' + fmt(amt), '#9dffb0', 26);
  },
  baseEvery: { dog: 6, cat: 4, hamster: 3, vacuum: 2, parrot: 3, gamer: 4, sleepy: 5, goblin: 3.5, big: 6, ghost: 5, alien: 6 },
  hype(c, id, x, y, r, t) {
    const l = this.lv(id); if (l < 25) return;
    c.globalCompositeOperation = 'lighter';
    glow(c, x, y, r * 1.6, l >= 100 ? rainbow(t * 0.2) : l >= 50 ? '#ffd23f' : '#9b6bff', 0.35);
    c.globalCompositeOperation = 'source-over';
    if (l >= 50 && R.qInfo.fx > 0) for (let i = 0; i < 3; i++) { const a = t * 1.5 + i * 2.1; star4(c, x + Math.cos(a) * r, y + Math.sin(a) * r * 0.7, 6 + 2 * Math.sin(t * 4 + i), '#fff6c8', t); }
  },
  update(dt, t) {
    for (const b of BUDDIES) {
      if (!this.has(b.id)) continue;
      const s = this.st[b.id]; s.t += dt;
      const ev = this.every(b.id, this.baseEvery[b.id]);
      if (s.t >= ev) { s.t = 0; s.act = 1; this.onAct(b.id, s); }
      s.act = Math.max(0, s.act - dt / 1.2);
    }
    // hamster rolls laps
    const h = this.st.hamster;
    if (this.has('hamster')) { const sp = 85 + Math.min(80, this.lv('hamster')); h.x += h.dir * sp * dt; if (h.x > 1860) h.dir = -1; if (h.x < 140) h.dir = 1; h.spin = (h.spin || 0) + h.dir * sp * dt / 32; }
    // robot vacuum hunts crumbs
    const v = this.st.vacuum;
    if (this.has('vacuum')) {
      if (!v.target || Math.random() < dt * 0.3) {
        let best = null, bd = 1e9;
        for (const f of FX.floorCrumbs) { if (f.y < 905) continue; const d = Math.hypot(f.x - v.x, (f.y - v.y) * 2); if (d < bd) { bd = d; best = f; } }
        v.target = best; if (!best && !v.tx) { v.tx = rand(150, 1850); v.ty = rand(915, 982); }
      }
      const tx = v.target ? v.target.x : v.tx, ty = v.target ? Math.max(915, v.target.y) : v.ty;
      const dx = tx - v.x, dy = ty - v.y, d = Math.hypot(dx, dy);
      const sp = 120 + Math.min(120, this.lv('vacuum') * 2);
      if (d > 4) { v.x += dx / d * Math.min(d, sp * dt); v.y += dy / d * Math.min(d, sp * dt); v.ang = Math.atan2(dy, dx); }
      else if (!v.target) { v.tx = rand(150, 1850); v.ty = rand(915, 982); }
      for (let i = FX.floorCrumbs.length - 1; i >= 0; i--) { const f = FX.floorCrumbs[i]; if (Math.abs(f.x - v.x) < 46 && Math.abs(f.y - v.y) < 30) { FX.floorCrumbs.splice(i, 1); if (v.target === f) v.target = null; v.eaten = (v.eaten || 0) + 1; if (v.eaten % 12 === 0) { AudioSys.beep(2); this.pop('vacuum', v.x, v.y - 60); } } }
    }
    // timed actions (frame-rate independent)
    const d = this.st.dog;
    if (d.flying) { d.flying.t += dt; if (d.flying.t >= 0.6) { d.flying = null; d.chomp = 0.3; AudioSys.chomp(0.18); FX.crumbs(786, 822, 4, Guy.crumbCols(CHIPS[S.chip].id), 0.4); this.pop('dog', 760, 755); } }
    if (d.chomp > 0) d.chomp = Math.max(0, d.chomp - dt);
    const bg = this.st.big;
    if (bg.pour > 0) {
      bg.pour += dt;
      if (bg.pour > 0.5 && bg.pour < 2.1 && Math.random() < dt * 25) { const cid = CHIPS[S.chip].id; FX.add({ type: 'custom', x: 1450, y: 612, vx: rand(-15, 5), vy: 120, g: 500, life: 0.4, draw: (cc, p) => ChipArt.draw(cc, cid, p.x, p.y, 14, p.t * 9, 0, {}) }); }
      if (bg.pour > 2.6) { bg.pour = 0; this.pop('big', 1420, 600); AudioSys.chomp(0.15); }
    }
    const al = this.st.alien;
    if (al.beam > 0) { al.beam += dt; if (al.beam > 2.4) { al.beam = 0; this.pop('alien', al.x, al.y - 40); AudioSys.squeak(); } }
    // alien drifts in a lazy figure-eight
    const a = this.st.alien; a.x = 1170 + Math.sin(t * 0.35) * 70; a.y = 170 + Math.sin(t * 0.7) * 34;
  },
  onAct(id, s) {
    switch (id) {
      case 'dog': // your guy tosses a chip, the dog catches it
        Guy.toss = 0.35; AudioSys.toss();
        s.flying = { t: 0 }; break;
      case 'cat': FX.crumbs(330, 356, 2, Guy.crumbCols(CHIPS[S.chip].id), 0.3, false); this.pop('cat', 290, 270); break;
      case 'hamster': this.pop('hamster', this.st.hamster.x, 860); break;

  },
  drawBack(c, t) {

    if (this.has('parrot')) this.parrot(c, t);

/* ---------- small icon canvases ---------- */

/* =========================================================
   INPUT
   ========================================================= */
const Input = {
  down: null, dragging: false,
  init() {
    const st = $('stage');
    st.addEventListener('pointerdown', e => {
      if (e.target.closest('button') || !Game.started) return;
      if (e.button !== undefined && e.button > 0) return;
      Game.tap();
      if (!this.down) { this.down = { id: e.pointerId, x: e.clientX, cam: R.camTX }; }
    });
    window.addEventListener('pointermove', e => {
      const d = this.down; if (!d || d.id !== e.pointerId) return;
      const dx = e.clientX - d.x;
      if (!this.dragging && Math.abs(dx) > 12 && R.viewW < ROOM_W + 100) this.dragging = true;
      if (this.dragging) { R.camTX = R.clampCam(d.cam - dx / R.s); R.panReturnAt = 0; }
    });
    const up = e => { if (this.down && this.down.id === e.pointerId) { this.down = null; this.dragging = false; } };
    window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
    st.addEventListener('contextmenu', e => e.preventDefault());
    st.addEventListener('wheel', e => { if (R.viewW < ROOM_W + 100) { R.camTX = R.clampCam(R.camTX + (e.deltaX || e.deltaY) * 0.8 / R.s * 0.5); R.panReturnAt = 0; } }, { passive: true });
    document.addEventListener('keydown', e => {
      if (!Game.started || UI.open || Game.revealing || e.target.tagName === 'INPUT') return;
      if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) { e.preventDefault(); if (document.activeElement && document.activeElement.tagName === 'BUTTON') document.activeElement.blur(); Game.tap(); }
      if (e.code === 'ArrowLeft') { R.camTX = R.clampCam(R.camTX - 120); R.panReturnAt = 0; }
      if (e.code === 'ArrowRight') { R.camTX = R.clampCam(R.camTX + 120); R.panReturnAt = 0; }
    });
  },
};

/* =========================================================
   GAME
   ========================================================= */
const BUDDY_SPOT = { dog: [760, 850], cat: [300, 330], hamster: [0, 930], vacuum: [0, 950], parrot: [1395, 230], gamer: [1640, 780], sleepy: [470, 520], goblin: [1110, 420], big: [1420, 760], ghost: [420, 600], alien: [1170, 170] };
const ROOM_SPOT = { posters: [1880, 225], lights: [1000, 70], plants: [1458, 600], lavalamp: [676, 550], couch2: [1005, 560], fridge: [1366, 630], neon: [500, 238], tv: [1645, 460], pc: [1900, 480], fish: [109, 490], led: [1000, 30], disco: [1300, 74], couch3: [1005, 560] };

const Game = {
  started: false, frenzyOn: false, frenzyT: 0, meter: 0, coolT: 0, lastTap: 0, tapTimes: [], bagSquash: 0,
  chipFx: { frost: 0 }, vibeAcc: 0, textAcc: 0, textT: 0, saveT: 0, trophyT: 0, tutT: 0, last: 0,
  rebirthing: null, revealing: null, wiping: false, welcomeData: null, flash: 0, glitchT: 0, energyAt: 0,

  boot() {
    const had = Save.load();
    // offline earnings: your buddies kept eating while you were away
    if (had && S.lastSave > 0) {
      const sec = clamp((Date.now() - S.lastSave) / 1000, 0, 12 * 3600);
      for (const k of Object.keys(S.cd)) S.cd[k] = Math.max(0, S.cd[k] - sec);
      for (const k of Object.keys(S.boost)) S.boost[k] = Math.max(0, S.boost[k] - sec);
      if (sec > 30) { const gain = Eco.buddyCps(false) * sec; if (gain >= 1) { this.earn(gain); this.welcomeData = [sec, gain]; } }
    }
    R.init(); ChipArt.init(); Buddies.init(); Guy.init(); UI.init(); Input.init();
    UI.updateChipLabel();
    $('btnPlay').textContent = had && S.life.bites > 0 ? 'CONTINUE' : 'PLAY';
    $('btnPlay').addEventListener('click', () => this.start());
    $('btnTitleSettings').addEventListener('click', () => { UI.settings(); });
    $('revBtn').addEventListener('click', () => this.closeReveal());
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { BagArt.cache = {}; R.statDirty = true; Room.tableDirty = true; UI.iconCache.clear(); UI.render(true); });
    setInterval(() => { if (this.started && !this.wiping) Save.save(); }, 10000);
    const saveNow = () => { if (this.started && !this.wiping) Save.save(); };
    document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
    window.addEventListener('pagehide', saveNow);
    this.titleRain = $('titleRain').getContext('2d');
    this.last = now();
    requestAnimationFrame(() => this.frame());
  },
  start() {
    if (this.started) return;
    AudioSys.init(); AudioSys.resume();
    this.started = true;
    const tl = $('title'); tl.style.transition = 'opacity .5s'; tl.style.opacity = '0'; setTimeout(() => tl.classList.add('hidden'), 520);
    AudioSys.chime([72, 76, 79, 84], 0.08, 0.05);
    if (this.welcomeData) { const [sec, gain] = this.welcomeData; this.welcomeData = null; setTimeout(() => UI.welcome(sec, gain), 450); }
  },

  /* ---------- main loop ---------- */
  frame() {
    const t = now(); let dt = t - this.last; this.last = t;
    if (dt > 2.5) { this.away(dt); dt = 1 / 60; }
    dt = Math.min(dt, 0.1);
    try { this.update(dt, t); this.render(t, dt); } catch (e) { console.error(e); }
    requestAnimationFrame(() => this.frame());
  },
  away(sec) { // the tab was asleep: buddies kept munching
    if (!this.started || this.rebirthing) return;
    sec = Math.min(sec, 12 * 3600);
    for (const k of Object.keys(S.cd)) S.cd[k] = Math.max(0, S.cd[k] - sec);
    for (const k of Object.keys(S.boost)) S.boost[k] = Math.max(0, S.boost[k] - sec);
    if (this.frenzyOn) this.endFrenzy(true);
    const gain = Eco.buddyCps(false) * sec;
    if (gain >= 1) { this.earn(gain); if (sec > 20) UI.toast('WHILE YOU WERE AWAY', `Your buddies munched +${fmt(gain)} coins`, Icons.make(c => c.drawImage(Icons.chip(CHIPS[S.chip].id, 40), 0, 0, 40, 40), 40)); }
  },
  update(dt, t) {
    if (this.started && !this.rebirthing) {
      for (const k of Object.keys(S.cd)) if (S.cd[k] > 0) S.cd[k] = Math.max(0, S.cd[k] - dt);
      for (const k of Object.keys(S.boost)) if (S.boost[k] > 0) S.boost[k] = Math.max(0, S.boost[k] - dt);
      // frenzy meter
      if (this.frenzyOn) { this.frenzyT -= dt; R.shake(2.2); if (this.frenzyT <= 0) this.endFrenzy(); }
      else if (this.coolT > 0) this.coolT = Math.max(0, this.coolT - dt);
      else if (this.meter >= 1) this.startFrenzy();
      else this.meter = Math.max(0, this.meter - dt * (t - this.lastTap > 0.4 ? 0.16 : 0.06));
      if (this.energyAt && t >= this.energyAt) { this.energyAt = 0; this.coolT = 0; this.startFrenzy(); }
      // buddies
      const bc = Eco.buddyCps(true); if (bc > 0) this.earn(bc * dt);
      S.life.playSec += dt;
    }
    if (!this.rebirthing) { Guy.update(dt, t); Buddies.update(dt, t); }
    FX.update(dt);
    this.bagSquash = Math.max(0, this.bagSquash - dt * 4);
    if (this.textAcc > 0 && t - this.textT > 0.085) { const [mx, my] = Guy.mouthPos(); FX.text(mx + rand(-30, 30), my - 40, '+' + fmt(this.textAcc), Game.frenzyOn ? '#fff3a0' : '#ffd23f', this.frenzyOn ? 40 : 34); this.textAcc = 0; this.textT = t; }
    this.vibe(dt, t);
    UI.tick(dt, t);
    if (this.rebirthing) this.updateRebirth(dt);
    if (this.revealing) this.revealing.t += dt;
    this.trophyT -= dt; if (this.trophyT <= 0) { this.trophyT = 1; this.checkTrophies(); }
    this.tutT -= dt; if (this.tutT <= 0) { this.tutT = 0.4; this.tutorial(); }
    this.flash = Math.max(0, this.flash - dt * 4); this.glitchT = Math.max(0, this.glitchT - dt);
    R.watchFps(dt);
  },
  earn(v) { if (!(v > 0) || !isFinite(v)) return; S.coins += v; S.runCoins += v; S.life.coins += v; },
  nope() { AudioSys.nope(); },

  /* ---------- eating ---------- */
  tap() {
    if (!this.started || this.rebirthing || this.revealing || UI.open) return;
    AudioSys.resume();
    const t = now();
    const A = Guy.armL, shiny = (A.has && A.shiny) || (this.frenzyOn && Guy.armR.has && Guy.armR.shiny);
    const v = Eco.biteValue(shiny);
    this.earn(v); this.textAcc += v;
    S.life.bites++; S.life.taps++;
    Guy.queueBite();
    // frenzy meter fills when you mash
    if (!this.frenzyOn && this.coolT <= 0 && !this.energyAt) {
      this.meter = Math.min(1, this.meter + (t - this.lastTap < 0.35 ? 0.046 : 0.016));
      if (this.meter >= 1) this.startFrenzy();
    }
    this.lastTap = t;
    this.tapTimes.push(t); while (this.tapTimes.length && t - this.tapTimes[0] > 1) this.tapTimes.shift();
    if (this.tapTimes.length > S.life.bestTps) S.life.bestTps = this.tapTimes.length;
  },
  onVisualBite(A, auto) {
    if (!this.started) return;
    if (auto) { const v = Eco.biteValue(A.shiny); this.earn(v); this.textAcc += v; S.life.bites++; }
    if (A.bites >= 4) this.coinFly(3, ...Guy.chipPos(A));
  },
  shinyPopup(A) {
    if (!this.started) return;
    const id = CHIPS[S.chip].id; S.shiny[id] = true;
    UI.banner('SHINY CHIP!', '#fff3a0'); AudioSys.chime([91, 95, 98, 103], 0.06, 0.06);
    const [x, y] = Guy.chipPos(A); for (let i = 0; i < 10; i++) FX.add({ type: 'spark', x, y, vx: rand(-200, 200), vy: rand(-220, 60), drag: 0.92, life: 0.8, size: 9, col: rainbow(i / 10), vr: 4 });
  },
  coinFly(n, wx, wy) {
    if (!this.started) return;
    const [sx, sy] = R.toScreen(wx, wy), st = $('stage').getBoundingClientRect(), cb = $('coinBox').querySelector('svg').getBoundingClientRect();
    const tx = cb.left + cb.width / 2 - st.left, ty = cb.top + cb.height / 2 - st.top;
    for (let i = 0; i < n; i++) {
      const cx = sx + rand(-80, 80), cy = Math.min(sy, ty + 200) - rand(40, 140);
      FX.addScr({ life: 0.55 + i * 0.07, draw: (c, p, k) => {
        const e = easeInOut(Math.min(1, k)), x = (1 - e) * (1 - e) * sx + 2 * (1 - e) * e * cx + e * e * tx, y = (1 - e) * (1 - e) * sy + 2 * (1 - e) * e * cy + e * e * ty, r = 9 * (1 - e * 0.35);
        circ(c, x, y + 1.5, r); c.fillStyle = '#b86e00'; c.fill(); circ(c, x, y, r); c.fillStyle = '#ffd23f'; c.fill(); c.lineWidth = 2.2; c.strokeStyle = OUT; c.stroke(); circ(c, x, y, r * 0.55); c.lineWidth = 1.5; c.strokeStyle = '#c98500'; c.stroke();
      }, update: (p) => { if (p.t >= p.life - 0.02 && !p.done) { p.done = true; const ct = $('coinText'); ct.classList.remove('bump'); void ct.offsetWidth; ct.classList.add('bump'); } } });
    }
    AudioSys.coinTick();
  },
  coinShower(n) {
    const st = $('stage'), W = st.clientWidth, H = st.clientHeight;
    for (let i = 0; i < n; i++) setTimeout(() => this.coinFly(1, ...R.toWorld(rand(W * 0.2, W * 0.8), rand(H * 0.4, H * 0.8))), i * 60);
  },

  /* ---------- frenzy ---------- */
  startFrenzy() {
    if (this.frenzyOn) { this.frenzyT = 10; return; }
    this.frenzyOn = true; this.frenzyT = 10; this.meter = 1; S.life.frenzies++;
    AudioSys.scratch(); Music.frenzy(true); R.shake(14);
    UI.banner('CRUNCH FRENZY!', '#ffd23f');
    if (S.settings.vibrate && navigator.vibrate) try { navigator.vibrate([30, 40, 60]); } catch (e) { }
    Guy.armR.state = 'rest';
  },
  endFrenzy(silent) {
    this.frenzyOn = false; this.coolT = 4; this.meter = 0; Music.frenzy(false);
    if (!silent) AudioSys.tapeStop();
  },

  /* ---------- shopping ---------- */
  sparkle(wx, wy, col = '#ffd23f', n = 16) {
    FX.add({ type: 'ring', x: wx, y: wy, size: 90, col, life: 0.6, lw: 8, must: true });
    for (let i = 0; i < n; i++) { const a = rand(TAU), sp = rand(150, 420); FX.add({ type: 'spark', x: wx, y: wy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, drag: 0.9, life: rand(0.6, 1.1), size: rand(7, 12), col, vr: 5 }); }
  },
  buyChip(i) {
    if (i !== S.chipMax + 1 || i >= CHIPS.length) return;
    const ch = CHIPS[i]; if (S.coins < ch.cost) return this.nope();
    S.coins -= ch.cost; S.chipMax = i; S.chip = i;
    UI.updateChipLabel(); UI.render(true);
    Guy.armL.bites = 0; Guy.surprise = 1.6;
    if (!S.seen[ch.id]) { S.seen[ch.id] = true; this.openReveal(i); }
    else { AudioSys.chime([84, 88, 91, 96]); UI.toast(ch.name.toUpperCase() + ' UNLOCKED', fmt(ch.v) + ' coins per bite', Icons.chip(ch.id, 40)); this.sparkle(...Guy.mouthPos(), ch.glow || '#ffd23f'); }
    this.checkTrophies(); Save.save();
  },
  buyBuddy(i, k) {
    if (!(i === 0 || S.bud[i - 1] > 0 || S.bud[i] > 0)) return;
    k = Math.max(1, Math.floor(k) || 1);
    const cost = Eco.budCost(i, k); if (S.coins < cost) return this.nope();
    S.coins -= cost; const before = S.bud[i]; S.bud[i] += k;
    const b = BUDDIES[i], spot = this.buddySpot(b.id);
    if (before === 0) {
      AudioSys.pop(i); AudioSys.kaching(0.7); UI.toast('NEW BUDDY: ' + b.name.toUpperCase(), b.desc, Icons.buddy(b.id, 40));
      R.panTo(spot[0]); this.sparkle(spot[0], spot[1], '#9dffb0');
    } else { AudioSys.pop(Math.min(12, i + 2)); this.sparkle(spot[0], spot[1], '#9dffb0', 5); }
    const hit = BUD_MILESTONES.find(m => before < m && S.bud[i] >= m);
    if (hit) { UI.toast(`${b.name.toUpperCase()} HIT LV ${hit}!`, 'Now earning 2x', Icons.buddy(b.id, 40)); AudioSys.chime(); }
    UI.render(false); this.checkTrophies();
  },
  buddySpot(id) { const s = BUDDY_SPOT[id].slice(), st = Buddies.st[id]; if (id === 'hamster' || id === 'vacuum' || id === 'alien') { s[0] = st.x; if (id === 'alien') s[1] = st.y; } return s; },
  buyRoom(id) {
    const r = ROOM_ITEMS.find(x => x.id === id); if (!r || S.room[id]) return;
    if (S.coins < r.cost) return this.nope();
