    Room.dirty(); Amb.refresh(); AudioSys.thunk();
    const [x, y] = ROOM_SPOT[id]; R.panTo(x); this.sparkle(x, y, '#ffd23f', 20);
    UI.toast(r.name.toUpperCase(), `+${Math.round((r.mult - 1) * 100)}% coins forever`, Icons.room(id, 40));
    UI.render(false); this.checkTrophies(); Save.save();
  },
  buyDip(id) {
    const i = DIPS.findIndex(d => d.id === id); if (i < 0 || S.dips[id] || (i > 0 && !S.dips[DIPS[i - 1].id])) return;
    const d = DIPS[i]; if (S.coins < d.cost) return this.nope();
    S.coins -= d.cost; S.dips[id] = true; Room.tableDirty = true; AudioSys.glop();
    R.panTo(1000); this.sparkle([866, 910, 954, 1046, 1090, 1134][i], POS.table.y - 14, d.col, 14);
    UI.toast(d.name.toUpperCase(), `x${d.mult} coins forever`, Icons.dip(d, 40));
    UI.render(false); this.checkTrophies(); Save.save();
  },
  buyDrink(id) {
    const i = DRINKS.findIndex(d => d.id === id); if (i < 0 || S.drinks[id] || (i > 0 && !S.drinks[DRINKS[i - 1].id])) return;
    const d = DRINKS[i]; if (S.coins < d.cost) return this.nope();
    S.coins -= d.cost; S.drinks[id] = true; S.cd[id] = 0; AudioSys.kaching();
    UI.toast(d.name.toUpperCase() + ' IN THE FRIDGE', 'Tap DRINK whenever it is ready', Icons.drink(id, 40));
    UI.render(false); Save.save();
  },
  useDrink(id) {
    const d = DRINKS.find(x => x.id === id); if (!d || !S.drinks[id] || this.rebirthing) return;
    if ((S.cd[id] || 0) > 0 || Guy.drink) return this.nope();
    S.cd[id] = d.cd; S.life.drinks++;
    Guy.drink = { type: id, t: 0 }; AudioSys.canOpen(id);
    if (id === 'energy') { this.coolT = 0; this.energyAt = now() + 1.25; } // frenzy kicks in right after he finishes chugging
    else { S.boost[id] = d.dur; UI.banner({ cola: 'SUGAR RUSH!', shake: 'BUDDY PARTY!', coffee: 'WIDE AWAKE!' }[id], { cola: '#ff6b5a', shake: '#ffb3d1', coffee: '#ffd9a0' }[id]); }
    UI.render(false);
  },
  applyTheme() { Room.dirty(); Amb.refresh(); Music.applyTheme(); },

  /* ---------- trophies + tutorial ---------- */
  checkTrophies() {
    if (!this.started) return;
    const h = new Date().getHours(); if (h < 4) S.life.night = true;
    let got = false;
    for (const [id, name, desc, test] of TROPHIES) {
      if (S.trophies[id]) continue;
      let ok = false; try { ok = test(S); } catch (e) { }
      if (ok) { S.trophies[id] = true; got = true; UI.toast('TROPHY: ' + name.toUpperCase(), desc + '  (+2% coins)', Icons.trophy('gold', 40)); }
    }
    if (got) { AudioSys.chime([79, 84, 88, 91, 96], 0.06, 0.06); Room.dirty(); }
  },
  tutorial() {
    if (!this.started || UI.open || this.revealing) return;
    const T = S.tut;
    if (!T.tap) { if (S.life.taps >= 8) { T.tap = true; UI.hint(null); } else UI.hint('tap', `<svg><use href="#i-tap"/></svg>Tap anywhere to make him crunch faster`); return; }
    if (!T.shop) {
      if (S.chipMax >= 1) { T.shop = true; UI.hint(null); }
      else if (S.coins >= CHIPS[1].cost) UI.hint('shop', `Sea Salt chips are ready! Unlock them in the <b>Chips</b> tab.`);
      return;
    }
    if (!T.frenzy && this.meter > 0.35 && !this.frenzyOn) { T.frenzy = true; UI.hint('frenzy', 'Keep mashing! Fill the meter for <b>CRUNCH FRENZY</b>.', 3000); return; }
    if (!T.drag && R.viewW < ROOM_W - 100 && (S.bud.some(l => l > 0) || Object.keys(S.room).length)) { T.drag = true; UI.hint('drag', 'Drag the room left and right to look around.', 3500); }
  },

  /* ---------- chip vibes: the room reacts to whatever you are eating ---------- */
  vibe(dt, t) {
    const id = CHIPS[S.chip].id, q = R.qInfo.fx, rate = q === 0 ? 0.4 : q === 1 ? 0.7 : 1;
    this.chipFx.frost = smooth(this.chipFx.frost, id === 'frost' ? 0.75 : 0, 2, dt);
    if (this.rebirthing || !this.started) return;
    const L = R.viewL(), Rr = R.viewR(), T = R.viewT(), B = T + R.viewH;
    this.vibeAcc += dt * rate;
    const spawn = per => { if (this.vibeAcc * per >= 1) { this.vibeAcc = 0; return true; } return false; };
    switch (id) {
      case 'lava': if (spawn(7)) FX.add({ type: 'ember', x: rand(L, Rr), y: rand(FLOOR_Y + 40, B), vx: rand(-15, 15), vy: rand(-110, -60), life: rand(2, 3.5), size: rand(2.5, 4.5), col: '#ff7a00' }); break;
      case 'frost': if (spawn(9)) FX.add({ type: 'snow', x: rand(L - 60, Rr), y: T - 10, vx: rand(10, 40), vy: rand(45, 90), life: 9, size: rand(3.5, 7), rot: rand(TAU), vr: rand(-1, 1) }); break;
      case 'toxic': if (spawn(5)) FX.add({ type: 'bubble', x: rand(L, Rr), y: B, vx: rand(-10, 10), vy: rand(-90, -50), life: 5, size: rand(5, 12), col: '#86ff4f' }); break;
      case 'gold': if (spawn(5)) FX.add({ type: 'spark', x: rand(L, Rr), y: rand(T + 80, B - 80), vx: 0, vy: -12, life: 1.6, size: rand(5, 9), col: '#ffd23f', vr: 2 }); break;
      case 'diamond': if (spawn(4)) FX.add({ type: 'custom', x: rand(L, Rr), y: rand(T + 60, FLOOR_Y), life: 2.2, draw: (c, p, k) => { c.globalCompositeOperation = 'lighter'; glow(c, p.x, p.y, 34, rainbow(p.x * 0.001 + k * 0.3, 100, 70), Math.sin(k * Math.PI) * 0.6); c.globalCompositeOperation = 'source-over'; } }); break;
      case 'lightning': if (Math.random() < dt * 0.18) { this.flash = 1; AudioSys.nz && AudioSys.ok() && AudioSys.nz(AudioSys.t, 0.5, 'lowpass', 300, 0.7, 0.25, AudioSys.ambOut); } if (spawn(1.5)) FX.add({ type: 'bolt', life: 0.15, pts: boltPts(POS.win.x + rand(20, 440), POS.win.y, POS.win.x + rand(20, 440), POS.win.y + rand(150, 300), 6, 16), col: '#c9f6ff' }); break;
      case 'glitch': if (Math.random() < dt * 0.5) this.glitchT = rand(0.08, 0.22); break;
      case 'galaxy': if (spawn(6)) FX.add({ type: 'spark', x: rand(L, Rr), y: rand(T, FLOOR_Y), vx: 0, vy: 0, life: rand(1.2, 2.2), size: rand(3, 6), col: pick(['#ffffff', '#ff9ff0', '#9fe6ff']), vr: 1 }); break;
      case 'dragon': if (spawn(5)) FX.add({ type: 'spark', x: rand(L, Rr), y: rand(T + 50, B - 50), vx: rand(-30, 30), vy: rand(-40, -10), life: 1.5, size: rand(5, 9), col: rainbow(Math.random()), vr: 3 }); break;
      case 'blackhole': if (spawn(12)) {
        const [cx, cy] = Guy.chipPos(Guy.armL), a = rand(TAU), d = rand(500, 900);
        FX.add({ type: 'custom', x: cx + Math.cos(a) * d, y: cy + Math.sin(a) * d * 0.7, a, d, life: 2.2, col: pick(['#b06bff', '#ffb35c', '#ffffff']), update: p => { const k = p.t / p.life; const dd = p.d * (1 - easeInOut(k)), aa = p.a + k * 4; const [gx, gy] = Guy.chipPos(Guy.armL); p.x = gx + Math.cos(aa) * dd; p.y = gy + Math.sin(aa) * dd * 0.7; }, draw: (c, p, k) => { circ(c, p.x, p.y, 3 + (1 - k) * 3); c.fillStyle = p.col; c.fill(); } });
      } break;
    }
  },

  /* ---------- rendering ---------- */
  worldTransform(c, pre) {
    const d = R.dpr, k = R.s;
    c.setTransform(d, 0, 0, d, 0, 0);
    if (pre) pre(c);
    c.transform(k, 0, 0, k, R.W / 2 - (R.camX + R.shakeX) * k, R.H / 2 - (R.camY + R.shakeY) * k);
  },
  render(t, dt) {
    const c = R.ctx, W = R.W, H = R.H, d = R.dpr;
    R.updateCam(dt);
    c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
    c.fillStyle = Room.pal().ceil; c.fillRect(0, 0, R.cv.width, R.cv.height);
    let pre = null, rb = this.rebirthing;
    if (rb) {
      const k = Math.min(1, rb.t / 4.4), [wx, wy] = Guy.chipPos(Guy.armL), [cx, cy] = R.toScreen(wx, wy);
      rb.cx = cx; rb.cy = cy;
      pre = cc => { cc.translate(cx, cy); cc.rotate(k * k * 6); const sc = Math.max(0.02, 1 - Math.pow(k, 1.6) * 0.98); cc.scale(sc, sc); cc.translate(-cx, -cy); };
    }
    this.worldTransform(c, pre);
    Room.drawWindow(c, t);
    R.drawStatic(c);
    Room.drawLive(c, t, dt);
    Buddies.drawBack(c, t);
    FX.drawFloor(c);
    // chip heat glow behind your guy
    const id = CHIPS[S.chip].id;
    if ((id === 'hot' || id === 'lava') && R.qInfo.fx > 0) { c.globalCompositeOperation = 'lighter'; glow(c, GX + 60, 380, 320, id === 'hot' ? '#ff3b1f' : '#ff7a00', 0.16 + 0.05 * Math.sin(t * 3)); c.globalCompositeOperation = 'source-over'; }
    Guy.draw(c, t);
    Room.drawTable(c); Snacks.drawTable(c, t);
    for (const [, fn] of Buddies.frontList(t)) fn();
    FX.draw(c, 0);
    // screen-space overlays
    c.setTransform(d, 0, 0, d, 0, 0);
    this.overlays(c, t, W, H);
    if (rb) this.drawRebirth(c, t, W, H);
    FX.drawScr(c);
    if (this.revealing) this.drawReveal(t);
    if (!this.started) this.drawTitleRain(t);
  },
  vig: null,
  overlays(c, t, W, H) {
    const id = CHIPS[S.chip].id;
    const tint = { frost: 'rgba(140,200,255,.07)', toxic: 'rgba(120,255,80,.06)', galaxy: 'rgba(25,0,70,.24)', blackhole: 'rgba(10,0,25,.25)', gold: 'rgba(255,200,60,.05)' }[id];
    if (tint) { c.fillStyle = tint; c.fillRect(0, 0, W, H); }
    if (id === 'dragon' && R.qInfo.fx > 0) { c.globalCompositeOperation = 'lighter'; c.globalAlpha = 0.07; const g = c.createLinearGradient(0, 0, W, H); for (let i = 0; i <= 6; i++) g.addColorStop(i / 6, `hsl(${(i * 60 + t * 60) % 360},100%,55%)`); c.fillStyle = g; c.fillRect(0, 0, W, H); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over'; }
    if (this.glitchT > 0) {
      const cv = R.cv, dd = R.dpr;
      for (let i = 0; i < 3; i++) { const y = rand(0, H - 40), h = rand(8, 40), off = rand(-30, 30); c.setTransform(1, 0, 0, 1, 0, 0); c.drawImage(cv, 0, y * dd, cv.width, h * dd, off * dd, y * dd, cv.width, h * dd); c.setTransform(dd, 0, 0, dd, 0, 0); c.fillStyle = pick(['rgba(255,43,214,.25)', 'rgba(34,227,255,.25)']); c.fillRect(0, y, W, h); }
    }
    if (this.flash > 0) { c.fillStyle = `rgba(220,240,255,${this.flash * 0.35})`; c.fillRect(0, 0, W, H); }
    // vignette
    if (!this.vig) { const v = document.createElement('canvas'); v.width = v.height = 256; const x = v.getContext('2d'), g = x.createRadialGradient(128, 128, 70, 128, 128, 182); g.addColorStop(0, 'rgba(8,2,22,0)'); g.addColorStop(1, 'rgba(8,2,22,.55)'); x.fillStyle = g; x.fillRect(0, 0, 256, 256); this.vig = v; }
    c.globalAlpha = id === 'blackhole' ? 1 : 0.8; c.drawImage(this.vig, -W * 0.1, -H * 0.1, W * 1.2, H * 1.2); if (id === 'blackhole') c.drawImage(this.vig, 0, 0, W, H); c.globalAlpha = 1;
    // frenzy edges pulse on the beat
    if (this.frenzyOn) {
      const ch = CHIPS[S.chip], col = ch.glow || '#ffd23f', p = 0.35 + 0.35 * Math.pow(1 - Music.phase(), 2), e = Math.min(W, H) * 0.16;
      for (const [x0, y0, x1, y1, rx, ry, rw, rh] of [[0, 0, 0, e, 0, 0, W, e], [0, H, 0, H - e, 0, H - e, W, e], [0, 0, e, 0, 0, 0, e, H], [W, 0, W - e, 0, W - e, 0, e, H]]) {
        const g = c.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, rgba(col === '#ffd23f' ? '#ffb020' : col, p)); g.addColorStop(1, rgba(col, 0)); c.fillStyle = g; c.fillRect(rx, ry, rw, rh);
      }
    }
  },

  /* ---------- new chip reveal ---------- */
  openReveal(i) {
    const ch = CHIPS[i], prev = CHIPS[i - 1];
    this.revealing = { i, t: 0 };
    $('revName').textContent = ch.name.toUpperCase();
    $('revName').style.color = ch.id === 'blackhole' ? '#d9ccff' : ch.id === 'dragon' ? '#ffd23f' : ch.bag[0] === '#141414' || ch.bag[0] === '#1c1c1c' || ch.bag[0] === '#2a1a1a' || ch.bag[0] === '#060309' || ch.bag[0] === '#1b1446' || ch.bag[0] === '#2a1a6e' ? ch.bag[1] : ch.bag[0];
    $('revVal').textContent = `${fmt(ch.v)} coins per bite  (${(ch.v / prev.v).toFixed(1)}x more!)`;
    $('revDesc').textContent = ch.desc;
    $('reveal').classList.remove('hidden');
    const cv = $('revealCanvas'), dd = Math.min(1.5, window.devicePixelRatio || 1);
    cv.width = innerWidth * dd; cv.height = innerHeight * dd; this.revealDpr = dd;
    AudioSys.reveal(i);
    if (S.settings.vibrate && navigator.vibrate) try { navigator.vibrate([20, 50, 20]); } catch (e) { }
  },
  closeReveal() {
    if (!this.revealing || this.revealing.t < 0.6) return;
    AudioSys.crunch(CHIPS[this.revealing.i].id, 1.2); this.revealing = null; $('reveal').classList.add('hidden');
    this.sparkle(...Guy.mouthPos(), CHIPS[S.chip].glow || '#ffd23f', 18);
  },
  drawReveal(t) {
    const rv = this.revealing, cv = $('revealCanvas'), c = cv.getContext('2d'), dd = this.revealDpr, W = cv.width / dd, H = cv.height / dd;
    const ch = CHIPS[rv.i], k = Math.min(1, rv.t / 0.9), cx = W / 2, cy = Math.min(H * 0.34, 300), size = Math.min(W, H) * 0.42;
    c.setTransform(dd, 0, 0, dd, 0, 0); c.clearRect(0, 0, W, H);
    // light rays
    c.save(); c.translate(cx, cy); c.rotate(t * 0.25); c.globalAlpha = 0.22 * k;
    for (let i = 0; i < 14; i++) { c.rotate(TAU / 14); c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.max(W, H), -60); c.lineTo(Math.max(W, H), 60); c.closePath(); c.fillStyle = ch.id === 'dragon' ? rainbow(i / 14 + t * 0.1) : (ch.glow || '#ffd23f'); c.fill(); }
    c.restore(); c.globalAlpha = 1;
    const sc = easeBack(k), rot = (1 - k) * 4 + Math.sin(t * 1.2) * 0.12;
    c.save(); c.translate(cx, cy); c.scale(sc, sc);
    ChipArt.aura(c, ch.id, 0, 0, size, t, 'back', 1.2);
    ChipArt.draw(c, ch.id, 0, 0, size, rot, t, { forceFx: true });
    ChipArt.aura(c, ch.id, 0, 0, size, t, 'front', 1.2);
    c.restore();
    for (let i = 0; i < 12; i++) { const a = t * 0.8 + i * TAU / 12, r = size * (0.75 + 0.06 * Math.sin(t * 3 + i)); c.globalAlpha = k; star4(c, cx + Math.cos(a) * r, cy + Math.sin(a) * r * 0.8, 6 + 3 * Math.sin(t * 5 + i), '#ffffff', t); }
    c.globalAlpha = 1;
  },

  /* ---------- rebirth ---------- */
  rebirth() {
    if (this.rebirthing || S.chipMax < CHIPS.length - 1) return;
    if (this.frenzyOn) this.endFrenzy(true);
    this.energyAt = 0;
    S.chip = CHIPS.length - 1; UI.updateChipLabel();
    this.rebirthing = { t: 0, done: false };
    $('fade').style.pointerEvents = 'auto';
    UI.hint(null);
    AudioSys.suck(4.3);
    if (AudioSys.ready) { const gi = AudioSys.musicIn.gain, tt = AudioSys.ctx.currentTime; gi.cancelScheduledValues(tt); gi.setValueAtTime(gi.value, tt); gi.linearRampToValueAtTime(0.0001, tt + 3.8); }
    UI.banner('IT WANTS THE ROOM', '#d9ccff');
  },
  updateRebirth(dt) {
    const rb = this.rebirthing; rb.t += dt;
    R.shake(Math.min(18, 2 + rb.t * 4));
    if (rb.t > 4.3 && !rb.flashed) { rb.flashed = true; const f = $('fade'); f.classList.add('white', 'on'); AudioSys.boom(); }
    if (rb.t > 5.0 && !rb.done) { rb.done = true; this.finishRebirth(); }
    if (rb.t > 5.6) {
      const f = $('fade'); f.classList.remove('on'); setTimeout(() => f.classList.remove('white'), 700);
      f.style.pointerEvents = 'none';
      this.rebirthing = null; Guy.wake = 2.2;
      if (AudioSys.ready) { const gi = AudioSys.musicIn.gain, tt = AudioSys.ctx.currentTime; gi.cancelScheduledValues(tt); gi.setValueAtTime(0.0001, tt); gi.linearRampToValueAtTime(1, tt + 2.5); }
      setTimeout(() => this.rebirthRewards(), 1600);
    }
  },
  drawRebirth(c, t, W, H) {
    const rb = this.rebirthing, k = Math.min(1, rb.t / 4.4), cx = rb.cx ?? W / 2, cy = rb.cy ?? H / 2;
    const r = 20 + Math.pow(k, 2.2) * Math.max(W, H) * 0.9;
    const g = c.createRadialGradient(cx, cy, r * 0.2, cx, cy, r * 1.6); g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.55, 'rgba(10,0,30,.85)'); g.addColorStop(1, 'rgba(10,0,30,0)');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    ChipArt.disk(c, cx, cy, r * 0.5, t * 3, 'back'); circ(c, cx, cy, r * 0.5); c.fillStyle = '#000'; c.fill(); ChipArt.disk(c, cx, cy, r * 0.5, t * 3, 'front');
    for (let i = 0; i < 40; i++) { const ph = (t * 0.7 + i / 40) % 1, a = i * 2.39 + ph * 6, d2 = Math.max(W, H) * (1 - ph); c.globalAlpha = ph; circ(c, cx + Math.cos(a) * d2, cy + Math.sin(a) * d2 * 0.7, 2 + ph * 3); c.fillStyle = i % 2 ? '#d9b8ff' : '#ffb35c'; c.fill(); }
    c.globalAlpha = 1;
  },
  finishRebirth() {
    S.rebirths++;
    const keep = { coins: 0 };
    Object.assign(S, freshRun(), keep);
    const th = THEMES.find(x => x.reb === S.rebirths); if (th) S.theme = th.id;
    const U = OUTFIT_UNLOCKS;
    if (U.phonesGlow === S.rebirths) S.outfit.phones = 'glow'; if (U.hoodieFlame === S.rebirths) S.outfit.hoodie = 'flame';
    if (U.chain === S.rebirths) S.outfit.chain = true; if (U.hoodieGalaxy === S.rebirths) S.outfit.hoodie = 'galaxy'; if (U.crown === S.rebirths) S.outfit.crown = true;
    this.meter = 0; this.coolT = 0; this.frenzyOn = false;
    FX.list.length = 0; FX.floorCrumbs.length = 0; FX.scr.length = 0; Guy.shirt.length = 0; Guy.pending = 0; Guy.drink = null; Guy.puff = 0;
    Guy.armL = makeArm(1); Guy.armR = makeArm(-1); Guy.init();
    this.applyTheme(); UI.updateChipLabel(); UI.setTab('chips');
    this.checkTrophies(); Save.save();
  },
  rebirthRewards() {
    const n = S.rebirths, list = UI.rebirthRewards(n);
    AudioSys.chime([72, 76, 79, 84, 88, 91], 0.09, 0.06);
    UI.show(`<h2>REBIRTH ${n}</h2><p>You woke up on the couch. Same chips, new you.</p><p><b>${list.join('<br>')}</b></p><p style="font-size:13px;color:var(--muted)">Change your room and style any time in the Rebirth tab.</p><button class="btn" data-close style="width:100%">LET'S EAT</button>`);
  },

  /* ---------- title screen rain ---------- */
  drawTitleRain(t) {
    const cv = $('titleRain'), c = this.titleRain; if (!c) return;
    const W = innerWidth, H = innerHeight, dd = Math.min(1.5, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(W * dd) || cv.height !== Math.round(H * dd)) { cv.width = Math.round(W * dd); cv.height = Math.round(H * dd); }
    c.setTransform(dd, 0, 0, dd, 0, 0); c.clearRect(0, 0, W, H);
    c.strokeStyle = 'rgba(180,200,255,.35)'; c.lineWidth = 1.4; c.beginPath();
    for (let i = 0; i < 90; i++) { const sp = 900 + (i * 53) % 400, ph = ((t * sp / H) + i * 0.173) % 1, x = ((i * 97.3) % (W + 80)) - 40 + ph * 60, y = ph * (H + 80) - 40; c.moveTo(x, y); c.lineTo(x - 7, y + 26); }
    c.stroke();
    // drips running down off the bottom edge of the sign
    const lg = $('logo').getBoundingClientRect();
    for (let i = 0; i < 6; i++) { const ph = ((t * 0.35) + i * 0.29) % 1, x = lg.left + lg.width * (0.12 + i * 0.15), y = lg.bottom + ph * 90; c.globalAlpha = 1 - ph; ell(c, x, y, 2.6, 4); c.fillStyle = 'rgba(255,170,220,.85)'; c.fill(); }
    c.globalAlpha = 1;
  },
};

window.addEventListener('load', () => Game.boot());
</script>
