<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPINBORN</title>
<link rel="icon" href="assets/icon.png">
<script src="gs3kit/gs3-console.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #020308; color: #fff; font-family: Inter, "Segoe UI", system-ui, sans-serif; }
  #stage canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  .gs3-screen.sb-side { background: transparent !important; justify-content: flex-end !important; padding-right: 4vw; }
  .gs3-screen.sb-side .gs3-panel { max-width: 460px; }
  .sb-wide { max-width: 820px !important; width: 92vw; }
  .sb-input { width: 100%; box-sizing: border-box; font: 600 22px Inter, system-ui, sans-serif; padding: 14px 16px; margin: 6px 0 14px;
    border-radius: 12px; border: 2px solid rgba(255,255,255,0.25); background: rgba(0,0,0,0.45); color: #fff; outline: none; }
  .sb-input:focus { border-color: #8db4ff; }
  .sb-grid { display: grid !important; grid-template-columns: 1fr 1fr; gap: 6px; }
  .sb-small { display: block; opacity: 0.7; font-size: 0.78em; margin-top: 2px; font-weight: 500; }
  .sb-primary { font-weight: 800 !important; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font: 800 42px Inter, system-ui, sans-serif; letter-spacing: 0.08em; background: #020308; }
  #loading small { display: block; font: 500 16px Inter, system-ui, sans-serif; opacity: 0.6; letter-spacing: 0; text-align: center; margin-top: 10px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="ui"></div>
<div id="loading"><div>SPINBORN<small>Loading the wheels...</small></div></div>
<script type="module" src="game.js"></script>
</body>
</html>
