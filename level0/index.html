<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEVEL 0</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: default; }
  canvas { display: block; }
  #title, #pause { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Courier New", Courier, monospace; color: #d9cf9f; user-select: none; }
  #title { background: #000; cursor: pointer; }
  #title h1 { font-weight: normal; letter-spacing: 0.5em; font-size: 28px; margin: 0 0 36px; padding-left: 0.5em; }
  #title p { font-size: 13px; letter-spacing: 0.2em; opacity: 0.55; margin: 0; }
  #title .keys { position: absolute; bottom: 28px; font-size: 12px; opacity: 0.35; letter-spacing: 0.1em; }
  #pause { display: none; background: rgba(0,0,0,0.72); gap: 14px; }
  #pause h2 { font-weight: normal; letter-spacing: 0.4em; font-size: 20px; margin: 0 0 10px; }
  #pause button { font: inherit; font-size: 14px; letter-spacing: 0.15em; width: 260px; padding: 10px; background: transparent;
    color: #d9cf9f; border: 1px solid rgba(217,207,159,0.35); cursor: pointer; }
  #pause button:hover { background: rgba(217,207,159,0.12); }
  #pause label { width: 260px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; letter-spacing: 0.1em; }
  #pause input[type=range] { width: 130px; accent-color: #c9b458; }
  #pause .cred { position: absolute; bottom: 18px; font-size: 11px; opacity: 0.35; letter-spacing: 0.05em; }
  #pause select { font: inherit; background: #111; color: #d9cf9f; border: 1px solid rgba(217,207,159,0.35); width: 130px; }
</style>
</head>
<body>
<div id="title"><h1>LEVEL 0</h1><p>CLICK TO START</p><div class="keys">WASD move &nbsp; SHIFT run &nbsp; MOUSE look &nbsp; ESC pause &nbsp; F11 full screen</div></div>
<div id="pause">
  <h2>PAUSED</h2>
  <button id="resume">RESUME</button>
  <label>MOUSE <input id="sens" type="range" min="0.2" max="3" step="0.05"></label>
  <label>VOLUME <input id="vol" type="range" min="0" max="1" step="0.01"></label>
  <label>QUALITY <select id="qual"><option value="auto">Auto</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option><option value="ultra">Ultra</option></select></label>
  <button id="full">FULL SCREEN</button>
  <button id="quit">QUIT</button>
  <div class="cred">Footsteps: swuing (CC BY 3.0). Textures: ambientCG, Poly Haven (CC0).</div>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
