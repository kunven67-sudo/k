<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
new GLTFLoader().load('avatar_raw.glb', g => {
  g.scene.updateMatrixWorld(true);
  const out = {};
  const v = new THREE.Vector3(), q = new THREE.Quaternion();
  g.scene.traverse(o => { if (o.isBone) { o.getWorldPosition(v); o.getWorldQuaternion(q); out[o.name] = { w: v.toArray().map(x=>+x.toFixed(3)), lp: o.position.toArray().map(x=>+x.toFixed(3)), lq: o.quaternion.toArray().map(x=>+x.toFixed(3)), wq: q.toArray().map(x=>+x.toFixed(3)), parent: o.parent.name }; } });
  const eyes = g.scene.getObjectByName('Playerhigh-poly') || g.scene.children.find(c=>/high/.test(c.name));
  let eb = null; g.scene.traverse(o => { if (o.isMesh && /high-poly/.test(o.material.name)) { const b = new THREE.Box3().setFromObject(o); eb = b.getCenter(new THREE.Vector3()).toArray().map(x=>+x.toFixed(3)); } });
  window.__out = { bones: out, eyes: eb, root: g.scene.children.map(c=>c.name+':'+c.type) };
  window.__ready = true;
});
</script></body></html>
