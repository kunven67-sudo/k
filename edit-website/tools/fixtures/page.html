<!DOCTYPE html>
<html lang="en" data-ew-test>
<head>
<meta charset="utf-8">
<title>Test Shop</title>
<link rel="stylesheet" href="/page.css">
</head>
<body>

    <div class="card"><img src="/pic.svg" alt=""><h3>Keyboard</h3><button type="button">Buy</button></div>
    <div class="card"><img src="/pic.svg" alt=""><h3>Mouse</h3><button type="button">Buy</button></div>
  </div>
  <input id="search" placeholder="Search">
  <svg id="logo" width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="#d2462c"/></svg>

<footer>Footer text here</footer>
