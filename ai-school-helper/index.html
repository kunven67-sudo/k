<title>AI School Helper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Patrick+Hand&display=swap">
<style>
/* Layout: one ruled notebook page (max 760px) with a red margin rule down the left.
   Bolt the robot is a ballpoint doodle; the top bar sticks up top, the chat composer sticks to the bottom. */
:root{
  --paper:#FCFCFA; --paper-2:#F1F4F9; --card:#FFFFFF; --rule:#DFE8F4; --margin:#F2B8B8;
  --ink:#1E2A47; --ink-2:#596381; --pen:#2F5BD3; --pen-2:#E7EEFD; --on-pen:#FFFFFF;
  --hl:#FFE680; --hl-ink:#33290A; --mark:#FFE680; --ok:#1C8448; --ok-bg:#E1F4E8; --bad:#C0392F; --bad-bg:#FCE9E7;
  --line:#D9E0EA; --shadow:0 1px 0 rgb(30 42 71 / .05),0 10px 24px -16px rgb(30 42 71 / .4);
  --f-hand:'Patrick Hand','Comic Neue','Segoe Print','Bradley Hand',cursive;
  --f-body:'Lexend','Atkinson Hyperlegible','Segoe UI',system-ui,-apple-system,sans-serif;
  --radius:14px; --gap-rule:31px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111827; --paper-2:#192338; --card:#1A253F; --rule:#1B2640; --margin:#5E2D3A;
    --ink:#E8EDF8; --ink-2:#A4AFCA; --pen:#8DB0FF; --pen-2:#21315A; --on-pen:#0C1322;
    --hl:#E8C95E; --hl-ink:#241C02; --mark:rgb(232 201 94 / .38); --ok:#5DD08F; --ok-bg:#15301F; --bad:#FF948C; --bad-bg:#3B1D22;
    --line:#2B3756; --shadow:0 1px 0 rgb(0 0 0 / .25),0 12px 28px -16px rgb(0 0 0 / .7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111827; --paper-2:#192338; --card:#1A253F; --rule:#1B2640; --margin:#5E2D3A;
  --ink:#E8EDF8; --ink-2:#A4AFCA; --pen:#8DB0FF; --pen-2:#21315A; --on-pen:#0C1322;
  --hl:#E8C95E; --hl-ink:#241C02; --mark:rgb(232 201 94 / .38); --ok:#5DD08F; --ok-bg:#15301F; --bad:#FF948C; --bad-bg:#3B1D22;
  --line:#2B3756; --shadow:0 1px 0 rgb(0 0 0 / .25),0 12px 28px -16px rgb(0 0 0 / .7);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100%; color:var(--ink); background-color:var(--paper);
  background-image:repeating-linear-gradient(to bottom,transparent 0 calc(var(--gap-rule) - 1px),var(--rule) calc(var(--gap-rule) - 1px) var(--gap-rule));
  font:400 16px/1.6 var(--f-body); -webkit-font-smoothing:antialiased;
}
html.young body{font-size:18px}
body::before{content:"";position:fixed;top:0;bottom:0;left:max(6px,calc(50% - 404px));width:2px;background:var(--margin);pointer-events:none;z-index:0}
h1,h2,h3{font-family:var(--f-hand);font-weight:400;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,6vw,40px)}
h2{font-size:28px}
p{margin:0}
a{color:var(--pen)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
#view:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-2)}
.tiny{font-size:13px;line-height:1.45}
.hl{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%);padding:0 .1em}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.stack{display:flex;flex-direction:column;gap:14px}
.page{display:flex;flex-direction:column;gap:30px}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1.5px solid var(--line);box-shadow:0 6px 14px -12px rgb(0 0 0 / .35)}
.top-in{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-hand);font-size:25px;line-height:1;color:var(--ink);background:none;border:0;padding:4px 2px;border-radius:10px}
.brand .bolt{width:34px;height:34px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.hot{border-color:#F08A3C}
.pill.bump{animation:bump .5s ease}
.who{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);color:var(--ink);font-weight:600;max-width:42vw}
.who .face{font-size:22px;line-height:1}
.who .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){ .brand span{display:none} .who .nm{display:none} .who{padding:3px 6px} }

/* ---------- page shell ---------- */
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
.hello{display:flex;gap:14px;align-items:center}
.hello > .bolt{flex:0 0 66px;width:66px;height:66px}
.hello > div{min-width:0;display:flex;flex-direction:column;gap:4px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.sec-head{display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap}
.empty{padding:14px 16px;border:1.5px dashed var(--line);border-radius:12px;color:var(--ink-2);background:var(--card)}
.note{padding:10px 14px;border-radius:12px;background:var(--pen-2)}
.banner{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--bad-bg);border:1.5px dashed var(--bad)}
.banner span{flex:1 1 240px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font-weight:600;line-height:1.2;box-shadow:0 3px 0 var(--ink);transition:transform .08s ease,box-shadow .08s ease;text-align:center}
.btn:hover{background:var(--paper-2)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--on-pen);box-shadow:0 3px 0 var(--ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--paper-2)}
.btn.danger{border-color:var(--bad);color:var(--bad);box-shadow:0 3px 0 var(--bad)}
.btn.danger.solid{background:var(--bad);color:var(--card)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:15px;box-shadow:0 2px 0 var(--ink)}
.btn.ghost.sm,.btn.ghost.danger{box-shadow:none}
.btn:disabled{opacity:.5;transform:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:500;line-height:1.2}
.chip:hover{border-color:var(--pen)}
.chip[aria-pressed="true"]{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.chip:disabled{opacity:.45}
.chip.av{font-size:24px;padding:5px 10px;min-width:48px;justify-content:center}
.chip.big{border:2px solid var(--pen);color:var(--pen);font-weight:600}
.iconbtn{flex:0 0 auto;display:inline-grid;place-items:center;width:46px;height:46px;border-radius:12px;border:0;background:var(--paper-2);color:var(--ink);font-size:20px;line-height:1}
.iconbtn:hover{filter:brightness(.97)}
.iconbtn.sm{width:38px;height:38px;font-size:15px;background:transparent}
.iconbtn.send{background:var(--pen);color:var(--on-pen)}
.iconbtn.stop{background:var(--bad);color:var(--card);font-size:16px}
.field{display:flex;flex-direction:column;gap:8px}
.label{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
input[type="text"],input:not([type]),textarea{width:100%;font:inherit;color:var(--ink);background:var(--paper-2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
input:focus,textarea:focus{outline:none;border-color:var(--pen)}
textarea{resize:none;line-height:1.5}
.check{display:flex;gap:10px;align-items:center;font-weight:500;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--pen)}
.err{color:var(--bad);font-weight:600}

/* ---------- Bolt doodle ---------- */
.bolt{display:block;color:var(--pen);overflow:visible}
.bolt .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.bolt.busy .zap{animation:zap .45s steps(2) infinite}
.bolt.busy .eyes{animation:look 1.4s ease-in-out infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes look{0%,100%{transform:translateX(-2px)}50%{transform:translateX(2px)}}
@keyframes zap{from{opacity:.25}to{opacity:1}}
@keyframes bump{40%{transform:scale(1.25)}}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@keyframes pop{from{transform:scale(.6) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(-3deg);opacity:1}}
.shake{animation:shake .35s ease}

/* ---------- boot + profiles + onboarding ---------- */
.boot{min-height:60vh;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center}
.boot .bolt{width:96px;height:96px}
.hand{font-family:var(--f-hand);font-size:24px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pcard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 12px;border-radius:16px;border:2px solid var(--ink);background:var(--card);box-shadow:0 3px 0 var(--ink);text-align:center}
.pcard:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.pcard.add{border-style:dashed;box-shadow:none}
.pav{font-size:46px;line-height:1.1}
.pname{font-weight:600;font-size:18px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- home ---------- */
.ask{display:flex;flex-direction:column;gap:14px}
@media (max-width:560px){
  .ask .row .btn{flex:1 1 100%}
  .ask .row .btn.primary{order:-1}
  .ask .row .spacer{display:none}
  .hello > .bolt{flex-basis:52px;width:52px;height:52px}
}
.ask textarea{min-height:76px;font-size:17px}
.how ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.topic{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:500;min-height:50px;line-height:1.3}
.topic:hover{border-color:var(--pen);color:var(--pen)}
.topic span{color:var(--pen);font-weight:700}
.practice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard2{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;text-align:left;padding:16px;border-radius:16px;border:2px solid var(--ink);background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.pcard2:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.pcard2 .em{grid-row:span 2;font-size:34px;line-height:1}
.pcard2 b{font-family:var(--f-hand);font-weight:400;font-size:26px;line-height:1.1}
.pcard2 span{color:var(--ink-2);font-size:14px}
@media (max-width:540px){ .practice{grid-template-columns:1fr} }
.chatlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.chatrow{display:flex;gap:4px;align-items:center}
.chatopen{flex:1;min-width:0;display:flex;gap:12px;align-items:center;text-align:left;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.chatopen:hover{border-color:var(--pen)}
.ci{flex:0 0 auto;font-size:22px;line-height:1}
.ct{min-width:0;display:flex;flex-direction:column}
.ct b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct .tiny{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.memory summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
.memory summary::-webkit-details-marker{display:none}
.memory summary::after{content:"▾";color:var(--ink-2);font-size:18px}
.memory[open] summary::after{content:"▴"}
.memory[open] > :not(summary){margin-top:12px}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.notes li{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:10px;background:var(--card);border:1.5px solid var(--line)}
.notes li span{flex:1;min-width:0}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;gap:12px}
.chat-head{display:flex;align-items:center;gap:8px}
.chat-title{display:flex;align-items:center;gap:8px;min-width:0;font-family:var(--f-hand);font-size:24px;line-height:1.15}
.chat-title b{font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msgs{display:flex;flex-direction:column;gap:16px;padding-block:6px 4px;min-height:40vh}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg .av{flex:0 0 40px;width:40px;height:40px;margin-top:2px}
.msg .av .bolt{width:40px;height:40px}
.bwrap{min-width:0;flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.bubble{min-width:0;max-width:100%;padding:12px 15px;border-radius:4px 16px 16px 16px;background:var(--card);border:1.5px solid var(--line);box-shadow:var(--shadow);overflow-wrap:anywhere}
.msg.me{justify-content:flex-end}
.msg.me .bubble{max-width:min(560px,88%);background:var(--hl);color:var(--hl-ink);border-color:transparent;border-radius:16px 4px 16px 16px;transform:rotate(-.4deg)}
.bubble p{margin:0 0 .6em}
.bubble > :last-child{margin-bottom:0}
.bubble ul,.bubble ol{margin:.1em 0 .6em;padding-left:1.35em}
.bubble li{margin:.15em 0}
.bubble code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em;background:var(--paper-2);padding:1px 5px;border-radius:5px}
.msg.me .bubble code{background:rgb(255 255 255 / .45)}
.bubble blockquote{margin:.2em 0 .6em;padding:.4em .8em;border-left:3px solid var(--pen);background:var(--pen-2);border-radius:0 8px 8px 0}
.bubble .thumb{display:block;max-width:180px;max-height:180px;border-radius:10px;margin-bottom:8px;border:2px solid rgb(0 0 0 / .1)}
.bubble.oops{border:1.5px dashed var(--bad);background:var(--bad-bg)}
.bubble.oops .row{margin-top:10px}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tool{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:500;padding:5px 11px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink-2)}
.tool:hover{border-color:var(--pen);color:var(--pen)}
.tool[aria-pressed="true"]{border-color:var(--pen);color:var(--pen)}
.sticker{display:inline-flex;align-items:center;gap:4px;padding:3px 11px;border-radius:999px;background:var(--hl);color:var(--hl-ink);font-weight:600;font-size:13px;transform:rotate(-3deg);animation:pop .4s ease}
.thinking{display:flex;align-items:center;gap:10px;color:var(--ink-2)}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--pen);animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-5px);opacity:1}}
.quick{display:flex;flex-wrap:wrap;gap:8px;padding-left:50px}
@media (max-width:480px){ .quick{padding-left:0;display:grid;grid-template-columns:repeat(3,1fr)} .quick .chip{justify-content:center;padding-inline:6px;gap:4px;font-size:14px;white-space:nowrap} .quick .chip.big{grid-column:1 / -1;font-size:16px} }
.composer{position:sticky;bottom:0;z-index:10;display:flex;flex-direction:column;gap:8px;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--paper) 78%,transparent)}
.composer-in{display:flex;gap:6px;align-items:flex-end;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:6px;box-shadow:0 3px 0 var(--ink)}
.composer-in:focus-within{border-color:var(--pen)}
.composer-in textarea{flex:1;min-width:0;border:0;background:transparent;padding:10px 8px;max-height:10em;font-size:16px}
.photo-prev{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 8px;border-radius:12px;background:var(--pen-2)}
.photo-prev img{width:52px;height:52px;object-fit:cover;border-radius:8px}
.photo-prev span{flex:1;min-width:0}

/* ---------- quiz ---------- */
.progress{display:flex;gap:6px}
.progress i{flex:1;height:9px;border-radius:99px;background:var(--line)}
.progress i.done{background:var(--pen)}
.progress i.now{background:var(--hl);outline:1.5px solid var(--hl-ink);outline-offset:-1.5px}
.qcard{display:flex;flex-direction:column;gap:14px}
.qtext{font-family:var(--f-body);font-size:22px;font-weight:600;line-height:1.35}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){ .choices{grid-template-columns:1fr} }
.choice{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-height:56px;font-weight:500;line-height:1.3}
.choice:hover:not(:disabled){border-color:var(--pen)}
.choice .key{flex:0 0 30px;height:30px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-weight:700;font-size:14px}
.choice > span:last-child{min-width:0;overflow-wrap:anywhere}
.choice.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ink)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--ink-2);text-decoration:line-through}
.choice:disabled{cursor:default}
.choice.dim{opacity:.55}
.feedback:empty{display:none}
.fb{padding:12px 14px;border-radius:12px;display:flex;flex-direction:column;gap:6px}
.fb.good{background:var(--ok-bg);border:1.5px solid var(--ok)}
.fb.hint{background:var(--pen-2);border:1.5px solid var(--pen)}
.fb.bad{background:var(--bad-bg);border:1.5px solid var(--bad)}
.spell-row{display:flex;gap:10px;flex-wrap:wrap}
.spell-row input{flex:1 1 220px;min-width:0;font-size:24px;letter-spacing:.06em;padding:12px 14px}
.letters{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:22px;letter-spacing:.12em;font-weight:700}
.big-score{font-family:var(--f-hand);font-size:76px;line-height:1}
.big-score span{font-size:40px;color:var(--ink-2)}
.missed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.missed li{padding:10px 14px;border-left:3px solid var(--bad);background:var(--card);border-radius:0 12px 12px 0;display:flex;flex-direction:column;gap:2px}
.level .bar{height:12px;border-radius:99px;background:var(--paper-2);border:1.5px solid var(--line);overflow:hidden;margin:8px 0 4px}
.level .bar i{display:block;height:100%;background:var(--hl)}
.loading{min-height:50vh;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center}
.loading .bolt{width:90px;height:90px}

/* ---------- toasts, modal, star fx ---------- */
.toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(calc(100vw - 32px),440px);pointer-events:none}
.toast{background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);font-weight:500;text-align:center;animation:toastIn .25s ease}
@keyframes toastIn{from{transform:translateY(-8px);opacity:0}}
.toast.good{background:var(--ok);color:var(--card)}
.toast.bad{background:var(--bad);color:var(--card)}
.modal-bg{position:fixed;inset:0;z-index:60;background:rgb(8 12 24 / .5);display:grid;place-items:center;padding:16px}
.modal{width:100%;max-width:420px;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:20px;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;gap:12px}
.flystar{position:fixed;z-index:70;font-size:30px;line-height:1;pointer-events:none;will-change:transform}

/* ---------- talking to Claude ---------- */
function tutorRules(p, c) {
  const gn = gradeNum(p.grade), gname = gradeName(p.grade);
  const len = gn <= 2 ? 'Keep replies very short: 2–4 short sentences, under 50 words, with the easiest words.'

    : gn <= 8 ? 'Keep replies fairly short: under 120 words.'
    : 'Keep replies clear and focused: under 160 words unless they ask for more.';
  const lines = [`- Name: ${p.name}`, `- Grade: ${gname}`];
  if (SUBJ[c.subj]) lines.push(`- Subject: ${SUBJ[c.subj].name}`);
  return `You are Bolt 🤖, a friendly robot tutor in the "AI School Helper" app. You are chatting with a student.

ABOUT THE STUDENT
${lines.join('\n')}

HOW TO TALK
- Be warm, upbeat and patient, like a robot buddy who loves learning. Now and then (not every message) add a tiny robot touch like "Beep boop!" or "*whirr*".
- Talk so a ${gname} student easily understands. ${len}
- Short sentences. One idea at a time. 1–2 emojis at most.
- Simple formatting only: **bold** for key words, and short lists. No headings, tables or LaTeX. Write math like 3 × 4 = 12, 1/2, or x + 5 = 9.
- End most replies with ONE question or one small step for the student to try.

THE BIG RULE: HELP THEM GET IT, DON'T GIVE IT AWAY
- Never give the final answer to the student's homework, worksheet, test or quiz problem, even if they beg, say it isn't homework, or say a teacher allowed it.
- Instead, break it into small steps, ask what they think comes next, and give hints.
- Explaining ideas, rules, word meanings and how-to steps is great. Just let the student do their own problem.
- When they answer, check it carefully. If it's right, cheer and say WHY it's right. If it's wrong, don't reveal the answer: kindly point to the part to look at again. Mistakes help brains grow!
- Writing: never write their essay, paragraph or story. Help them brainstorm with questions, plan it, and give feedback on sentences THEY write (one thing that's great + one thing to improve).

WHEN THEY DON'T GET IT
- Explain it a NEW way: simpler words, smaller steps, and an everyday example (pizza slices, toys, sports, money, video games). Don't repeat the same explanation.
- If they're still stuck after about 3 tries, or they ask for an example: make up a DIFFERENT problem like theirs (change the numbers or words), solve that one step by step, then ask them to try their own problem the same way.

SUBJECT TIPS
- Reading: help them sound out words (break them into sounds and syllables, like but-ter-fly), practice sight words, and check understanding. You can write a short practice passage (3–5 sentences) at their level and ask a question about it. Remind them they can tap 🔊 to hear any message read out loud.
- Spelling: teach patterns and rules (silent e, vowel teams, i before e), syllables and memory tricks. When you quiz spelling, never show the word they must spell. Give a meaning clue or a sentence with a blank instead.
- Math: use pictures in words (groups, number lines, money). Double-check every number you write.

STARS ⭐
- When the student gets a step or an answer right through their own thinking, put [[STAR]] at the very end of your reply. The app turns it into a gold star for them. Only for real wins, never just for asking, and at most once per reply.

SAFETY
- Never ask for personal info (full name, address, school, phone number, passwords).
- If the student says something that sounds unsafe or very sad (someone hurting them, bullying, wanting to hurt themselves), be kind, tell them to talk to a trusted adult like a parent, teacher or school counselor, and that in the US they can call or text 988 any time to talk to someone. Then gently offer to keep helping.
- Keep everything kid-friendly. If they go off topic, answer briefly if it's harmless, then steer back to learning.

WHAT YOU REMEMBER ABOUT ${p.name.toUpperCase()}
${memoryBlock(p, c)}
Use this naturally (like "Last time we worked on fractions!"). Don't list it all out.`;
}

async function generate(job, fallback, backView) {

  const q = S.quiz;

  const it = q.items[q.i];
  if (!(k >= 0 && k < it.choices.length) || q.wrong.includes(k)) return;
  markActivity();
  let fx = null;
  if (k === it.answer) {
    q.answered = true; q.result = q.tries === 0 ? 'first' : 'second';
    if (q.tries === 0) { q.score++; q.stars++; fx = 'star'; } else q.missed.push(missEntry(q, it));
  } else {
    q.wrong.push(k); q.tries++;
    if (q.tries >= 2) { q.answered = true; q.result = 'reveal'; q.missed.push(missEntry(q, it)); }
  }
  stopSpeech();
  renderView();
  if (fx) awardStars(1, S.pid, document.querySelector(`.choice[data-k="${k}"]`) || btn);
  else if (k !== it.answer) { const b = document.querySelector(`.choice[data-k="${k}"]`); if (b) b.classList.add('shake'); }

  markActivity();
